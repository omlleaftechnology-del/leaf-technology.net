<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Unitly — Resident app</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>window.COMPANY_NAME = "Unitly";</script>
<style>
  :root{
    --brand:#111111;
    --brand-dark:#000000;
    --brand-tint:#F2F2F2;
    --brand-tint-2:#E3E3E3;
    --black:#1B1C1B;
    --white:#FFFFFF;
    --g50:#FAFAF9;
    --g100:#F2F2F1;
    --g200:#E4E5E3;
    --g300:#CDCEC9;
    --g500:#84867F;
    --g600:#6B6E68;
    --g700:#4C4E49;
    --font:-apple-system,"SF Pro Display","SF Pro Text","Inter","Helvetica Neue",Arial,sans-serif;
    --ease:cubic-bezier(.22,.61,.36,1);
    --nav-h:64px;
    --safe-b:env(safe-area-inset-bottom,0px);
    --safe-t:env(safe-area-inset-top,0px);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{
    font-family:var(--font);
    color:var(--black);
    background:var(--white);
    -webkit-font-smoothing:antialiased;
    padding-bottom:calc(var(--nav-h) + var(--safe-b) + 8px);
  }
  button,input,select,textarea{font-family:var(--font);}
  button{cursor:pointer;}
  a{color:inherit; text-decoration:none;}
  ::selection{background:var(--brand); color:#fff;}

  /* ===== Header (mobile: minimal, top-bar only) ===== */
  header.site{
    position:sticky; top:0; z-index:40; background:rgba(255,255,255,.94); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--g200);
    padding-top:var(--safe-t);
  }
  .header-inner{
    padding:12px 18px;
    display:flex; align-items:center; justify-content:space-between; gap:14px;
  }
  .logo-mark{height:28px; display:block;}
  nav.main-nav{display:none;}
  .header-right{display:flex; align-items:center; gap:10px;}
  .apt-chip{font-size:11.5px; font-weight:700; color:var(--brand-dark); background:var(--brand-tint); border:1px solid var(--brand-tint-2); padding:5px 10px; border-radius:20px; white-space:nowrap;}
  .apt-chip.parking-chip{color:var(--g700); background:var(--g100); border-color:var(--g200);}
  .avatar{width:30px;height:30px;border-radius:50%; background:var(--g100); border:1px solid var(--g200); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:var(--g700); flex:0 0 auto;}

  /* ===== Bottom tab bar (mobile primary nav) ===== */
  nav.tab-bar{
    position:fixed; left:0; right:0; bottom:0; z-index:50;
    display:flex; background:rgba(255,255,255,.96); backdrop-filter:blur(10px);
    border-top:1px solid var(--g200);
    padding:8px 6px calc(8px + var(--safe-b)) 6px;
  }
  .tab-item{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;
    background:none; border:none; color:var(--g500); font-size:10.5px; font-weight:700; padding:4px 2px;
  }
  .tab-item svg{width:22px; height:22px;}
  .tab-item.active{color:var(--brand-dark);}

  /* ===== Layout shell ===== */
  main{padding:0 18px;}
  .view{display:none;}
  .view.active{display:block; animation:fadeUp .3s var(--ease);}
  @keyframes fadeUp{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  /* ===== Home hero ===== */
  .hero{padding:24px 0 20px 0; border-bottom:1px solid var(--g200);}
  .hero h1{font-size:26px; font-weight:800; letter-spacing:-0.015em; line-height:1.16; margin:0 0 10px 0;}
  .hero .eyebrow{font-size:12.5px; font-weight:700; color:var(--brand-dark); margin:0 0 8px 0;}
  .hero p.sub{font-size:14px; color:var(--g600); line-height:1.55; margin:0 0 20px 0;}
  .hero-apt{border-top:2px solid var(--brand); padding-top:14px;}
  .hero-apt .lbl{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--g500); font-weight:700; margin-bottom:5px;}
  .hero-apt .num{font-size:18px; font-weight:800; letter-spacing:-0.01em;}
  .hero-apt .addr{font-size:12.5px; color:var(--g600); margin-top:3px;}

  /* ===== Quick action grid ===== */
  .quick-row{display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:20px 0; border-bottom:1px solid var(--g200);}
  .quick-item{
    text-align:left; background:none; border:1px solid var(--g200); border-radius:12px; padding:16px 14px;
    display:flex; flex-direction:column; gap:8px; transition:border-color .15s var(--ease), background .15s var(--ease);
  }
  .quick-item:active{background:var(--g50);}
  .quick-item .qi-ic{width:26px;height:26px; color:var(--brand-dark);}
  .quick-item .qi-label{font-size:13.5px; font-weight:700;}
  .quick-item .qi-note{font-size:11.5px; color:var(--g500); line-height:1.3;}

  /* ===== Section headers ===== */
  .section{padding:28px 0; border-bottom:1px solid var(--g200);}
  .section:last-child{border-bottom:none;}
  .section-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:16px;}
  .section-head h2{font-size:17px; font-weight:800; letter-spacing:-0.01em; margin:0;}
  .section-head a.see-all{font-size:12.5px; font-weight:700; color:var(--brand-dark); border-bottom:1px solid var(--brand-tint-2); white-space:nowrap;}

  /* ===== Request list rows ===== */
  .req-row{
    display:grid; grid-template-columns:18px 1fr auto; align-items:center; gap:12px;
    padding:14px 0; border-bottom:1px solid var(--g200); cursor:pointer; width:100%; background:none; border-left:none; border-right:none; border-top:none; text-align:left;
  }
  .req-row:last-child{border-bottom:none;}
  .req-dot{width:7px;height:7px;border-radius:50%; background:var(--g300); flex:0 0 auto;}
  .req-dot.live{background:var(--brand);}
  .req-main{min-width:0;}
  .req-main .req-cat{font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--g500); font-weight:700;}
  .req-main .req-title{font-size:13.5px; font-weight:600; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .req-main .req-when{font-size:11.5px; color:var(--g500); margin-top:2px;}
  .req-status{font-size:11px; font-weight:700; white-space:nowrap; text-align:right;}
  .req-status.live{color:var(--brand-dark);}
  .req-status.done{color:var(--g500);}
  .req-status.new{color:var(--black);}

  .empty-note{padding:24px 0; color:var(--g500); font-size:13.5px;}

  /* ===== Services list ===== */
  .svc-list{display:flex; flex-direction:column;}
  .svc-row{
    display:flex; align-items:center; gap:14px; padding:16px 0; border-bottom:1px solid var(--g200);
    background:none; border-left:none; border-right:none; border-top:none; width:100%; text-align:left;
  }
  .svc-row:first-child{padding-top:0;}
  .svc-row:last-child{border-bottom:none;}
  .svc-ic{width:40px;height:40px; flex:0 0 auto; color:var(--brand-dark); display:flex; align-items:center; justify-content:center; border:1px solid var(--g200); border-radius:10px;}
  .svc-info{flex:1; min-width:0;}
  .svc-info .svc-name{font-size:14.5px; font-weight:700;}
  .svc-info .svc-desc{font-size:12px; color:var(--g600); margin-top:2px;}
  .svc-arrow{color:var(--g500); flex:0 0 auto;}
  .svc-price{font-size:13px; font-weight:800; color:var(--brand-dark); flex:0 0 auto; margin-right:6px;}
  .svc-price-note{display:inline-block; background:var(--brand-tint); border:1px solid var(--brand-tint-2); color:var(--brand-dark); border-radius:12px; padding:8px 14px; font-size:13px; margin:2px 0 14px 0;}

  /* ===== Building shortcuts ===== */
  .building-row{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .building-item{padding:16px 14px; border:1px solid var(--g200); border-radius:12px; font-size:13px; font-weight:700; display:flex; align-items:center; gap:9px;}
  .building-item svg{color:var(--brand-dark); flex:0 0 auto;}

  /* ===== Form (request creation) ===== */
  .form-shell{padding:24px 0;}
  .back-link{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; color:var(--g600); margin-bottom:16px;}
  .form-card{border:1px solid var(--g200); border-radius:16px; padding:22px;}
  .form-card h1{font-size:20px; font-weight:800; letter-spacing:-0.01em; margin:0 0 6px 0;}
  .form-card p.lead{font-size:13px; color:var(--g600); margin:0 0 22px 0; line-height:1.5;}
  .field{margin-bottom:18px;}
  .field label{display:block; font-size:12px; font-weight:700; color:var(--g700); margin-bottom:7px;}
  .field input, .field textarea, .field select{
    width:100%; border:1.4px solid var(--g200); background:var(--g50); border-radius:10px; padding:12px 14px;
    font-size:14px; color:var(--black);
  }
  .field textarea{min-height:100px; resize:vertical;}
  .field input:focus, .field textarea:focus, .field select:focus{outline:none; border-color:var(--brand); background:var(--white);}
  .field input:disabled{background:var(--g100); color:var(--g600); cursor:not-allowed;}
  .pill-row{display:flex; gap:8px; flex-wrap:wrap;}
  .pill{border:1.4px solid var(--g200); background:var(--white); border-radius:20px; padding:8px 14px; font-size:12.5px; font-weight:600; color:var(--g700);}
  .pill.active{background:var(--brand); border-color:var(--brand); color:#fff;}
  .attach-row{display:flex; gap:10px;}
  .attach-box{flex:1; border:1.6px dashed var(--g300); border-radius:10px; padding:16px 8px; text-align:center; color:var(--g500); font-size:11.5px; font-weight:600;}

  .btn{
    border-radius:10px; border:none; padding:14px 20px; font-size:14px; font-weight:700;
    display:inline-flex; align-items:center; justify-content:center; gap:8px; width:100%;
  }
  .btn-primary{background:var(--brand); color:#fff;}
  .btn-primary:active{background:var(--brand-dark);}
  .btn-secondary{background:transparent; color:var(--black); border:1.4px solid var(--g300);}

  /* ===== Login (full-screen, no header/tab-bar chrome) ===== */
  body.login-mode{padding-bottom:0;}
  /* The login screen already pads itself (.login-wrap), so drop <main>'s own side padding here —
     it was shaving a further 36px off a phone-wide card that has little room to spare. */
  body.login-mode main{padding:0;}
  .login-wrap{min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:32px 20px; background:var(--brand-tint);}
  .login-card{width:100%; max-width:380px; background:#fff; border:1px solid var(--g200); border-radius:18px; padding:32px 24px;}
  .login-logo{height:36px; margin-bottom:28px; display:block;}
  .login-card h1{font-size:21px; font-weight:800; margin:0 0 6px 0;}
  .login-card p.sub{font-size:13px; color:var(--g600); margin:0 0 24px 0; line-height:1.5;}
  .login-forgot{display:block; text-align:right; font-size:12px; font-weight:700; color:var(--brand-dark); margin:-8px 0 20px 0;}
  .login-note{font-size:11.5px; color:var(--g500); line-height:1.55; margin-top:20px; padding-top:18px; border-top:1px solid var(--g200);}

  /* ===== Confirmation ===== */
  .confirm-shell{padding:56px 0; text-align:center;}
  .confirm-mark{width:52px;height:52px;border-radius:50%; background:var(--brand); display:flex; align-items:center; justify-content:center; margin:0 auto 20px auto;}
  .confirm-shell h1{font-size:21px; font-weight:800; margin:0 0 10px 0;}
  .confirm-shell p{font-size:13.5px; color:var(--g600); line-height:1.6; margin:0 0 26px 0;}
  .confirm-actions{display:flex; flex-direction:column; gap:10px;}

  /* ===== Request detail ===== */
  .detail-shell{padding:24px 0;}
  .detail-head{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:22px;}
  .detail-head h1{font-size:19px; font-weight:800; margin:6px 0 4px 0;}
  .detail-head .meta{font-size:12px; color:var(--g500);}
  .t-row{display:flex; gap:12px;}
  .t-dotcol{display:flex; flex-direction:column; align-items:center;}
  .t-dot{width:9px;height:9px;border-radius:50%; margin-top:4px;}
  .t-line{width:1.4px; flex:1; background:var(--g200); min-height:24px;}
  .t-body{padding-bottom:20px;}
  .t-title{font-size:13.5px; font-weight:700;}
  .t-when{font-size:12px; color:var(--g500); margin-top:2px;}

  .segment{display:inline-flex; background:var(--g100); border-radius:10px; padding:3px; gap:2px; margin-bottom:20px; width:100%;}
  .segment button{flex:1; border:none; background:transparent; padding:9px 10px; border-radius:8px; font-size:12.5px; font-weight:700; color:var(--g600);}
  .segment button.active{background:#fff; color:var(--black); box-shadow:0 1px 3px rgba(0,0,0,.08);}

  /* ===== Profile ===== */
  .profile-head{text-align:center; padding:24px 0 8px 0;}
  .profile-head .av{width:64px;height:64px;border-radius:50%; background:var(--brand-tint); border:1px solid var(--brand-tint-2); color:var(--brand-dark); display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:800; margin:0 auto 12px auto;}
  .profile-head .name{font-size:17px; font-weight:800;}
  .profile-head .apt{font-size:12.5px; color:var(--g500); margin-top:2px;}
  .profile-list{margin-top:8px; max-width:420px; margin-left:auto; margin-right:auto;}
  .profile-row{display:flex; align-items:center; gap:12px; padding:0; min-height:64px; box-sizing:border-box; border-bottom:1px solid var(--g200); width:100%; background:none; border-left:none; border-right:none; border-top:none; text-align:left;}
  .profile-row:last-child{border-bottom:none;}
  .profile-row .pr-ic{width:34px;height:34px; border:1px solid var(--g200); border-radius:9px; display:flex; align-items:center; justify-content:center; color:var(--brand-dark); flex:0 0 auto;}
  .profile-row > span{font-size:13.5px; font-weight:600; flex:1;}

  /* ===== Footer (desktop only, hidden on mobile to save space above tab bar) ===== */
  footer.site{display:none;}

  /* ===== App shell below 900px: tab bar and header stay put, only <main> scrolls =====
     Before, the whole page scrolled and the tab bar was merely pinned on top of it, so the page's
     scrollbar ran the full height of the window and slid under the tab bar. Now the scrollable area
     ends exactly where the tab bar begins (desktop, >=900px, keeps the normal page scroll). */
  @media (max-width:899px){
    html, body{height:100%; overflow:hidden;}
    body{display:flex; flex-direction:column; height:100vh; height:100dvh; padding-bottom:0;}
    header.site{position:relative; flex:0 0 auto;}
    main{flex:1 1 auto; min-height:0; overflow-x:hidden; overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; padding-bottom:20px;}
    body.login-mode main{padding-bottom:0;}
    nav.tab-bar{position:relative; left:auto; right:auto; bottom:auto; flex:0 0 auto;}
  }

  /* =========================================================
     DESKTOP ENHANCEMENT — everything above is the mobile base
     ========================================================= */
  @media (min-width:900px){
    :root{--nav-h:0px;}
    body{padding-bottom:0;}
    main{max-width:1180px; margin:0 auto; padding:0 32px;}

    header.site{padding-top:0;}
    .header-inner{max-width:1180px; margin:0 auto; padding:14px 32px;}
    .logo-mark{height:38px;}
    nav.main-nav{display:flex; gap:32px; align-items:center;}
    nav.main-nav a{font-size:14px; font-weight:600; color:var(--g600); padding:6px 0; border-bottom:2px solid transparent; transition:color .15s var(--ease), border-color .15s var(--ease);}
    nav.main-nav a:hover{color:var(--black);}
    nav.main-nav a.active{color:var(--black); border-color:var(--brand);}
    .header-right{gap:16px;}
    .apt-chip{font-size:12.5px; padding:6px 12px;}
    .avatar{width:34px;height:34px; font-size:12px;}

    nav.tab-bar{display:none;}

    .hero{padding:56px 0 40px 0; display:grid; grid-template-columns:1.3fr 1fr; gap:48px; align-items:end;}
    .hero h1{font-size:38px; margin-bottom:12px;}
    .hero .eyebrow{font-size:13px;}
    .hero p.sub{font-size:15.5px; max-width:440px; margin-bottom:0;}
    .hero-apt{border-top:none; border-left:2px solid var(--brand); padding-top:0; padding-left:20px;}
    .hero-apt .num{font-size:22px;}
    .hero-apt .addr{font-size:13.5px;}

    .quick-row{grid-template-columns:repeat(4,1fr); gap:0; padding:0; display:flex;}
    .quick-item{flex:1; border:none; border-right:1px solid var(--g200); border-radius:0; padding:26px 16px;}
    .quick-item:last-child{border-right:none;}
    .quick-item:hover{background:var(--g50);}
    .quick-item .qi-ic{width:30px;height:30px;}
    .quick-item .qi-label{font-size:14px;}
    .quick-item .qi-note{font-size:12px;}

    .section{padding:44px 0;}
    .section-head{margin-bottom:22px;}
    .section-head h2{font-size:20px;}
    .section-head a.see-all{font-size:13px;}

    .req-row{grid-template-columns:22px 1fr auto auto; gap:16px; padding:16px 0;}
    .req-row:hover .req-title{color:var(--brand-dark);}
    .req-main .req-title{font-size:14.5px; white-space:normal;}
    .req-main .req-when{display:none;}
    .req-when-col{display:block;}

    .svc-row{gap:18px; padding:20px 0;}
    .svc-ic{width:44px;height:44px; border-radius:10px;}
    .svc-row:hover .svc-ic{border-color:var(--brand); background:var(--brand-tint);}
    .svc-info .svc-name{font-size:16px;}
    .svc-info .svc-desc{font-size:13px;}
    .svc-arrow{transition:transform .15s var(--ease);}
    .svc-row:hover .svc-arrow{transform:translateX(3px); color:var(--brand-dark);}

    .building-row{grid-template-columns:repeat(4,1fr); gap:0; border:1px solid var(--g200); border-radius:12px; overflow:hidden;}
    .building-item{border:none; border-right:1px solid var(--g200); border-radius:0; padding:18px 20px;}
    .building-item:last-child{border-right:none;}
    .building-item:hover{background:var(--g50);}

    .form-shell{max-width:640px; margin:0 auto; padding:48px 0;}
    .form-shell .back-link{margin-bottom:20px;}
    .form-card{padding:36px;}
    .form-card h1{font-size:24px;}
    .form-card p.lead{font-size:14px; margin-bottom:28px;}
    .btn{width:auto; padding:13px 22px;}
    .btn-primary{width:100%;}
    .btn-secondary{width:100%;}

    .confirm-shell{max-width:520px; margin:0 auto; padding:90px 0;}
    .confirm-shell h1{font-size:24px;}
    .confirm-shell p{font-size:14.5px; margin-bottom:30px;}
    .confirm-actions{max-width:280px; margin:0 auto;}

    .detail-shell{max-width:760px; margin:0 auto; padding:44px 0;}
    .detail-head h1{font-size:22px;}
    .detail-head .meta{font-size:13px;}

    .segment{width:auto;}
    .segment button{flex:none; padding:8px 18px;}

    .profile-head{padding:32px 0 8px 0;}
    .profile-list{max-width:420px; margin:0 auto;}

    footer.site{display:block; border-top:1px solid var(--g200); margin-top:20px;}
    .footer-inner{max-width:1180px; margin:0 auto; padding:28px 32px; display:flex; align-items:center; justify-content:space-between; gap:20px;}
    .footer-inner .fl{display:flex; align-items:center; gap:12px;}
    .footer-inner img{height:22px; opacity:.7;}
    .footer-inner span{font-size:12px; color:var(--g500);}
    .footer-links{display:flex; gap:20px;}
    .footer-links a{font-size:12.5px; color:var(--g600); font-weight:600;}
    .footer-links a:hover{color:var(--black);}
  }

  /* ===== Language switcher ===== */
  .login-top{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:28px;}
  .login-top .login-logo{margin-bottom:0;}
  .lang-menu-wrap{position:relative; display:inline-block;}
  .lang-trigger{display:inline-flex; align-items:center; gap:7px; height:38px; padding:0 12px; border:1.4px solid var(--g200); background:var(--white); border-radius:20px; font-size:13px; font-weight:700; color:var(--black); cursor:pointer; white-space:nowrap;}
  .lang-trigger svg{color:var(--g600); flex:0 0 auto;}
  .lang-trigger[aria-expanded="true"]{border-color:var(--brand);}
  .lang-menu{position:absolute; right:0; top:calc(100% + 8px); min-width:184px; background:var(--white); border:1px solid var(--g200); border-radius:16px; box-shadow:0 14px 34px rgba(0,0,0,.14); padding:6px; z-index:60;}
  .lang-opt{display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%; padding:11px 12px; border:none; background:none; border-radius:10px; font-size:14px; font-weight:600; color:var(--black); text-align:left; cursor:pointer;}
  .lang-opt:hover{background:var(--g100);}
  .lang-opt.active{background:var(--brand-tint); color:var(--brand-dark); font-weight:800;}
  .icon-btn{width:34px;height:34px;border-radius:50%; border:1px solid var(--g200); background:none; display:flex; align-items:center; justify-content:center; color:var(--g600); flex:0 0 auto;}
  .desktop-lang{display:none;}
  @media (min-width:900px){
    .desktop-lang{display:flex; gap:4px; background:var(--g100); border-radius:10px; padding:3px;}
    .desktop-lang button{border:none; background:transparent; padding:7px 10px; border-radius:7px; font-size:11.5px; font-weight:800; color:var(--g600);}
    .desktop-lang button.active{background:#fff; color:var(--black); box-shadow:0 1px 3px rgba(0,0,0,.08);}
    .mobile-lang-btn{display:none;}
  }

  /* ===== Login buttons: same size in every language =====
     Labels differ a lot in length ("Sign in" vs "Iniciar sesión", "Forgot password?" vs
     "¿Olvidaste tu contraseña?"). Fixed height + columns sized to the real label lengths, so the
     buttons never change size between languages. If a label ever doesn't fit on one line (very
     narrow phone, wider system font) it wraps INSIDE the same fixed-height button instead of
     growing it. Below 370px the three buttons stack. */
  .login-actions{display:grid; grid-template-columns:minmax(0,.36fr) minmax(0,.64fr); gap:10px;}
  .login-actions .btn, .login-first{height:44px; padding:0 8px; font-size:12px; line-height:1.15; text-align:center; width:100%;}
  .login-first{margin-top:10px;}
  @media (max-width:370px){ .login-actions{grid-template-columns:1fr;} }


  /* ===== Amenities: information-only rows and the booking screen ===== */
  .svc-row-info{cursor:default;}
  .svc-row-info:hover .svc-ic{border-color:var(--g200); background:none;}
  .svc-note{display:inline-block; margin-top:7px; font-size:11.5px; font-weight:700; color:var(--g700); background:var(--g100); border:1px solid var(--g200); border-radius:20px; padding:4px 11px;}
  .amen-meta{display:inline-block; font-size:12px; font-weight:700; color:var(--g700); background:var(--g100); border-radius:20px; padding:4px 11px; margin:0 0 20px 0;}
  .amen-muted{font-size:12.5px; color:var(--g600); margin:0; line-height:1.5;}
  .slot-grid{display:grid; grid-template-columns:repeat(4, 1fr); gap:8px;}
  .slot-grid.loading{opacity:.55;}
  .slot{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; min-height:42px; border:1.4px solid var(--g200); background:var(--white); border-radius:12px; padding:6px 0; font-size:13px; font-weight:700; color:var(--g700); cursor:pointer;}
  .slot span{font-size:9.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--g500);}
  .slot.active{background:var(--brand); border-color:var(--brand); color:#fff;}
  .slot.full, .slot:disabled{background:var(--g100); border-style:dashed; color:var(--g500); cursor:not-allowed;}
  @media (max-width:340px){ .slot-grid{grid-template-columns:repeat(3, 1fr);} }

  .btn-cancel-booking{flex:0 0 auto; border:1.4px solid var(--g200); background:var(--white); border-radius:20px; padding:8px 14px; font-size:12px; font-weight:700; color:#8a1f1f; cursor:pointer;}
  .amen-notice{margin:0 0 14px 0; padding:11px 14px; border-radius:12px; background:var(--brand-tint); border:1px solid var(--brand-tint-2); color:var(--brand-dark); font-size:13px; font-weight:700;}

  .logo-wordmark{font-weight:900; font-size:21px; letter-spacing:-.03em; color:var(--black); text-decoration:none;}
  .login-wordmark{font-weight:900; font-size:28px; letter-spacing:-.03em; color:var(--black); margin-bottom:28px;}
  .login-top .login-wordmark{margin-bottom:0;}
  .demo-toast{position:fixed; left:50%; bottom:calc(var(--nav-h) + 20px); transform:translate(-50%,12px); background:#111; color:#fff; padding:11px 16px; border-radius:12px; font-size:13px; font-weight:600; opacity:0; transition:all .25s; z-index:9999; max-width:86%; text-align:center;}
  .demo-toast.show{opacity:1; transform:translate(-50%,0);}

</style>

        { status: 'scheduled', note: 'Visit confirmed for tomorrow at 10 AM', createdAt: stamp(at(-1, 16, 0)) }], attachments: [] },
  ];
  let nextRequestId = 4, nextAttachmentId = 1;

  const amenities = [
    { id: 1, key: 'gym', name: 'Gym', hours: '06:00 – 23:00', bookable: true, quantity: 1, openTime: '06:00', closeTime: '23:00' },
    { id: 2, key: 'party', name: 'Party room', hours: '09:00 – 23:00', bookable: true, quantity: 1, openTime: '09:00', closeTime: '23:00' },
    { id: 3, key: 'bbq', name: 'BBQ area', hours: '10:00 – 21:00', bookable: true, quantity: 5, openTime: '10:00', closeTime: '21:00' },
    { id: 4, key: 'cinema', name: 'Cinema room', hours: '18:00 – 23:00', bookable: true, quantity: 1, openTime: '18:00', closeTime: '23:00' },
    { id: 5, key: 'pool', name: 'Pool', hours: '07:00 – 22:00', bookable: false, quantity: 1, openTime: '07:00', closeTime: '22:00' },   // information only
    { id: 6, key: 'pingpong', name: 'Ping-pong', hours: '09:00 – 22:00', bookable: true, quantity: 2, openTime: '09:00', closeTime: '22:00' },
  ];
  // Other residents' bookings, so the demo shows taken ("Full") times: the gym is booked tomorrow 18:00, 4 of 5 BBQs at noon.
  const bookings = [{ id: 1, amenityId: 1, date: dateOnly(at(1)), timeSlot: '18:00', duration: '1h' }];
  for (let i = 0; i < 4; i++) bookings.push({ id: 2 + i, amenityId: 3, date: dateOnly(at(1)), timeSlot: '12:00', duration: '1h' });
  // The demo resident's own bookings (shown under "My bookings", can be cancelled).
  bookings.push({ id: 20, amenityId: 6, date: dateOnly(at(1)), timeSlot: '17:00', duration: '1h', mine: true, createdAt: stamp(at(0, 9)) });
  bookings.push({ id: 21, amenityId: 4, date: dateOnly(at(3)), timeSlot: '20:00', duration: '2h', mine: true, createdAt: stamp(at(0, 9, 30)) });
  let nextBookingId = 100;

  // Same rules as the real server: an amenity has `quantity` identical units; a booking takes one for its whole duration.
  const DUR = { '1h': 1, '2h': 2, '3h': 3 };
  const toMin = (t) => { const m = /^(\d{1,2}):(\d{2})$/.exec(String(t || '')); return m ? Number(m[1]) * 60 + Number(m[2]) : null; };
  const fmtMin = (m) => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
  const freeUnits = (a, date, start, end) => {
    const iv = bookings.filter((x) => x.amenityId === a.id && x.date === date).map((x) => [toMin(x.timeSlot), toMin(x.timeSlot) + 60 * parseFloat(x.duration)]);
    const pts = [start, ...iv.map((i) => i[0]).filter((v) => v > start && v < end)];
    return Math.max(0, a.quantity - Math.max(...pts.map((pt) => iv.filter(([s0, e0]) => s0 <= pt && pt < e0).length)));
  };
  const passed = (date, start) => { const n = new Date(); return date === dateOnly(n) && start <= n.getHours() * 60 + n.getMinutes(); };

  const news = [
    { id: 3, tag: 'Notice', title: 'Fire alarm test tomorrow, 10 AM', body: 'A routine fire alarm test will take place in Building A tomorrow at 10 AM. No action is needed on your side.', publishedAt: stamp(at(-1, 9, 0)) },
    { id: 2, tag: 'News', title: 'New rooftop lounge is now open', body: 'The redesigned rooftop lounge is open daily from 8 AM to 10 PM. Reservations are available right here in the app.', publishedAt: stamp(at(-9, 9, 0)) },
    { id: 1, tag: 'Notice', title: 'Elevator B maintenance this weekend', body: 'Elevator B will be out of service on Saturday from 8 AM to 2 PM for scheduled maintenance. Thank you for your patience.', publishedAt: stamp(at(-12, 9, 0)) },
  ];

  const documents = [
    { id: 'shared-1', originalName: 'House rules.pdf', docType: 'rules', mimeType: 'application/pdf', sizeBytes: 182400, uploadedAt: stamp(at(-120, 10, 0)) },
    { id: 1, originalName: 'Lease agreement.pdf', docType: 'lease', mimeType: 'application/pdf', sizeBytes: 311200, uploadedAt: stamp(at(-200, 10, 0)) },
  ];

  const messages = [
    { id: 1, sender: 'resident', body: 'Hi, when can the plumber come to fix the leak?', createdAt: stamp(at(-2, 14, 10)) },
    { id: 2, sender: 'management', body: 'Hi Alex, a technician will come tomorrow at 10 AM. We’ll message you if anything changes.', createdAt: stamp(at(-1, 16, 5)) },
  ];
  let nextMessageId = 3;

  const guestParking = [
    { id: 1, guestName: 'Sophie Martin', licensePlate: 'ABC 123', startDate: dateOnly(at(1)), endDate: dateOnly(at(2)), createdAt: stamp(at(-1, 11, 0)) },
  ];
  let nextGuestId = 2;

  const settings = { managementPhone: '+1 555 010 0100', services: {
    plumbing: { enabled: true, price: null }, electrical: { enabled: true, price: null },
    cleaning: { enabled: true, price: 80 }, moving: { enabled: true, price: 249.5 },
    repairs: { enabled: true, price: null }, other: { enabled: true, price: null } } };

  const listShape = (r) => { const { timeline, attachments, ...rest } = r; return rest; };

  return {
    getToken() { return token; },
    setToken(t) { token = t; },
    clearToken() { token = null; },

    login() { token = 'demo'; return later({ token: 'demo', mustChangePassword: false }); },
    getMe() { return later(me); },
    updateMe(patch) { Object.assign(me, patch || {}); return later(me); },

    getRequests() { return later(requests.slice().sort((a, b) => (a.createdAt < b.createdAt ? 1 : -1)).map(listShape)); },
    getRequest(id) { const r = requests.find((x) => String(x.id) === String(id)); return r ? later(r) : fail(404, 'Request not found.'); },
    createRequest(p) {
      const now = new Date();
      const r = { id: nextRequestId++, category: p.category, description: p.description, status: 'submitted',
        preferredDate: p.preferredDate || null, preferredTime: p.preferredTime || null, assignedTo: null, scheduledDate: null, scheduledTime: null,
        createdAt: stamp(now), updatedAt: stamp(now),
        timeline: [{ status: 'submitted', note: 'Request submitted', createdAt: stamp(now) }], attachments: [] };
      requests.push(r);
      return later(listShape(r));
    },
    uploadAttachment(requestId, file) {
      const r = requests.find((x) => String(x.id) === String(requestId));
      const a = { id: nextAttachmentId++, originalName: (file && file.name) || 'photo.jpg', mimeType: (file && file.type) || 'image/jpeg', sizeBytes: (file && file.size) || 0 };
      if (r) r.attachments.push(a);
      return later(a);
    },

    checkEmail() { return later({ ok: true }); },
    setPassword() { token = 'demo'; return later({ token: 'demo' }); },
    forgotPassword() { return later({ ok: true }); },
    changePassword() { return later({ ok: true, token: 'demo' }); },
    logoutEverywhere() { return later({ ok: true }); },

    getAmenities() { return later(amenities); },
    getMyBookings() {
      const now = new Date();
      return later(bookings.filter((b) => b.mine && new Date(`${b.date}T${b.timeSlot}:00`) > now).sort((x, y) => (x.date + x.timeSlot < y.date + y.timeSlot ? -1 : 1))
        .map((b) => { const a = amenities.find((x) => x.id === b.amenityId); return { id: b.id, amenityId: a.id, amenityName: a.name, amenityKey: a.key, date: b.date, timeSlot: b.timeSlot, duration: b.duration, createdAt: b.createdAt }; }));
    },
    cancelBooking(id) {
      const i = bookings.findIndex((b) => b.mine && String(b.id) === String(id));
      if (i < 0) return fail(404, 'Booking not found.');
      bookings.splice(i, 1);                       // frees the time again
      return later({ ok: true });
    },
    getAmenityAvailability(id, date, duration) {
      const a = amenities.find((x) => x.id === Number(id)); if (!a) return fail(404, 'Amenity not found.');
      const h = DUR[duration] || 1, open = toMin(a.openTime), close = toMin(a.closeTime), slots = [];
      if (a.bookable) for (let st = open; st + h * 60 <= close; st += 60) slots.push({ time: fmtMin(st), left: passed(date, st) ? 0 : freeUnits(a, date, st, st + h * 60) });
      return later({ amenityId: a.id, bookable: a.bookable, quantity: a.quantity, date, duration, slots, problem: null });
    },
    bookAmenity(id, p) {
      const a = amenities.find((x) => x.id === Number(id)); if (!a) return fail(404, 'Amenity not found.');
      if (!a.bookable) return fail(400, 'This space does not need a reservation.');
      const h = DUR[p.duration], st = toMin(p.timeSlot);
      if (!h || st === null || !/^\d{4}-\d{2}-\d{2}$/.test(p.date || '')) return fail(400, 'Please pick a date, a time and a duration.');
      if (p.date < dateOnly(new Date()) || passed(p.date, st)) return fail(400, 'That time has already passed.');
      if (st < toMin(a.openTime) || st + h * 60 > toMin(a.closeTime)) return fail(400, `This space is open ${a.hours}.`);
      if (freeUnits(a, p.date, st, st + h * 60) < 1) return fail(409, 'This time is no longer available.');
      const newId = nextBookingId++;
      bookings.push({ id: newId, amenityId: a.id, date: p.date, timeSlot: p.timeSlot, duration: p.duration, mine: true, createdAt: stamp(new Date()) });
      return later({ id: newId, amenityId: a.id, date: p.date, timeSlot: p.timeSlot, duration: p.duration });
    },

    getGuestParking() { return later(guestParking.slice().reverse()); },
    createGuestParking(p) {
      const g = { id: nextGuestId++, guestName: p.guestName, licensePlate: p.licensePlate, startDate: p.startDate, endDate: p.endDate, createdAt: stamp(new Date()) };
      guestParking.push(g);
      return later(g);
    },

    getMessages() { return later(messages); },
    sendMessage(body) {
      const m = { id: nextMessageId++, sender: 'resident', body, createdAt: stamp(new Date()) };
      messages.push(m);
      // A friendly canned reply shows up a moment later (visible when the thread is reopened).
      setTimeout(() => messages.push({ id: nextMessageId++, sender: 'management', body: 'Thanks for your message — our team will get back to you shortly.', createdAt: stamp(new Date()) }), 2500);
      return later(m);
    },

    getNews() { return later(news); },
    getDocuments() { return later(documents); },
    getSettings() { return later(settings); },
  };
})();

</script>

// Escapes text before it goes into an HTML template string. Every field
// that came from user input (request descriptions, chat messages, names,
// etc.) MUST be wrapped in this before being interpolated into a `` ` ``
// template that becomes innerHTML — otherwise a resident could store a
// <script> tag that runs in another resident's, or the admin's, browser.
function esc(value) {
  if (value === null || value === undefined) return '';
  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function svcIcon(path, size) {
  size = size || 20;
  const parts = path.split('|').map(p => `<path d="${p}"/>`).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${parts}</svg>`;
}

function statusBucket(status) {
  if (status === 'completed') return 'done';
  if (status === 'submitted') return 'new';
  return 'live'; // reviewed | assigned | scheduled
}

function formatDate(iso) {
  if (!iso) return '';
  const d = new Date(iso.replace(' ', 'T'));
  if (isNaN(d)) return iso;
  return d.toLocaleDateString(state.lang, { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
}

// "2026-10-05" + "10:00" -> "Oct 5, 10:00 AM" (date only if no time was set)
function formatVisit(date, time) {
  if (!date) return '';
  if (time) return formatDate(`${date} ${time}`);
  const d = new Date(`${date}T00:00:00`);
  if (isNaN(d)) return date;
  return d.toLocaleDateString(state.lang, { day: 'numeric', month: 'short' });
}

}

// Opens the booking screen (information-only spaces never do) and loads which times are free.
async function handleCancelBooking(id) {
  const ab = L.amenityBooking;
  if (!confirm(ab.cancelConfirm)) return;
  try { await api.cancelBooking(id); state.amenNotice = ab.cancelled; }
  catch (err) { alert(err.message); }
  try { state.myBookings = await api.getMyBookings(); } catch (e) { /* keep what we have */ }
  render();
}

function openAmenityBooking(id) {
  const a = (state.amenities || []).find(x => x.id === id);
  if (!a || !a.bookable) return;
  state.activeAmenityId = id; state.amenDate = localDateStr(new Date()); state.amenDurationIdx = 0;
  state.amenSlot = null; state.amenAvail = null; state.amenBookingError = null;
  showView('amenityBooking');
  loadAmenityAvailability();
}

async function loadAmenityAvailability() {
  const id = state.activeAmenityId, date = state.amenDate, duration = AMEN_DURATIONS[state.amenDurationIdx ?? 0];
  if (!date) return;
  state.amenLoading = true; render();
  try {
    const r = await api.getAmenityAvailability(id, date, duration);
    if (id !== state.activeAmenityId || date !== state.amenDate || duration !== AMEN_DURATIONS[state.amenDurationIdx ?? 0]) return;   // an older answer arrived late
    state.amenAvail = r;
    if (state.amenSlot && !r.slots.some(s => s.time === state.amenSlot && s.left > 0)) state.amenSlot = null;
    state.amenLoading = false; render();
  } catch (err) {
    state.amenLoading = false; state.amenBookingError = err.message; render();
  }
}

  ).join('');

  document.getElementById('viewRoot').innerHTML = (views[state.view] ? views[state.view]() : views.login());
  // Opening a screen starts at the top; redrawing the same screen (picking a time slot, a pill…) keeps the position.
  if (state.view !== lastRenderedView) scrollViewToTop();
  lastRenderedView = state.view;
}

// Below 900px <main> is the scrolling area (header and tab bar stay put); on desktop it is the page itself.
function scrollViewToTop() {
  const main = document.querySelector('main');
  if (main && getComputedStyle(main).overflowY === 'auto') main.scrollTo({ top: 0, behavior: 'smooth' });
  else window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function loadInitialData() {
  const [resident, requests, settings] = await Promise.all([api.getMe(), api.getRequests(), api.getSettings().catch(() => null)]);
  state.resident = resident;
  state.requests = requests;
  if (settings) { state.services = settings.services || null; state.managementPhone = settings.managementPhone || null; }
}

// Services management currently offers, in display order. Before the
// settings have loaded (or if that call failed) everything is shown, so a
// hiccup never hides the whole services screen.
function enabledServices() {
  if (!state.services) return serviceOrder;
  return serviceOrder.filter(k => !state.services[k] || state.services[k].enabled);
}

function servicePrice(key) {
  const sv = state.services && state.services[key];
  return sv && sv.price !== null && sv.price !== undefined ? sv.price : null;
}

function fmtPrice(n) {
  const localeMap = { fr:'fr-CA', en:'en-CA', uk:'uk-UA', es:'es-MX' };
  return new Intl.NumberFormat(localeMap[state.lang] || 'fr-CA', { style: 'currency', currency: 'CAD', minimumFractionDigits: Number.isInteger(n) ? 0 : 2 }).format(n);
}

async function goHome() {
  state.view = 'home';
  render();
}

async function showView(key) {
  state.amenNotice = null;
  lastRenderedView = null;          // explicit navigation always starts at the top, even to the same screen
  state.view = key;
  state.loginError = null;
  state.formError = null;
  state.saveMessage = null;
  state.firstTimeError = null;
  state.createPasswordError = null;
  state.pwdError = null;
  state.pwdSaved = false;
  state.firstTimeSent = false;
  render();
}

async function handleLoginSubmit(email, password) {
  state.busy = true; state.loginError = null; render();
  try {
    const { token } = await api.login(email, password);
    api.setToken(token);
    await loadInitialData();
    state.busy = false;
    await goHome();
  } catch (err) {
    state.busy = false;
    state.loginError = err.message;
    render();
  }
}

async function handleForgotPassword(email) {
  state.busy = true; state.forgotPasswordError = null; render();
  try {
    await api.forgotPassword(email);
    state.busy = false;
    state.forgotPasswordSent = true;
    render();
  } catch (err) {
    state.busy = false;
    state.forgotPasswordError = err.message;
    render();
  }
}

async function handleCheckEmail(email) {
  state.busy = true; state.firstTimeError = null; render();
  try {
    await api.checkEmail(email);
    state.busy = false;
    state.firstTimeSent = true;
    render();
  } catch (err) {
    state.busy = false;
    state.firstTimeError = err.message;
    render();
  }
}

async function handleCreatePassword(password, confirmPassword) {
  if (password.length < 8) {
    state.createPasswordError = L.createPassword.tooShort;
    render();
    return;
  }
  if (password !== confirmPassword) {
    state.createPasswordError = L.createPassword.mismatch;
    render();
    return;
  }
  state.busy = true; state.createPasswordError = null; render();
  try {
    const { token } = await api.setPassword(state.pendingActivationEmail, state.pendingActivationToken, password);
    api.setToken(token);
    await loadInitialData();
    state.busy = false;
    state.pendingActivationEmail = undefined;
    state.pendingActivationToken = undefined;
    await goHome();
  } catch (err) {
    state.busy = false;
    state.createPasswordError = err.message;
    render();
  }
}

async function handleSubmitRequest() {
  const textarea = document.getElementById('reqDescription');
  const description = textarea ? textarea.value.trim() : '';
  if (!description) {
    state.formError = L.form.descLabel + ' — ' + (state.lang === 'fr' ? 'requis' : 'required');
    render();
    return;
  }
  const preferredDate = L.form.dateOptions[state.selectedDateIdx ?? 1];
  const preferredTime = L.form.timeOptions[state.selectedTimeIdx ?? 1];
  state.busy = true; state.formError = null; render();
  try {
    const created = await api.createRequest({ category: state.activeService, description, preferredDate, preferredTime });
    state.lastCreatedId = created.id;

    // Upload any selected photo/video now that the request exists.
    if (state.reqPhotoFile) await api.uploadAttachment(created.id, state.reqPhotoFile);
    if (state.reqVideoFile) await api.uploadAttachment(created.id, state.reqVideoFile);

    state.requests = await api.getRequests();
    state.selectedDateIdx = undefined;
    state.selectedTimeIdx = undefined;
    state.reqPhotoFile = undefined; state.reqPhotoName = undefined;
    state.reqVideoFile = undefined; state.reqVideoName = undefined;
    state.busy = false;
    state.confirmKind = undefined;
    state.confirmLink = null;
    showView('confirm');
  } catch (err) {
    state.busy = false;
    state.formError = err.message;
    render();
  }
}

async function openRequestDetail(id) {
  try {
    state.requestDetail = await api.getRequest(id);
    showView('detail');
  } catch (err) {
    if (err.status === 401) { showView('login'); }
  }
}

async function openBuildingNews() {
  try { state.news = await api.getNews(); showView('buildingNews'); }
  catch (err) { if (err.status === 401) showView('login'); }
}

async function openAmenities() {
  try { [state.amenities, state.myBookings] = await Promise.all([api.getAmenities(), api.getMyBookings().catch(() => [])]); showView('amenities'); }
  catch (err) { if (err.status === 401) showView('login'); }
}

async function openDocuments() {
  try { state.documents = await api.getDocuments(); showView('documents'); }
  catch (err) { if (err.status === 401) showView('login'); }
}

async function openMessages() {
  try { state.messages = await api.getMessages(); showView('messages'); }
  catch (err) { if (err.status === 401) showView('login'); }
}

async function openManagement() {
  try { const s = await api.getSettings(); state.managementPhone = s.managementPhone; showView('management'); }
  catch (err) { if (err.status === 401) showView('login'); else showView('management'); }
}

async function handleSubmitAmenityBooking() {
  const ab = L.amenityBooking;
  if (!state.amenSlot) { state.amenBookingError = ab.pickSlot; render(); return; }
  const payload = { date: state.amenDate, timeSlot: state.amenSlot, duration: AMEN_DURATIONS[state.amenDurationIdx ?? 0] };
  state.busy = true; state.amenBookingError = null; render();
  try {
    await api.bookAmenity(state.activeAmenityId, payload);
    state.busy = false;
    state.confirmKind = 'booking';
    state.confirmLink = 'amenities';
    showView('confirm');
  } catch (err) {
    // Someone else may have just taken it: say so and show the fresh picture of what is still free.
    state.busy = false; state.amenSlot = null;
    state.amenBookingError = err.status === 409 ? ab.taken : err.message;
    await loadAmenityAvailability();
  }
}

async function handleSubmitGuestParking() {
  const startDate = document.getElementById('gpFrom').value.trim();
  const endDate = document.getElementById('gpTo').value.trim();
  const guestName = document.getElementById('gpGuestName').value.trim();
  const licensePlate = document.getElementById('gpPlate').value.trim();
  if (!guestName) {
    state.gpError = L.guestParking.guestNameLabel + ' — ' + (state.lang === 'fr' ? 'requis' : 'required');
    render();
    return;
  }
  state.busy = true; state.gpError = null; render();
  try {
    await api.createGuestParking({ guestName, licensePlate, startDate, endDate });
    state.busy = false;
    state.confirmKind = 'booking';
    state.confirmLink = null;
    showView('confirm');
  } catch (err) {
    state.busy = false;
    state.gpError = err.message;
    render();
  }
}

async function handleSendMessage() {
  const input = document.getElementById('messageInput');
  const body = input ? input.value.trim() : '';
  if (!body) return;
  state.busy = true; render();
  try {
    await api.sendMessage(body);
    state.messages = await api.getMessages();
    state.busy = false;
    render();
  } catch (err) {
    state.busy = false;
    render();
  }
}

// Documents (like attachments) are behind auth, so fetch with the token
// and open the result as a blob URL rather than using a plain <a href>.
async function viewDocument(docId, filename) {
  try {
    const token = api.getToken();
    const res = await fetch(`/api/documents/${docId}`, {
      headers: token ? { Authorization: `Bearer ${token}` } : {},
    });
    if (!res.ok) throw new Error('Could not load the document.');
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename || 'document';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  } catch (err) {
    alert(err.message);
  }
}

async function downloadAllDocuments() {
  try {
    const token = api.getToken();
    const res = await fetch('/api/documents/download-all', {
      headers: token ? { Authorization: `Bearer ${token}` } : {},
    });
    if (!res.ok) throw new Error(L.documents.downloadAllError);
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `documents-${(window.COMPANY_NAME || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'all'}.zip`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  } catch (err) {
    alert(err.message);
  }
}

async function handleSaveContact() {
  const email = document.getElementById('piEmail').value.trim();
  const phone = document.getElementById('piPhone').value.trim();
  state.busy = true; state.saveMessage = null; render();
  try {
    await api.updateMe({ email, phone });
    state.resident.email = email;
    state.resident.phone = phone;
    state.busy = false;
    state.saveMessage = state.lang === 'fr' ? 'Enregistré.' : 'Saved.';
    render();
  } catch (err) {
    state.busy = false;
    state.saveMessage = err.message;
    render();
  }
}

async function handleSavePassword() {
  const pi = L.personalInfo;
  const currentPassword = document.getElementById('piPwdCurrent').value;
  const newPassword = document.getElementById('piPwdNew').value;
  const confirmPassword = document.getElementById('piPwdConfirm').value;

  if (!currentPassword || !newPassword || !confirmPassword) {
    state.pwdError = pi.pwdAllRequired; state.pwdSaved = false; render(); return;
  }
  if (newPassword.length < 8) {
    state.pwdError = pi.pwdTooShort; state.pwdSaved = false; render(); return;
  }
  if (newPassword !== confirmPassword) {
    state.pwdError = pi.pwdMismatch; state.pwdSaved = false; render(); return;
  }

  state.busy = true; state.pwdError = null; state.pwdSaved = false; render();
  try {
    const { token } = await api.changePassword(currentPassword, newPassword);
    // Changing the password revokes every token issued before this
    // moment — including the one this very request just used — so the
    // fresh one from the response has to replace it, or the next action
    // would otherwise fail as if logged out.
    if (token) api.setToken(token);
    state.busy = false;
    state.pwdSaved = true;
    render();
  } catch (err) {
    state.busy = false;
    state.pwdError = err.message;
    render();
  }
}

function handleLogout() {
  api.clearToken();
  state.resident = null;
  state.requests = [];
  showView('login');
}

async function handleLogoutEverywhere() {
  if (!confirm(L.personalInfo.logoutEverywhereConfirm)) return;
  state.busy = true; render();
  try {
    await api.logoutEverywhere();
  } catch (err) {
    // Even a network hiccup here doesn't change what happens next: the
    // call either revoked every token or it didn't, but either way this
    // device's own copy is about to be discarded regardless, so the
    // person still ends up signed out, which is what they asked for.
  }
  state.busy = false;
  handleLogout();
}

// Attachment downloads require the Bearer token, so a plain <a href> won't
// work (the browser sends no custom headers on navigation). Fetch it with
// the token instead, then open the result as a blob URL.
async function viewAttachment(requestId, attachmentId) {
  try {
    const token = api.getToken();
    const res = await fetch(`/api/requests/${requestId}/attachments/${attachmentId}`, {
      headers: token ? { Authorization: `Bearer ${token}` } : {},
    });
    if (!res.ok) throw new Error('Could not load the file.');
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    window.open(url, '_blank');
  } catch (err) {
    alert(err.message);
  }
}

document.addEventListener('submit', (e) => {
  if (e.target && e.target.id === 'loginForm') {
    e.preventDefault();
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    handleLoginSubmit(email, password);
  }
  if (e.target && e.target.id === 'firstTimeForm') {
    e.preventDefault();
    const email = document.getElementById('firstTimeEmail').value.trim();
    handleCheckEmail(email);
  }
  if (e.target && e.target.id === 'forgotPasswordForm') {
    e.preventDefault();
    handleForgotPassword(document.getElementById('forgotEmail').value.trim());
  }
  if (e.target && e.target.id === 'createPasswordForm') {
    e.preventDefault();
    const password = document.getElementById('newPassword').value;
    const confirm = document.getElementById('confirmPassword').value;
    handleCreatePassword(password, confirm);
  }
});

document.addEventListener('change', (e) => {
  if (e.target && e.target.id === 'amenDate' && e.target.value) {
    state.amenDate = e.target.value; state.amenSlot = null; state.amenBookingError = null; loadAmenityAvailability();
  }
  if (e.target && e.target.id === 'reqPhotoInput') {
    const file = e.target.files[0];
    if (file) { state.reqPhotoFile = file; state.reqPhotoName = file.name; render(); }
  }
  if (e.target && e.target.id === 'reqVideoInput') {
    const file = e.target.files[0];
    if (file) { state.reqVideoFile = file; state.reqVideoName = file.name; render(); }
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && state.langMenuOpen) { state.langMenuOpen = false; render(); }
});

document.addEventListener('click', (e) => {
  const langMenuBtn = e.target.closest('[data-action="toggle-lang-menu"]');
  if (langMenuBtn) { state.langMenuOpen = !state.langMenuOpen; render(); return; }
  const langBtn = e.target.closest('[data-setlang]');
  if (langBtn) { state.lang = langBtn.dataset.setlang; state.langMenuOpen = false; render(); return; }
  // A click anywhere else closes an open language menu (and carries on as normal).
  if (state.langMenuOpen && !e.target.closest('.lang-menu-wrap')) { state.langMenuOpen = false; render(); }

  const filterBtn = e.target.closest('[data-filter]');
  if (filterBtn) { state.filter = filterBtn.dataset.filter; render(); return; }

  const pillEl = e.target.closest('.pill-row .pill');
  if (pillEl) {
    const group = pillEl.closest('[data-pillgroup]').dataset.pillgroup;
    const idx = parseInt(pillEl.dataset.pill, 10);
    if (group === 'date') state.selectedDateIdx = idx;
    if (group === 'time') state.selectedTimeIdx = idx;
    if (group === 'amenDuration') { state.amenDurationIdx = idx; state.amenSlot = null; loadAmenityAvailability(); return; }
    render();
    return;
  }

  const actionBtn = e.target.closest('[data-action]');
  if (actionBtn) {
    e.preventDefault();
    const action = actionBtn.dataset.action;
    if (action === 'submit-request') handleSubmitRequest();
    if (action === 'cancel-booking') handleCancelBooking(actionBtn.dataset.booking);
    if (action === 'pick-amen-slot') { state.amenSlot = actionBtn.dataset.time; state.amenBookingError = null; render(); }
    if (action === 'save-contact') handleSaveContact();
    if (action === 'save-password') handleSavePassword();
    if (action === 'logout-everywhere') handleLogoutEverywhere();
    if (action === 'logout') handleLogout();
    if (action === 'view-attachment') viewAttachment(actionBtn.dataset.req, actionBtn.dataset.att);
    if (action === 'submit-amenity-booking') handleSubmitAmenityBooking();
    if (action === 'submit-guest-parking') handleSubmitGuestParking();
    if (action === 'send-message') handleSendMessage();
    if (action === 'view-document') viewDocument(actionBtn.dataset.doc, actionBtn.dataset.name);
    if (action === 'download-all-documents') downloadAllDocuments();
    return;
  }

  const goEl = e.target.closest('[data-go]');
  if (goEl) {
    e.preventDefault();
    const key = goEl.dataset.go;
    if (key === 'requestForm') { state.activeService = goEl.dataset.svc || 'plumbing'; showView('requestForm'); return; }
    if (key === 'newsDetail') { state.activeNews = parseInt(goEl.dataset.news, 10); showView('newsDetail'); return; }
    if (key === 'amenityBooking') { openAmenityBooking(parseInt(goEl.dataset.amenity, 10)); return; }
    if (key === 'detail') { openRequestDetail(goEl.dataset.req); return; }
    if (key === 'buildingNews') { openBuildingNews(); return; }
    if (key === 'amenities') { openAmenities(); return; }
    if (key === 'documents') { openDocuments(); return; }
    if (key === 'messages') { openMessages(); return; }
    if (key === 'management') { openManagement(); return; }
    // Opening any other screen (e.g. coming back to "Forgot password") starts it fresh,
    // instead of showing the previous "email sent" confirmation again.
    state.forgotPasswordSent = false; state.forgotPasswordError = null;
    showView(key);
  }
});

(async function init() {
  L = I18N[state.lang];

  // A resident arriving via their activation email link — ?activate=TOKEN&email=...
  // Takes priority over an existing session: if someone is testing a
  // second account on the same browser, the link should still work.
  const params = new URLSearchParams(window.location.search);
  const activateToken = params.get('activate');
  const activateEmail = params.get('email');
  if (activateToken && activateEmail) {
    state.pendingActivationToken = activateToken;
    state.pendingActivationEmail = activateEmail;
    state.view = 'createPassword';
    window.history.replaceState({}, '', window.location.pathname);
    render();
    return;
  }

  if (api.getToken()) {
    try {
      await loadInitialData();
      state.view = 'home';
    } catch (err) {
      api.clearToken();
      state.view = 'login';
    }
  }
  render();
})();

<script>
// Demo-only overrides: file previews/downloads need a real server, so say so politely.
(function () {
  const TEXT = {
    en: 'Demo mode — file previews aren’t included.',
    fr: 'Mode démo — l’aperçu des fichiers n’est pas inclus.',
    uk: 'Демо-режим — перегляд файлів недоступний.',
    es: 'Modo demo — la vista previa de archivos no está incluida.',
  };
  function toast() {
    const old = document.getElementById('demoToast'); if (old) old.remove();
    const t = document.createElement('div');
    t.id = 'demoToast'; t.className = 'demo-toast'; t.textContent = TEXT[state.lang] || TEXT.en;
    document.body.appendChild(t);
    setTimeout(() => t.classList.add('show'), 10);
    setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 2600);
  }
  window.viewDocument = async function () { toast(); };
  window.downloadAllDocuments = async function () { toast(); };
  window.viewAttachment = async function () { toast(); };
})();

</script>
