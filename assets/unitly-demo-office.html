<style>/* The Office — admin panel styles, ported from the rich design prototype,
   with the brand green (#587B5B) replacing black as the accent/active
   color, and near-black kept only for body text (matching the resident
   site's palette split). This is a real running app, not a design mockup,
   so there's no fake browser-window chrome here — just the actual layout. */

:root{
  --brand:#587B5B;
  --brand-dark:#3E5A42;
  --brand-tint:#F2F5F1;
  --brand-tint-2:#E7EEE7;
    --brand-rgb:88,123,91; /* overridden per client by /brand.css (BRAND_COLOR in .env) */
  --black:#1B1C1B;
  --ink:#252625;
  --white:#FFFFFF;
  --g50:#FAFBFB;
  --g100:#F3F3F3;
  --g150:#EBEBEC;
  --g200:#E1E1E2;
  --g300:#CDCDCF;
  --g400:#A3A3A6;
  --g500:#87878B;
  --g600:#626266;
  --g700:#46464A;
  --radius-lg:20px;
  --radius-md:14px;
  --radius-sm:10px;
  --shadow-card:0 1px 2px rgba(10,10,10,.03), 0 8px 20px -14px rgba(10,10,10,.14);
  --font: -apple-system, "SF Pro Display", "SF Pro Text", "Inter", "Helvetica Neue", Arial, sans-serif;
  --ease: cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font); color:var(--black); min-height:100vh;
  -webkit-font-smoothing:antialiased; overflow-wrap:break-word; word-break:normal;
  background:var(--g50);
}
button, input, select, textarea{font-family:var(--font);}
button{cursor:pointer; transition:transform .12s var(--ease), background .15s var(--ease), color .15s var(--ease), border-color .15s var(--ease), box-shadow .15s var(--ease);}
button:active{transform:scale(.98);}
a{color:inherit; text-decoration:none;}

/* ===== Shell layout ===== */
.admin-shell{display:flex; height:100vh; overflow:hidden;} /* menu stays put, only .content scrolls */
.admin-sidebar{width:216px; flex:0 0 216px; background:var(--white); border-right:1px solid var(--g150); display:flex; flex-direction:column; padding:20px 12px; overflow-y:auto;}
.admin-sidebar img{height:28px; width:auto; align-self:flex-start; margin:4px 8px 20px 8px;}
.admin-nav-item{display:flex; align-items:center; gap:9px; padding:9px 10px; border-radius:10px; border:none; background:none; text-align:left; font-size:12.5px; font-weight:600; color:var(--g600); width:100%; line-height:1.25;}
.admin-nav-group{display:flex; flex-direction:column; gap:2px; margin-bottom:10px;}
.admin-nav-head{font-size:10px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--g400,#9a9a9a); padding:4px 10px 4px;}
.nav-badge{margin-left:auto; min-width:18px; height:18px; padding:0 5px; border-radius:9px; background:#c0392b; color:#fff; font-size:10.5px; font-weight:800; display:inline-flex; align-items:center; justify-content:center;}
.admin-nav-item.soon, .admin-nav-item.soon:hover{color:var(--g400, #a3a3a3); opacity:.6; cursor:not-allowed; background:none;}
.admin-nav-item:hover:not(.active):not(.soon){background:var(--g100); color:var(--black);}
.admin-nav-item.active{background:var(--brand); color:#fff; font-weight:700;}
.admin-main{flex:1; display:flex; flex-direction:column; min-width:0; min-height:0;}
.topbar{height:60px; flex:0 0 auto; border-bottom:1px solid var(--g150); display:flex; align-items:center; justify-content:space-between; padding:0 28px; background:#fff;}
.topbar .eyebrow{font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--g500); font-weight:700;}
.who{display:flex; align-items:center; gap:9px;}
.who .av{width:32px;height:32px;border-radius:50%; background:var(--brand-tint); border:1px solid var(--brand-tint-2); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; color:var(--brand-dark);}
.who .meta{line-height:1.2;}
.who .meta b{font-size:12.5px; display:block; color:var(--black);}
.who .meta span{font-size:10.5px; color:var(--g500);}
.content{flex:1; overflow-y:auto; padding:28px 34px 40px 34px; background:var(--g50);}
h1.page-title{font-size:22px; font-weight:800; letter-spacing:-0.015em; margin:0 0 4px 0; color:var(--black);}
p.page-sub{font-size:13px; color:var(--g500); margin:0 0 22px 0;}

/* ===== Cards & stat cards ===== */
.admin-card{background:var(--white); border:1px solid var(--g150); border-radius:var(--radius-lg); box-shadow:var(--shadow-card); padding:20px;}
.stat-card{background:#fff; border:1px solid var(--g150); border-radius:16px; padding:18px; box-shadow:var(--shadow-card);}
.stat-card .n{font-size:26px; font-weight:800; letter-spacing:-0.02em; color:var(--black);}
.stat-card .l{font-size:11.5px; color:var(--g500); font-weight:600; margin-top:4px;}

/* ===== Buttons ===== */
.btn{border-radius:11px; border:none; padding:10px 16px; font-size:12.5px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; gap:7px; line-height:1.3;}
.btn-primary{background:var(--brand); color:#fff;}
.btn-primary:hover{background:var(--brand-dark);}
.btn-secondary{background:#fff; color:var(--black); border:1.3px solid var(--g200);}
.btn-secondary:hover{background:var(--g50);}
.btn-ghost{background:none; color:var(--g600); font-weight:600;}
.btn-ghost:hover{color:var(--black);}

/* ===== Tables ===== */
.admin-table{width:100%; border-collapse:collapse;}
.admin-table th{text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--g500); font-weight:700; padding:14px 16px; border-bottom:1px solid var(--g150); background:var(--g50);}
.admin-table td{padding:13px 16px; font-size:13px; border-bottom:1px solid var(--g150); color:var(--g700); vertical-align:top;}
.admin-table tr:last-child td{border-bottom:none;}
.admin-table tr.clickable{cursor:pointer; transition:background .12s var(--ease);}
.admin-table tr.clickable:hover td{background:var(--g50);}

/* ===== Status pills ===== */
.status-pill{display:inline-flex; align-items:center; font-size:10px; font-weight:800; letter-spacing:.02em; text-transform:uppercase; padding:5px 10px; border-radius:20px; white-space:nowrap;}
.status-pill.submitted{background:var(--g100); color:var(--g600);}
.status-pill.reviewed, .status-pill.assigned{background:#fff; color:var(--black); border:1px solid var(--g300);}
.status-pill.scheduled{background:var(--brand-tint); color:var(--brand-dark); border:1px solid var(--brand-tint-2);}
.status-pill.completed{background:transparent; color:var(--g600); border:1px solid var(--g200);}
.status-pill.urgent{background:#fdeeee; color:#b33a3a; border:1px solid #f6d4d4; gap:4px;}

/* ===== Dashboard v2 (redesign) ===== */
.admin-card .n{font-size:26px; font-weight:800; letter-spacing:-0.02em; color:var(--black);}
.admin-card .l{font-size:12px; color:var(--g500); font-weight:600; margin-top:4px;}
.admin-card.dark{background:var(--brand); border-color:var(--brand);}
.admin-card.dark .n{color:#fff;}
.admin-card.dark .l{color:#e4ece4;}
.dash-row{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:24px;}
.dash-cols{display:grid; grid-template-columns:1.6fr 1fr; gap:18px; align-items:start;}
.dash-urgent-row td:first-child{border-left:3px solid #c0453f; padding-left:15px;}
.dash-cat-icon{display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px; border-radius:8px; background:var(--g100); color:var(--g600); flex:0 0 auto;}
.dash-booking-row, .dash-contractor-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid var(--g150);}
.dash-booking-row:last-child, .dash-contractor-row:last-child{border-bottom:none;}
@media (max-width:900px){
  .dash-row{grid-template-columns:repeat(2,1fr);}
  .dash-cols{grid-template-columns:1fr;}
}

/* ===== Filter tab group (pill switcher) ===== */
.filter-tabs{display:inline-flex; gap:2px; background:var(--g100); border-radius:12px; padding:4px; margin-bottom:18px;}
.filter-tab{border:none; background:none; padding:8px 16px; border-radius:9px; font-size:12.5px; font-weight:700; color:var(--g600); cursor:pointer;}
.filter-tab.active{background:#fff; color:var(--black); box-shadow:0 1px 2px rgba(0,0,0,.08);}
.booking-row-type{display:flex; align-items:center; gap:9px;}

/* ===== Reports v2 (vertical bar chart) ===== */
.bar-chart{display:flex; align-items:flex-end; gap:18px; height:180px; margin-top:28px;}
.bar-chart-col{display:flex; flex-direction:column; align-items:center; flex:1; height:100%; justify-content:flex-end;}
.bar-chart-n{font-size:13px; font-weight:800; color:var(--black); margin-bottom:6px;}
.bar-chart-bar{width:100%; max-width:72px; background:linear-gradient(180deg, var(--brand) 0%, var(--brand-dark) 100%); border-radius:8px 8px 3px 3px; min-height:6px;}
.bar-chart-label{font-size:12.5px; color:var(--g600); font-weight:600; margin-top:10px; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;}

/* ===== Forms ===== */
.field{margin-bottom:14px;}
.field label{display:block; font-size:10.5px; font-weight:700; color:var(--g600); margin-bottom:6px; text-transform:uppercase; letter-spacing:.04em;}
.field input, .field textarea, .field select{width:100%; border:1.3px solid var(--g200); background:var(--g50); border-radius:11px; padding:10px 12px; font-size:13px; color:var(--black);}
.field textarea{min-height:70px; resize:vertical;}
.field input:focus, .field textarea:focus, .field select:focus{outline:none; border-color:var(--brand); background:#fff;}
.field input:disabled{background:var(--g100); color:var(--g600);}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.back-link{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; color:var(--g600); margin-bottom:16px;}
.back-link:hover{color:var(--black);}

/* ===== Login ===== */
.admin-login-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--g50);}
.admin-login-card{width:100%; max-width:360px; background:#fff; border:1px solid var(--g150); border-radius:var(--radius-lg); box-shadow:var(--shadow-card); padding:32px 28px; text-align:center;}
.admin-login-card img{height:34px; margin-bottom:20px;}
.admin-login-card .field{text-align:left;}

/* ===== Messages / chat ===== */
.msg-thread-list{background:var(--white);}
.msg-thread-list .thread-row{display:block; width:100%; text-align:left; background:none; border:none; border-bottom:1px solid var(--g150); padding:12px 16px;}
.msg-thread-list .thread-row:hover{background:var(--g50);}
.msg-thread-list .thread-row.active{background:var(--brand-tint);}

@media (max-width:900px){
  .admin-shell{flex-direction:column;}
  .admin-sidebar{width:100%; flex-direction:row; flex-wrap:wrap; overflow-x:auto; border-right:none; border-bottom:1px solid var(--g150); padding:10px 12px;}
  .admin-sidebar img{display:none;}
  .admin-sidebar{flex:0 0 auto; flex-wrap:nowrap; align-items:center; gap:4px;}
  .admin-nav-group{flex-direction:row; flex-wrap:nowrap; margin-bottom:0; align-items:center; flex:0 0 auto; gap:2px;}
  .admin-nav-group + .admin-nav-group{border-left:1px solid var(--g150); padding-left:4px;}
  .admin-nav-item{width:auto; white-space:nowrap; flex:0 0 auto;}
  .admin-nav-head{display:none;}
  .admin-main{padding:20px;}
}


/* ===== Service on/off settings (green toggle switches) ===== */
.switch{position:relative; display:inline-block; width:46px; height:26px; flex:0 0 auto;}
.switch input{opacity:0; width:0; height:0; position:absolute;}
.switch .slider{position:absolute; inset:0; background:var(--g300); border-radius:26px; cursor:pointer; transition:background .15s;}
.switch .slider::before{content:''; position:absolute; width:20px; height:20px; left:3px; top:3px; background:#fff; border-radius:50%; box-shadow:0 1px 2px rgba(0,0,0,.25); transition:transform .15s;}
.switch input:checked + .slider{background:var(--brand);}
.switch input:checked + .slider::before{transform:translateX(20px);}
.switch input:focus-visible + .slider{outline:2px solid var(--brand-dark); outline-offset:2px;}
.svc-setting-row{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 0; border-bottom:1px solid var(--g150);}
.svc-setting-row:last-of-type{border-bottom:none;}
.svc-setting-name{font-size:14px; font-weight:700; color:var(--black);}
.svc-setting-controls{display:flex; align-items:center; gap:14px;}
.svc-price-wrap{display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--g600); font-weight:700;}
.svc-price-wrap input{width:96px; padding:7px 10px; border:1.4px solid var(--g200); background:var(--g50); border-radius:10px; font-size:13px; text-align:right;}
.svc-price-wrap.off{opacity:.45;}


/* ===== Language picker (one compact button + menu) ===== */
.admin-login-top{display:flex; justify-content:flex-end; margin:-12px -8px 6px 0;}
.lang-menu-wrap{position:relative; display:inline-block; text-align:left;}
.lang-trigger{display:inline-flex; align-items:center; gap:7px; height:34px; padding:0 11px; border:1.3px solid var(--g200); background:#fff; border-radius:18px; font-size:12.5px; font-weight:700; color:var(--black); cursor:pointer; white-space:nowrap; font-family:inherit;}
.lang-trigger svg{color:var(--g600); flex:0 0 auto;}
.lang-trigger[aria-expanded="true"]{border-color:var(--brand);}
.lang-menu{position:absolute; right:0; top:calc(100% + 8px); min-width:176px; background:#fff; border:1px solid var(--g200); border-radius:14px; box-shadow:0 14px 34px rgba(0,0,0,.14); padding:6px; z-index:60;}
.lang-opt{display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%; padding:10px 12px; border:none; background:none; border-radius:9px; font-size:13px; font-weight:600; color:var(--black); text-align:left; cursor:pointer; font-family:inherit;}
.lang-opt:hover{background:var(--g100);}
.lang-opt.active{background:var(--brand-tint); color:var(--brand-dark); font-weight:800;}

/* ===== Buildings: 3D-style animated cards (see js/adminBuildingScene.js) ===== */
.bld{--b-card:#fff; --b-ink:var(--black); --b-muted:var(--g500); --b-line:var(--g150); --b-soft:var(--g100);
  --sky1:#eef2f7; --sky2:#fbfcfd; --ground:#e8ebee; --ground-side:#d3d8de; --ground-side2:#c3c9d1;
  --win-off:#b4bcc6; --win-on:#ffd36e; --tree:#8fb796; --trunk:#8b7a6a; --edge:rgba(0,0,0,.07);
  --b-shadow:0 1px 2px rgba(0,0,0,.04), 0 10px 30px -14px rgba(0,0,0,.18);}
.bld-top{display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; margin-bottom:22px;}
.bld-stats{display:flex; gap:12px; flex-wrap:wrap;}
.bld-stat{background:var(--b-card); border:1px solid var(--b-line); border-radius:16px; padding:10px 18px; min-width:120px; box-shadow:var(--b-shadow);}
.bld-stat b{display:block; font-size:22px; letter-spacing:-.02em; font-variant-numeric:tabular-nums; color:var(--b-ink);}
.bld-stat span{font-size:10.5px; font-weight:700; color:var(--b-muted); text-transform:uppercase; letter-spacing:.06em;}
.bld-tools{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.bld-toggle{display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:700; color:var(--b-muted); cursor:pointer; user-select:none;}
.bld-sw{width:38px; height:22px; border-radius:20px; background:var(--g200); position:relative; transition:background .25s; flex:0 0 auto;}
.bld-sw::after{content:""; position:absolute; top:3px; left:3px; width:16px; height:16px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.3); transition:transform .25s cubic-bezier(.3,1.4,.5,1);}
.bld-toggle input{display:none} .bld-toggle input:checked + .bld-sw{background:var(--brand);} .bld-toggle input:checked + .bld-sw::after{transform:translateX(16px);}

.bld-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:24px;}
.bld-slot{position:relative;}
.bld-card{position:relative; background:var(--b-card); border:1px solid var(--b-line); border-radius:22px; overflow:hidden; cursor:pointer; box-shadow:var(--b-shadow);
  transform:perspective(1100px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)); transition:transform .18s ease-out, box-shadow .3s; will-change:transform;}
.bld-card:hover{box-shadow:0 30px 60px -22px rgba(0,0,0,.4);}
.bld-card:focus-visible{outline:2px solid var(--brand); outline-offset:2px;}
.bld-card.enter{animation:bldCardIn .85s cubic-bezier(.2,.85,.25,1) backwards; animation-delay:calc(var(--idx) * .12s);}
@keyframes bldCardIn{from{opacity:0; transform:perspective(1100px) translateY(70px) rotateX(40deg) scale(.9);}}
.bld-card.fresh{animation:bldCardDrop 1s cubic-bezier(.2,.9,.25,1.08) backwards;}
@keyframes bldCardDrop{from{opacity:0; transform:perspective(1100px) translateY(-110px) rotateX(-32deg) rotateZ(-2deg) scale(.82);}}
.bld-card.fresh::after{content:""; position:absolute; inset:0; border-radius:22px; pointer-events:none; border:2px solid var(--brand); animation:bldRing 2.2s ease-out .5s forwards; opacity:0;}
@keyframes bldRing{0%{opacity:0; transform:scale(1)} 25%{opacity:.9} 100%{opacity:0; transform:scale(1.04)}}
.bld-badge{position:absolute; top:14px; left:14px; z-index:3; background:var(--brand); color:#fff; font-size:10.5px; font-weight:800; letter-spacing:.08em; border-radius:20px; padding:5px 11px; animation:bldBadge 5s .9s both;}
@keyframes bldBadge{0%{opacity:0; transform:translateY(-6px) scale(.8)} 8%{opacity:1; transform:none} 85%{opacity:1} 100%{opacity:0; transform:translateY(-4px)}}
.bld-card.removing{pointer-events:none; animation:bldCardOut .45s cubic-bezier(.5,0,.8,.4) .95s forwards;}
@keyframes bldCardOut{to{opacity:0; transform:perspective(1100px) translateY(40px) rotateX(30deg) scale(.88);}}
.bld-del{position:absolute; top:12px; right:12px; z-index:4; width:30px; height:30px; border-radius:50%; border:1px solid var(--b-line); background:#fff; color:var(--b-muted); font-size:15px; line-height:1; cursor:pointer; opacity:0; transform:scale(.8); transition:opacity .2s, transform .2s, color .2s;}
.bld-card:hover .bld-del, .bld-del:focus-visible{opacity:1; transform:none;} .bld-del:hover{color:#c2410c;}
@media (hover:none){ .bld-del{opacity:1; transform:none;} }

.bld-scene{height:222px; background:radial-gradient(120% 95% at 50% 100%, var(--sky2), var(--sky1)); position:relative; border-bottom:1px solid var(--b-line);}
.bld-scene svg{width:100%; height:100%; display:block; overflow:visible; transition:transform .5s cubic-bezier(.2,.9,.3,1);}
.bld-card:hover .bld-scene svg{transform:translateY(-5px) scale(1.03);}
.bld-meta{padding:16px 20px 18px;}
.bld-name{font-size:16.5px; font-weight:800; letter-spacing:-.01em; color:var(--b-ink);}
.bld-code{font-weight:500; color:var(--g400);}
.bld-addr{font-size:12.5px; color:var(--b-muted); margin-top:3px;}
.bld-chips{display:flex; gap:8px; margin-top:13px; flex-wrap:wrap;}
.bld-chip{font-size:11.5px; font-weight:700; background:var(--b-soft); color:var(--b-muted); border-radius:20px; padding:5px 11px; border:1px solid var(--b-line);}
.bld-chip b{color:var(--b-ink);}

/* form: pickers + live preview */
.bld-form{display:flex; gap:24px; flex-wrap:wrap; align-items:flex-start;}
.bld-preview-wrap{flex:1 1 320px; max-width:440px;}
.bld-preview{border:1px solid var(--b-line); border-radius:22px; overflow:hidden; box-shadow:var(--b-shadow); height:260px;}
.bld-preview-note{font-size:11.5px; color:var(--b-muted); margin-top:8px; text-align:center;}
.bld-seg{display:flex; gap:6px;}
.bld-seg button{flex:1; border:1.4px solid var(--g200); background:var(--g100); color:var(--g500); border-radius:10px; padding:8px 0; font-size:12px; font-weight:700; cursor:pointer; font-family:inherit;}
.bld-seg button.on{border-color:var(--black); color:var(--black); background:#fff;}
.bld-dots{display:flex; gap:10px;}
.bld-dots button{width:30px; height:30px; border-radius:50%; border:2px solid transparent; cursor:pointer; box-shadow:inset 0 0 0 2px #fff, 0 0 0 1px var(--g200);}
.bld-dots button.on{border-color:var(--black);}
.tone-dot-stone{background:#c8ced6} .tone-dot-sand{background:#d6c7aa} .tone-dot-sage{background:#8fb796} .tone-dot-slate{background:#5f6e7e}

/* ---------- the isometric building (SVG) ---------- */
.tone-stone{--top:#f6f7f8; --left:#dfe3e8; --right:#c8ced6; --roof:#8e98a5; --roof2:#a9b2be;}
.tone-sand {--top:#f8f2e7; --left:#eadfca; --right:#d6c7aa; --roof:#a4795c; --roof2:#bf9577;}
.tone-sage {--top:#eff4ef; --left:#d4e0d5; --right:#bdcebf; --roof:#587b5b; --roof2:#729776;}
.tone-slate{--top:#eaeef3; --left:#c9d2de; --right:#aeb9c8; --roof:#46525f; --roof2:#5f6e7e;}
.f-top{fill:var(--top)} .f-left{fill:var(--left)} .f-right{fill:var(--right)}
.f-top,.f-left,.f-right{stroke:var(--edge); stroke-width:.6; stroke-linejoin:round;}
.r-slope{fill:var(--roof2)} .r-slope2{fill:var(--roof)} .r-gable{fill:var(--right)} .r-inner{fill:var(--left)}
.r-slope,.r-slope2,.r-gable,.r-inner{stroke:var(--edge); stroke-width:.6; stroke-linejoin:round;}
.g-top{fill:var(--ground)} .g-left{fill:var(--ground-side)} .g-right{fill:var(--ground-side2)}
.win{fill:var(--win-off); stroke:var(--edge); stroke-width:.4;}
.win.lit{fill:var(--win-on);}
.door{fill:#4b5563; stroke:var(--edge); stroke-width:.4;}
.canopy{fill:var(--tree)} .trunk{fill:var(--trunk)} .antenna{stroke:var(--roof); stroke-width:1; fill:none; stroke-linecap:round;} .beacon{fill:#ef4444;}
/* build-up: ground grows, floors drop in one by one, roof lands, windows switch on, trees pop */
.ground{transform-box:fill-box; transform-origin:50% 50%; animation:bldGroundIn .7s cubic-bezier(.2,.9,.3,1) backwards; animation-delay:var(--b);}
@keyframes bldGroundIn{from{opacity:0; transform:scale(.15) translateY(20px);}}
.floor{animation:bldFloorIn .8s cubic-bezier(.22,.9,.3,1) backwards; animation-delay:calc(var(--b) + .35s + var(--i) * .15s);}
@keyframes bldFloorIn{0%{opacity:0; transform:translateY(-80px);} 55%{opacity:1;} 100%{opacity:1; transform:none;}}
.roof{animation:bldRoofIn .9s cubic-bezier(.2,.9,.3,1.25) backwards; animation-delay:calc(var(--b) + .45s + var(--i) * .15s);}
@keyframes bldRoofIn{0%{opacity:0; transform:translateY(-110px);} 60%{opacity:1;} 100%{opacity:1; transform:none;}}
.win.lit{animation:bldWinOn .6s ease backwards, bldTwinkle 6s ease-in-out infinite; animation-delay:var(--wd), calc(var(--wd) + 1.2s);}
.win.lit.still{animation:bldWinOn .6s ease backwards; animation-delay:var(--wd);}
@keyframes bldWinOn{from{fill:var(--win-off);}}
@keyframes bldTwinkle{0%,100%{opacity:1} 50%{opacity:.78}}
.tree-in{transform-box:fill-box; transform-origin:50% 100%; animation:bldTreePop .6s cubic-bezier(.2,1.5,.4,1) backwards; animation-delay:calc(var(--b) + 1.1s + var(--i) * .15s);}
@keyframes bldTreePop{from{opacity:0; transform:scale(0);}}
.beacon{animation:bldBlink 1.8s ease-in-out infinite;} @keyframes bldBlink{0%,100%{opacity:1} 50%{opacity:.25}}
/* taken apart on delete */
.removing .floor{animation:bldFloorOut .5s cubic-bezier(.5,0,.9,.3) both; animation-delay:calc((var(--n) - var(--i)) * .08s);}
.removing .roof{animation:bldFloorOut .45s cubic-bezier(.5,0,.9,.3) both; animation-delay:0s;}
.removing .tree-in{animation:bldTreeOut .3s ease both;} .removing .win.lit{animation:none;}
.removing .ground{animation:bldGroundOut .45s ease .5s both;}
@keyframes bldFloorOut{to{opacity:0; transform:translateY(-70px);}} @keyframes bldTreeOut{to{opacity:0; transform:scale(0);}} @keyframes bldGroundOut{to{opacity:0; transform:scale(.3) translateY(16px);}}
/* animations off (the switch or the system "reduce motion" setting): the finished picture at once */
.no-anim *, .no-anim *::before, .no-anim *::after{animation:none !important; transition:none !important;}
@media (max-width:560px){ .bld-grid{grid-template-columns:1fr;} }

/* ===== Amenities: cards (Settings of each zone) ===== */
.amen-top{display:flex; justify-content:space-between; align-items:flex-start; gap:20px; margin-bottom:20px;}
.amen-sub{margin:0; max-width:560px; font-size:13px; line-height:1.55; color:var(--g500);}
.amen-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:18px;}
.amen-card{background:var(--white); border:1px solid var(--g150); border-radius:var(--radius-lg); box-shadow:var(--shadow-card); padding:18px 18px 16px;}
.amen-head{display:flex; gap:12px; align-items:center;}
.amen-ic{width:46px; height:46px; border-radius:14px; background:var(--g100); border:1px solid var(--g150); display:flex; align-items:center; justify-content:center; color:var(--black); flex:0 0 auto;}
.amen-name{font-size:15.5px; font-weight:800; color:var(--black);}
.amen-hours{display:flex; align-items:center; gap:5px; font-size:12.5px; color:var(--g500); margin-top:3px;}
.amen-tags{display:flex; gap:8px; flex-wrap:wrap; margin:14px 0; min-height:26px;}
.amen-tag{font-size:11.5px; font-weight:700; border-radius:20px; padding:5px 11px; background:var(--g100); color:var(--g500);}
.amen-tag.on{background:var(--brand); color:#fff;}
.amen-tag.off{background:transparent; border:1.3px dashed var(--g300); color:var(--g500);}
.amen-actions{display:flex; gap:8px; border-top:1px solid var(--g150); padding-top:14px;}
.field label.amen-switch,.amen-switch{display:inline-flex; align-items:center; gap:10px; cursor:pointer; font-size:13px; font-weight:600; color:var(--black); text-transform:none; letter-spacing:0;}
.amen-switch input{display:none}
.amen-sw{width:38px; height:22px; border-radius:20px; background:var(--g200); position:relative; transition:background .25s; flex:0 0 auto;}
.amen-sw::after{content:""; position:absolute; top:3px; left:3px; width:16px; height:16px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.3); transition:transform .25s cubic-bezier(.3,1.4,.5,1);}
.amen-switch input:checked + .amen-sw{background:var(--brand);} .amen-switch input:checked + .amen-sw::after{transform:translateX(16px);}
.amen-help{margin:7px 0 0; font-size:11.5px; color:var(--g500); line-height:1.5;}
.amen-times{display:flex; align-items:center; gap:10px;} .amen-times input{width:130px;}
.field label.amen-check,.amen-check{display:flex; align-items:center; gap:8px; margin-top:10px; font-size:12.5px; font-weight:600; text-transform:none; letter-spacing:0; cursor:pointer;}
.amen-check input{width:auto;}
@media (max-width:700px){ .amen-top{flex-direction:column;} }

/* ===== Residents: little buildings, occupancy bar, avatars, rows sliding in ===== */
.res-bld{width:104px; height:86px; flex:0 0 auto; border-radius:14px; overflow:hidden; background:radial-gradient(120% 95% at 50% 100%, var(--sky2), var(--sky1)); border:1px solid var(--b-line);}
.res-bld svg{width:100%; height:100%; display:block;}
.res-bld.still *{animation:none !important;}
.res-occ{width:150px; height:5px; border-radius:5px; background:var(--g150); margin-top:8px; overflow:hidden;}
.res-occ i{display:block; height:100%; width:var(--w); background:var(--brand); border-radius:5px; animation:resOcc 1s cubic-bezier(.2,.9,.3,1) .4s backwards;}
@keyframes resOcc{from{width:0}}
.res-av{display:inline-flex; width:26px; height:26px; border-radius:50%; align-items:center; justify-content:center; margin-right:10px; font-size:10.5px; font-weight:800; color:#fff; vertical-align:middle; background:hsl(var(--h) 38% 46%);}
.res-open tbody tr{animation:resRow .5s cubic-bezier(.2,.9,.3,1) backwards; animation-delay:calc(var(--i) * .06s);}
.res-open .res-av{animation:resPop .5s cubic-bezier(.2,1.5,.4,1) backwards; animation-delay:calc(var(--i) * .06s + .12s);}
@keyframes resRow{from{opacity:0; transform:translateX(-16px);}}
@keyframes resPop{from{opacity:0; transform:scale(0);}}
@media (max-width:700px){ .res-bld{width:84px; height:70px;} .res-occ{width:110px;} }

/* Roles */
.role-select{font-size:12px; padding:5px 8px; border:1px solid var(--g200); border-radius:8px; background:#fff;}
.role-select:disabled{opacity:.6;}
.ro-banner{background:var(--g100); border:1px dashed var(--g300); border-radius:10px; padding:8px 12px; font-size:12.5px; font-weight:600; color:var(--g700); margin-bottom:14px;}

/* Settings: two columns of soft rounded "islands" */
.settings-islands .page-title{margin-bottom:8px;}
.isl-grid{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:24px; align-items:start; margin-bottom:24px;}
.isl-col{display:flex; flex-direction:column; gap:24px; min-width:0;}
.settings-islands .admin-card{max-width:none !important; width:100%; margin:0 !important; border-radius:28px; padding:28px 30px; box-shadow:0 1px 2px rgba(20,30,20,.04), 0 6px 22px rgba(20,30,20,.06);}
@media (max-width:1000px){ .isl-grid{grid-template-columns:1fr;} }
@media (max-width:900px){
  .admin-shell{height:auto; overflow:visible;}
  .settings-islands .admin-card{border-radius:22px; padding:18px 20px;}
}

/* Overview: every section is its own island on a slightly deeper canvas (same look as the Settings islands) */
.content.dash-islands{background:#EFF0EE;}
.dash-islands .admin-card, .dash-islands .dist{border:0; border-radius:28px; box-shadow:0 1px 2px rgba(20,30,20,.04), 0 10px 30px -14px rgba(20,30,20,.16);}
.dash-islands .admin-card{padding:22px 24px;}
.dash-islands .dist{margin-bottom:24px;}
.dash-islands .dash-row{gap:20px; margin-bottom:24px;}
.dash-islands .dash-row .admin-card{padding:22px 24px 20px;}
.dash-islands .dash-row .admin-card .n{font-size:30px;}
.dash-islands .dash-cols{gap:24px;}
.dash-islands .dash-cols > div > .admin-card + .admin-card{margin-top:24px;}
.dash-islands .dash-cols > div > .admin-card{margin-bottom:0 !important;}
.dash-islands .dash-cols .admin-card[style*="padding:0"] > div:first-child{padding:20px 24px !important; border-bottom:0 !important;}
.dash-islands .admin-table th{background:transparent;}
.dash-islands .admin-table th:first-child, .dash-islands .admin-table td:first-child{padding-inline-start:24px;}
.dash-islands .admin-table th:last-child, .dash-islands .admin-table td:last-child{padding-inline-end:24px;}
.dash-islands .admin-table tr:last-child td{border-bottom:0;}
.dash-islands .ro-banner{border:0; border-radius:20px; background:#fff; box-shadow:0 1px 2px rgba(20,30,20,.04), 0 8px 24px -14px rgba(20,30,20,.14); padding:14px 20px; margin-bottom:24px !important;}
@media (max-width:900px){
  .admin-main:has(.dash-islands){background:#EFF0EE;}
  .dash-islands .dash-cols .admin-card[style*="padding:0"]{overflow-x:auto;}
  .dash-islands .dash-cols .admin-table{min-width:560px;}
  .dash-islands .admin-card, .dash-islands .dist{border-radius:22px;}
  .dash-islands .dash-row{gap:12px; margin-bottom:16px;}
  .dash-islands .dash-cols{gap:16px;}
  .dash-islands .dash-cols > div > .admin-card + .admin-card{margin-top:16px;}
  .dash-islands .dash-row .admin-card{padding:16px 18px;}
  .dash-islands .dash-row .admin-card .n{font-size:26px;}
}

/* Tasks */
.task-row{display:flex; align-items:center; gap:14px; padding:14px 18px; border-bottom:1px solid var(--g150);}
.task-row:last-child{border-bottom:0;}
.task-check{flex:0 0 24px; width:24px; height:24px; border-radius:50%; border:2px solid var(--g300); background:#fff; color:#fff; font-size:14px; line-height:1; cursor:pointer; padding:0; display:flex; align-items:center; justify-content:center;}
.task-check:hover{border-color:var(--brand-dark);}
.task-row.done .task-check{background:var(--brand-dark); border-color:var(--brand-dark);}
.task-main{flex:1; min-width:0;}
.task-title{font-size:14px; font-weight:700;}
.task-row.done .task-title{text-decoration:line-through; color:var(--g500);}
.task-meta{display:flex; flex-wrap:wrap; gap:4px 12px; font-size:12px; color:var(--g500); margin-top:3px;}
.task-badge{font-weight:800; font-size:10px; text-transform:uppercase; letter-spacing:.03em; padding:2px 8px; border-radius:12px;}
.task-badge.late{background:#f6dcdc; color:#8a1f1f;}
.task-badge.today{background:var(--brand-tint); color:var(--brand-dark);}

/* Notes and history */
.note-row{padding:12px 0; border-top:1px solid var(--g150); margin-top:10px;}
.note-body{font-size:13px; line-height:1.5; white-space:pre-wrap;}
.note-meta{font-size:11.5px; color:var(--g500); margin-top:5px; display:flex; gap:6px; align-items:center; flex-wrap:wrap;}
.note-del{margin-left:auto; background:none; border:0; color:#8a1f1f; font-size:11.5px; font-weight:700; cursor:pointer;}
.timeline{display:flex; flex-direction:column; gap:14px; position:relative;}
.tl-item{display:flex; gap:12px; align-items:flex-start;}
.tl-dot{flex:0 0 10px; height:10px; border-radius:50%; margin-top:5px; background:var(--g300);}
.tl-request,.tl-request_status{background:var(--brand-dark);}
.tl-booking{background:#5b8c6a;} .tl-booking_cancelled{background:#b3261e;}
.tl-note{background:#c9a227;}
.tl-text{font-size:13px; line-height:1.4;} .tl-time{font-size:11.5px; color:var(--g500);}

/* Single-card forms: the same soft rounded "island" look */
.form-islands .admin-card{border-radius:28px; padding:28px 30px; box-shadow:0 1px 2px rgba(20,30,20,.04), 0 6px 22px rgba(20,30,20,.06);}

/* Contact groups */
.grp-item{display:flex; justify-content:space-between; align-items:center; width:100%; background:none; border:1px solid transparent; border-radius:14px; padding:10px 12px; cursor:pointer; font:inherit; font-size:13.5px; font-weight:700; text-align:left;}
.grp-item em{font-style:normal; font-weight:500; font-size:12px; color:var(--g500);}
.grp-item:hover{background:var(--g50);}
.grp-item.active{background:var(--brand-tint); border-color:var(--brand-tint-2); color:var(--brand-dark);}
.grp-members{max-height:340px; overflow-y:auto; border:1px solid var(--g200); border-radius:14px; padding:6px 12px;}
.grp-bld{font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; color:var(--g500); margin:10px 0 4px 0;}
.grp-member{display:flex; gap:8px; align-items:center; padding:6px 0; font-size:13px; cursor:pointer; text-transform:none; letter-spacing:0; font-weight:500; color:var(--black);}
.grp-member em{margin-left:auto; font-style:normal; color:var(--g500); font-size:12px;}

/* ===== Dashboard: the 3D "district" (all buildings in one scene, day / night) ===== */
.dist{position:relative; border-radius:28px; overflow:hidden; margin-bottom:24px; border:1px solid var(--g150); box-shadow:0 1px 2px rgba(20,30,20,.04), 0 10px 34px -14px rgba(20,30,20,.25); min-height:370px; display:flex; align-items:flex-end;
  --d-ink:#1b2430; --d-pill:rgba(255,255,255,.88);}
.dist.night{--d-ink:#e8edf6; --d-pill:rgba(24,32,48,.72);
  --win-off:#2c3547; --win-on:#ffd36e; --ground:#3b475b; --ground-side:#2f3849; --ground-side2:#262e3c; --tree:#3f6a52; --trunk:#4a4038; --edge:rgba(0,0,0,.28);}
.dist.night svg{--top:#8f99ab; --left:#677188; --right:#4f586c; --roof:#394150; --roof2:#465061;}
.dist-sky{position:absolute; inset:0; transition:opacity .9s ease;}
.dist-sky-day{background:linear-gradient(180deg,#cde5f6 0%,#e9f4fb 62%,#f7fafc 100%);}
.dist-sky-night{background:linear-gradient(180deg,#0e1525 0%,#1f2b45 62%,#33425f 100%); opacity:0;}
.dist.night .dist-sky-night{opacity:1;}
.dist-stars{position:absolute; inset:0 0 40% 0; opacity:0; transition:opacity .9s ease;
  background:
    radial-gradient(1.4px 1.4px at 8% 22%,#fff,transparent), radial-gradient(1.2px 1.2px at 17% 62%,#dfe8ff,transparent),
    radial-gradient(1.6px 1.6px at 29% 14%,#fff,transparent), radial-gradient(1.2px 1.2px at 41% 48%,#fff,transparent),
    radial-gradient(1.4px 1.4px at 55% 20%,#e8eeff,transparent), radial-gradient(1.2px 1.2px at 66% 58%,#fff,transparent),
    radial-gradient(1.6px 1.6px at 78% 16%,#fff,transparent), radial-gradient(1.2px 1.2px at 91% 44%,#dfe8ff,transparent);
  animation:distStars 4s ease-in-out infinite;}
.dist.night .dist-stars{opacity:1;}
@keyframes distStars{0%,100%{filter:brightness(1)} 50%{filter:brightness(.6)}}
.dist-cloud{position:absolute; height:26px; width:110px; border-radius:30px; background:#fff; opacity:.85; filter:blur(.4px); transition:opacity .9s;
  animation:distCloud linear infinite; left:-160px;}
.dist-cloud::before,.dist-cloud::after{content:""; position:absolute; background:#fff; border-radius:50%;}
.dist-cloud::before{width:44px; height:44px; left:16px; top:-22px;} .dist-cloud::after{width:58px; height:58px; left:46px; top:-30px;}
.dist-cloud.c1{top:34px; animation-duration:80s;} .dist-cloud.c2{top:78px; transform:scale(.7); animation-duration:110s; animation-delay:-45s;} .dist-cloud.c3{top:20px; transform:scale(.55); animation-duration:140s; animation-delay:-90s;}
.dist.night .dist-cloud{opacity:.12;}
@keyframes distCloud{from{left:-180px} to{left:calc(100% + 40px)}}
.dist-orb{position:absolute; top:18px; right:22px; z-index:5; width:44px; height:44px; border-radius:50%; border:0; background:transparent; cursor:pointer; padding:0;}
.dist-orb span{position:absolute; inset:5px; border-radius:50%; transition:opacity .6s, transform .8s cubic-bezier(.2,.9,.3,1);}
.dist-orb .sun{background:radial-gradient(circle at 40% 38%,#fff3b0,#ffc83d); box-shadow:0 0 0 6px rgba(255,200,61,.22), 0 0 34px 8px rgba(255,200,61,.45); animation:distSun 6s ease-in-out infinite;}
.dist-orb .moon{background:#eef2fb; box-shadow:inset -9px -4px 0 0 #b9c4dc, 0 0 26px 4px rgba(190,205,240,.45); opacity:0; transform:translateY(20px) scale(.6);}
.dist.night .dist-orb .sun{opacity:0; transform:translateY(-22px) scale(.5);}
.dist.night .dist-orb .moon{opacity:1; transform:none;}
@keyframes distSun{0%,100%{box-shadow:0 0 0 6px rgba(255,200,61,.22), 0 0 34px 8px rgba(255,200,61,.45)} 50%{box-shadow:0 0 0 10px rgba(255,200,61,.14), 0 0 44px 12px rgba(255,200,61,.55)}}

  transform:perspective(1100px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)); transition:transform .18s ease-out; will-change:transform;}

.dist-tag{position:relative; z-index:3; text-align:center; margin-bottom:-18px; color:var(--d-ink); display:flex; flex-direction:column; align-items:center; gap:3px; transition:color .6s;}

/* windows: the scene draws the evening set; by day only about one in five of those stays lit; the switch fades them in and out */

/* ===== Bookings calendar: month grid of tiny towers + day equalizers ===== */
.cal-nav{display:flex; align-items:center; gap:6px; margin-bottom:14px;}
.cal-title{flex:1; text-align:center; font-size:16px; font-weight:800; text-transform:capitalize; letter-spacing:-.01em;}
.cal-arrow{width:34px; height:34px; border-radius:50%; border:1px solid var(--g200); background:#fff; font-size:20px; line-height:1; cursor:pointer; color:var(--g700); transition:background .2s, transform .2s;}
.cal-arrow:hover{background:var(--g100); transform:scale(1.08);}
.cal-week{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-bottom:6px;}
.cal-week span{text-align:center; font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--g500);}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
.cal-grid.flip-next{animation:calFlipNext .5s cubic-bezier(.2,.85,.25,1);} .cal-grid.flip-prev{animation:calFlipPrev .5s cubic-bezier(.2,.85,.25,1);}
@keyframes calFlipNext{from{opacity:0; transform:perspective(900px) rotateY(-16deg) translateX(46px);}}
@keyframes calFlipPrev{from{opacity:0; transform:perspective(900px) rotateY(16deg) translateX(-46px);}}
.cal-cell{position:relative; aspect-ratio:1/1.08; border:1px solid var(--g150); background:#fff; border-radius:16px; padding:6px 7px; cursor:pointer; text-align:left; font:inherit; display:flex; flex-direction:column; transition:transform .2s cubic-bezier(.2,.9,.3,1), box-shadow .2s, border-color .2s; animation:calCellIn .45s cubic-bezier(.2,.85,.25,1) backwards; animation-delay:var(--d);}
@keyframes calCellIn{from{opacity:0; transform:translateY(14px) scale(.92);}}
.cal-cell.empty{border:0; background:transparent; animation:none; cursor:default;}
.cal-cell:not(.empty):hover{transform:translateY(-3px); box-shadow:0 10px 22px -12px rgba(0,0,0,.3);}
.cal-cell.sel{border-color:var(--brand-dark); box-shadow:0 0 0 2px var(--brand-tint-2);}
.cal-num{font-size:12px; font-weight:700; color:var(--g700);}
.cal-cell.today .cal-num{background:var(--brand-dark); color:#fff; border-radius:50%; width:22px; height:22px; display:inline-flex; align-items:center; justify-content:center; font-size:11.5px;}
.cal-cell.today::after{content:""; position:absolute; inset:-3px; border-radius:19px; border:2px solid var(--brand-dark); opacity:0; animation:calPulse 2.4s ease-out infinite; pointer-events:none;}
@keyframes calPulse{0%{opacity:.7; transform:scale(.96)} 100%{opacity:0; transform:scale(1.08)}}
.cal-stack{position:absolute; left:50%; bottom:2px; transform:translateX(-50%); width:52%; max-width:44px;}
.cal-tower{width:100%; display:block; overflow:visible;}
.cal-fl{animation:calFl .55s cubic-bezier(.22,.9,.3,1.1) backwards; animation-delay:calc(var(--d, 0s) + .25s + var(--k) * .08s);}
.cal-cell.has .cal-fl{animation-delay:calc(.3s + var(--k) * .08s);}
@keyframes calFl{from{opacity:0; transform:translateY(-26px);}}
.cal-bad{--top:#f3c9c6; --left:#e29b96; --right:#cf7770;}
.cal-count{position:absolute; top:6px; right:7px; font-size:10.5px; font-weight:800; color:var(--g500);}
.cal-legend{font-size:11.5px; color:var(--g500); margin:12px 0 0 0; display:flex; align-items:center; gap:8px;}
.cal-dot{width:9px; height:9px; border-radius:2px; background:#bdcebf; display:inline-block;}
.cal-today-pill{font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; background:var(--brand-tint); color:var(--brand-dark); padding:3px 9px; border-radius:20px; margin-left:6px; vertical-align:middle;}
.eq-row{margin-bottom:18px;} .eq-row:last-child{margin-bottom:0;}
.eq-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px;}
.eq-head b{font-size:13px;} .eq-head span{font-size:11.5px; color:var(--g500);}
.eq-bars{position:relative; display:grid; grid-template-columns:repeat(var(--cols),1fr); gap:3px; height:64px; align-items:end;}
.eq-col{position:relative; height:100%; background:var(--g100); border-radius:6px; overflow:visible;}
.eq-col i{position:absolute; left:0; right:0; bottom:0; height:var(--p); background:linear-gradient(180deg,#7fa985,#587b5b); border-radius:6px; transform-origin:bottom; animation:eqRise .7s cubic-bezier(.2,.9,.3,1.1) backwards; animation-delay:calc(var(--i) * .03s + .15s);}
.eq-col.full i{background:linear-gradient(180deg,#e0b15a,#c28a2c);} .eq-col.over i{background:linear-gradient(180deg,#e58b84,#c0453f);}
@keyframes eqRise{from{transform:scaleY(0);}}
.eq-col span{position:absolute; top:calc(100% + 3px); left:50%; transform:translateX(-50%); font-size:9.5px; color:var(--g500); font-weight:600;}
.eq-bars{margin-bottom:16px;}
.eq-now{position:absolute; top:-4px; bottom:-4px; width:2px; background:#d6342c; border-radius:2px; animation:eqNow 1.6s ease-in-out infinite; pointer-events:none;}
@keyframes eqNow{0%,100%{opacity:1} 50%{opacity:.35}}
.cal-row{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--g150); font-size:13px;}
.cal-row:last-child{border-bottom:0;} .cal-row.bad{box-shadow:inset 3px 0 0 #c0453f; padding-left:10px;}
.cal-who{font-size:12px; color:var(--g500); margin-top:2px;} .cal-conf{color:#8a1f1f; font-weight:700; margin-left:6px;}
.cal-wrap.no-anim .cal-cell, .cal-wrap.no-anim .cal-fl, .cal-wrap.no-anim .eq-col i{animation:none !important;}
@media (max-width:1000px){ .cal-cell{aspect-ratio:auto; min-height:58px;} }

/* ---- requests: status pipeline, row entrance, detail progress track ---- */
.rq-pipe{display:grid; grid-template-columns:.7fr repeat(5,1fr); gap:10px; margin-bottom:18px;}
.rq-all,.rq-stage{position:relative; border:1px solid var(--g150,#eee); background:#fff; border-radius:18px; padding:12px 14px 14px; text-align:left; cursor:pointer; font-family:inherit; display:flex; flex-direction:column; gap:2px; transition:transform .18s, box-shadow .18s, border-color .18s;}
.rq-all:hover,.rq-stage:hover{transform:translateY(-2px); box-shadow:0 6px 16px rgba(0,0,0,.06);}
.rq-all.active,.rq-stage.active{border-color:var(--brand-dark); box-shadow:0 0 0 1px var(--brand-dark) inset;}
.rq-all b,.rq-num{font-size:24px; font-weight:800; color:var(--black); line-height:1.1;}
.rq-all span,.rq-lbl{font-size:11.5px; font-weight:700; color:var(--g500);}
.rq-bar{height:5px; border-radius:3px; background:var(--g100); margin-top:8px; overflow:hidden;}
.rq-bar i{display:block; height:100%; border-radius:3px; background:var(--brand-dark);}
.rq-stage.completed .rq-bar i{background:var(--g400,#aaa);}
.rq-dot{position:absolute; top:12px; right:12px; width:9px; height:9px; border-radius:50%; background:#c0453f; animation:rqPulse 1.6s infinite;}
@keyframes rqPulse{0%{box-shadow:0 0 0 0 rgba(192,69,63,.5)}70%{box-shadow:0 0 0 8px rgba(192,69,63,0)}100%{box-shadow:0 0 0 0 rgba(192,69,63,0)}}
.rq-pipe.enter .rq-stage,.rq-pipe.enter .rq-all{animation:rqIn .5s both; animation-delay:calc(var(--i,0)*70ms);}
.rq-pipe.enter .rq-bar i{animation:rqBar .9s cubic-bezier(.2,.8,.2,1) both; animation-delay:calc(var(--i,0)*70ms + 200ms);}
@keyframes rqIn{from{opacity:0; transform:translateY(12px)}to{opacity:1; transform:none}}
@keyframes rqBar{from{width:0 !important}}
.rq-row{animation:rqRow .35s both; animation-delay:calc(var(--i,0)*28ms);}
@keyframes rqRow{from{opacity:0; transform:translateX(-8px)}to{opacity:1; transform:none}}
.rq-track{position:relative; display:grid; grid-template-columns:repeat(5,1fr); background:#fff; border:1px solid var(--g150,#eee); border-radius:18px; padding:18px 10px 14px; margin-bottom:16px;}
.rq-line{position:absolute; left:10%; right:10%; top:31px; height:4px; background:var(--g100); border-radius:2px;}
.rq-line i{display:block; height:100%; width:calc(var(--cur)/4*100%); background:var(--brand-dark); border-radius:2px;}
.rq-step{position:relative; display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center;}
.rq-pt{width:28px; height:28px; border-radius:50%; background:#fff; border:2px solid var(--g200); display:grid; place-items:center; font-size:12px; font-weight:800; color:var(--g500); z-index:1;}
.rq-step.done .rq-pt{background:var(--brand-dark); border-color:var(--brand-dark); color:#fff;}
.rq-step.now .rq-pt{border-color:var(--brand-dark); color:var(--brand-dark); box-shadow:0 0 0 4px var(--brand-tint);}
.rq-sl{font-size:11.5px; font-weight:700; color:var(--g500);}
.rq-step.now .rq-sl,.rq-step.done .rq-sl{color:var(--black);}
.rq-track.play .rq-line i{animation:rqLine .9s cubic-bezier(.2,.8,.2,1) both .15s;}
@keyframes rqLine{from{width:0}}
.rq-track.play .rq-step{animation:rqIn .45s both; animation-delay:calc(var(--i)*90ms);}
.rq-track.play .rq-step.now .rq-pt{animation:rqNow 2s infinite 1s;}
@keyframes rqNow{0%,100%{box-shadow:0 0 0 4px var(--brand-tint)}50%{box-shadow:0 0 0 8px rgba(0,0,0,0)}}
.rq-ev{animation:rqRow .4s both; animation-delay:calc(var(--i,0)*60ms + 250ms);}
.no-anim .rq-stage,.no-anim .rq-all,.no-anim .rq-row,.no-anim .rq-ev,.no-anim .rq-dot,.no-anim .rq-step,.no-anim .rq-line i,.no-anim .rq-bar i{animation:none !important;}
@media (max-width:900px){.rq-pipe{grid-template-columns:repeat(3,1fr);}}

/* ===== Motion layer for the remaining admin screens ===== */
/* section change = cross-fade: the new page comes in while the old one (.section-ghost, see adminLoaders.js) leaves */
#viewRoot[data-dir="forward"] .content{animation:aScrFwd .42s cubic-bezier(.22,.8,.3,1) .09s backwards;}
#viewRoot[data-dir="back"] .content{animation:aScrBack .42s cubic-bezier(.22,.8,.3,1) .09s backwards;}
#viewRoot[data-dir="fade"] .content{animation:aScrFade .4s cubic-bezier(.22,.8,.3,1) .09s backwards;}
@keyframes aScrFwd{from{opacity:0; transform:translateX(34px);}to{opacity:1; transform:none;}}
@keyframes aScrBack{from{opacity:0; transform:translateX(-34px);}to{opacity:1; transform:none;}}
@keyframes aScrFade{from{opacity:0; transform:translateY(12px) scale(.992);}to{opacity:1; transform:none;}}
.section-ghost{position:fixed !important; z-index:5; margin:0 !important; overflow:hidden !important; pointer-events:none; box-sizing:border-box; will-change:opacity, transform;}
.section-ghost.ghost-fade{animation:aGhostFade .2s cubic-bezier(.2,.6,.4,1) forwards;}
.section-ghost.ghost-forward{animation:aGhostFwd .2s cubic-bezier(.2,.6,.4,1) forwards;}
.section-ghost.ghost-back{animation:aGhostBack .2s cubic-bezier(.2,.6,.4,1) forwards;}
.section-ghost *{animation:none !important;}
@keyframes aGhostFade{to{opacity:0; transform:translateY(-8px) scale(.996);}}
@keyframes aGhostFwd{to{opacity:0; transform:translateX(-26px);}}
@keyframes aGhostBack{to{opacity:0; transform:translateX(26px);}}
@media (prefers-reduced-motion:reduce){ .section-ghost{display:none;} }
/* cards rise in, table rows cascade, lists step in — only on a screen change, only on screens without their own show */
body[data-enter="1"] #viewRoot:is([data-view="reports"],[data-view="bookings"],[data-view="guestParking"],[data-view="auditLog"],[data-view="tasks"],[data-view="groups"],[data-view="amenities"],[data-view="news"],[data-view="contractors"],[data-view="settings"],[data-view="residentDetail"],[data-view="requestDetail"]) .admin-card{animation:aRise .5s cubic-bezier(.22,.61,.36,1) backwards; animation-delay:calc(var(--ai,0)*70ms);}
.admin-card:nth-child(1){--ai:0}.admin-card:nth-child(2){--ai:1}.admin-card:nth-child(3){--ai:2}.admin-card:nth-child(4){--ai:3}.admin-card:nth-child(n+5){--ai:4}
.dash-cols > :nth-child(2) .admin-card:nth-child(1){--ai:1}.dash-cols > :nth-child(2) .admin-card:nth-child(2){--ai:2}.dash-cols > :nth-child(2) .admin-card:nth-child(3){--ai:3}
@keyframes aRise{from{opacity:0; transform:translateY(16px);}}
body[data-enter="1"] #viewRoot:is([data-view="bookings"],[data-view="guestParking"],[data-view="auditLog"],[data-view="amenities"],[data-view="news"],[data-view="contractors"],[data-view="tasks"],[data-view="groups"]) :is(.admin-table tbody tr, .task-row, .grp-row){animation:resRow .45s cubic-bezier(.2,.9,.3,1) backwards; animation-delay:calc(var(--r,0)*45ms + 120ms);}
.admin-table tbody tr:nth-child(1){--r:0}.admin-table tbody tr:nth-child(2){--r:1}.admin-table tbody tr:nth-child(3){--r:2}.admin-table tbody tr:nth-child(4){--r:3}.admin-table tbody tr:nth-child(5){--r:4}.admin-table tbody tr:nth-child(6){--r:5}.admin-table tbody tr:nth-child(7){--r:6}.admin-table tbody tr:nth-child(8){--r:7}.admin-table tbody tr:nth-child(n+9){--r:8}
.task-row:nth-child(1){--r:0}.task-row:nth-child(2){--r:1}.task-row:nth-child(3){--r:2}.task-row:nth-child(4){--r:3}.task-row:nth-child(5){--r:4}.task-row:nth-child(n+6){--r:5}
/* reports: bars grow from the baseline, numbers above them fade in after */
body[data-enter="1"] .bar-chart-bar{transform-origin:bottom; animation:aBar .9s cubic-bezier(.2,.9,.3,1.1) backwards; animation-delay:calc(var(--bi,0)*90ms + 250ms);}

@keyframes aBar{from{transform:scaleY(0);}}

.bld-top{margin-bottom:20px; align-items:center;}
.bld-stats{gap:0; border:1px solid var(--line); border-radius:var(--r-box); overflow:hidden; flex-wrap:nowrap;}
.bld-stat{display:flex; flex-direction:column-reverse; gap:4px; border:0; border-radius:0; min-width:130px; padding:12px 20px;}
.bld-stat + .bld-stat{border-inline-start:1px solid var(--line);}
.bld-stat b{font-size:24px; letter-spacing:-.02em;}
.bld-stat span{font-size:13px; color:var(--g600);}
/* people keep a stable pale tint of their own (identity, not data) */
.res-av{background:hsl(var(--h) 45% 90%); color:hsl(var(--h) 45% 26%); font-weight:600;}
.res-open tbody tr, .res-open .res-av, .res-occ i{animation:none !important;}
.res-occ{height:4px; border-radius:2px; background:#EFEFED;} .res-occ i{border-radius:2px;}
.res-bld{border:1px solid var(--line); border-radius:var(--r-ctl); background:#E7EDF1;}
/* a row action is quiet until the pointer is on it */
.admin-table td .btn-secondary{background:none; border-color:transparent; color:var(--g600); font-weight:500;}
.admin-table tr:hover td .btn-secondary, .admin-table td .btn-secondary:focus-visible{border-color:var(--line-strong); color:var(--black);}
.admin-table td .btn-secondary:hover{background:var(--frame);}
.dash-cat-icon svg{display:block;}
.booking-row-type{gap:10px;}
/* native file pickers look like the rest of the buttons */
input[type=file]{font-size:13px; color:var(--g600);}
input[type=file]::file-selector-button{font:inherit; font-size:13px; font-weight:600; color:var(--black); background:var(--sheet); border:1px solid var(--line-strong); border-radius:var(--r-ctl); padding:7px 12px; margin-inline-end:10px; cursor:pointer;}
input[type=file]::file-selector-button:hover{background:var(--frame);}
.res-wrap select{border:1px solid var(--line-strong); border-radius:var(--r-ctl); background:var(--sheet);}
.amen-note{font-size:13px; color:var(--g600);}

/* ===== Settings and other forms ===== */
.admin-card h3{font-size:15px !important; font-weight:600 !important; letter-spacing:-.005em;}
/* nothing under 12px in the working text (notes, sub-lines) */
#viewRoot :is([style*="font-size:11.5px"], [style*="font-size:11px"], [style*="font-size:10.5px"]):not(.status-pill):not(.nav-badge):not(.cal-count){font-size:12px !important;}
.settings-islands .page-title{margin-bottom:16px;}
.svc-setting-row{min-height:54px; padding:8px 0; border-bottom:1px solid #EFEFED;}
.svc-setting-name{font-size:14px; font-weight:500;}
.svc-price-wrap input{border:1px solid var(--line-strong); background:var(--sheet); border-radius:var(--r-ctl); height:34px;}
.switch .slider{background:#CFCFCC;}
.switch .slider::before{box-shadow:none;}
.role-select{border:1px solid var(--line-strong); border-radius:var(--r-ctl); padding:6px 8px; font-size:13px;}

/* ===== Messages: the conversation list is a sheet of its own beside the thread ===== */
.msg-thread-list{background:var(--sheet) !important; border:1px solid var(--line); border-radius:var(--r-box); margin:0 12px 0 0; padding:12px 0 !important; width:280px !important;}
html[dir=rtl] .msg-thread-list{margin:0 0 0 12px;}
.msg-thread-list > div:first-child{text-transform:none !important; font-size:13px !important; font-weight:600 !important; color:var(--g700) !important; letter-spacing:0;}
.msg-thread-list .thread-row{border-bottom:1px solid #EFEFED; padding:12px 16px;}
.msg-thread-list .thread-row:hover{background:#FAFAF8;}
.msg-thread-list .thread-row.active{background:var(--frame);}
.msg-thread-list .thread-row > div:first-child{font-weight:600 !important; font-size:14px !important;}
#viewRoot[data-view="messages"] [style*="max-width:80%"]{animation:none; font-size:14px !important; border-radius:12px !important; line-height:1.45;}
#viewRoot[data-view="messages"] #replyInput{border:1px solid var(--line-strong); background:var(--sheet); border-radius:var(--r-ctl) !important; font-size:14px !important;}
#viewRoot[data-view="messages"] [data-action="send-reply"]{border-radius:var(--r-ctl) !important;}

/* ===== Calendar: flat, still; the towers stay (they are the product's own picture of a booking) ===== */
.cal-title{font-size:16px; font-weight:600;}
.cal-arrow{border-radius:var(--r-ctl); border:1px solid var(--line-strong); width:34px; height:34px;}
.cal-arrow:hover{transform:none; background:var(--frame);}
.cal-cell{border:1px solid var(--line); border-radius:10px; animation:none !important; transition:background .15s;}
.cal-cell:not(.empty):hover{transform:none; box-shadow:none; background:#FAFAF8;}
.cal-cell.sel{border-color:var(--black); box-shadow:none; background:var(--frame);}
.cal-cell.today::after{animation:none; opacity:1; inset:-1px; border:1px solid var(--black); border-radius:10px;}
.cal-cell.today .cal-num{background:var(--black);}
.cal-grid.flip-next, .cal-grid.flip-prev{animation:none;}
.cal-fl{animation:none !important;}
.cal-num{font-size:13px;} .cal-count{font-size:12px; font-weight:600; color:var(--g600);}
.cal-legend{font-size:12px;}
.eq-col{background:#EFEFED; border-radius:4px;}
.eq-col i, .eq-col.full i, .eq-col.over i{animation:none !important; border-radius:4px;}
.eq-col i{background:var(--brand);}
.eq-col.full i{background:#C9962B;}
.eq-col.over i{background:#C0453F;}
.eq-col span{font-size:11px;}
.eq-now{animation:none; background:var(--black); width:1px;}
.eq-head b{font-size:14px; font-weight:600;} .eq-head span{font-size:12px;}
.cal-row{border-bottom:1px solid #EFEFED; font-size:14px;}
.cal-row.bad{box-shadow:none; border-inline-start:2px solid #C0453F; padding-inline-start:10px;}
.cal-conf{color:#A3342B;}

/* the same icon on every row of a list says nothing */
.admin-table .booking-row-type .dash-cat-icon{display:none;}

/* ===== Buildings, equipment, reports ===== */
.bld-card{border-radius:var(--r-box); box-shadow:none; border:1px solid var(--line);}
.bld-card:hover{box-shadow:none; border-color:var(--line-strong);}
.bld-scene{background:#E7EDF1; border-bottom:1px solid var(--line);}
.bld-name{font-size:16px; font-weight:600;}
.bld-chip{font-size:12px; font-weight:500; border-radius:999px; background:var(--frame); border:0;}
.bld-badge{font-size:12px; font-weight:600; letter-spacing:0;}
.bld-seg button.on{border-color:var(--black);}
.bld-preview{border-radius:var(--r-box); box-shadow:none;}
.amen-ic{width:auto; height:auto; background:none; border:0; border-radius:0; color:var(--g600);}
.amen-name{font-size:15px; font-weight:600;}
.amen-tag{font-size:12px; font-weight:500;}
.amen-tag.on{background:var(--brand-tint); color:var(--brand-dark);}
.amen-tag.off{border:1px dashed var(--line-strong);}
.amen-actions{border-top:1px solid var(--line);}
.admin-card .n{font-size:28px; font-weight:500; letter-spacing:-.02em; font-variant-numeric:tabular-nums;}
.admin-card .l{font-size:13px; font-weight:500; color:var(--g600);}
.bar-chart-bar{max-width:56px;}
.bar-chart-label{font-size:13px;}

/* ===== No entrances: nothing performs when a screen opens ===== */
body[data-enter="1"] #viewRoot :is(.admin-card, .admin-table tbody tr, .task-row, .grp-item, .amen-card, .rq-stage, .rq-all, .rq-row, .rq-ev){animation:none !important;}
.rq-row, .rq-ev, .rq-pipe.enter .rq-stage, .rq-pipe.enter .rq-all, .rq-pipe.enter .rq-bar i, .rq-track.play .rq-step, .rq-track.play .rq-line i{animation:none !important;}
@keyframes aScrFwd{from{opacity:0}} @keyframes aScrBack{from{opacity:0}} @keyframes aScrFade{from{opacity:0}}
@keyframes aGhostFade{to{opacity:0}} @keyframes aGhostFwd{to{opacity:0}} @keyframes aGhostBack{to{opacity:0}}
body[data-enter="1"] .admin-nav-item.active{animation:none;}

/* ===== Phone ===== */
@media (max-width:900px){
  .topbar, html[dir=rtl] .topbar{height:52px; padding:0 14px;}
  .admin-sidebar{width:100%; flex:0 0 auto; padding:0 10px 8px; gap:2px;}
  .admin-nav-group, .admin-nav-group:not(:has(.admin-nav-head)){margin-bottom:0; padding:4px; border-radius:16px;}
  .admin-nav-group + .admin-nav-group{border-left:0; padding-inline-start:4px; margin-inline-start:0;}
  .admin-sidebar > .admin-nav-item[data-action="logout"]{padding:9px 12px; border-radius:14px;}
  .admin-nav-item, .admin-nav-group:not(:has(.admin-nav-head)) .admin-nav-item{padding:7px 10px;}
  .admin-main, html[dir=rtl] .admin-main{padding:0 8px 8px;}
  .admin-main:has(.dash-islands){background:var(--frame);}
  .content, .content.dash-islands, .content.settings-islands, .content.form-islands{padding:20px 16px 32px; border-radius:var(--r-box);}
  .settings-islands .admin-card, .form-islands .admin-card{padding:18px 16px; border-radius:var(--r-box);}
  .dash-islands .admin-card, .dash-islands .dist{border-radius:var(--r-box);}
  .dash-row{grid-template-columns:repeat(2,1fr);}
  .dash-row .admin-card:nth-child(3){border-inline-start:0; border-top:1px solid var(--line);}
  .dash-row .admin-card:nth-child(4){border-top:1px solid var(--line);}
  .dash-islands .dash-row{gap:0; margin-bottom:20px;}
  .dash-islands .dash-row .admin-card{padding:16px 18px;}
  .msg-thread-list{width:120px !important; margin-right:8px;}
  .msg-thread-list > div:first-child{padding-inline:12px !important; font-size:12px !important; overflow-wrap:normal;}
  .msg-thread-list .thread-row{padding:10px 12px;}
  .msg-thread-list .thread-row > div:first-child{font-size:13px !important;}
  .admin-card[style*="padding:0"]{overflow-x:auto;}
  .admin-card[style*="padding:0"] .admin-table{min-width:620px;}
  .bld-stat{min-width:0; flex:1; padding:10px 14px;}
  .bld-stats{width:100%;}
  .rq-pipe{grid-template-columns:repeat(3,1fr);}
  .rq-stage:nth-child(4), .rq-all{border-inline-start:0;}
  .rq-stage:nth-child(n+4){border-top:1px solid var(--line);}
  .rq-all + .rq-stage{border-inline-start:1px solid var(--line);}
}
</style>
<style>:root{--brand:#1B1C1B;--brand-dark:#141514;--brand-tint:#F1F1F1;--brand-tint-2:#E4E4E4;--brand-rgb:27,28,27;}
</style>

<body>
<div id="viewRoot"></div>
<script>// adminApi.js — thin wrapper for The Office's admin-only endpoints.
// Uses its own token key so an admin session and a resident session
// (if somehow open in the same browser) never collide.

const ADMIN_TOKEN_KEY = 'pivert_admin_token';
const ADMIN_NAME_KEY = 'pivert_admin_name';

const adminApi = {
  // The real token is in an HttpOnly cookie (server/webCookie.ts); localStorage keeps only the placeholder "cookie".
  getToken() {
    const t = localStorage.getItem(ADMIN_TOKEN_KEY);
    if (t && t !== 'cookie') { localStorage.removeItem(ADMIN_TOKEN_KEY); return null; } // a real token stored by an older version
    return t;
  },
  setToken(t) { localStorage.setItem(ADMIN_TOKEN_KEY, t); },
  clearToken() { localStorage.removeItem(ADMIN_TOKEN_KEY); },
  getName() { return localStorage.getItem(ADMIN_NAME_KEY); },
  setName(n) { localStorage.setItem(ADMIN_NAME_KEY, n); },
  clearName() { localStorage.removeItem(ADMIN_NAME_KEY); },

  sendSnowNotice(body) { return adminApi._request('/api/admin/snow-notice', { method: 'POST', body: JSON.stringify(body) }); },
  async _request(path, options = {}) {
    const headers = { 'Content-Type': 'application/json', 'X-Web-Client': '1', ...(options.headers || {}) };
    const token = adminApi.getToken();
    if (token) headers.Authorization = `Bearer ${token}`;
    const res = await fetch(path, { ...options, headers });
    if (res.status === 403) {
      // A role refusal ("read-only", "owners only") is not a sign-out: keep the session, show the message.
      let b = null; try { b = await res.clone().json(); } catch (_) {}
      if (b && b.code === 'role') { const e = new Error(b.error); e.status = 403; e.role = true; throw e; }
      // Signed in with a temporary password: keep the session, send the admin to "choose your password".
      if (b && b.code === 'must_change_password') { showMustChangePassword(); const e = new Error(b.error); e.status = 403; e.mustChange = true; throw e; }
    }
    if (res.status === 401) {
      // A wrong current password when changing it is not a sign-out either.
      let b = null; try { b = await res.clone().json(); } catch (_) {}
      if (b && b.code === 'wrong_password') { const e = new Error(b.error); e.status = 401; e.code = b.code; throw e; }
    }
    if (res.status === 401 && path.startsWith('/api/admin/auth/login')) {
      let b = null; try { b = await res.json(); } catch (_) {}
      throw new Error((b && b.error) || 'Unauthorized');
    }
    if (res.status === 401 || res.status === 403) {
      adminApi.clearToken();
      const err = new Error('Unauthorized');
      err.status = res.status;
      throw err;
    }
    let body = null;
    try { body = await res.json(); } catch (_) {}
    if (!res.ok) {
      // Password refused by the server's policy: say why, in the admin's language.
      const msg = body && body.code && L && L.pwPolicy && L.pwPolicy[body.code];
      throw new Error(msg || (body && body.error) || `Request failed (${res.status})`);
    }
    return body;
  },

  login(email, password) {
    return adminApi._request('/api/admin/auth/login', { method: 'POST', body: JSON.stringify({ email, password }) });
  },
  login2fa(mfaToken, code) { return adminApi._request('/api/admin/auth/login-2fa', { method: 'POST', body: JSON.stringify({ mfaToken, code }) }); },
  tfaStatus() { return adminApi._request('/api/admin/auth/2fa/status'); },
  tfaSetup() { return adminApi._request('/api/admin/auth/2fa/setup', { method: 'POST', body: '{}' }); },
  tfaEnable(code) { return adminApi._request('/api/admin/auth/2fa/enable', { method: 'POST', body: JSON.stringify({ code }) }); },
  tfaDisable(password, code) { return adminApi._request('/api/admin/auth/2fa/disable', { method: 'POST', body: JSON.stringify({ password, code }) }); },
  tfaReset(id) { return adminApi._request(`/api/admin/admins/${id}/2fa-reset`, { method: 'POST', body: '{}' }); },
  checkEmail(email) { return adminApi._request('/api/admin/auth/check-email', { method: 'POST', body: JSON.stringify({ email }) }); },
  forgotPassword(email) { return adminApi._request('/api/admin/auth/forgot-password', { method: 'POST', body: JSON.stringify({ email }) }); },
  setPassword(email, token, password) { return adminApi._request('/api/admin/auth/set-password', { method: 'POST', body: JSON.stringify({ email, token, password }) }); },
  getRl31(year) { return adminApi._request(`/api/admin/rl31?year=${year}`); },
  saveDwelling(payload) { return adminApi._request('/api/admin/rl31/dwelling', { method: 'PUT', body: JSON.stringify(payload) }); },
  // Files need the Authorization header, so they are fetched and handed to the browser as a download.
  async downloadFile(path, fallbackName) {
    const token = adminApi.getToken();
    const res = await fetch(path, { headers: token ? { Authorization: `Bearer ${token}` } : {} });
    if (res.status === 401 || res.status === 403) { adminApi.clearToken(); throw new Error('Unauthorized'); }
    if (!res.ok) throw new Error(`Export failed (${res.status})`);
    const m = /filename="([^"]+)"/.exec(res.headers.get('Content-Disposition') || '');
    const url = URL.createObjectURL(await res.blob());
    const a = document.createElement('a'); a.href = url; a.download = m ? m[1] : fallbackName;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  },
  getTasks(status) { return adminApi._request(`/api/admin/tasks?status=${status}`); },
  createTask(p) { return adminApi._request('/api/admin/tasks', { method: 'POST', body: JSON.stringify(p) }); },
  updateTask(id, p) { return adminApi._request(`/api/admin/tasks/${id}`, { method: 'PATCH', body: JSON.stringify(p) }); },
  deleteTask(id) { return adminApi._request(`/api/admin/tasks/${id}`, { method: 'DELETE' }); },
  getResidentNotes(id) { return adminApi._request(`/api/admin/residents/${id}/notes`); },
  addResidentNote(id, body, scope) { return adminApi._request(`/api/admin/residents/${id}/notes`, { method: 'POST', body: JSON.stringify({ body, scope }) }); },
  deleteNote(id) { return adminApi._request(`/api/admin/notes/${id}`, { method: 'DELETE' }); },
  getResidentHistory(id) { return adminApi._request(`/api/admin/residents/${id}/history`); },
  getGroups() { return adminApi._request('/api/admin/groups'); },
  createGroup(p) { return adminApi._request('/api/admin/groups', { method: 'POST', body: JSON.stringify(p) }); },
  updateGroup(id, p) { return adminApi._request(`/api/admin/groups/${id}`, { method: 'PATCH', body: JSON.stringify(p) }); },
  deleteGroup(id) { return adminApi._request(`/api/admin/groups/${id}`, { method: 'DELETE' }); },
  messageGroup(id, body) { return adminApi._request(`/api/admin/groups/${id}/message`, { method: 'POST', body: JSON.stringify({ body }) }); },
  getMe() { return adminApi._request('/api/admin/me'); },
  setAdminRole(id, role) { return adminApi._request(`/api/admin/admins/${id}`, { method: 'PATCH', body: JSON.stringify({ role }) }); },
  getAdmins() { return adminApi._request('/api/admin/admins'); },
  inviteAdmin(payload) { return adminApi._request('/api/admin/admins', { method: 'POST', body: JSON.stringify(payload) }); },
  deleteAdmin(id) { return adminApi._request(`/api/admin/admins/${id}`, { method: 'DELETE' }); },
  getRequests() { return adminApi._request('/api/admin/requests'); },
  // One page (50 rows) of a long list: { rows, total, page, pageSize, … }.
  getRequestsPage({ page = 0, status = 'all', sort = 'new' } = {}) { return adminApi._request(`/api/admin/requests?page=${page}&status=${encodeURIComponent(status)}&sort=${encodeURIComponent(sort)}`); },
  getBuildings() { return adminApi._request('/api/admin/buildings'); },
  getBuildingUnits(id) { return adminApi._request(`/api/admin/buildings/${id}/units`); },
  createBuilding(payload) { return adminApi._request('/api/admin/buildings', { method: 'POST', body: JSON.stringify(payload) }); },
  updateBuilding(id, payload) { return adminApi._request(`/api/admin/buildings/${id}`, { method: 'PATCH', body: JSON.stringify(payload) }); },
  deleteBuilding(id) { return adminApi._request(`/api/admin/buildings/${id}`, { method: 'DELETE' }); },
  getRequest(id) { return adminApi._request(`/api/admin/requests/${id}`); },
  updateRequest(id, patch) { return adminApi._request(`/api/admin/requests/${id}`, { method: 'PATCH', body: JSON.stringify(patch) }); },
  getDashboard() { return adminApi._request('/api/admin/dashboard'); },
  getResidents() { return adminApi._request('/api/admin/residents'); },
  getResident(id) { return adminApi._request(`/api/admin/residents/${id}`); },
  createResident(payload) { return adminApi._request('/api/admin/residents', { method: 'POST', body: JSON.stringify(payload) }); },
  updateResident(id, payload) { return adminApi._request(`/api/admin/residents/${id}`, { method: 'PATCH', body: JSON.stringify(payload) }); },
  deleteResident(id) { return adminApi._request(`/api/admin/residents/${id}`, { method: 'DELETE' }); },
  // Multipart POST (a form with a file); same error handling as _request for the common cases.
  async sendForm(path, formData) {
    const token = adminApi.getToken();
    const res = await fetch(path, { method: 'POST', headers: token ? { Authorization: `Bearer ${token}` } : {}, body: formData });
    let body = null; try { body = await res.json(); } catch (_) {}
    if (res.status === 403 && body && body.code === 'must_change_password') { showMustChangePassword(); throw new Error(body.error); }
    if (res.status === 403 && body && body.code === 'role') throw new Error(body.error);
    if (res.status === 401 || res.status === 403) { adminApi.clearToken(); throw new Error('Unauthorized'); }
    if (!res.ok) {
      // Password refused by the server's policy: say why, in the admin's language.
      const msg = body && body.code && L && L.pwPolicy && L.pwPolicy[body.code];
      throw new Error(msg || (body && body.error) || `Request failed (${res.status})`);
    }
    return body;
  },
  async uploadResidentDocument(residentId, file, docType) {
    const formData = new FormData();
    formData.append('file', file);
    formData.append('docType', docType);
    const token = adminApi.getToken();
    const res = await fetch(`/api/admin/residents/${residentId}/documents`, {
      method: 'POST', headers: token ? { Authorization: `Bearer ${token}` } : {}, body: formData,
    });
    if (res.status === 401 || res.status === 403) { adminApi.clearToken(); throw new Error('Unauthorized'); }
    let body = null; try { body = await res.json(); } catch (_) {}
    if (!res.ok) throw new Error((body && body.error) || `Upload failed (${res.status})`);
    return body;
  },
  deleteResidentDocument(residentId, docId) { return adminApi._request(`/api/admin/residents/${residentId}/documents/${docId}`, { method: 'DELETE' }); },
  getSharedDocuments() { return adminApi._request('/api/admin/shared-documents'); },
  async uploadSharedDocument(file, docType, buildingCode, requiresAck) {
    const formData = new FormData();
    formData.append('file', file);
    formData.append('docType', docType);
    if (buildingCode) formData.append('buildingCode', buildingCode);
    if (requiresAck) formData.append('requiresAck', '1');
    const token = adminApi.getToken();
    const res = await fetch('/api/admin/shared-documents', {
      method: 'POST', headers: token ? { Authorization: `Bearer ${token}` } : {}, body: formData,
    });
    if (res.status === 401 || res.status === 403) { adminApi.clearToken(); throw new Error('Unauthorized'); }
    let body = null; try { body = await res.json(); } catch (_) {}
    if (!res.ok) throw new Error((body && body.error) || `Upload failed (${res.status})`);
    return body;
  },
  deleteSharedDocument(id) { return adminApi._request(`/api/admin/shared-documents/${id}`, { method: 'DELETE' }); },
  createNews(payload) { return adminApi._request('/api/admin/news', { method: 'POST', body: JSON.stringify(payload) }); },
  updateNews(id, payload) { return adminApi._request(`/api/admin/news/${id}`, { method: 'PATCH', body: JSON.stringify(payload) }); },
  deleteNews(id) { return adminApi._request(`/api/admin/news/${id}`, { method: 'DELETE' }); },
  getNews() { return adminApi._request('/api/admin/news'); },
  getIntercom() { return adminApi._request('/api/admin/intercom'); },
  addIntercomDevice(payload) { return adminApi._request('/api/admin/intercom/devices', { method: 'POST', body: JSON.stringify(payload) }); },
  deleteIntercomDevice(id) { return adminApi._request(`/api/admin/intercom/devices/${id}`, { method: 'DELETE' }); },
  openIntercomDoor(id) { return adminApi._request(`/api/admin/intercom/devices/${id}/open`, { method: 'POST', body: '{}' }); },

// exact same database as the resident site. Same 4 languages as the

// Word form after a number: Slavic one / few / many (1 жилец, 2 жильца, 5 жильцов) and Arabic
// one / two / 3–10 / 11–99 / other.
const slavicPick = (n, one, few, many) => { const a = n % 10, b = n % 100; return a === 1 && b !== 11 ? one : a >= 2 && a <= 4 && (b < 12 || b > 14) ? few : many; };
const arabicPick = (n, one, two, few, many, other) => { const b = n % 100; return n === 1 ? one : n === 2 ? two : b >= 3 && b <= 10 ? few : b >= 11 ? many : other; };

      <span>${current}</span>
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    ${state.langMenuOpen ? `<div class="lang-menu" role="listbox">${ADMIN_LANG_NAMES.map(([code, name]) => `
      <button type="button" class="lang-opt ${state.lang === code ? 'active' : ''}" role="option" aria-selected="${state.lang === code}" data-setlang="${code}"><span>${name}</span>${state.lang === code ? check : ''}</button>`).join('')}</div>` : ''}

}

<script>// 3D "Buildings" screen: isometric SVG drawing of a building, card markup, tilt-on-hover and delete animation.

const buildingScene = (() => {

    const poly = (pts, cls) => `<polygon class="${cls}" points="${pts.map((p) => P(...p)).join(' ')}"/>`;

      poly([[x0, y1, z0], [x1, y1, z0], [x1, y1, z1], [x0, y1, z1]], 'f-left') + poly([[x1, y0, z0], [x1, y1, z0], [x1, y1, z1], [x1, y0, z1]], 'f-right') + (top ? poly([[x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]], 'f-top') : '');

    const wins = (x0, y0, x1, y1, z0, ground) => {
      let out = '';
      for (let j = 0; j < Math.round(y1 - y0); j++) { const a = y0 + j + 0.22, b = y0 + j + 0.78; out += `<polygon class="win${r() < (spec.lit ?? 0.58) ? ' lit' : ''}${r() < 0.7 ? ' still' : ''}" style="${winDelay()}" points="${[[x1, a, z0 + 0.28], [x1, b, z0 + 0.28], [x1, b, z0 + 0.72], [x1, a, z0 + 0.72]].map((p) => P(...p)).join(' ')}"/>`; }

function buildingAnimOn() {
