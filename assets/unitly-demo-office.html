document.addEventListener('input', (e) => {

    if (action === 'delete-task') { handleDeleteTask(actionBtn.dataset.task); return; }
    if (action === 'filter-tasks') { state.tasksFilter = actionBtn.dataset.filter; loadTasks(); return; }
    if (action === 'save-dwelling') { handleSaveDwelling(actionBtn); return; }
    if (action === 'export-csv') { handleExport(actionBtn.dataset.kind); return; }
    if (action === 'cancel-booking') { handleCancelBooking(actionBtn.dataset.booking); return; }
    if (action === 'filter-bookings') { state.bookingsFilter = actionBtn.dataset.filter; state.bookingsPage = 0; loadBookings(); return; }
    if (action === 'save-services') handleSaveServices();
    if (action === 'sort-requests') { state.requestsSort = actionBtn.dataset.sort; state.requestsPage = 0; loadRequests(); return; }
    if (action === 'filter-requests') { state.requestsFilter = actionBtn.dataset.filter; state.requestsPage = 0; loadRequests(); return; }
    if (action === 'page') { const k = actionBtn.dataset.list; state[k + 'Page'] = Number(actionBtn.dataset.page) || 0; ({ requests: loadRequests, bookings: loadBookings, guestParking: loadGuestParking })[k](); return; }
    if (action === 'invite-admin') handleInviteAdmin();
    if (action === 'upload-shared-doc') handleUploadSharedDoc();
    if (action === 'delete-shared-doc') { e.stopPropagation(); handleDeleteSharedDoc(actionBtn.dataset.doc); }
    if (action === 'delete-admin') { e.stopPropagation(); handleDeleteAdminAccount(actionBtn.dataset.admin); }
    if (action === 'view-admin-attachment') openAdminMedia(actionBtn);
    return;
  }
  const goEl = e.target.closest('[data-go]');
  if (goEl) {
    e.preventDefault();
    const key = goEl.dataset.go;
    if (key === 'requests') state.reqAnim = true;
    if (key === 'requestDetail') { openRequestDetail(goEl.dataset.req); return; }
    if (key === 'residentDetail') { openResidentDetail(goEl.dataset.resident); return; }
    if (key === 'newsForm') { openEditNews(goEl.dataset.news); return; }
    if (key === 'amenityForm') { openEditAmenity(goEl.dataset.amenity); return; }
    if (key === 'buildingForm') { openEditBuilding(goEl.dataset.building); return; }
    if (key === 'contractorForm') { openEditContractor(goEl.dataset.contractor); return; }
    if (key === 'contractors') { loadContractors(); return; }
    if (key === 'buildings') { loadBuildings(); return; }
    if (key === 'settings') { loadSettings(); return; }
    if (key === 'requests') { loadRequests(); return; }
    if (key === 'bookings') { loadBookings(); return; }
    if (key === 'guestParking') { loadGuestParking(); return; }
    if (key === 'moves') { loadMoves(); return; }
    if (key === 'incidents') { state.incForm = false; state.incError = null; loadIncidents(); return; }
    if (key === 'inspections') { state.inspForm = false; state.inspError = null; loadInspections(); return; }
    if (key === 'events') { state.evOpen = null; state.evAtt = null; state.evError = null; loadEvents(); return; }
    if (key === 'residents') { loadResidents(true); return; }
    if (key === 'messages') { loadMessages(); return; }
    if (key === 'dashboard') { loadDashboard(); return; }
    if (key === 'news') { loadNewsAdmin(); return; }
    if (key === 'alerts') { loadAlerts(); return; }
    if (key === 'schedule') { loadScheduleAdmin(); return; }
    if (key === 'intercom') { state.intercomSip = null; loadIntercom(); return; }
    if (key === 'alertDetail') { openAlert(goEl.dataset.alert); return; }
    if (key === 'amenities') { loadAmenitiesAdmin(); return; }
    if (key === 'calendar') { loadCalendar(); return; }
    if (key === 'auditLog') { loadAuditLog(); return; }
    if (key === 'reports') { loadReports(); return; }
    if (key === 'tasks') { loadTasks(); return; }
    if (key === 'groups') { loadGroups(false); return; }
    if (key === 'adminInviteForm') { openAddAdmin(); return; }
    state.view = key;
    state.loginError = null;
    state.firstTimeSent = false;
    state.forgotPasswordSent = false;
    state.forgotPasswordError = null;
    state.pwdError = null;
    render();
  }
});

<script>// Live updates in The Office (WebSocket /ws): a new resident message shows up in the open Messages screen
// without refreshing. The socket only says "a thread changed"; the data is fetched through the normal API.
(function () {
  let ws = null, retry = 1000, timer = null;

  async function refreshMessages(residentId) {
    if (state.view !== 'messages') return;
    try {
      state.threads = await adminApi.getMessageThreads();
      if (state.activeThreadResidentId && (!residentId || state.activeThreadResidentId === residentId)) {
        state.messages = await adminApi.getMessageThread(state.activeThreadResidentId);
      }
      const inp = document.getElementById('replyInput');
      const val = inp ? inp.value : '', focus = document.activeElement === inp;
      render();
      const n = document.getElementById('replyInput');
      if (n) {
        n.value = val; if (focus) { n.focus(); n.setSelectionRange(val.length, val.length); }
        const pane = n.parentElement && n.parentElement.previousElementSibling;
        if (pane) pane.scrollTop = pane.scrollHeight;
      }
    } catch (e) { /* offline or signed out */ }
  }

  // Pending sign-up requests: red badge on "Residents". Refreshed on the live event, every minute, and after a decision.
  async function refreshSignupCount() {
    if (!adminApi.getToken() || state.view === 'login') return;
    try {
      const n = (await adminApi.getSignupCount()).count;
      if (n !== state.signupCount) {
        state.signupCount = n;
        if (state.view === 'residents') { try { state.signups = await adminApi.getSignups(); } catch (_) {} }
        const a = document.activeElement;
        if (!(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))) render(); // never redraw under someone who is typing
      }
    } catch (_) { /* offline or signed out */ }
  }
  window.refreshSignupCount = refreshSignupCount;
  setInterval(refreshSignupCount, 60000);

  function connect() {
    const token = adminApi.getToken();
    if (!token || ws) return;
    try {
      const s = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws?as=admin&token=${encodeURIComponent(token)}`);
      ws = s;
      s.onopen = () => { retry = 1000; refreshMessages(); refreshSignupCount(); };
      s.onmessage = (m) => { let e; try { e = JSON.parse(m.data); } catch (_) { return; } if (e.type === 'message') refreshMessages(e.residentId); if (e.type === 'signup') refreshSignupCount(); };
      s.onclose = () => { if (ws === s) ws = null; clearTimeout(timer); timer = setTimeout(connect, retry); retry = Math.min(retry * 2, 15000); };
      s.onerror = () => { try { s.close(); } catch (_) {} };
    } catch (e) { ws = null; }
  }

  // Sign-in happens after the page loads, so keep checking; open the connection once there is a session.
  setInterval(() => { if (adminApi.getToken() && state.view !== 'login') connect(); else if (ws) { const s = ws; ws = null; try { s.close(); } catch (_) {} } }, 2000);
})();
</script>
<script>// init() – start of the app
// Part of the admin app: plain <script> files share one global scope; load order is set in index.html.
(async function init() {
  // An admin arriving via their invitation/activation email link —
  // ?activate=TOKEN&email=... — takes priority over an existing session.
  const params = new URLSearchParams(window.location.search);
  const activateToken = params.get('activate');
  const activateEmail = params.get('email');
  if (activateToken && activateEmail) {
    state.pendingActivationToken = activateToken;
    state.pendingActivationEmail = activateEmail;
    state.view = 'createPassword';
    window.history.replaceState({}, '', window.location.pathname);
    render();
    return;
  }

  if (adminApi.getToken()) {
    state.adminName = adminApi.getName() || null;
    try {
      const me = await adminApi.getMe(); state.adminRole = me.role; state.intercomEnabled = !!me.intercomEnabled;
      if (me.mustChangePassword) showMustChangePassword(); else await loadDashboard();
    }
    catch (err) { adminApi.clearToken(); adminApi.clearName(); render(); }
  } else {
    render();
  }
})();
</script>
