    const ox = 130 - ((w - d) * C) / 2, oy = 198 - (w + d + 2 * m) * S;
    const pt = (x, y, z) => [ox + (x - y) * C, oy + (x + y) * S - z * U];
    const P = (x, y, z) => pt(x, y, z).map((n) => n.toFixed(1)).join(',');
    const poly = (pts, cls) => `<polygon class="${cls}" points="${pts.map((p) => P(...p)).join(' ')}"/>`;
    const box = (x0, y0, x1, y1, z0, z1, top = true) =>
      poly([[x0, y1, z0], [x1, y1, z0], [x1, y1, z1], [x0, y1, z1]], 'f-left') + poly([[x1, y0, z0], [x1, y1, z0], [x1, y1, z1], [x1, y0, z1]], 'f-right') + (top ? poly([[x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]], 'f-top') : '');
    const winDelay = () => `--wd:${(base + 0.35 + (floors + 1) * 0.15 + 0.5 + r() * 1.4).toFixed(2)}s`;
    const wins = (x0, y0, x1, y1, z0, ground) => {
      let out = '';
      for (let j = 0; j < Math.round(y1 - y0); j++) { const a = y0 + j + 0.22, b = y0 + j + 0.78; out += `<polygon class="win${r() < (spec.lit ?? 0.58) ? ' lit' : ''}${r() < 0.7 ? ' still' : ''}" style="${winDelay()}" points="${[[x1, a, z0 + 0.28], [x1, b, z0 + 0.28], [x1, b, z0 + 0.72], [x1, a, z0 + 0.72]].map((p) => P(...p)).join(' ')}"/>`; }
      for (let i = 0; i < Math.round(x1 - x0); i++) {
        const a = x0 + i + 0.22, b = x0 + i + 0.78;
        if (ground && i === Math.floor((x1 - x0) / 2)) { out += `<polygon class="door" points="${[[a, y1, 0], [b, y1, 0], [b, y1, 0.78], [a, y1, 0.78]].map((p) => P(...p)).join(' ')}"/>`; continue; }
        out += `<polygon class="win${r() < (spec.lit ?? 0.58) ? ' lit' : ''}${r() < 0.7 ? ' still' : ''}" style="${winDelay()}" points="${[[a, y1, z0 + 0.28], [b, y1, z0 + 0.28], [b, y1, z0 + 0.72], [a, y1, z0 + 0.72]].map((p) => P(...p)).join(' ')}"/>`;
      }
      return out;
    };
    const tree = (x, y, i) => { const [X, Y] = pt(x, y, 0); return `<g transform="translate(${X.toFixed(1)} ${Y.toFixed(1)})"><g class="tree-in" style="--i:${i}"><rect class="trunk" x="-1.2" y="-9" width="2.4" height="9" rx="1"/><ellipse class="canopy" cx="0" cy="-15" rx="6.8" ry="8.2"/><ellipse class="canopy" cx="-2" cy="-17" rx="3" ry="3.6" style="opacity:.55;fill:#fff"/></g></g>`; };

    // Own random stream, so adding balconies never changes which windows are lit.
    const rb = rng(seed + 7);
    const balconies = (k, z0) => {
      if (k < 1) return '';
      let out = '';
      for (let i = 0; i < w; i++) {
        if (rb() > 0.3) continue;
        const a = i + 0.1, b = i + 0.9;
        out += box(a, d, b, d + 0.32, z0 + 0.02, z0 + 0.1)
          + poly([[a, d + 0.32, z0 + 0.1], [b, d + 0.32, z0 + 0.1], [b, d + 0.32, z0 + 0.42], [a, d + 0.32, z0 + 0.42]], 'rail');
      }
      return out;
    };
    const ledge = (z1) => poly([[0, d, z1 - 0.08], [w, d, z1 - 0.08], [w, d, z1], [0, d, z1]], 'ledge')
      + poly([[w, 0, z1 - 0.08], [w, d, z1 - 0.08], [w, d, z1], [w, 0, z1]], 'ledge');
    const bush = (x, y, i) => { const [X, Y] = pt(x, y, 0); return `<g transform="translate(${X.toFixed(1)} ${Y.toFixed(1)})"><g class="tree-in" style="--i:${i}"><ellipse class="bush" cx="0" cy="-2.6" rx="4.2" ry="3.2"/></g></g>`; };
    const di = Math.floor(w / 2);

    let html = `<g class="ground">${poly([[w + m, -m, 0], [w + m, d + m, 0], [w + m, d + m, -0.4], [w + m, -m, -0.4]], 'g-right')}${poly([[-m, d + m, 0], [w + m, d + m, 0], [w + m, d + m, -0.4], [-m, d + m, -0.4]], 'g-left')}${poly([[-m, -m, 0], [w + m, -m, 0], [w + m, d + m, 0], [-m, d + m, 0]], 'g-top')}</g>`;
    // soft shadow to the right and front, a path to the door and shrubs along the front wall
    html += poly([[w, 0, 0.02], [w + 1.2, 0.8, 0.02], [w + 1.2, d + 0.8, 0.02], [0, d + 0.8, 0.02], [0, d, 0.02], [w, d, 0.02]], 'g-shadow');
    html += poly([[di + 0.12, d, 0.03], [di + 0.88, d, 0.03], [di + 0.88, d + m, 0.03], [di + 0.12, d + m, 0.03]], 'g-path');
    for (let x = 0.5, bi = 0; x < w; x += 0.9, bi++) if (Math.abs(x - (di + 0.5)) > 0.8) html += bush(x, d + 0.55, bi);
    html += tree(-0.55, 0.3, 0);
    const total = floors + (roof === 'terrace' ? 1 : 0);
    for (let k = 0; k < floors; k++) {
      const z0 = k * FH, z1 = z0 + FH, last = k === floors - 1 && roof === 'flat';
      html += `<g class="floor" style="--i:${k}"><g class="faces">${box(0, 0, w, d, z0, z1, last)}${ledge(z1)}</g><g class="wins">${wins(0, 0, w, d, z0, k === 0)}${balconies(k, z0)}</g></g>`;
    }
    const zt = floors * FH; let ri = floors;
    if (roof === 'flat') {
      html += `<g class="roof" style="--i:${ri}"><g class="faces">${poly([[0.28, 0.28, zt], [w - 0.28, 0.28, zt], [w - 0.28, d - 0.28, zt], [0.28, d - 0.28, zt]], 'r-inner')}${box(w * 0.5, d * 0.18, w * 0.5 + 1.1, d * 0.18 + 1.1, zt, zt + 0.95)}${box(w * 0.16, d * 0.5, w * 0.16 + 0.9, d * 0.5 + 0.8, zt, zt + 0.5)}</g><path class="antenna" d="M${P(w * 0.5 + 0.55, d * 0.18 + 0.55, zt + 0.95)} L${P(w * 0.5 + 0.55, d * 0.18 + 0.55, zt + 2.4)}"/><circle class="beacon" cx="${pt(w * 0.5 + 0.55, d * 0.18 + 0.55, zt + 2.4)[0].toFixed(1)}" cy="${pt(w * 0.5 + 0.55, d * 0.18 + 0.55, zt + 2.4)[1].toFixed(1)}" r="1.5"/></g>`;
    } else if (roof === 'gable') {
      const rh = d * 0.38;
      html += `<g class="roof" style="--i:${ri}"><g class="faces">${poly([[w, 0, zt], [w, d, zt], [w, d / 2, zt + rh]], 'r-gable')}${poly([[-0.3, -0.3, zt], [w + 0.3, -0.3, zt], [w + 0.3, d / 2, zt + rh], [-0.3, d / 2, zt + rh]], 'r-slope2')}${poly([[-0.3, d + 0.3, zt], [w + 0.3, d + 0.3, zt], [w + 0.3, d / 2, zt + rh], [-0.3, d / 2, zt + rh]], 'r-slope')}${box(w * 0.62, d * 0.55, w * 0.62 + 0.7, d * 0.55 + 0.7, zt + rh * 0.4, zt + rh * 0.4 + 0.9)}</g></g>`;
    } else {
      const a = 0.85, z0 = zt, z1 = zt + FH;
      html += `<g class="floor" style="--i:${floors}"><g class="faces">${box(a, a, w - a, d - a, z0, z1, false)}</g><g class="wins">${wins(a, a, w - a, d - a, z0, false)}</g></g>`;
      html += `<g class="roof" style="--i:${floors + 1}"><g class="faces">${poly([[a - 0.2, a - 0.2, z1], [w - a + 0.2, a - 0.2, z1], [w - a + 0.2, d - a + 0.2, z1], [a - 0.2, d - a + 0.2, z1]], 'f-top')}${poly([[a + 0.2, a + 0.2, z1], [w - a - 0.2, a + 0.2, z1], [w - a - 0.2, d - a - 0.2, z1], [a + 0.2, d - a - 0.2, z1]], 'r-inner')}</g></g>`;
    }
    html += `<g class="awning">${box(di + 0.02, d, di + 0.98, d + 0.55, 0.84, 0.94)}</g>`;
    html += tree(w + 0.75, d + 0.85, 1) + tree(-0.7, d + 0.7, 2);
    return `<svg viewBox="0 0 260 220" class="tone-${spec.tone}" style="--b:${base.toFixed(2)}s;--n:${total}" aria-hidden="true">${html}</svg>`;
  }

  return scene;
})();

const BUILDING_TONES = ['stone', 'sand', 'sage', 'slate'];
const BUILDING_ROOFS = ['flat', 'gable', 'terrace'];

// Animations on/off: remembered per browser (never required), default follows the system "reduce motion" setting.
function buildingAnimOn() {
  try {
    const saved = localStorage.getItem('buildingsAnim');
    if (saved === '0') return false;
    if (saved === '1') return true;
  } catch (_) {}
  return !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
}

// What to draw for a building: its own floors / roof / colour if set, otherwise a stable default derived from it.
function buildingSpec(b) {
  const id = Number(b.id) || 1;
  const floors = Number.isInteger(b.floors) && b.floors >= 2 && b.floors <= 8
    ? b.floors
    : Math.max(2, Math.min(8, Math.ceil((Number(b.units) || 24) / 8)));
  const roof = BUILDING_ROOFS.includes(b.roof) ? b.roof : BUILDING_ROOFS[(id * 7) % 3];
  const tone = BUILDING_TONES.includes(b.tone) ? b.tone : BUILDING_TONES[(id * 5) % 4];
  const kind = ['shop', 'office', 'factory', 'mixed'].includes(b.kind) ? b.kind : 'residential';
  return { w: 4 + (id % 2), d: 3 + ((id >> 1) % 2), floors, roof, tone, kind, seed: 1000 + id * 77 };
}

// One card. mode: 'enter' (staggered drop-up on load), 'fresh' (just created) or '' (static).
function buildingCardHtml(b, idx, mode) {
  const spec = buildingSpec(b);
  const base = mode === 'fresh' ? 0.3 : idx * 0.12 + 0.35;
  const bv = L.buildingsV;
  return `
    <div class="bld-slot">
      <div class="bld-card ${mode}" style="--idx:${idx}" data-go="buildingForm" data-building="${b.id}" tabindex="0">
        ${mode === 'fresh' ? `<span class="bld-badge">${esc(bv.newBadge)}</span>` : ''}
        <button class="bld-del" data-action="delete-building" data-building="${b.id}" title="${esc(L.common.delete)}" aria-label="${esc(L.common.delete)}">×</button>
        <div class="bld-scene">${b.hasPhoto ? `<img class="bld-photo" data-bld-photo="${b.id}" alt="">` : buildingScene(spec, base)}</div>
        <div class="bld-meta">
          <div class="bld-name">${esc(b.name)} <span class="bld-code">(${esc(b.code)})</span></div>
          <div class="bld-addr">${esc(b.address || '—')}</div>
          <div class="bld-chips">
            ${b.kind && b.kind !== 'residential' ? `<span class="bld-chip"><b>${esc(L.buildingForm.kinds[b.kind] || b.kind)}</b></span>` : ''}
            <span class="bld-chip"><b>${esc(b.units || '—')}</b> ${esc(bv.unitsChip)}</span>
            <span class="bld-chip"><b>${b.residentCount}</b> ${esc(bv.residentsChip(b.residentCount))}</span>
            <span class="bld-chip"><b>${spec.floors + (spec.roof === 'terrace' ? 1 : 0)}</b> ${esc(bv.floorsChip)}</span>
          </div>
        </div>
      </div>
    </div>`;
}

// Count-up for the three numbers on top of the Buildings screen.
function buildingsCountUp() {
  if (!buildingAnimOn()) return;
  document.querySelectorAll('.bld-stat b[data-to]').forEach((el) => {
    const to = Number(el.dataset.to) || 0, t0 = performance.now();
    (function step(t) {
      if (!el.isConnected) return;
      const p = Math.min(1, (t - t0) / 700), e = 1 - Math.pow(1 - p, 3);
      el.textContent = Math.round(to * e);
      if (p < 1) requestAnimationFrame(step);
    })(t0);
  });
}

// Hover tilt (mouse only). Delegated, because the whole screen is redrawn by render().
document.addEventListener('pointermove', (e) => {
  if (e.pointerType === 'touch' || !buildingAnimOn()) return;
  const card = e.target.closest && e.target.closest('.bld-card, .dist-bld');
  if (!card || card.classList.contains('removing')) return;
  const q = card.getBoundingClientRect();
  card.style.setProperty('--ry', (((e.clientX - q.left) / q.width - 0.5) * 12).toFixed(2) + 'deg');
  card.style.setProperty('--rx', (-((e.clientY - q.top) / q.height - 0.5) * 10).toFixed(2) + 'deg');
});
document.addEventListener('pointerout', (e) => {
  const card = e.target.closest && e.target.closest('.bld-card, .dist-bld');
  if (card && !card.contains(e.relatedTarget)) { card.style.setProperty('--rx', '0deg'); card.style.setProperty('--ry', '0deg'); }
});

// Building form: floors / roof / colour pickers with a live preview.
const BUILDING_KINDS = ['residential', 'shop', 'office', 'factory', 'mixed'];

function buildingFormLook() {
  const pick = (id) => { const on = document.querySelector('#' + id + ' .on'); return on ? on.dataset.v : null; };
  const f = parseInt(document.getElementById('bfFloors').value, 10);
  return { floors: Number.isInteger(f) ? Math.max(2, Math.min(8, f)) : null, roof: pick('bfRoof'), tone: pick('bfTone') };
}
function buildingFormPreview() {
  const box = document.getElementById('bfPreview');
  if (!box || box.dataset.photo) return; // a photo stays; only the model is redrawn
  const look = buildingFormLook();
  const id = state.buildingFormMode === 'add' ? 1 : state.activeBuildingId;
  const kindSelect = document.getElementById('bfKind');
  const spec = buildingSpec({ id, floors: look.floors, roof: look.roof, tone: look.tone, kind: kindSelect ? kindSelect.value : 'residential', units: parseInt(document.getElementById('bfUnits').value, 10) || null });
  box.innerHTML = buildingScene(spec, 0.05);
  const lbl = document.getElementById('bfFloorsV');
  if (lbl) lbl.textContent = spec.floors;
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-seg] button');
  if (!b) return;
  b.parentElement.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b));
  buildingFormPreview();
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'bfFloors' || e.target.id === 'bfUnits') buildingFormPreview();
});
document.addEventListener('change', (e) => {
  if (e.target.id !== 'bfKind') return;
  const mixed = document.getElementById('bfMixed');
  if (mixed) mixed.style.display = e.target.value === 'mixed' ? '' : 'none';
  buildingFormPreview();
});
document.addEventListener('change', (e) => {
  if (!e.target.matches || !e.target.matches('[data-action="toggle-building-anim"]')) return;
  try { localStorage.setItem('buildingsAnim', e.target.checked ? '1' : '0'); } catch (_) {}
  state.buildingsAnim = e.target.checked;
  render();
});


// ---- Dashboard "district": every building in one scene, day / night, open-request tags ----
// Night = the hours 19:00–06:59 on the viewer's clock, unless they flipped the sun/moon switch.
function districtIsNight() {
  if (typeof state.distNight === 'boolean') return state.distNight;
  const h = new Date().getHours();
  return h >= 19 || h < 7;
}

function districtHtml(buildings, enter) {
  const dv = L.districtV;
  const night = districtIsNight();
  if (!buildings || !buildings.length) {
    return `<div class="admin-card" style="margin-bottom:22px;"><p style="margin:0; color:var(--g500); font-size:13px;">${dv.empty} <a href="#" data-go="buildings" style="color:var(--brand-dark); font-weight:700;">${L.nav.buildings} →</a></p></div>`;
  }
  const items = buildings.map((b, i) => {
    // Windows: the scene always draws the "night" set of lit windows; CSS dims most of them in daytime.
    const spec = { ...buildingSpec(b), lit: 0.9 };
    const open = b.openRequests || 0;
    const tag = open
      ? `<span class="dist-open ${b.urgentRequests ? 'urgent' : ''}"><i></i>${dv.open(open)}</span>`
      : `<span class="dist-open calm">${dv.allClear}</span>`;
    return `<div class="dist-bld ${enter ? 'enter' : ''}" style="--idx:${i}" data-go="requests" tabindex="0" title="${esc(b.name)}">
      <div class="dist-tag"><b>${esc(b.name)}</b>${tag}<small>${b.residentCount} ${esc(L.buildingsV.residentsChip(b.residentCount))}</small></div>
      <div class="dist-svg">${buildingScene(spec, i * 0.28 + 0.2)}</div>
    </div>`;
  }).join('');
  return `
  <div class="bld dist ${night ? 'night' : ''} ${buildingAnimOn() ? '' : 'no-anim'}" id="district">
    <div class="dist-sky dist-sky-day"></div>
    <div class="dist-sky dist-sky-night"></div>
    <div class="dist-cloud c1"></div><div class="dist-cloud c2"></div><div class="dist-cloud c3"></div>
    <div class="dist-stars"></div>
    <button class="dist-orb" data-action="toggle-daynight" title="${esc(dv.toggle)}" aria-label="${esc(dv.toggle)}"><span class="sun"></span><span class="moon"></span></button>
    <div class="dist-row">${items}</div>
  </div>`;
}

// Flips day / night without redrawing (so buildings do not rebuild themselves) and remembers it for this visit.
function toggleDayNight() {
  const el = document.getElementById('district');
  if (!el) return;
  state.distNight = !el.classList.contains('night');
  el.classList.toggle('night', state.distNight);
}

// Count-up for the big numbers on the dashboard.
function dashCountUp() {
  if (!buildingAnimOn()) return;
  document.querySelectorAll('[data-count-to]').forEach((el) => {
    const to = Number(el.dataset.countTo) || 0, t0 = performance.now();
    if (!to) return;
    (function step(t) {
      if (!el.isConnected) return;
      const p = Math.min(1, (t - t0) / 800), e = 1 - Math.pow(1 - p, 3);
      el.textContent = String(Math.round(to * e));
      if (p < 1) requestAnimationFrame(step);
    })(t0);
  });
}
</script>
<script>// 3D models of commercial buildings (1.1): a shop, an office tower, a factory, and a mixed building (shops below,
// apartments above). The same isometric drawing and CSS classes as buildingScene.js (boxes made of three faces,
// windows, ground, trees); buildingScene() hands over to this when the building's kind is not residential.
// The admin Buildings screen has its own copy of this file (kept in sync by hand), like buildingScene.js.

const commercialScene = (() => {
  const U = 13;
  const C = 0.866 * U;
  const S = 0.5 * U;
  const FH = 0.95; // height of one storey

  const rng = (seed) => {
    let t = seed >>> 0;
    return () => {
      t += 0x6d2b79f5;
      let x = Math.imul(t ^ (t >>> 15), 1 | t);
      x ^= x + Math.imul(x ^ (x >>> 7), 61 | x);
      return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
    };
  };

  function scene(spec, base) {
    const { w, d, tone, seed, kind } = spec;
    const r = rng(seed);
    const m = 1.3;
    const lit = spec.lit ?? 0.58;
    const ox = 130 - ((w - d) * C) / 2;
    const oy = 198 - (w + d + 2 * m) * S;
    const pt = (x, y, z) => [ox + (x - y) * C, oy + (x + y) * S - z * U];
    const P = (x, y, z) => pt(x, y, z).map((n) => n.toFixed(1)).join(',');
    const poly = (pts, cls) => `<polygon class="${cls}" points="${pts.map((p) => P(...p)).join(' ')}"/>`;
    const box = (x0, y0, x1, y1, z0, z1, top = true) =>
      poly([[x0, y1, z0], [x1, y1, z0], [x1, y1, z1], [x0, y1, z1]], 'f-left') +
      poly([[x1, y0, z0], [x1, y1, z0], [x1, y1, z1], [x1, y0, z1]], 'f-right') +
      (top ? poly([[x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]], 'f-top') : '');

    // A window on the front face (the plane y = d) or on the right face (the plane x = w).
    const delay = () => `--wd:${(base + 0.8 + r() * 1.4).toFixed(2)}s`;
    const winClass = (litChance) => `win${r() < litChance ? ' lit' : ''}${r() < 0.7 ? ' still' : ''}`;
    const winFront = (x0, x1, z0, z1, litChance = lit) =>
      `<polygon class="${winClass(litChance)}" style="${delay()}" points="${[[x0, d, z0], [x1, d, z0], [x1, d, z1], [x0, d, z1]].map((p) => P(...p)).join(' ')}"/>`;
    const winSide = (y0, y1, z0, z1, litChance = lit) =>
      `<polygon class="${winClass(litChance)}" style="${delay()}" points="${[[w, y0, z0], [w, y1, z0], [w, y1, z1], [w, y0, z1]].map((p) => P(...p)).join(' ')}"/>`;
    const door = (x0, x1, z1) => poly([[x0, d, 0], [x1, d, 0], [x1, d, z1], [x0, d, z1]], 'door');

    const tree = (x, y, i) => {
      const [X, Y] = pt(x, y, 0);
      return `<g transform="translate(${X.toFixed(1)} ${Y.toFixed(1)})"><g class="tree-in" style="--i:${i}"><rect class="trunk" x="-1.2" y="-9" width="2.4" height="9" rx="1"/><ellipse class="canopy" cx="0" cy="-15" rx="6.8" ry="8.2"/><ellipse class="canopy" cx="-2" cy="-17" rx="3" ry="3.6" style="opacity:.55;fill:#fff"/></g></g>`;
    };
    const bush = (x, y, i) => {
      const [X, Y] = pt(x, y, 0);
      return `<g transform="translate(${X.toFixed(1)} ${Y.toFixed(1)})"><g class="tree-in" style="--i:${i}"><ellipse class="bush" cx="0" cy="-2.6" rx="4.2" ry="3.2"/></g></g>`;
    };

    const di = w / 2; // the entrance is in the middle of the front face
    const ground = () => {
      let out = `<g class="ground">${poly([[w + m, -m, 0], [w + m, d + m, 0], [w + m, d + m, -0.4], [w + m, -m, -0.4]], 'g-right')}${poly([[-m, d + m, 0], [w + m, d + m, 0], [w + m, d + m, -0.4], [-m, d + m, -0.4]], 'g-left')}${poly([[-m, -m, 0], [w + m, -m, 0], [w + m, d + m, 0], [-m, d + m, 0]], 'g-top')}</g>`;
      out += poly([[w, 0, 0.02], [w + 1.2, 0.8, 0.02], [w + 1.2, d + 0.8, 0.02], [0, d + 0.8, 0.02], [0, d, 0.02], [w, d, 0.02]], 'g-shadow');
      out += poly([[di - 0.4, d, 0.03], [di + 0.4, d, 0.03], [di + 0.4, d + m, 0.03], [di - 0.4, d + m, 0.03]], 'g-path');
      return out;
    };
    const group = (cls, i, faces, wins = '') => `<g class="${cls}" style="--i:${i}"><g class="faces">${faces}</g>${wins ? `<g class="wins">${wins}</g>` : ''}</g>`;
    const flatRoof = (z, i, inset = 0.28) =>
      group('roof', i, poly([[inset, inset, z], [w - inset, inset, z], [w - inset, d - inset, z], [inset, d - inset, z]], 'r-inner') +
        box(w * 0.55, d * 0.2, w * 0.55 + 1.0, d * 0.2 + 1.0, z, z + 0.7) +
        box(w * 0.14, d * 0.5, w * 0.14 + 0.9, d * 0.5 + 0.8, z, z + 0.45));
    const awning = (x0, x1, z) => `<g class="awning">${box(x0, d, x1, d + 0.7, z, z + 0.1)}</g>`;
    const sign = (x0, x1, z0, z1) => poly([[x0, d, z0], [x1, d, z0], [x1, d, z1], [x0, d, z1]], 'sign');

    // The glass front of a shop at the foot of a building: panes either side of the door.
    const shopFront = (z0, z1) => {
      let out = '';
      const pane = (a, b) => {
        const n = Math.max(1, Math.round((b - a) / 0.95));
        const step = (b - a) / n;
        for (let i = 0; i < n; i++) out += winFront(a + i * step + 0.06, a + (i + 1) * step - 0.06, z0, z1, 0.9);
      };
      pane(0.3, di - 0.55);
      pane(di + 0.55, w - 0.3);
      out += door(di - 0.4, di + 0.4, z1 - 0.05);
      return out;
    };

    let html = ground();
    let total = 2;

    if (kind === 'shop') {
      const h = 1.8;
      html += group('floor', 0, box(0, 0, w, d, 0, h, true), shopFront(0.16, 1.1) + winSide(0.6, 1.4, 0.5, 1.3, 0.8) + winSide(d - 1.4, d - 0.6, 0.5, 1.3, 0.8));
      html += awning(0.12, w - 0.12, 1.22) + group('floor', 1, sign(0.7, w - 0.7, 1.4, 1.72));
      html += flatRoof(h, 2);
      html += bush(di - 1.0, d + 0.9, 1) + bush(di + 1.0, d + 0.9, 2);
      total = 4;
    } else if (kind === 'office') {
      const n = Math.max(4, Math.min(8, (spec.floors || 4) + 2));
      for (let k = 0; k < n; k++) {
        const z0 = k * FH;
        const z1 = z0 + FH;
        let wins = '';
        if (k === 0) {
          wins += door(di - 0.45, di + 0.45, 0.78);
          wins += winFront(0.3, di - 0.7, z0 + 0.2, z0 + 0.8, 0.8) + winFront(di + 0.7, w - 0.3, z0 + 0.2, z0 + 0.8, 0.8);
        } else {
          const cols = Math.max(3, Math.round(w * 2));
          for (let i = 0; i < cols; i++) wins += winFront((i + 0.1) * (w / cols), (i + 0.9) * (w / cols), z0 + 0.2, z0 + 0.8);
        }
        const rows = Math.max(3, Math.round(d * 2));
        for (let j = 0; j < rows; j++) wins += winSide((j + 0.1) * (d / rows), (j + 0.9) * (d / rows), z0 + 0.2, z0 + 0.8);
        html += group('floor', k, box(0, 0, w, d, z0, z1, k === n - 1), wins);
      }
      html += awning(di - 1.0, di + 1.0, 0.86);
      html += flatRoof(n * FH, n);
      html += tree(w + 0.75, d + 0.85, 1);
      total = n + 3;
    } else if (kind === 'factory') {
      const h = 1.5;
      let wins = '';
      for (let i = 0; i < Math.max(3, Math.round(w)); i++) {
        const cols = Math.max(3, Math.round(w));
        if (Math.abs((i + 0.5) * (w / cols) - di) < 1.0) continue;
        wins += winFront((i + 0.15) * (w / cols), (i + 0.85) * (w / cols), 0.85, 1.25, 0.5);
      }
      wins += door(di - 0.8, di + 0.8, 1.15);
      for (let j = 0; j < Math.max(2, Math.round(d)); j++) wins += winSide((j + 0.15) * (d / Math.max(2, Math.round(d))), (j + 0.85) * (d / Math.max(2, Math.round(d))), 0.85, 1.25, 0.5);
      html += group('floor', 0, box(0, 0, w, d, 0, h, false), wins);
      // a sawtooth roof: every tooth is a slope with a glass wall on its tall side
      const teeth = 3;
      const tw = w / teeth;
      let roof = '';
      for (let i = 0; i < teeth; i++) {
        const x0 = i * tw;
        const x1 = x0 + tw;
        roof += poly([[x0, 0, h], [x0, d, h], [x1, d, h + 0.8], [x1, 0, h + 0.8]], 'r-slope');
        roof += poly([[x0, d, h], [x1, d, h], [x1, d, h + 0.8]], 'r-gable');
        roof += poly([[x1, 0, h], [x1, d, h], [x1, d, h + 0.8], [x1, 0, h + 0.8]], 'f-right');
        roof += `<polygon class="win lit still" style="${delay()}" points="${[[x1, 0.3, h + 0.15], [x1, d - 0.3, h + 0.15], [x1, d - 0.3, h + 0.65], [x1, 0.3, h + 0.65]].map((p) => P(...p)).join(' ')}"/>`;
      }
      html += group('roof', 1, roof);
      // the chimney beside the hall, with smoke
      const cx = w + 0.45;
      html += group('roof', 2, box(cx, 0.2, cx + 0.7, 0.9, 0, 3.8) + box(cx - 0.08, 0.12, cx + 0.78, 0.98, 3.55, 3.8));
      const [sx, sy] = pt(cx + 0.35, 0.55, 3.95);
      html += [0, 1, 2].map((i) => `<ellipse class="smoke" style="--sd:${(i * 1.6).toFixed(1)}s" cx="${(sx + i * 1.5).toFixed(1)}" cy="${(sy - i * 3).toFixed(1)}" rx="${4 + i}" ry="${3 + i * 0.6}"/>`).join('');
      html += bush(0.4, d + 0.9, 1) + bush(w - 0.4, d + 0.9, 2);
      total = 4;
    } else {
      // mixed: shops on the ground floor, apartments above
      const n = Math.max(4, Math.min(6, spec.floors || 4));
      const gh = 1.25;
      html += group('floor', 0, box(0, 0, w, d, 0, gh, false), shopFront(0.16, 1.0) + winSide(0.6, 1.4, 0.4, 1.0, 0.8) + winSide(d - 1.4, d - 0.6, 0.4, 1.0, 0.8));
      for (let k = 1; k < n; k++) {
        const z0 = gh + (k - 1) * FH;
        const z1 = z0 + FH;
        let wins = '';
        for (let i = 0; i < Math.max(2, Math.round(w)); i++) {
          const cols = Math.max(2, Math.round(w));
          wins += winFront((i + 0.22) * (w / cols), (i + 0.78) * (w / cols), z0 + 0.28, z0 + 0.72);
        }
        for (let j = 0; j < Math.max(2, Math.round(d)); j++) {
          const rows = Math.max(2, Math.round(d));
          wins += winSide((j + 0.22) * (d / rows), (j + 0.78) * (d / rows), z0 + 0.28, z0 + 0.72);
        }
        html += group('floor', k, box(0, 0, w, d, z0, z1, k === n - 1), wins);
      }
      html += awning(0.12, w - 0.12, 1.02);
      html += flatRoof(gh + (n - 1) * FH, n);
      html += tree(w + 0.75, d + 0.85, 1);
      total = n + 3;
    }
    html += tree(-0.7, d + 0.7, 2);

    return `<svg viewBox="0 0 260 220" class="tone-${tone}" style="--b:${base.toFixed(2)}s;--n:${total}" aria-hidden="true">${typeof WIN_DEFS === 'string' ? WIN_DEFS : ''}${html}</svg>`; // the admin screen has no window gradients
  }

  return scene;
})();
</script>
<script>// Building form: apartments (area, size, parking, equipment) and numbered parking spots.
// Part of the admin app: plain <script> files share one global scope; load order is set in index.html.
// state.bfu = { areaUnit, parkingTotal, rows: [{ number, area, rooms, parking, equipment, spots }], loaded }

function bfuBlank() { return { areaUnit: 'sqft', parkingTotal: '', rows: [], loaded: true }; }

async function bfuLoad(buildingId) {
  state.bfu = { areaUnit: 'sqft', parkingTotal: '', rows: [], loaded: false };
  try {
    const d = await adminApi.getBuildingUnits(buildingId);
    state.bfu = { areaUnit: d.areaUnit || 'sqft', parkingTotal: d.parkingTotal == null ? '' : d.parkingTotal, loaded: true,
      rows: (d.units || []).map(u => ({ number: u.number, area: u.area == null ? '' : u.area, rooms: u.rooms || '', parking: u.parking || 0, equipment: u.equipment || '', spots: u.spots || [], resident: u.resident })) };
  } catch (_) { state.bfu.loaded = true; }
}

// Apartment numbers typed in the form ("101-120, 201-220"), or 1..N from the units field.
function bfuNumbers() {
  const txt = (document.getElementById('bfApts') || {}).value || '';
  const out = [];
  for (const part of txt.split(/[,;\n]+/).map(x => x.trim()).filter(Boolean)) {
    const m = /^(\d{1,5})\s*-\s*(\d{1,5})$/.exec(part);
    if (m) { const a = +m[1], b = +m[2]; if (b >= a && b - a <= 999) for (let i = a; i <= b; i++) out.push(String(i)); }
    else out.push(part);
  }
  if (!out.length) { const n = parseInt((document.getElementById('bfUnits') || {}).value, 10); if (n > 0 && n <= 2000) for (let i = 1; i <= n; i++) out.push(String(i)); }
  return [...new Set(out)];
}

function bfuRowsHtml() {
  const rows = state.bfu.rows;
  const bf = L.buildingForm;
  if (!rows.length) return `<tr><td colspan="6" style="color:var(--g500);">${bf.rowsEmpty}</td></tr>`;
  return rows.map((r, i) => `<tr>
    <td style="font-weight:700;">${esc(r.number)}${r.resident ? `<div style="font-weight:400; font-size:11px; color:var(--g500);">${esc(r.resident)}</div>` : ''}</td>
    <td><input data-bfu="${i}:area" type="number" min="0" step="any" value="${esc(r.area)}" style="width:92px;"></td>
    <td><input data-bfu="${i}:rooms" value="${esc(r.rooms)}" placeholder="${bf.roomsPh}" style="width:70px;"></td>
    <td><select data-bfu="${i}:parking" style="width:64px;">${[0, 1, 2, 3, 4, 5].map(n => `<option ${+r.parking === n ? 'selected' : ''}>${n}</option>`).join('')}</select></td>
    <td><input data-bfu="${i}:equipment" value="${esc(r.equipment)}" placeholder="${bf.equipPh}" style="width:100%; min-width:140px;"></td>
    <td style="white-space:nowrap; color:var(--g600);">${r.spots && r.spots.length ? esc(r.spots.join(', ')) : (+r.parking ? bf.spotsAuto : '—')}</td>
  </tr>`).join('');
}

function bfuSummary() {
  const need = state.bfu.rows.reduce((s, r) => s + (+r.parking || 0), 0);
  const total = parseInt((document.getElementById('bfParkTotal') || {}).value, 10) || 0;
  return { text: L.buildingForm.assigned.replace('{a}', need).replace('{n}', total), over: need > total };
}

function bfuRefresh() {
  const body = document.getElementById('bfuBody'); if (body) body.innerHTML = bfuRowsHtml();
  const sum = document.getElementById('bfuSum');
  if (sum) { const s = bfuSummary(); sum.textContent = s.text; sum.style.color = s.over ? '#8a1f1f' : 'var(--g600)'; }
}

function bfuCardHtml() {
  const bf = L.buildingForm; const u = state.bfu || bfuBlank();
  const s = { text: bf.assigned.replace('{a}', u.rows.reduce((x, r) => x + (+r.parking || 0), 0)).replace('{n}', u.parkingTotal || 0) };
  return `<div class="admin-card" style="margin-top:20px;">
    <h2 style="font-size:17px; margin:0 0 4px;">${bf.unitsTitle}</h2>
    <p style="font-size:12.5px; color:var(--g500); margin:0 0 14px;">${bf.unitsHint}</p>
    <div style="display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end;">
      <div class="field" style="margin:0;"><label>${bf.areaUnit}</label><select id="bfAreaUnit"><option value="sqft" ${u.areaUnit === 'sqft' ? 'selected' : ''}>${bf.areaSqft}</option><option value="m2" ${u.areaUnit === 'm2' ? 'selected' : ''}>${bf.areaM2}</option></select></div>
      <div class="field" style="margin:0;"><label>${bf.parkingTotal}</label><input id="bfParkTotal" type="number" min="0" max="2000" value="${esc(u.parkingTotal)}" style="width:120px;"></div>
      <button type="button" class="btn" style="width:auto;" data-action="bfu-build">${bf.buildRows}</button>
    </div>
    <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; margin-top:16px; padding:12px; background:var(--g50,#f7f7f7); border-radius:12px;">
      <b style="font-size:12.5px; align-self:center;">${bf.bulkTitle}</b>
      <input id="bfuAllArea" type="number" min="0" step="any" placeholder="${bf.colArea}" style="width:100px;">
      <input id="bfuAllRooms" placeholder="${bf.colRooms} (${bf.roomsPh})" style="width:120px;">
      <select id="bfuAllPark" style="width:70px;">${[0, 1, 2, 3].map(n => `<option>${n}</option>`).join('')}</select>
      <button type="button" class="btn" style="width:auto;" data-action="bfu-apply">${bf.applyAll}</button>
    </div>
    <div style="overflow-x:auto; margin-top:14px;"><table class="admin-table">
      <thead><tr><th>${bf.colApt}</th><th>${bf.colArea}</th><th>${bf.colRooms}</th><th>${bf.colParking}</th><th>${bf.colEquip}</th><th>${bf.colSpots}</th></tr></thead>
      <tbody id="bfuBody">${bfuRowsHtml()}</tbody></table></div>
    <div id="bfuSum" style="font-size:12.5px; font-weight:700; margin-top:10px; color:var(--g600);">${s.text}</div>
  </div>`;
}

// Data for the save request. Rows are sent only when the list exists, so an empty list never wipes saved apartments.
function bfuPayload() {
  const u = state.bfu; if (!u) return {};
  const pt = (document.getElementById('bfParkTotal') || {}).value;
  const out = { areaUnit: (document.getElementById('bfAreaUnit') || {}).value || 'sqft', parkingTotal: pt === '' || pt == null ? null : parseInt(pt, 10) };
  if (u.rows.length) out.unitsList = u.rows.map(r => ({ number: r.number, area: r.area === '' ? null : r.area, rooms: r.rooms, parking: +r.parking || 0, equipment: r.equipment }));
  return out;
}

document.addEventListener('input', (e) => {
  const t = e.target; const k = t && t.dataset && t.dataset.bfu; if (k === undefined || !state.bfu) return;
  const [i, f] = k.split(':'); const row = state.bfu.rows[+i]; if (!row) return;
  row[f] = t.value; if (f === 'parking') row.spots = [];
  bfuRefresh2();
});
document.addEventListener('change', (e) => { if (e.target && e.target.dataset && e.target.dataset.bfu !== undefined) bfuRefresh2(); });
document.addEventListener('input', (e) => { if (e.target && e.target.id === 'bfParkTotal') { if (state.bfu) state.bfu.parkingTotal = e.target.value; bfuRefresh2(); } });
document.addEventListener('change', (e) => { if (e.target && e.target.id === 'bfAreaUnit' && state.bfu) state.bfu.areaUnit = e.target.value; });
function bfuRefresh2() {   // only the summary line: re-drawing the table would take focus away from the field being typed in
  const sum = document.getElementById('bfuSum');
  if (sum) { const s = bfuSummary(); sum.textContent = s.text; sum.style.color = s.over ? '#8a1f1f' : 'var(--g600)'; }
}

document.addEventListener('click', (e) => {
  const b = e.target.closest && e.target.closest('[data-action="bfu-build"], [data-action="bfu-apply"]'); if (!b || !state.bfu) return;
  if (b.dataset.action === 'bfu-build') {
    const old = new Map(state.bfu.rows.map(r => [r.number, r]));
    state.bfu.rows = bfuNumbers().map(n => old.get(n) || { number: n, area: '', rooms: '', parking: 0, equipment: '', spots: [] });
  } else {
    const area = document.getElementById('bfuAllArea').value, rooms = document.getElementById('bfuAllRooms').value.trim(), park = +document.getElementById('bfuAllPark').value;
    state.bfu.rows.forEach(r => { if (area !== '') r.area = area; if (rooms) r.rooms = rooms; r.parking = park; r.spots = []; });
  }
  bfuRefresh();
});
</script>

    </div>
  </div>
`;

    </div>`;
}

function shell(title, contentHtml) {
  return `
  <div class="admin-shell">
    ${topbarHtml()}
    <div class="admin-body">
    <div class="nav-scrim"></div>
    <div class="admin-sidebar">
      ${navHtml(L)}
      <div style="flex:1;"></div>
      <button class="admin-nav-item" data-action="logout" style="color:#8a1f1f;">${L.common.logout}</button>
    </div>
    <div class="admin-main">
      <div class="content ${state.view === 'settings' || state.view === 'residentDetail' ? 'settings-islands' : ''} ${state.view === 'dashboard' ? 'dash-islands' : ''} ${['buildingForm','contractorForm','newsForm','amenityForm','adminInviteForm'].includes(state.view) ? 'form-islands' : ''}">
        ${state.adminRole === 'viewer' ? `<div class="ro-banner">${L.adminsV.readOnly}</div>` : ''}
        ${title ? `<h1 class="page-title">${title}</h1>` : ''}
        ${contentHtml}
      </div>
    </div>
    </div>
  </div>
`;}
</script>
<script>// Screens: requests, request detail, bookings, guest parking, dashboard
// Part of the admin app: plain <script> files share one global scope; load order is set in index.html.
// Pager under a long list: "1–50 of 5 549" and previous / next. list = 'requests' | 'bookings' | 'guestParking'.
function pagerHtml(list, meta) {
  if (!meta || meta.total <= meta.pageSize) return '';
  const p = L.pager, from = meta.page * meta.pageSize + 1, to = Math.min(meta.total, from + meta.pageSize - 1);
  const last = Math.ceil(meta.total / meta.pageSize) - 1;
  const btn = (page, label, off) => `<button class="btn btn-secondary" ${off ? 'disabled' : ''} data-action="page" data-list="${list}" data-page="${page}">${label}</button>`;
  return `<div class="pager">${btn(meta.page - 1, p.prev, meta.page <= 0)}<span>${p.range.replace('{a}', from).replace('{b}', to).replace('{n}', meta.total)}</span>${btn(meta.page + 1, p.next, meta.page >= last)}</div>`;
}

// Status filter: one coloured bar (a quick visual of the whole queue) and a row of chips under it.
function reqPipeline(filter) {
  // Counts come from the server for ALL requests (the list itself holds only the current page).
  const counts = (state.requestsMeta && state.requestsMeta.counts) || {};
  const cnt = {}; STATUS_ORDER.forEach(k => cnt[k] = counts[k] ? counts[k].n : 0);
  const allCount = Object.values(cnt).reduce((a, b) => a + b, 0);
  const pick = k => `data-action="filter-requests" data-filter="${k}"`;
  const segments = STATUS_ORDER.filter(k => cnt[k]).map(k => `<button class="st-${k} ${filter === k ? 'active' : ''}" style="flex:${cnt[k]}" ${pick(k)} title="${esc(L.status[k])}: ${cnt[k]}"></button>`).join('');
  const chips = STATUS_ORDER.map(k => {
    const urgent = counts[k] ? counts[k].urgent : 0;
    return `<button class="rq-chip ${filter === k ? 'active' : ''}" ${pick(k)}><i class="st-${k}"></i>${L.status[k]}<b>${cnt[k]}</b>${urgent ? '<span class="rq-dot"></span>' : ''}</button>`;
  }).join('');
  return `<div class="rq-bar-all ${allCount ? '' : 'empty'}">${segments}</div>
    <div class="rq-chips"><button class="rq-chip ${filter === 'all' ? 'active' : ''}" ${pick('all')}>${L.requestsV.allTab}<b>${allCount}</b></button>${chips}</div>`;
}

// "3 days ago" in the interface language; old open requests turn amber, then red.
// Two small charts above the list: new requests per day and the mix of categories (last 30 days).
function reqCharts() {
  const d = state.dashboard;
  if (!d || !d.requestsByDay) return '';
  return `<div class="rq-charts">
    <div class="admin-card chart-card"><h3>${L.dash.chartDays}</h3>${dashBarsChart(d.requestsByDay)}</div>
    <div class="admin-card chart-card"><h3>${L.dash.chartCategory}</h3>${dashDonut(d.categoryMix || [])}</div>
  </div>`;
}

function reqAge(r, loc) {
  const days = Math.max(0, Math.floor((Date.now() - serverDateMs(r.createdAt)) / 86400000));
  const tone = r.status === 'completed' ? '' : days >= 3 ? 'old' : days >= 1 ? 'mid' : '';
  const text = new Intl.RelativeTimeFormat(loc, { numeric: 'auto', style: 'short' }).format(-days, 'day');
  return `<span class="rq-age ${tone}">${esc(text)}</span>`;
}
// "YYYY-MM-DD HH:MM:SS" from the server is UTC without a marker.
const serverDateMs = iso => Date.parse(String(iso).replace(' ', 'T') + (String(iso).includes('Z') ? '' : 'Z'));

views.requests = () => {
  state.reqAnim = false;
  const rv = L.requestsV;
  const filter = state.requestsFilter || 'all';
  // The server already filtered and sorted this page (sort "due": soonest visit / wished date first, finished and undated last).
  const filtered = (state.requests || []).map(r => ({ ...r, tint: catColor(r.category) }));
  const sort = state.requestsSort || 'new';
  const dueOf = r => r.scheduledDate || r.preferredDate || '';
  const loc = ({ fr: 'fr-CA', en: 'en-CA', uk: 'uk-UA', es: 'es-MX', ru: 'ru-RU', zh: 'zh-CN', ar: 'ar' })[state.lang] || 'fr-CA';
  const dueCell = r => dueOf(r) ? esc(new Date(dueOf(r) + 'T00:00').toLocaleDateString(loc, { day: 'numeric', month: 'short' })) + (r.scheduledTime || r.preferredTime ? ` · ${esc(r.scheduledTime || r.preferredTime)}` : '') : '—';
  const sortBar = `<div class="rq-sort"><span>${rv.sortLabel}</span>${[['new', rv.sortNew], ['due', rv.sortDue]].map(([k, label]) => `<button class="${sort === k ? 'active' : ''}" data-action="sort-requests" data-sort="${k}">${label}</button>`).join('')}</div>`;
  return shell('', `
    <h1 class="page-title" style="margin-bottom:2px;">${L.nav.requests}</h1>
    <p style="color:var(--g500); font-size:13px; margin:0 0 18px 0;">${rv.subtitle}</p>
    ${reqCharts()}
    ${reqPipeline(filter)}
    ${sortBar}
    <div class="admin-card" style="padding:0; overflow:hidden;">
      <table class="admin-table rq-table">
        <thead><tr><th>${rv.colDescription}</th><th>${rv.colApartment}</th><th>${rv.colCategory}</th><th>${rv.colDue}</th><th>${rv.colStatus}</th></tr></thead>
        <tbody>
          ${filtered.map((r, idx) => `
            <tr class="clickable rq-row st-row-${esc(r.status)} ${r.isUrgent ? 'dash-urgent-row is-urgent' : ''}" style="--i:${Math.min(idx, 14)}; --c:${r.tint}" data-go="requestDetail" data-req="${r.id}">
              <td class="rq-desc">
                <div class="rq-title">${esc(r.description)}</div>
                <div class="rq-who"><span>#${r.id}</span>${esc(r.residentFirstName)} ${esc(r.residentLastName)} ${reqAge(r, loc)}</div>
              </td>
              <td class="rq-apt"><b>${esc(r.apartmentNumber)}</b>${r.buildingName ? `<small>${esc(r.buildingName)}</small>` : ''}</td>
              <td><div class="booking-row-type"><span class="dash-cat-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${CATEGORY_ICONS[r.category] || CATEGORY_ICONS.other}</svg></span><span>${L.category[r.category] || r.category}</span></div></td>
              <td style="white-space:nowrap;">${dueCell(r)}</td>
              <td>
                ${r.isUrgent ? `<span class="status-pill urgent" style="margin-bottom:4px; display:inline-flex;"><svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor" style="margin-right:3px;"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z"/></svg>${L.dash.urgent}</span><br>` : ''}
                <span class="status-pill ${r.status}">${L.status[r.status] || r.status}</span>
              </td>
            </tr>
          `).join('') || `<tr><td colspan="5" style="color:var(--g500);">${rv.empty}</td></tr>`}
        </tbody>
      </table>
    </div>
    ${pagerHtml('requests', state.requestsMeta)}
  `);
};

views.requestDetail = () => {
  const r = state.requestDetail;
  const rd = L.requestDetail;
  if (!r) return shell(L.nav.requests, `<p>${rd.loading}</p>`);
  return shell(rd.title(r.id), `
    <a href="#" class="back-link" data-go="requests">${rd.back}</a>
    ${(() => { const cur = Math.max(0, STATUS_ORDER.indexOf(r.status)); const pl = buildingAnimOn();
      return `<div class="rq-track ${pl ? 'play' : ''}" style="--cur:${cur}"><div class="rq-line"><i></i></div>${STATUS_ORDER.map((k, i) => `<div class="rq-step ${i < cur ? 'done' : ''} ${i === cur ? 'now' : ''}" style="--i:${i}"><span class="rq-pt">${i < cur ? '✓' : i + 1}</span><span class="rq-sl">${L.status[k]}</span></div>`).join('')}</div>`; })()}
    <div class="rqd">
      <div class="rqd-main">
        <div class="admin-card rqd-head">
          <div class="rqd-top">
            <span class="rqd-cat"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${CATEGORY_ICONS[r.category] || CATEGORY_ICONS.other}</svg>${L.category[r.category] || r.category}</span>
            <span class="rqd-pills">
              ${r.isUrgent ? `<span class="status-pill urgent"><svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z"/></svg>${L.dash.urgent}</span>` : ''}
              <span class="status-pill ${r.status}">${L.status[r.status] || r.status}</span>
            </span>
          </div>
          <h2 class="rqd-title">${esc(r.description)}</h2>
          ${r.attachments && r.attachments.length ? `
            <div class="att-grid" data-att-grid>
              ${r.attachments.map(a => {
                const video = a.mimeType && a.mimeType.startsWith('video/');
                return `<button class="att-thumb ${video ? 'is-video' : ''}" data-action="view-admin-attachment" data-req="${r.id}" data-att="${a.id}" data-mime="${esc(a.mimeType || '')}" data-name="${esc(a.originalName || '')}" title="${esc(a.originalName || '')}">
                  ${video ? '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"><path d="M8 5.5v13l11-6.5-11-6.5Z"/></svg>' : `<img data-admin-thumb data-req="${r.id}" data-att="${a.id}" alt="">`}
                </button>`;
              }).join('')}
            </div>` : ''}
        </div>

        <div class="admin-card rqd-person">
          <div class="rqd-who">
            <span class="rqd-av">${esc(initials(r.resident.firstName + ' ' + r.resident.lastName))}</span>
            <div>
              <b>${esc(r.resident.firstName)} ${esc(r.resident.lastName)}</b>
              <small>${L.requestsV.apt} ${esc(r.resident.apartmentNumber)} · ${rd.building} ${esc(r.resident.buildingCode)}</small>
            </div>
          </div>
          <div class="rqd-contacts">
            <a href="mailto:${esc(r.resident.email)}">${esc(r.resident.email)}</a>
            ${r.resident.phone ? `<a href="tel:${esc(r.resident.phone)}">${esc(r.resident.phone)}</a>` : ''}
          </div>
          <dl class="rqd-facts">
            <div><dt>${rd.createdLabel}</dt><dd>${fmtDate(r.createdAt)}</dd></div>
            ${r.preferredDate ? `<div><dt>${rd.preferredLabel}</dt><dd>${esc(r.preferredDate)}${r.preferredTime ? ' · ' + esc(r.preferredTime) : ''}</dd></div>` : ''}
            ${r.scheduledDate ? `<div><dt>${rd.scheduledDateLabel}</dt><dd>${esc(r.scheduledDate)}${r.scheduledTime ? ' · ' + esc(r.scheduledTime) : ''}</dd></div>` : ''}
          </dl>
        </div>

        ${r.status === 'completed' ? `<div class="admin-card">
          <h3 class="rqd-h">${L.engageV.ratingTitle}</h3>
          ${r.rating ? `<div style="font-size:18px;color:var(--brand-dark);letter-spacing:2px;">${'★'.repeat(r.rating)}<span style="color:var(--g300,#ccc);">${'★'.repeat(5 - r.rating)}</span></div>
            <p style="font-size:12.5px;color:var(--g600);margin:6px 0 0;">${r.ratingComment ? esc(r.ratingComment) : L.engageV.commentNone}</p>` : `<p style="font-size:12.5px;color:var(--g500);margin:0;">${L.engageV.noRating}</p>`}
        </div>` : ''}

        <div class="admin-card">
          <h3 class="rqd-h">${rd.historyTitle}</h3>
          <ol class="rqd-tl">
            ${r.timeline.map((ev, ti) => `<li class="rq-ev" style="--i:${ti};"><i class="st-${esc(ev.status)}"></i><div><b>${L.status[ev.status] || esc(ev.status)}</b>${ev.note ? `<p>${esc(ev.note)}</p>` : ''}<small>${fmtDate(ev.createdAt)}</small></div></li>`).join('')}
          </ol>
        </div>
      </div>

      <div class="admin-card rqd-side">
        <h3 class="rqd-h">${rd.updateTitle}</h3>
        <label class="rqd-urgent">
          <input type="checkbox" id="urgentCheckbox" ${(state.urgentDraft !== null ? state.urgentDraft : r.isUrgent) ? 'checked' : ''}>
          ${rd.urgentLabel}
        </label>
        <div class="field">
          <label>${rd.statusLabel}</label>
          <select id="statusSelect">
            ${STATUS_ORDER.map(s => `<option value="${s}" ${s === (state.statusDraft ?? r.status) ? 'selected' : ''}>${L.status[s]}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label>${rd.assignedLabel}</label>
          <select id="assignedContractorSelect">
            <option value="">${rd.assignedNone}</option>
            ${state.contractorsList.map(c => `<option value="${c.id}" ${state.assignedMode === 'contractor' && (state.assignedContractorDraft !== null ? state.assignedContractorDraft === c.id : r.assignedContractorId === c.id) ? 'selected' : ''}>${esc(c.firstName)} ${esc(c.lastName)}</option>`).join('')}
            <option value="__other__" ${state.assignedMode === 'other' ? 'selected' : ''}>${rd.assignedOther}</option>
          </select>
          ${state.assignedMode === 'other' ? `<input id="assignedInput" style="margin-top:8px;" value="${esc(state.assignedDraft !== null ? state.assignedDraft : (r.assignedContractorId ? '' : (r.assignedTo || '')))}" placeholder="${rd.assignedPh}">` : ''}
        </div>
        <div class="rqd-when">
          <div class="field"><label>${rd.scheduledDateLabel}</label><input type="date" id="scheduledDateInput" value="${esc(r.scheduledDate) || ''}"></div>
          <div class="field"><label>${rd.scheduledTimeLabel}</label><input type="time" id="scheduledTimeInput" value="${esc(r.scheduledTime) || ''}"></div>
        </div>
        <div class="field"><label>${rd.noteLabel}</label><input id="statusNote" placeholder="${rd.notePh}"></div>
        <button class="btn btn-primary" style="width:100%; margin-top:6px;" data-action="save-request-status" ${state.busy ? 'disabled' : ''}>${state.busy ? '…' : L.common.save}</button>
      </div>
    </div>
  `);
};

// "today", "tomorrow", "in 3 days" for a booking date, plus the weekday and day in the interface language.
function bookingDayTitle(isoDate) {
  const loc = adminLocale();
  const days = Math.round((Date.parse(isoDate + 'T00:00:00') - new Date().setHours(0, 0, 0, 0)) / 86400000);
  const when = new Intl.RelativeTimeFormat(loc, { numeric: 'auto' }).format(days, 'day');
  const full = new Date(isoDate + 'T00:00:00').toLocaleDateString(loc, { weekday: 'long', day: 'numeric', month: 'long' });
  return { when, full, soon: days >= 0 && days <= 1, past: days < 0 };
}

// A week at a glance: one bar per day, taller when more bookings (from the bookings on this page).
function bookingsWeek(list) {
  const loc = adminLocale();
  const counts = new Map();
  list.forEach(b => counts.set(b.date, (counts.get(b.date) || 0) + 1));
  const day0 = new Date().setHours(0, 0, 0, 0);
  const days = [...Array(7)].map((_, i) => {
    const d = new Date(day0 + i * 86400000);
    const iso = new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    return { n: counts.get(iso) || 0, name: d.toLocaleDateString(loc, { weekday: 'short' }), num: d.getDate(), today: i === 0 };
  });
  const top = Math.max(1, ...days.map(x => x.n));
  return `<div class="admin-card bk-week">${days.map(x => `
    <div class="bk-day ${x.today ? 'today' : ''}" title="${x.n}">
      <span class="bk-n">${x.n || ''}</span><i style="height:${x.n ? Math.max(8, Math.round(x.n / top * 100)) : 3}%"></i>
      <b>${x.num}</b><small>${esc(x.name)}</small>
    </div>`).join('')}</div>`;
}

function bookingCard(b, bv) {
  return `<div class="bk-item" style="--c:${b.tint}">
    <span class="bk-ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${AMENITY_ICONS[b.amenityKey] || AMENITY_ICONS.lounge}</svg></span>
    <div class="bk-main">
      <div class="bk-title">${esc(b.amenityName)} <small>${esc(b.duration)}</small></div>
      <div class="bk-who"><i>${esc(initials(b.residentFirstName + ' ' + b.residentLastName))}</i>${esc(b.residentFirstName)} ${esc(b.residentLastName)} · ${esc(b.apartmentNumber)}${b.buildingName ? `, ${esc(b.buildingName)}` : ''}</div>
    </div>
    <span class="bk-time">${esc(b.timeSlot)}</span>
    <button class="btn btn-secondary btn-sm" data-action="cancel-booking" data-booking="${b.id}">${bv.cancelBtn}</button>
  </div>`;
}

// Same amenity always gets the same colour, picked from a small fixed palette.
const BOOKING_TINTS = ['#4F8FCB', '#4FB286', '#8E6FC9', '#E0A82E', '#D6643F', '#3FB3C6', '#C97FB0'];
function bookingTint(key) {
  let h = 0;
  for (const ch of String(key)) h = (h * 31 + ch.charCodeAt(0)) % 997;
  return BOOKING_TINTS[h % BOOKING_TINTS.length];
}

views.bookings = () => {
  const bv = L.bookingsV;
  const filter = state.bookingsFilter || 'all';
  // Tabs are built from the amenity types that actually have bookings (sent by the server with the page),
  // instead of a hardcoded list — adapts automatically to however many amenities a building has configured.
  const amenityTypes = [...new Map(((state.bookingsMeta && state.bookingsMeta.types) || []).map(t => [t.key, t.name])).entries()];
  const list = (state.bookings || []).map(b => ({ ...b, tint: bookingTint(b.amenityKey) })); // this page, filtered by the server
  const byDay = new Map();
  list.forEach(b => { if (!byDay.has(b.date)) byDay.set(b.date, []); byDay.get(b.date).push(b); });
  const days = [...byDay.keys()].sort();
  return shell('', `
    <h1 class="page-title" style="margin-bottom:2px;">${bv.title}</h1>
    <p style="color:var(--g500); font-size:13px; margin:0 0 18px 0;">${bv.subtitle}</p>
    ${bookingsWeek(list)}
    <div class="filter-tabs">
      <button class="filter-tab ${filter === 'all' ? 'active' : ''}" data-action="filter-bookings" data-filter="all">${bv.allTab}</button>
      ${amenityTypes.map(([key, name]) => `<button class="filter-tab ${filter === key ? 'active' : ''}" data-action="filter-bookings" data-filter="${key}">${esc(name)}</button>`).join('')}
    </div>
    ${days.map(day => {
      const t = bookingDayTitle(day);
      return `<section class="bk-group ${t.past ? 'past' : ''}">
        <h3 class="bk-head ${t.soon ? 'soon' : ''}"><span>${esc(t.when)}</span><small>${esc(t.full)}</small><em>${byDay.get(day).length}</em></h3>
        <div class="bk-list">${byDay.get(day).sort((x, y) => String(x.timeSlot).localeCompare(String(y.timeSlot))).map(b => bookingCard(b, bv)).join('')}</div>
      </section>`;
    }).join('') || `<div class="admin-card" style="color:var(--g500);">${bv.empty}</div>`}
    ${pagerHtml('bookings', state.bookingsMeta)}
  `);
};

function guestParkingStatus(g) {
  const today = new Date().toISOString().slice(0, 10);
  if (g.endDate < today) return { key: 'past', label: L.guestParkingV.statusPast, pill: 'completed' };
  if (g.startDate > today) return { key: 'upcoming', label: L.guestParkingV.statusUpcoming, pill: 'reviewed' };
  return { key: 'active', label: L.guestParkingV.statusActive, pill: 'scheduled' };
}

const CAR_ICON = '<path d="M5 11l1.5-4.5A2 2 0 0 1 8.4 5h7.2a2 2 0 0 1 1.9 1.5L19 11"/><rect x="3" y="11" width="18" height="6" rx="2"/><circle cx="7.5" cy="17" r="1.5"/><circle cx="16.5" cy="17" r="1.5"/>';
const GUEST_TINT = { active: '#4FB286', upcoming: '#4F8FCB', past: '#9AA0A6' };

// A friendly empty state: a big line icon and one sentence (shared by lists with nothing in them yet).
function emptyState(iconPaths, sentence) {
  return `<div class="msg-empty"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">${iconPaths}</svg><p>${sentence}</p></div>`;
}

views.guestParking = () => {
  const gv = L.guestParkingV;
  const list = (state.guestParking || []).map(g => { const s = guestParkingStatus(g); return { ...g, state: s, tint: GUEST_TINT[s.key] }; });
  const order = ['active', 'upcoming', 'past'];
  const heading = { active: gv.statusActive, upcoming: gv.statusUpcoming, past: gv.statusPast };
  const groups = order.map(k => [k, list.filter(g => g.state.key === k)]).filter(([, rows]) => rows.length);
  return shell('', `
    <h1 class="page-title" style="margin-bottom:2px;">${gv.title}</h1>
    <p style="color:var(--g500); font-size:13px; margin:0 0 22px 0;">${gv.subtitle}</p>
    ${groups.map(([key, rows]) => `<section class="bk-group ${key === 'past' ? 'past' : ''}">
      <h3 class="bk-head ${key === 'active' ? 'soon' : ''}"><span>${heading[key]}</span><em>${rows.length}</em></h3>
      <div class="bk-list">${rows.map(g => `<div class="bk-item" style="--c:${g.tint}">
        <span class="bk-ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${CAR_ICON}</svg></span>
        <div class="bk-main">
          <div class="bk-title">${esc(g.guestName)} ${g.licensePlate ? `<span class="plate">${esc(g.licensePlate)}</span>` : ''}</div>
          <div class="bk-who"><i>${esc(initials(g.residentFirstName + ' ' + g.residentLastName))}</i>${esc(g.residentFirstName)} ${esc(g.residentLastName)} · ${esc(g.apartmentNumber)}${g.buildingName ? `, ${esc(g.buildingName)}` : ''}${g.parkingSpot ? ` · ${esc(gv.colSpot.toLowerCase())} ${esc(g.parkingSpot)}` : ''}</div>
        </div>

// Charts on the overview: plain SVG / CSS, brand colour at different strengths.
const CHART_SHADES = [1, 0.72, 0.5, 0.32, 0.18];
// One colour per request category, used on chips, rows and the donut so a kind of request is found by colour.
const CATEGORY_COLORS = { plumbing: '#4F8FCB', electrical: '#E0A82E', cleaning: '#4FB286', moving: '#8E6FC9', drycleaning: '#C97FB0', carwash: '#3FB3C6', tires: '#6B7280', furniture: '#C98B5A', repairs: '#D6643F', other: '#9AA0A6' };
const catColor = key => CATEGORY_COLORS[key] || CATEGORY_COLORS.other;

function dashBarsChart(rows) {
  const top = Math.max(1, ...rows.map((r) => r.n));
  const bars = rows.map((r, i) => {
    const h = Math.max(r.n ? 6 : 2, Math.round((r.n / top) * 100));
    const last = i === rows.length - 1;
    return `<div class="bar-col" title="${esc(r.day)}: ${r.n}">
      <span class="bar-n">${r.n || ''}</span>
      <i class="${last ? 'cur' : ''}" style="height:${h}%"></i>
      <span class="bar-d">${esc(r.day.slice(8))}</span>
    </div>`;
  }).join('');
  return `<div class="bars">${bars}</div>`;
}

function dashDonut(rows) {
  const total = rows.reduce((sum, r) => sum + r.n, 0);
  if (!total) return `<p class="chart-empty">—</p>`;
  const R = 15.9155; // circumference 100, so a share is just its percentage
  let offset = 25;
  const tinted = rows.map(r => ({ ...r, tint: catColor(r.category) }));
  const arcs = tinted.map((r, i) => {
    const share = (r.n / total) * 100;
    const arc = `<circle r="${R}" cx="21" cy="21" fill="none" stroke="${r.tint}"
      stroke-width="6" stroke-dasharray="${share.toFixed(2)} ${(100 - share).toFixed(2)}" stroke-dashoffset="${offset.toFixed(2)}"/>`;
    offset -= share;
    return arc;
  }).join('');
  const legend = tinted.map(r => `<li><i style="background:${r.tint}"></i>
    <span>${esc(L.category[r.category] || r.category)}</span><b>${r.n}</b></li>`).join('');
  return `<div class="donut-wrap">
    <svg viewBox="0 0 42 42" class="donut"><circle r="${R}" cx="21" cy="21" fill="none" stroke="var(--frame)" stroke-width="6"/>${arcs}
      <text x="21" y="23" text-anchor="middle" class="donut-n">${total}</text></svg>
    <ul class="donut-legend">${legend}</ul></div>`;
}

function dashStatusBar(rows) {
  const total = rows.reduce((sum, r) => sum + r.n, 0);
  if (!total) return `<p class="chart-empty">—</p>`;
  const order = ['submitted', 'reviewed', 'assigned', 'scheduled', 'completed'];
  const sorted = order.map((k) => rows.find((r) => r.status === k)).filter(Boolean);
  const parts = sorted.map((r) => `<i class="st-${r.status}" style="flex:${r.n}" title="${esc(L.status[r.status] || r.status)}: ${r.n}"></i>`).join('');
  const legend = sorted.map((r) => `<li><i class="st-${r.status}"></i><span>${esc(L.status[r.status] || r.status)}</span><b>${r.n}</b></li>`).join('');
  return `<div class="stack">${parts}</div><ul class="stack-legend">${legend}</ul>`;
}

function dashCharts(d) {
  const days = d.requestsByDay || [];
  return `<div class="dash-charts">
    <div class="admin-card chart-card wide"><h3>${L.dash.chartDays}</h3>${dashBarsChart(days)}</div>
    <div class="admin-card chart-card"><h3>${L.dash.chartCategory}</h3>${dashDonut(d.categoryMix || [])}</div>
    <div class="admin-card chart-card"><h3>${L.dash.chartStatus}</h3>${dashStatusBar(d.statusMix || [])}</div>
  </div>`;
}

// The photo of a building (only The Office shows it, instead of the 3D model): fetched with the admin token.
function fillBuildingPhotos() {
  document.querySelectorAll('img[data-bld-photo]:not([src])').forEach(img => {
    img.src = 'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
    const t = adminApi.getToken();
    fetch(`/api/admin/buildings/${img.dataset.bldPhoto}/photo`, { headers: t ? { Authorization: `Bearer ${t}` } : {} })
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.blob(); })
      .then(b => { img.src = URL.createObjectURL(b); })
      .catch(() => {});
  });
}
new MutationObserver(fillBuildingPhotos).observe(document.documentElement, { childList: true, subtree: true });

<script>// Screens: news, amenities, calendar, reports, audit log

function newsReadersBlock(d) {
  const E = L.engageV;
  const chips = (arr) => arr.map(r => `<span style="display:inline-block;background:var(--g100);border-radius:999px;padding:3px 10px;margin:2px 4px 2px 0;font-size:12px;">${esc(r.buildingCode)} · ${esc(r.apartmentNumber)} ${esc(r.firstName)} ${esc(r.lastName)}</span>`).join('');

  return `<div style="padding:6px 2px;font-size:12.5px;">
    <div style="font-weight:700;margin-bottom:4px;">${E.unread} (${d.unread.length})</div>
    ${d.unread.length ? chips(d.unread) : `<span style="color:var(--g500);">${E.all}</span>`}

}

// Advertising written here is temporary: when the central dashboard serves ads to every client, this goes away.
const AD_KEYS = { plain: 'adPlain', admin: 'adAdmin', special: 'adSpecial' };

// Ordinary notices keep to cool colours (ads are warm posters): the tag picks one of these, always the same.
const NEWS_TINTS = ['#4F8FCB', '#4FB286', '#8E6FC9', '#3FB3C6', '#C97FB0'];
function newsTint(tag) {
  let h = 0;
  for (const ch of String(tag || '')) h = (h * 31 + ch.charCodeAt(0)) % 997;
  return NEWS_TINTS[h % NEWS_TINTS.length];
}

// "today", "3 days ago": how long ago a notice went out.
function newsAgo(iso) {
  const days = -Math.max(0, Math.floor((Date.now() - serverDateMs(iso)) / 86400000));
  return new Intl.RelativeTimeFormat(adminLocale(), { numeric: 'auto' }).format(days, 'day');
}

// "08:30" -> 8.5 hours, for placing a bar on a 24-hour line.
const hourOf = clock => {
  const [h, m] = String(clock || '0:0').split(':').map(Number);
  return (h || 0) + (m || 0) / 60;
};

// A row-by-row bar list: a name, a bar as long as its share of the biggest, and the number.
function repBars(rows, emptyText) {
  if (!rows.length) return `<p class="chart-empty">${emptyText}</p>`;
  const top = Math.max(1, ...rows.map(r => r.n));
  return `<div class="rep-bars">${rows
    .map(r => `<div class="rep-bar"><span class="rep-name" title="${esc(r.name)}">${esc(r.name)}</span>
      <i><u style="width:${Math.max(4, Math.round((r.n / top) * 100))}%; background:${r.tint}"></u></i>
      <b>${r.n}</b></div>`)
    .join('')}</div>`;
}

// One headline number with an icon chip and a colour that says if it is good or needs a look.
function repTile(iconPaths, value, caption, tone) {
  return `<div class="admin-card rep-tile ${tone || ''}">
    <span class="rep-tile-ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"
      stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${iconPaths}</svg></span>
    <b>${value}</b><span>${caption}</span></div>`;
}

      <table class="admin-table" style="margin-top:12px;">
        <thead><tr><th>${L.rl31.colDwelling}</th><th>${L.rl31.colAddress}</th><th>${L.rl31.colTenants}</th><th>${L.rl31.colNumber}</th><th></th></tr></thead>
        <tbody>
          ${((state.rl31 && state.rl31.rows) || []).map(r => `
            <tr>

              <td>${r.address ? esc(r.address) : `<span style="color:#8a1f1f;">${L.rl31.noAddress}</span>`}</td>
              <td>${r.tenantCount} — ${esc(r.tenants.join(', '))}</td>
              <td><input data-dwelling value="${esc(r.dwellingNumber || '')}" maxlength="15" placeholder="AB123CD456EF789" style="font-family:monospace; font-size:12px; padding:6px 8px; border:1px solid ${r.dwellingNumber ? 'var(--g200)' : '#d9a5a5'}; border-radius:8px; width:170px; text-transform:uppercase;"></td>
              <td style="text-align:right;"><button class="btn btn-secondary" style="width:auto; padding:6px 10px; font-size:11px;" data-action="save-dwelling" data-building="${esc(r.buildingCode)}" data-apt="${esc(r.apartment)}">${L.common.save || 'OK'}</button></td>
            </tr>`).join('')}

    <div class="admin-card" style="margin-top:16px; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;">

      <button class="btn btn-secondary" style="width:auto; padding:7px 12px; font-size:12px;" data-action="export-csv" data-kind="requests">${L.rl31.export}</button>

};

              <td class="aud-who"><i>${esc(initials(e.adminName))}</i>${esc(e.adminName)}</td>
              <td><span class="act-chip ${e.action === 'delete' ? 'del' : e.action === 'create' ? 'add' : e.action === 'update' ? 'upd' : ''}">${av.action[e.action] || esc(e.action)}</span></td>
              <td>${av.target[e.targetType] || esc(e.targetType)}${e.targetLabel ? ` — ${esc(e.targetLabel)}` : ''}</td>
              <td style="color:var(--g500);">${esc(e.details) || '—'}</td>
