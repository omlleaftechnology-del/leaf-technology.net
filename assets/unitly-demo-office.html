<script>// The Interphones screen, built from small blocks: connection card, SIP settings card, add form, devices,
// recent calls and the event journal.

const IC_SMALL_BTN = 'width:auto;';
const IC_CARD_BTN = 'width:auto;';
const IC_CHIP_BTN = 'width:auto;';
const IC_TH_MARGIN = 'font-size:14px; font-weight:800; margin:26px 0 10px 0;';

function icEventLabel(t) {
  const v = L.intercomV;
  if (v['ev' + t]) return v['ev' + t];
  return t < 40 ? v.evNormal : t < 80 ? v.evWarn : t < 120 ? v.evAlarm : t < 166 ? v.evState : v.evOther;
}
function icEventColor(t) { return t >= 80 && t < 120 ? '#d92d20' : t >= 40 && t < 80 ? '#b54708' : 'inherit'; }

const icBtn = (action, id, label, disabled) =>
  `<button class="btn btn-secondary" style="${IC_SMALL_BTN}" data-action="${action}" data-id="${id}" ${disabled ? 'disabled' : ''}>${label}</button>`;
const icNone = (cols) => `<tr><td colspan="${cols}" style="color:var(--g500);">—</td></tr>`;

function icMessage() {
  const m = state.intercomMsg;
  if (!m) return '';
  const color = m.ok ? 'var(--brand-dark)' : '#8a1f1f';
  return `<div style="font-size:12.5px; font-weight:600; margin:0 0 12px 0; color:${color};">${esc(m.text)}</div>`;
}

// Where the manufacturer-protocol door stations must connect (or a note that nothing is switched on).
function icConnectionCard(d) {
  const v = L.intercomV;
  if (d.connection.enabled === false) {
    if (d.sip && d.sip.enabled) return '';
    return `<div class="admin-card" style="max-width:640px; margin-bottom:16px;">${v.off}</div>`;
  }
  return `<div class="admin-card" style="max-width:640px; margin-bottom:16px;">
    <div style="font-size:12px; color:var(--g500);">${v.connTitle}</div>
    <div style="font-size:18px; font-weight:800; margin:4px 0 6px 0; user-select:all;">${esc(d.connection.address || '')}</div>
    <p style="font-size:12px; color:var(--g500); margin:0; line-height:1.5;">${v.connNote}</p>
  </div>`;
}

// The SIP settings of one panel, laid out in a row, opened right under that device.
function icSipPanel() {
  const s = state.intercomSip;
  const v = L.intercomV;
  const fields = [
    ['sipServer', s.server],
    ['sipPort', s.port],
    ['sipUser', s.username],
    ['sipPass', s.password],
  ];
  const cells = fields
    .map(
      ([key, value]) => `<div class="ic-cred">
      <span>${v[key]}</span>
      <b>${esc(String(value))}</b>
      <button class="btn btn-secondary btn-sm" data-action="ic-copy"
        data-value="${esc(String(value))}">${v.copy}</button>
    </div>`
    )
    .join('');
  const button = (action, caption) =>
    `<button class="btn btn-secondary btn-sm" data-action="${action}"
      data-id="${s.id}">${caption}</button>`;
  return `<div class="ic-sip">
    <ol class="ic-steps">
      <li>${v.step1}</li><li>${v.step2}</li><li>${v.step3}</li>
    </ol>
    <div class="ic-creds">${cells}</div>
    <div class="ic-sip-foot">
      <span>${v.sipCodecs}: ${esc(String(s.codecs))} · ${v.sipDtmf}: ${esc(String(s.dtmf))}</span>
      <span>${button('ic-sip-reset', v.sipReset)} ${button('ic-sip-close', v.sipClose)}</span>
    </div>
  </div>`;
}

// The wizard under a building: pick a model from the drop-down, then fill in the panel's own connection data.
function icWizard(d, building) {
  const v = L.intercomV;
  const w = state.icWizard;
  const options = (d.models || [])
    .map(m => ({ ...m, picked: w.model === m.id ? 'selected' : '' }))
    .map(m => `<option value="${esc(m.id)}" ${m.picked}>${esc(m.name || '')}</option>`)
    .join('');
  const input = (key, label, extra) => `<div class="field"><label>${label}</label>
    <input data-icw="${key}" value="${esc(w[key] || '')}" ${extra || ''}></div>`;
  const fields = w.model
    ? `<div class="ic-fields">
        ${input('sn', v.snLabel, 'maxlength="40" autocomplete="off" id="icSn"')}
        ${input('host', v.panelHost, 'maxlength="253" autocomplete="off" inputmode="url"')}
        ${input('port', v.panelPort, 'maxlength="5" inputmode="numeric" autocomplete="off"')}
        ${input('user', v.panelUser, 'maxlength="60" autocomplete="off"')}
        ${input('pass', v.panelPass, 'maxlength="120" type="password" autocomplete="new-password"')}
      </div>
      <small class="ic-hint">${v.snWhere} ${v.panelHint}</small>
      <div class="ic-wiz-actions">
        <button class="btn btn-primary" data-action="ic-add" data-code="${esc(building.code)}"
          ${state.busy ? 'disabled' : ''}>${state.busy ? '…' : v.connectGo}</button>
        <button class="btn btn-secondary" data-action="ic-wiz-close">${v.cancel}</button>
      </div>`
    : `<div class="ic-wiz-actions"><button class="btn btn-secondary"
        data-action="ic-wiz-close">${v.cancel}</button></div>`;
  return `<div class="ic-wiz">
    <div class="field ic-model-field"><label>${v.chooseModel}</label>
      <select id="icModel"><option value="">—</option>${options}</select></div>
    ${fields}
    ${w.error ? `<div class="ic-error">${esc(w.error)}</div>` : ''}
  </div>`;
}

// One connected door station inside a building card.
function icDeviceLine(x) {
  const v = L.intercomV;
  const isSip = x.driver === 'sip';
  const names = Object.fromEntries(((state.intercomData || {}).models || []).map(m => [m.id, m.name]));
  const modelLabel = x.model && names[x.model] ? esc(names[x.model]) : isSip ? v.typeSipTag : 'MQTT';
  const stateText = isSip ? '' : x.online ? v.online : v.offline;
  const checked = (state.icCheck || {})[x.id];
  const checkText = checked === 'checking' ? v.checking : checked === 'ok' ? v.checkOk : checked === 'fail' ? v.checkFail : '';
  const address = x.host ? esc(x.host) + (x.port ? ':' + esc(String(x.port)) : '') : '';
  const addressPart = address ? ' · ' + address : '';
  const tint = isSip ? '#4F8FCB' : x.online ? '#4FB286' : '#9AA0A6';
  const buttons = isSip
    ? (x.host ? icBtn('ic-check', x.id, v.checkBtn) + ' ' : '') + icBtn('ic-sip', x.id, v.sipBtn)
    : icBtn('ic-open', x.id, v.openBtn, !x.online) +
      ' ' +
      icBtn('ic-sync', x.id, v.syncBtn, !(x.online && x.buildingCode));
  const trash = `<button class="res-trash" data-action="ic-del" data-id="${x.id}"
    title="${esc(v.delBtn)}" aria-label="${esc(v.delBtn)}">${RDOC_DEL}</button>`;
  const opened = state.intercomSip && state.intercomSip.id === x.id;
  return `<div class="ic-dev"><div class="ic-line" style="--c:${tint}">
    <span class="bk-ic">${icIcon()}</span>
    <div class="bk-main"><div class="bk-title">${esc(x.name)} <span class="task-chip">${modelLabel}</span></div>
      <div class="mv-note">${esc(x.sn)}${addressPart}${
        stateText ? ` · <span class="ic-state"><i></i>${stateText}</span>` : ''
      }</div>
      ${checkText ? `<div class="ic-check ${checked}">${checkText}</div>` : ''}</div>
    <div class="ic-actions-inline">${buttons}${trash}</div>
  </div>${opened ? icSipPanel() : ''}</div>`;
}

const IC_ICON =
  '<rect x="6" y="2.5" width="12" height="19" rx="2.5"/><circle cx="12" cy="9" r="2.2"/>' +
  '<path d="M9.5 15h5M9.5 18h5"/>';
const icIcon = () =>
  `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC_ICON}</svg>`;

// A building with an intercom entrance gets "Connect a device"; a street entrance has none to connect.
function icHouse(d, b) {
  const v = L.intercomV;
  const bf = L.buildingForm;
  const street = b.entrance === 'street';
  const devices = d.devices.filter(x => x.buildingCode === b.code);
  const open = state.icWizard && state.icWizard.code === b.code;
  const inner = street
    ? `<div class="ic-street"><span>${v.streetNote}</span>
        <span class="task-chip ic-soon">${v.doorbellSoon}</span></div>`
    : `${devices.map(icDeviceLine).join('') || `<p class="ic-none">${v.notConnected}</p>`}
      ${open
        ? icWizard(d, b)
        : `<button class="btn btn-primary btn-sm" data-action="ic-wiz-open"
            data-code="${esc(b.code)}">+ ${v.connectBtn}</button>`}`;
  return `<div class="admin-card ic-house">
    <div class="ic-house-head">
      <span class="bk-ic" style="--c:${street ? '#9AA0A6' : '#4F8FCB'}"><svg width="18" height="18"
        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
        stroke-linecap="round" stroke-linejoin="round">${NAV_ICONS.buildings}</svg></span>
      <div class="bk-main"><div class="bk-title">${esc(b.name)}</div>
        <div class="mv-note">${esc(b.address || '')}</div></div>
      <span class="task-chip">${street ? bf.entranceStreet : bf.entranceLobby}</span>
    </div>
    ${inner}
  </div>`;
}

function icHouses(d) {
  const v = L.intercomV;
  const buildings = state.buildingsList || [];
  if (!buildings.length) return `<div class="admin-card">${v.noHouses}</div>`;
  const known = new Set(buildings.map(b => b.code));
  const orphans = d.devices.filter(x => !known.has(x.buildingCode));
  const loose = orphans.length
    ? `<div class="admin-card ic-house"><div class="ic-house-head"><div class="bk-main">
        <div class="bk-title">${v.elsewhere}</div></div></div>
        ${orphans.map(icDeviceLine).join('')}</div>`
    : '';
  return `<h3 class="ic-h">${v.housesTitle}</h3>
    <div class="ic-houses">${buildings.map(b => icHouse(d, b)).join('')}${loose}</div>`;
}

function icCallsTable(d) {
  const v = L.intercomV;
  const tone = st => (/miss|no|timeout|reject/.test(st) ? 'del' : /open|answer/.test(st) ? 'add' : '');
  const rows = d.calls.map(c => ({ ...c, tone: tone(c.state) })).map(c => `<tr><td>${fmtDate(c.startedAt)}</td><td>${esc(c.room || '—')}</td><td>${esc(c.device)}</td>
    <td><span class="act-chip ${c.tone}">${v['st_' + c.state] || esc(c.state)}</span></td><td>${esc(c.openedByName || '—')}</td></tr>`).join('');
  return `<h3 style="${IC_TH_MARGIN}">${v.callsTitle}</h3>
  <div class="admin-card" style="padding:0; overflow:auto;"><table class="admin-table">
    <thead><tr><th>${v.colTime}</th><th>${v.colRoom}</th><th>${v.colName}</th><th>${v.colResult}</th><th>${v.colOpenedBy}</th></tr></thead>
    <tbody>${rows || icNone(5)}</tbody>
  </table></div>`;
}

function icEventsTable(d) {
  const v = L.intercomV;
  const rows = d.events.map(e => {
    const strong = e.type >= 40 && e.type < 120;
    return `<tr><td>${esc(e.at || '—')}</td><td>${esc(e.device)}</td>
      <td style="color:${icEventColor(e.type)}; font-weight:${strong ? 700 : 400};">${esc(icEventLabel(e.type))}</td></tr>`;
  }).join('');
  return `<h3 style="${IC_TH_MARGIN}">${v.eventsTitle}</h3>
  <div class="admin-card" style="padding:0; overflow:auto;"><table class="admin-table">
    <thead><tr><th>${v.colTime}</th><th>${v.colName}</th><th>${v.colEvent}</th></tr></thead>
    <tbody>${rows || icNone(3)}</tbody>
  </table></div>`;
}

views.intercom = () => {
  const v = L.intercomV;
  const d = state.intercomData || { devices: [], knocking: [], events: [], calls: [], connection: {} };
  return shell(v.title, `
  <p style="color:var(--g500); font-size:13px; margin:-6px 0 16px 0; max-width:640px;">${v.lead}</p>
  ${icConnectionCard(d)}
  ${icMessage()}
  ${icHouses(d)}
  ${icCallsTable(d)}
  ${icEventsTable(d)}`);
};
</script>
<script>// Screens: settings (services, admins, password), admin invite form, messages
// Part of the admin app: plain <script> files share one global scope; load order is set in index.html.
const SERVICE_ORDER = ['cleaning', 'moving', 'drycleaning', 'carwash', 'tires', 'furniture', 'plumbing', 'electrical', 'repairs', 'other'];
const PRICED_SERVICES = ['cleaning', 'moving', 'drycleaning', 'carwash', 'tires', 'furniture'];

// Working copy of the service on/off + price form. Kept in state (not read
// back from the DOM) because every toggle re-renders the whole screen —
// without this a price typed into one field would vanish on the next click.
function svcDraft() {
  if (state.serviceDraft) return state.serviceDraft;
  const d = {};
  Object.entries(state.serviceSettings || {}).forEach(([k, v]) => { d[k] = { enabled: v.enabled, price: v.price === null ? '' : String(v.price) }; });
  return d;
}

async function handleSaveServices() {
  const draft = svcDraft();
  const payload = {};
  state.serviceError = null; state.serviceSaved = false;
  for (const cat of SERVICE_ORDER) {
    const d = draft[cat] || { enabled: true, price: '' };
    let price = null;
    if (PRICED_SERVICES.includes(cat) && String(d.price).trim() !== '') {
      const n = Number(String(d.price).replace(',', '.').trim());
      if (!Number.isFinite(n) || n < 0 || n > 100000 || Math.round(n * 100) / 100 !== n) {
        state.serviceError = L.settingsV.serviceErrPrice(L.category[cat]); render(); return;
      }
      price = n;
    }
    payload[cat] = { enabled: !!d.enabled, price };
  }
  if (!Object.values(payload).some(p => p.enabled)) { state.serviceError = L.settingsV.serviceErrNone; render(); return; }
  state.busy = true; render();
  try {
    state.serviceSettings = await adminApi.saveServiceSettings(payload);
    state.serviceDraft = null; state.serviceSaved = true;
  } catch (err) { state.serviceError = err.message; }
  state.busy = false; render();
}

function tfaCard() {
  const t = L.tfa, s = state.tfa || { enabled: false, step: 'idle' };
  const err = s.error ? `<div style="color:#8a1f1f; font-size:12.5px; font-weight:600; margin-top:12px;">${esc(s.error)}</div>` : '';
  let body;
  if (s.step === 'setup') {
    body = `<p style="font-size:12px; color:var(--g500); margin:0 0 12px 0; line-height:1.5;">${t.scan}</p>
      <img src="${s.qr}" alt="QR" style="width:180px; height:180px; display:block; margin:0 0 10px 0;">
      <p style="font-size:11.5px; color:var(--g500); margin:0 0 4px 0;">${t.manual}</p>
      <code style="font-size:12.5px; word-break:break-all; user-select:all;">${esc(s.secret)}</code>
      ${s.mailFailed
        ? `<p style="font-size:12.5px; color:#8a1f1f; font-weight:600; margin:14px 0 8px 0; line-height:1.5;">${t.mailFailed}</p>`
        : `<p style="font-size:12px; color:var(--g500); margin:14px 0 8px 0; line-height:1.5;">${t.emailSentNote}</p>`}
      <div class="field" style="margin:0;"><label>${t.emailCodeLabel}</label><input id="tfaEmailCode" inputmode="numeric" autocomplete="off" maxlength="8"></div>
      <div class="field" style="margin:14px 0 0 0;"><label>${t.codeLabel}</label><input id="tfaCode" inputmode="numeric" autocomplete="one-time-code" maxlength="8"></div>${err}
      <div style="display:flex; gap:10px; margin-top:14px;">
        <button class="btn btn-primary" style="width:auto;" data-action="tfa-confirm" ${state.busy ? 'disabled' : ''}>${t.confirm}</button>
        <button class="btn btn-secondary" style="width:auto;" data-action="tfa-cancel">${t.cancel}</button></div>`;
  } else if (s.step === 'codes') {
    body = `<h4 style="font-size:13px; margin:0 0 6px 0;">${t.recTitle}</h4>
      <p style="font-size:12px; color:var(--g500); margin:0 0 10px 0; line-height:1.5;">${t.recNote}</p>
      <pre id="tfaCodes" style="font-size:14px; line-height:1.7; background:var(--g100,#f4f4f4); padding:12px; border-radius:8px; margin:0 0 14px 0; user-select:all;">${s.codes.map(esc).join('\n')}</pre>
      <button class="btn btn-primary" style="width:auto;" data-action="tfa-done">${t.recDone}</button>`;
  } else if (s.enabled) {
    body = `<p style="font-size:12px; color:var(--g500); margin:0 0 10px 0;">${t.disNote}</p>
      <div class="field"><label>${t.pwd}</label><input type="password" id="tfaPwd" autocomplete="current-password"></div>
      <div class="field" style="margin-bottom:0;"><label>${t.codeLabel}</label><input id="tfaOff" autocomplete="one-time-code" maxlength="24"></div>${err}
      <button class="btn btn-secondary" style="width:auto; margin-top:14px;" data-action="tfa-disable" ${state.busy ? 'disabled' : ''}>${t.disBtn}</button>`;
  } else {
    body = `<p style="font-size:12px; color:var(--g500); margin:0 0 14px 0; line-height:1.5;">${t.note}</p>
      <div class="field" style="margin:0;"><label>${t.pwd}</label><input type="password" id="tfaSetupPwd" autocomplete="current-password"></div>${err}
      <button class="btn btn-primary" style="width:auto; margin-top:14px;" data-action="tfa-start" ${state.busy ? 'disabled' : ''}>${t.enable}</button>`;
  }
  return `<div class="admin-card" id="tfaCard" style="max-width:480px; margin-top:16px;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
      <h3 style="font-size:14px; font-weight:800; margin:0;">${t.title}</h3>
      <span class="status-pill ${s.enabled ? 'completed' : 'submitted'}">${s.enabled ? t.on : t.off}</span></div>${body}</div>`;
}

views.settings = () => {
  const sv = L.settingsV;
  return shell(sv.title, `
    <div class="isl-grid">
    <div class="isl-col">
    ${state.adminRole === 'owner' ? `
    <div class="admin-card" style="max-width:480px; margin-bottom:16px;">
      <div class="set-grid">

// Chat times: the server stores UTC, show them in the viewer's language and clock.
const msgClock = iso => new Date(serverDateMs(iso)).toLocaleTimeString(adminLocale(), { hour: '2-digit', minute: '2-digit' });
// In the list: the time for today's messages, the short date for older ones.
function msgShortTime(iso) {
  const d = new Date(serverDateMs(iso));
  return d.toDateString() === new Date().toDateString()
    ? msgClock(iso)
    : d.toLocaleDateString(adminLocale(), { day: 'numeric', month: 'short' });
}
// Puts a "21 November" divider before the first message of each day.
function msgsWithDays(list) {
  const out = [];
  let last = '';
  list.forEach(m => {
    const day = new Date(serverDateMs(m.createdAt)).toLocaleDateString(adminLocale(), { weekday: 'long', day: 'numeric', month: 'long' });
    if (day !== last) { out.push({ separator: day }); last = day; }
    out.push(m);
  });
  return out;
}

<script>// Auto-created tasks store language-neutral markers ("@moving|…"); render them in the current admin language.
const TASK_MOVING_TXT = {
  fr: { t: (n, a, b) => `🚚 Déménagement : ${n}, app. ${a} (${b})`, n: (id, d, x) => `Service de déménagement demandé (demande n° ${id}) pour le ${d}. ${x}` },
  en: { t: (n, a, b) => `🚚 Moving: ${n}, apt ${a} (${b})`, n: (id, d, x) => `Moving service requested (request #${id}) for ${d}. ${x}` },
  uk: { t: (n, a, b) => `🚚 Переїзд: ${n}, кв. ${a} (${b})`, n: (id, d, x) => `Замовлено послугу переїзду (заявка №${id}) на ${d}. ${x}` },
  es: { t: (n, a, b) => `🚚 Mudanza: ${n}, apto. ${a} (${b})`, n: (id, d, x) => `Servicio de mudanza solicitado (solicitud n.º ${id}) para el ${d}. ${x}` },
  ru: { t: (n, a, b) => `🚚 Переезд: ${n}, кв. ${a} (${b})`, n: (id, d, x) => `Заказана услуга переезда (заявка №${id}) на ${d}. ${x}` },
  zh: { t: (n, a, b) => `🚚 搬家：${n}，${a}室（${b}）`, n: (id, d, x) => `已申请搬家服务（请求 #${id}），日期 ${d}。${x}` }
};
function taskText(str) {
  if (typeof str !== 'string' || !str.startsWith('@moving|')) return str;
  const f = str.split('|'); const T = TASK_MOVING_TXT[state.lang] || TASK_MOVING_TXT.en;
  return f.length >= 4 && /^\d+$/.test(f[1]) ? T.n(f[1], f[2], f.slice(3).join('|')).trim() : T.t(f[1], f[2], f.slice(3).join('|'));
}
// Screen: tasks and reminders for the management team
// Part of the admin app: plain <script> files share one global scope; load order is set in index.html.
const adminLocale = () => ({ fr: 'fr-CA', en: 'en-CA', uk: 'uk-UA', es: 'es-MX', ru: 'ru-RU', zh: 'zh-CN', ar: 'ar' })[state.lang] || 'fr-CA';

// "tomorrow", "in 3 days", "2 days ago": how far the due date is from today, in the interface language.
function dueRelative(isoDate) {
  const days = Math.round((Date.parse(isoDate + 'T00:00:00') - new Date().setHours(0, 0, 0, 0)) / 86400000);
  return new Intl.RelativeTimeFormat(adminLocale(), { numeric: 'auto' }).format(days, 'day');
}

// Overdue first, then today, then by date; tasks without a date go last.
function sortOpenTasks(list) {
  const rank = t => (t.overdue ? 0 : t.dueToday ? 1 : t.dueDate ? 2 : 3);
  return [...list].sort((x, y) => rank(x) - rank(y) || String(x.dueDate || '').localeCompare(String(y.dueDate || '')));
}

const TASK_ICONS = {
  late: '<path d="M12 3 2.5 20h19L12 3Z"/><path d="M12 10v4M12 17.5v.01"/>',
  today: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  all: '<rect x="4" y="4" width="16" height="16" rx="2"/><path d="m8 12 3 3 5-6"/>',
};
function taskTile(kind, count, caption) {
  return `<div class="task-tile ${kind} ${count ? 'has' : ''}">
    <span class="task-tile-ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${TASK_ICONS[kind]}</svg></span>
    <b>${count}</b><span>${caption}</span></div>`;
}

function taskCard(t, tv) {
  const tone = t.doneAt ? 'done' : t.overdue ? 'late' : t.dueToday ? 'today' : '';
  const dueChip = t.dueDate && !t.doneAt
    ? `<span class="task-chip ${tone}">${t.overdue ? tv.overdue + ' · ' : ''}${esc(dueRelative(t.dueDate))} <small>${esc(t.dueDate)}</small></span>`
    : t.dueDate ? `<span class="task-chip">${esc(t.dueDate)}</span>` : '';
  return `<div class="task-row task-card ${tone}">
    <button class="task-check" data-action="toggle-task" data-task="${t.id}" data-done="${t.doneAt ? 0 : 1}" title="${t.doneAt ? tv.reopen : tv.markDone}" aria-label="${t.doneAt ? tv.reopen : tv.markDone}">${t.doneAt ? '✓' : ''}</button>
    <div class="task-main">
      <div class="task-title">${esc(taskText(t.title))}</div>
      <div class="task-meta">
        ${dueChip}
        ${t.templateId ? `<span class="task-chip" title="${esc(L.recurV.recurring)}">↻ ${esc(L.recurV.recurring)}</span>` : ''}
        ${t.residentName ? `<span class="task-chip person"><i>${esc(initials(t.residentName))}</i>${esc(t.residentName)} · ${esc(t.apartment)}</span>` : ''}
        ${t.note ? `<span class="task-note">${esc(taskText(t.note))}</span>` : ''}
        ${t.doneAt ? `<span class="task-note">${tv.doneBy(esc(t.doneBy || '—'))}</span>` : ''}
      </div>
    </div>
    <button class="res-trash" data-action="delete-task" data-task="${t.id}" title="${esc(L.common.delete)}" aria-label="${esc(L.common.delete)}">${RDOC_DEL}</button>
  </div>`;
}

document.addEventListener('click', async (e) => {
  const btn = e.target.closest('[data-action^="tpl-"]'); if (!btn) return;
  const R = L.recurV; const a = btn.dataset.action; state.tplError = null;
  try {
    if (a === 'tpl-add') {
      const title = document.getElementById('tplTitle').value.trim(); const first = document.getElementById('tplFirst').value;
      const every = parseInt(document.getElementById('tplEvery').value, 10);
      if (!title || !first || !every) { state.tplError = R.required; render(); return; }
      await adminApi.createTemplate({ title, repeatEvery: every, repeatUnit: document.getElementById('tplUnit').value, nextDue: first });
    } else if (a === 'tpl-toggle') await adminApi.updateTemplate(btn.dataset.id, { active: btn.dataset.a === '1' });
    else if (a === 'tpl-del') { if (!confirm(R.confirmDel)) return; await adminApi.deleteTemplate(btn.dataset.id); }
  } catch (err) { state.tplError = err.message; }
  try { state.tplList = await adminApi.getTemplates(); state.tasksList = await adminApi.getTasks(state.tasksFilter); } catch (_) {}
  render();
});
</script>

<script>// Screen: bookings calendar — a month grid where every booking is one floor of a tiny building, and a day panel
// with an "equalizer" per amenity (one column per opening hour, filled by how many units are taken).
// Part of the admin app: plain <script> files share one global scope; load order is set in index.html.

const calPad = (n) => String(n).padStart(2, '0');
const calKey = (y, m, d) => `${y}-${calPad(m + 1)}-${calPad(d)}`;
const calToday = () => { const t = new Date(); return calKey(t.getFullYear(), t.getMonth(), t.getDate()); };
const calToMin = (hhmm) => { const [h, m] = String(hhmm).split(':').map(Number); return h * 60 + (m || 0); };
const calLocale = () => ({ fr: 'fr-CA', en: 'en-CA', uk: 'uk-UA', es: 'es-MX', ru: 'ru-RU', zh: 'zh-CN' }[state.lang] || 'fr-CA');

// Length of a booking in minutes (older rows only have whole hours).
function calDur(b) { return b.durationMin || (Number(b.duration) || 1) * 60; }

// A tiny isometric tower: `n` floors (max 6). Same slab drawing language as the Buildings screen.
function calTower(n, bad) {
  const floors = Math.min(n, 6);
  let out = '';
  for (let k = 0; k < floors; k++) {
    const y = 41 - k * 5;
    out += `<g class="cal-fl" style="--k:${k}">
      <polygon class="f-left" points="7,${y} 15,${y + 4.6} 15,${y + 9.6} 7,${y + 5}"/>
      <polygon class="f-right" points="15,${y + 4.6} 23,${y} 23,${y + 5} 15,${y + 9.6}"/>
      <polygon class="f-top" points="7,${y} 15,${y - 4.6} 23,${y} 15,${y + 4.6}"/></g>`;
  }
  return `<svg viewBox="0 0 30 52" class="cal-tower ${bad ? 'cal-bad' : 'tone-sage'}" aria-hidden="true">${out}</svg>`;
}

// Peak simultaneous bookings of one amenity inside [s, e) minutes of one day.
function calPeak(list, s, e) {
  let peak = 0;
  list.forEach((b) => {
    const bs = calToMin(b.timeSlot), be = bs + calDur(b);
    if (bs < e && be > s) peak = Math.max(peak, list.filter(x => { const xs = calToMin(x.timeSlot), xe = xs + calDur(x); return xs < be && xe > bs; }).length);
  });
  return peak;
}

function calMonthCells(y, m) {
  const first = new Date(y, m, 1);
  const lead = (first.getDay() + 6) % 7; // Monday first
  const days = new Date(y, m + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < lead; i++) cells.push(null);
  for (let d = 1; d <= days; d++) cells.push(d);
  while (cells.length % 7) cells.push(null);
  return cells;
}

views.calendar = () => {
  const cv = L.calendarV;
  const now = new Date();
  if (!state.calMonth) state.calMonth = { y: now.getFullYear(), m: now.getMonth() };
  if (!state.calDay) state.calDay = calToday();
  const { y, m } = state.calMonth;
  const anim = state.calAnim; state.calAnim = null;
  const play = buildingAnimOn();
  const byDate = {};
  (state.calendarBookings || []).forEach(b => { (byDate[b.date] = byDate[b.date] || []).push(b); });
  const today = calToday();
  const monthTitle = new Date(y, m, 1).toLocaleDateString(calLocale(), { month: 'long', year: 'numeric' });
  const wd = [...Array(7)].map((_, i) => new Date(2024, 0, 1 + i).toLocaleDateString(calLocale(), { weekday: 'short' }));
  const cells = calMonthCells(y, m);

  const grid = cells.map((d, i) => {
    if (!d) return `<div class="cal-cell empty"></div>`;
    const key = calKey(y, m, d), list = byDate[key] || [];
    // conflict = more bookings of one amenity at the same moment than it has units
    const bad = list.some(b => calPeak(list.filter(x => x.amenityId === b.amenityId), calToMin(b.timeSlot), calToMin(b.timeSlot) + calDur(b)) > (b.quantity || 1));
    return `<button class="cal-cell ${key === today ? 'today' : ''} ${key === state.calDay ? 'sel' : ''} ${list.length ? 'has' : ''}" data-action="cal-day" data-day="${key}" style="--d:${(i % 7) * 0.03 + Math.floor(i / 7) * 0.06}s">
      <span class="cal-num">${d}</span>
      ${list.length ? `<span class="cal-stack">${calTower(list.length, bad)}</span><span class="cal-count">${list.length}</span>` : ''}
    </button>`;
  }).join('');

  // ---- the selected day ----
  const day = state.calDay;
  const dayList = byDate[day] || [];
  const dayTitle = new Date(day + 'T12:00:00').toLocaleDateString(calLocale(), { weekday: 'long', day: 'numeric', month: 'long' });
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const amenities = (state.amenitiesList || []).filter(a => a.bookable);
  const equalizers = amenities.map(a => {
    const open = a.openTime ? calToMin(a.openTime) : 0;
    const close = !a.closeTime ? 1440 : a.closeTime === '24:00' ? 1440 : calToMin(a.closeTime);
    const qty = a.quantity || 1;
    const list = dayList.filter(b => b.amenityId === a.id);
    const h0 = Math.floor(open / 60), h1 = Math.ceil(close / 60);
    let cols = '';
    for (let h = h0; h < h1; h++) {
      const s = h * 60, e = s + 60;
      const conc = list.filter(b => { const bs = calToMin(b.timeSlot), be = bs + calDur(b); return bs < e && be > s; }).length;
      const pct = Math.min(100, Math.round((conc / qty) * 100));
      cols += `<div class="eq-col ${conc > qty ? 'over' : conc === qty ? 'full' : ''}" title="${calPad(h)}:00 — ${conc}/${qty}"><i style="--p:${pct}%; --i:${h - h0}"></i><span>${(h - h0) % 3 === 0 ? h : ''}</span></div>`;
    }
    const marker = day === today && nowMin > h0 * 60 && nowMin < h1 * 60 ? `<div class="eq-now" style="left:${(((nowMin - h0 * 60) / ((h1 - h0) * 60)) * 100).toFixed(2)}%"></div>` : '';
    return `<div class="eq-row">
      <div class="eq-head"><b>${esc(a.name)}</b><span>${[qty > 1 ? `${qty} ${cv.units}` : '', list.length ? cv.bookingsN(list.length) : ''].filter(Boolean).map(esc).join(' · ')}</span></div>
      <div class="eq-bars" style="--cols:${h1 - h0}">${cols}${marker}</div>
    </div>`;
  }).join('');

  const rows = [...dayList].sort((a, b) => a.timeSlot.localeCompare(b.timeSlot)).map(b => {
    const s = calToMin(b.timeSlot), e = s + calDur(b);
    const range = `${b.timeSlot} – ${calPad(Math.floor(e / 60) % 24)}:${calPad(e % 60)}`;
    const started = day < today || (day === today && s <= nowMin);
    const conflict = calPeak(dayList.filter(x => x.amenityId === b.amenityId), s, e) > (b.quantity || 1);
    return `<div class="cal-row ${conflict ? 'bad' : ''}">
      <div><b>${esc(range)}</b> · ${esc(b.amenityName)}<div class="cal-who">${esc(b.residentFirstName)} ${esc(b.residentLastName)} · ${L.requestsV.apt} ${esc(b.apartmentNumber)}${conflict ? ` <span class="cal-conf">${cv.conflict}</span>` : ''}</div></div>
      ${started ? `<span class="amen-note">${cv.past}</span>` : `<button class="btn btn-secondary" style="width:auto; padding:5px 10px; font-size:11px;" data-action="cancel-booking" data-booking="${b.id}">${L.bookingsV.cancelBtn}</button>`}
    </div>`;
  }).join('');

  return shell(cv.title, `
    <div class="isl-grid cal-wrap ${play ? '' : 'no-anim'}">
      <div class="isl-col">
        <div class="admin-card">
          <div class="cal-nav">
            <button class="cal-arrow" data-action="cal-nav" data-dir="-1" aria-label="${esc(cv.prev)}">‹</button>
            <div class="cal-title">${esc(monthTitle)}</div>
            <button class="cal-arrow" data-action="cal-nav" data-dir="1" aria-label="${esc(cv.next)}">›</button>
            <button class="btn btn-secondary" style="width:auto; padding:6px 12px; font-size:12px; margin-left:8px;" data-action="cal-today">${cv.todayBtn}</button>
          </div>
          <div class="cal-week">${wd.map(w => `<span>${esc(w)}</span>`).join('')}</div>
          <div class="cal-grid ${anim ? 'flip-' + anim : ''}">${grid}</div>
          <p class="cal-legend"><span class="cal-dot"></span>${cv.legend}</p>
        </div>
      </div>
      <div class="isl-col">
        <div class="admin-card">
          <h3 style="font-size:15px; font-weight:800; margin:0; text-transform:capitalize;">${esc(dayTitle)} ${day === today ? `<span class="cal-today-pill">${cv.todayBtn}</span>` : ''}</h3>
          <p style="font-size:12px; color:var(--g500); margin:3px 0 14px 0;">${dayList.length ? cv.bookingsN(dayList.length) : cv.noBookings}</p>
          ${equalizers || `<p style="font-size:12.5px; color:var(--g500);">${cv.noAmenities}</p>`}
        </div>
        ${dayList.length ? `<div class="admin-card">${rows}</div>` : ''}
      </div>
    </div>
  `);
};
</script>

<script>// render(), data loaders (load*) and open*/view* helpers

const SECTION_PARENT = { requestDetail: 'requests', residentDetail: 'residents', residentImport: 'residents', alertDetail: 'alerts', amenityForm: 'amenities', buildingForm: 'buildings', contractorForm: 'contractors', newsForm: 'news', incidentDetail: 'incidents', inspectionDetail: 'inspections', adminInviteForm: 'settings' };
const SECTION_OPEN = {
  dashboard: () => loadDashboard(), requests: () => loadRequests(), calendar: () => loadCalendar(), tasks: () => loadTasks(),
  contractors: () => loadContractors(), residents: () => loadResidents(true), groups: () => loadGroups(false), messages: () => loadMessages(),
  bookings: () => loadBookings(), guestParking: () => loadGuestParking(), moves: () => loadMoves(), buildings: () => loadBuildings(),
  amenities: () => loadAmenitiesAdmin(), inspections: () => { state.inspForm = false; state.inspError = null; return loadInspections(); },
  incidents: () => { state.incForm = false; state.incError = null; return loadIncidents(); }, news: () => loadNewsAdmin(), ads: () => loadAdsAdmin(),
  events: () => { state.evOpen = null; state.evAtt = null; state.evError = null; return loadEvents(); }, alerts: () => loadAlerts(),
  schedule: () => loadScheduleAdmin(), reports: () => loadReports(), auditLog: () => loadAuditLog(), settings: () => loadSettings(),
  intercom: () => { state.intercomSip = null; return loadIntercom(); },
};
function rememberSection() {
  const sec = SECTION_PARENT[state.view] || (SECTION_OPEN[state.view] ? state.view : null);
  const base = location.pathname + location.search;
  if (sec) { if (location.hash !== '#' + sec) void(null, '', base + '#' + sec); }

function render() {
  L = ADMIN_I18N[state.lang];
  rememberSection();
  document.documentElement.lang = state.lang; document.documentElement.dir = state.lang === 'ar' ? 'rtl' : 'ltr';
  // Motion layer: entrance animations play only when the screen really changes (not on busy/error redraws).
  const root = document.getElementById('viewRoot');
  let TOP = []; try { TOP = navKeys(); } catch (_) {}
  const entering = state.view !== state._shown;
  const wasTop = TOP.includes(state._shown), isTop = TOP.includes(state.view);
  root.dataset.dir = !entering ? '' : (isTop ? (wasTop ? 'fade' : 'back') : 'forward');
  root.dataset.view = state.view;

  state._shown = state.view;

  const sbOld = root.querySelector('.admin-sidebar');
  const sbTop = sbOld ? sbOld.scrollTop : 0, sbLeft = sbOld ? sbOld.scrollLeft : 0;
  // Redrawing the same screen (adding a row, opening a form…) must not throw the page back to the top.
  const ctOld = root.querySelector('.content'); const ctTop = ctOld ? ctOld.scrollTop : 0;

  root.innerHTML = views[state.view] ? views[state.view]() : views.login();

  if (ghostFrom && root.querySelector('.content')) sectionGhost(ctOld, ghostFrom, ctTop, root.dataset.dir);
  if (!entering && ctTop) { const ctNew = root.querySelector('.content'); if (ctNew) ctNew.scrollTop = ctTop; }

      else if (a.top < b.top) sbNew.scrollTop -= b.top - a.top + 8;
      if (a.right > b.right) sbNew.scrollLeft += a.right - b.right + 8;
      else if (a.left < b.left) sbNew.scrollLeft -= b.left - a.left + 8;

// Section change: the old page stays a moment on top and fades out while the new one comes in, so the switch
// is a cross-fade instead of a cut. The DOM is already the new screen (render stays synchronous); the ghost
// is the old .content node, detached, frozen at its old place and scroll, and never clickable.
function sectionGhostOk() {
  return !document.body.classList.contains('no-anim') && !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
}
function sectionGhost(oldContent, rect, scrollTop, dir) {
  document.querySelectorAll('.section-ghost').forEach((g) => g.remove());
  const g = oldContent;
  g.classList.add('section-ghost', 'ghost-' + (dir || 'fade'));
  g.setAttribute('aria-hidden', 'true'); g.inert = true;
  Object.assign(g.style, { top: rect.top + 'px', left: rect.left + 'px', width: rect.width + 'px', height: rect.height + 'px' });
  document.body.appendChild(g);
  g.scrollTop = scrollTop;
  const done = () => g.remove();
  g.addEventListener('animationend', done, { once: true });
  setTimeout(done, 600);
}

// Count-up for plain-number cards ("12", "45%", "3.5 h") on the Reports screen.
function countUpText(root) {
  if (state.view !== 'reports' || typeof buildingAnimOn !== 'function' || !buildingAnimOn()) return;
  root.querySelectorAll('.admin-card .n').forEach((el) => {
    const m = el.textContent.trim().match(/^(-?\d+(?:\.\d+)?)(.*)$/);
    if (!m) return;
    const to = parseFloat(m[1]), suffix = m[2], dec = (m[1].split('.')[1] || '').length, t0 = performance.now();
    if (!to) return;
    (function step(t) {
      if (!el.isConnected) return;
      const p = Math.min(1, (t - t0) / 900), e = 1 - Math.pow(1 - p, 3);
      el.textContent = (to * e).toFixed(dec) + suffix;
      if (p < 1) requestAnimationFrame(step);
    })(t0);
  });
}

// Requests, bookings and guest parking come one page (50 rows) at a time; filters and sorting are applied by the server.
// A page that became empty (rows deleted meanwhile) falls back to the last page that still has rows.
async function loadPaged(fetchPage, pageKey) {
  let data = await fetchPage(state[pageKey] || 0);
  if (!data.rows.length && data.total > 0 && state[pageKey] > 0) {
    state[pageKey] = Math.ceil(data.total / data.pageSize) - 1;
    data = await fetchPage(state[pageKey]);
  }
  return data;
}

  const h = L.notesV.hist;

  switch (e.type) {
    case 'account': return h.account;
    case 'request': return h.request(e.requestId, (L.category && L.category[e.category]) || e.category);
    case 'request_status': return h.requestStatus(e.requestId, st(e.status), e.note);
    case 'booking': return h.booking(e.amenity, e.date, e.time);
    case 'booking_cancelled': return h.bookingCancelled(e.amenity, e.date, e.time, e.by);
    case 'guest_parking': return h.guest(e.guest, e.from, e.to);

}

<script>// Actions: sign in, admin accounts, requests and replies, residents and their documents
// Part of the admin app: plain <script> files share one global scope; load order is set in index.html.
// The password typed at sign-in, kept in memory only until the "choose your password" screen has used it (never stored).
let signInPassword = null;

async function handleAdminLogin(email, password) {
  state.busy = true; state.loginError = null; state.loginNote = null; render();
  signInPassword = password;
  try {
    const r = await adminApi.login(email, password);
    if (r.mfaRequired) { state.busy = false; state.mfaToken = r.mfaToken; state.loginError = null; state.view = 'login2fa'; render(); return; }
    await finishLogin(r);
  } catch (err) {
    signInPassword = null;
    state.busy = false;
    state.loginError = err.message;
    render();
  }
}

async function handleAdminLogin2fa(code) {
  state.busy = true; state.loginError = null; render();
  try {
    await finishLogin(await adminApi.login2fa(state.mfaToken, code));
  } catch (err) {
    state.busy = false;
    state.loginError = err.message;
    if (/expired/i.test(err.message) || /Too many/i.test(err.message)) { state.mfaToken = null; state.view = 'login'; }
    render();
  }
}

async function finishLogin({ token, name, mustChangePassword }) {
  {
    state.mfaToken = null;
    adminApi.setToken(token);
    adminApi.setName(name);
    state.adminName = name;
    let me = null;
    try { me = await adminApi.getMe(); state.adminRole = me.role; state.intercomEnabled = !!me.intercomEnabled; } catch (_) {}
    state.busy = false;
    if (mustChangePassword) { showMustChangePassword(); return; }
    if (me && me.mustSetup2fa) { showMust2fa(); return; }
    signInPassword = null;
    await loadDashboard();
  }
}

// Two-step sign-in is compulsory: until it is on, only its set-up screen opens (the server refuses everything else too).
function showMust2fa() {
  state.busy = false;
  state.tfa = { enabled: false, step: 'idle' };
  state.view = 'must2fa';
  render();
}

// After a temporary password: nothing else opens (the server refuses too) until the admin picks their own password.
function showMustChangePassword() {
  state.busy = false; state.mustChangeError = null;
  state.view = 'mustChangePassword'; render();

async function handleMustChangePassword(current, newPassword, confirmPassword) {

  state.busy = true; state.mustChangeError = null; render();
  try {
    const { token } = await adminApi.changePassword(cur, newPassword);

    signInPassword = null;
    try { const me = await adminApi.getMe(); state.adminRole = me.role; state.intercomEnabled = !!me.intercomEnabled; } catch (_) {}
    state.busy = false;
    await loadDashboard();
  } catch (err) {
    state.busy = false;
    state.mustChangeError = err.code === 'wrong_password' ? L.mustChange.wrong : err.message;
    render();
  }
}

async function viewResidentDocument(residentId, docId) {
  try {
    const token = adminApi.getToken();
    const res = await fetch(`/api/admin/residents/${residentId}/documents/${docId}`, {
      headers: token ? { Authorization: `Bearer ${token}` } : {},
    });
    if (!res.ok) throw new Error('Error');
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    window.open(url, '_blank', 'noopener');
  } catch (err) {
    alert(err.message);
  }
}

async function downloadResidentDocument(residentId, docId, name) {
  try {
    const token = adminApi.getToken();
    const res = await fetch(`/api/admin/residents/${residentId}/documents/${docId}`, { headers: token ? { Authorization: `Bearer ${token}` } : {} });
    if (!res.ok) throw new Error('Error');
    const url = URL.createObjectURL(await res.blob());
    const a = document.createElement('a'); a.href = url; a.download = name || 'document';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  } catch (err) { alert(err.message); }
}

async function handleSaveNews(republish) {
  const isAd = state.newsKind === 'ads';
  const adLabel = isAd ? document.getElementById('newsAd').value : null;
  // An ad has no free-text tag: its signature is its tag.
  const tag = isAd ? L.newsForm[AD_KEYS[adLabel]].slice(0, 40) : document.getElementById('newsTag').value.trim();
  const title = document.getElementById('newsTitle').value.trim();
  const body = document.getElementById('newsBody').value.trim();
  const buildingCode = document.getElementById('newsBuilding').value;
  const file = document.getElementById('newsImage').files[0];
  const removeImage = !!(document.getElementById('newsImageRemove') || {}).checked;
  if (!tag || !title || !body) {
    state.newsFormError = L.newsForm.allFieldsRequired;
    render();
    return;
  }
  state.busy = true; state.newsFormError = null; render();
  let id = state.activeNewsId;
  try {
    if (state.newsFormMode === 'add') id = (await adminApi.createNews({ tag, title, body, buildingCode, adLabel })).id;
    else await adminApi.updateNews(id, { tag, title, body, buildingCode, adLabel });
  } catch (err) {
    state.busy = false;
    state.newsFormError = err.message;
    render();
    return;
  }
  try {
    if (removeImage && !file) await adminApi.deleteNewsImage(id);
    if (file) await adminApi.uploadNewsImage(id, file);
    adPicCache.delete(String(id)); // show the new picture, not the cached old one
    if (republish) await adminApi.republishNews(id);
  } catch (err) {
    // The notice is saved already: stay on it (as an edit) so that a second try does not publish it twice.
    state.newsFormMode = 'edit'; state.activeNewsId = id;
    state.newsList = await adminApi.getNews();
    state.busy = false;
    state.newsFormError = L.newsForm.imageFailed + ' ' + err.message;
    render();
    return;
  }
  state.busy = false;
  await (isAd ? loadAdsAdmin() : loadNewsAdmin());
}

  const units = parseInt(document.getElementById('bfUnits').value, 10) || null;
  const apartmentNumbers = document.getElementById('bfApts').value.trim();
  const look = buildingFormLook();
  look.elevator = (document.getElementById('bfElevator') || {}).value || 'none';
  look.entrance = (document.getElementById('bfEntrance') || {}).value || 'lobby';
  Object.assign(look, bfuPayload());

async function handleSavePassword() {
  const sv = L.settingsV;
  const currentPassword = document.getElementById('pwdCurrent').value;
  const newPassword = document.getElementById('pwdNew').value;
  const confirmPassword = document.getElementById('pwdConfirm').value;

  if (!currentPassword || !newPassword || !confirmPassword) {
    state.pwdError = sv.pwdAllRequired; state.pwdSaved = false; render(); return;
  }
  if (newPassword.length < 8) {
    state.pwdError = sv.pwdTooShort; state.pwdSaved = false; render(); return;
  }
  if (newPassword !== confirmPassword) {
    state.pwdError = sv.pwdMismatch; state.pwdSaved = false; render(); return;
  }

  state.busy = true; state.pwdError = null; state.pwdSaved = false; render();
  try {
    const { token } = await adminApi.changePassword(currentPassword, newPassword);
    // Same reasoning as the resident side: changing the password
    // revokes every token issued before now, including the one that
    // just made this request — the fresh one from the response has to
    // replace it.
    if (token) adminApi.setToken(token);
    state.busy = false;
    state.pwdSaved = true;
    render();
  } catch (err) {
    state.busy = false;
    state.pwdError = err.message;
    render();
  }
}

</script>
<script>// Interphones screen: what the buttons do.

function icMsg(ok, text) { state.intercomMsg = { ok, text }; render(); }

// Connect a device to a building: the model decides the connection type; the owner types what the panel
// itself shows (serial number, IP address, port, its login and password).
async function handleIntercomAdd(buildingCode) {
  const w = state.icWizard;
  const building = (state.buildingsList || []).find(b => b.code === buildingCode);
  const model = ((state.intercomData || {}).models || []).find(m => m.id === w.model);
  if (!model || !building) return;
  const v = L.intercomV;
  const port = String(w.port || '443').trim();
  if (String(w.sn || '').trim().length < 4) return wizardError(v.needSerial);
  if (!String(w.host || '').trim()) return wizardError(v.needHost);
  if (!/^\d{1,5}$/.test(port) || Number(port) < 1 || Number(port) > 65535) {
    return wizardError(v.needPort);
  }
  const name = (building.name + ' · ' + (model.name || '')).slice(0, 60);
  state.busy = true;
  w.error = null;
  render();
  try {
    const dev = await adminApi.addIntercomDevice({
      model: model.id,
      sn: w.sn.trim(),
      name,
      buildingCode,
      host: w.host.trim(),
      port: Number(port),
      panelUser: (w.user || '').trim(),
      panelPassword: w.pass || '',
    });
    state.busy = false;
    state.icWizard = null;
    await loadIntercom();
    handleIntercomCheck(dev.id);
  } catch (err) {
    state.busy = false;
    wizardError(err.message);
  }
}

function wizardError(message) {
  state.icWizard.error = message;
  render();
}

// "Does the panel answer?" The server tries the address; the result stays on the device card.
async function handleIntercomCheck(id) {
  state.icCheck = { ...(state.icCheck || {}), [id]: 'checking' };
  render();
  let outcome = 'fail';
  try {
    outcome = (await adminApi.checkIntercom(id)).ok ? 'ok' : 'fail';
  } catch (_) {}
  state.icCheck = { ...state.icCheck, [id]: outcome };
  render();
}

// Copies one value (server, port, username or password) and says so on the button for a moment.
async function handleIntercomCopy(button) {
  try {
    await navigator.clipboard.writeText(button.dataset.value);
    const label = button.textContent;
    button.textContent = L.intercomV.copied;
    setTimeout(() => { button.textContent = label; }, 1400);
  } catch (_) {}
}

async function handleIntercomSip(id) {
  // A second press on the same device closes its settings again.
  if (state.intercomSip && state.intercomSip.id === Number(id)) {
    state.intercomSip = null;
    return render();
  }
  try {
    const dev = (state.intercomData.devices || []).find((x) => String(x.id) === String(id));
    state.intercomSip = { id: Number(id), name: dev ? dev.name : '', ...(await adminApi.getIntercomSip(id)) };
    render();
  } catch (err) { icMsg(false, err.message); }
}

async function handleIntercomSipReset(id) {
  if (!confirm(L.intercomV.confirmSipReset)) return;
  try {
    const cur = state.intercomSip || {};
    state.intercomSip = { id: Number(id), name: cur.name || '', ...(await adminApi.resetIntercomSip(id)) };
    render();
  } catch (err) { icMsg(false, err.message); }
}

async function handleIntercomOpen(id) {
  if (!confirm(L.intercomV.confirmOpen)) return;
  try { await adminApi.openIntercomDoor(id); icMsg(true, L.intercomV.opened); } catch (err) { icMsg(false, err.message); }
}

async function handleIntercomSync(id) {
  try { const r = await adminApi.syncIntercom(id); await loadIntercom(); icMsg(true, r.sent + L.intercomV.synced); }
  catch (err) { icMsg(false, err.message); }
}

async function handleIntercomDelete(id) {
  if (!confirm(L.intercomV.confirmDelete)) return;
  try { await adminApi.deleteIntercomDevice(id); await loadIntercom(); } catch (err) { icMsg(false, err.message); }
}
</script>
<script>// Actions: CSV import of residents, invitations, adoption card
// Part of the admin app: plain <script> files share one global scope; load order is set in index.html.
state.imp = null; state.onboarding = null; state.pendingOpen = false; state.obMsg = null;

// Excel in French writes ANSI files, newer exports use UTF-8: try UTF-8 first, fall back to Windows-1252.
function obDecode(buf) {
  try { return new TextDecoder('utf-8', { fatal: true }).decode(buf); } catch (_) { return new TextDecoder('windows-1252').decode(buf); }
}

function obReadForm() {
  if (!state.imp) return;
  const ta = document.getElementById('impText'); if (ta) state.imp.csv = ta.value;
  const b = document.getElementById('impBuilding'); if (b) state.imp.buildingCode = b.value;
  const c = document.getElementById('impSend'); if (c) state.imp.sendInvites = c.checked;
}

async function obImportOpen() {
  if (!state.buildingsList.length) { try { state.buildingsList = await adminApi.getBuildings(); } catch (_) {} }
  state.imp = { csv: '', buildingCode: '', preview: null, result: null, error: null, sendInvites: true };
  state.view = 'residentImport'; render();
}

async function obPreview() {
  obReadForm(); const t = L.onboardV;
  state.imp.error = null; state.imp.preview = null;
  if (!state.imp.csv.trim()) { state.imp.error = t.f_empty; render(); return; }
  state.busy = true; render();
  try { state.imp.preview = await adminApi.importPreview(state.imp.csv, state.imp.buildingCode); }
  catch (err) { state.imp.error = t['f_' + err.message] || err.message; }
  state.busy = false; render();
}

async function obCommit() {
  obReadForm(); const t = L.onboardV;
  state.busy = true; state.imp.error = null; render();
  try { state.imp.result = await adminApi.importCommit(state.imp.csv, state.imp.buildingCode, state.imp.sendInvites); obPoll(); }
  catch (err) { state.imp.error = t['f_' + err.message] || err.message; }
  state.busy = false; render();
}

function obTemplate() {
  const d = state.lang === 'fr' ? ';' : ',';
  const rows = [['First name', 'Last name', 'Email', 'Apartment', 'Building', 'Phone', 'Parking', 'Rent', 'Lease end'], ['Anna', 'Tremblay', 'anna@example.com', '101', (state.buildingsList[0] || {}).code || 'A', '514-555-0101', '', '1250', '2027-06-30']];
  const csv = '﻿' + rows.map(r => r.join(d)).join('\r\n') + '\r\n';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); a.download = 'residents-template.csv';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// While invitations are being sent in the background, refresh the numbers until the queue is empty.
function obPoll() {
  setTimeout(async () => {
    if (state.view !== 'residents') return;
    try { state.onboarding = await adminApi.getOnboarding(); } catch (_) { return; }
    render();
    if (state.onboarding.queue > 0) obPoll();
  }, 1500);
}

async function obInviteNeeded() {
  const o = state.onboarding; if (!o) return; const t = L.onboardV;
  const n = o.counts.not_invited + o.counts.expired; if (!n) return;
  if (!confirm(fmt(t.confirmInvite, { n }))) return;
  try { const r = await adminApi.inviteNeeded(); state.obMsg = fmt(t.invitesQueued, { n: r.queued }); } catch (err) { state.obMsg = err.message; }
  try { state.onboarding = await adminApi.getOnboarding(); } catch (_) {}
  render(); obPoll();
}

async function obInviteOne(id) {
  const t = L.onboardV; state.busy = true; state.obMsg = null; render();
  try { const r = await adminApi.inviteResident(id); state.obMsg = r.sent ? t.resent : t.resendFail; } catch (err) { state.obMsg = err.message; }
  try { state.onboarding = await adminApi.getOnboarding(); } catch (_) {}
  state.busy = false; render();
}

document.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-action^="ob-"]'); if (!btn) return;
  const a = btn.dataset.action;
  if (a === 'ob-import-open') obImportOpen();
  else if (a === 'ob-import-preview') obPreview();
  else if (a === 'ob-import-commit') obCommit();
  else if (a === 'ob-import-template') obTemplate();
  else if (a === 'ob-invite-needed') obInviteNeeded();
  else if (a === 'ob-invite-one') obInviteOne(btn.dataset.id);
  else if (a === 'ob-news-readers') {
    const id = parseInt(btn.dataset.news, 10);
    if (state.newsReaders && state.newsReaders.id === id) { state.newsReaders = null; render(); return; }
    state.newsReaders = { id, loading: true, read: [], unread: [] }; render();
    adminApi._request(`/api/admin/news/${id}/readers`).then((d) => { state.newsReaders = { id, ...d }; render(); }).catch(() => { state.newsReaders = null; render(); });
  }
  else if (a === 'ob-toggle-pending') { state.pendingOpen = !state.pendingOpen; render(); }
});

document.addEventListener('change', (e) => {
  if (!e.target || e.target.id !== 'impFile') return;
  const f = e.target.files && e.target.files[0]; if (!f) return;
  if (f.size > 95000) { state.imp.error = L.onboardV.f_too_many; render(); return; }
  f.arrayBuffer().then((buf) => { obReadForm(); state.imp.csv = obDecode(buf); state.imp.preview = null; state.imp.error = null; render(); });
});
</script>

            <div class="bk-who"><i>${esc(initials(m.firstName + ' ' + m.lastName))}</i>${esc(m.firstName)} ${esc(m.lastName)} · ${esc(m.buildingCode)} · ${esc(m.apartmentNumber)}${m.phone ? ' · ' + esc(m.phone) : ''}</div>
            ${m.notes ? `<div class="mv-note">${esc(m.notes)}</div>` : ''}

document.addEventListener('click', async (e) => {

<script>// Events (RSVP) and polls (admin).
// How far away an event is, in the interface language: "today", "tomorrow", "in 3 days".
function evWhen(isoDate) {
  const days = Math.round((Date.parse(isoDate + 'T00:00:00') - new Date().setHours(0, 0, 0, 0)) / 86400000);
  const words = new Intl.RelativeTimeFormat(adminLocale(), { numeric: 'auto' }).format(days, 'day');
  return { words, soon: days >= 0 && days <= 1 };
}

// A group of event cards (the coming ones, or the earlier ones dimmed).
function evGroup(list, V, att, chips, past) {
  if (!list.length) return '';
  const cards = list
    .map(e => ({ ...e, when: evWhen(e.date), pct: e.audience ? Math.round((e.going / e.audience) * 100) : 0 }))
    .map(e => `
    <div class="bk-item ev-item ${past ? 'past' : ''}" style="--c:#8E6FC9">
      <span class="ev-date"><b>${esc(e.date.slice(8))}</b><small>${esc(new Date(e.date + 'T00:00:00').toLocaleDateString(adminLocale(), { month: 'short' }))}</small></span>
      <div class="bk-main">
        <div class="bk-title">${esc(e.title)} ${past ? '' : `<span class="task-chip ${e.when.soon ? 'today' : ''}">${esc(e.when.words)}</span>`}</div>
        <div class="bk-who">${e.startTime ? `<span class="task-chip">${esc(e.startTime)}${e.endTime ? ' – ' + esc(e.endTime) : ''}</span>` : ''}${e.location ? esc(e.location) + ' · ' : ''}${e.buildingCode ? esc(e.buildingName || e.buildingCode) : V.allB}</div>
      </div>
      <button class="ev-going" data-action="ev-att" data-id="${e.id}" title="${esc(V.attendees)}">
        <b>${e.going} / ${e.audience}</b><i><u style="width:${e.pct}%"></u></i><small>${V.colGoing}</small>
      </button>
      <div class="ev-actions"><button class="btn btn-secondary btn-sm" data-action="ev-edit" data-id="${e.id}">${V.edit}</button><button class="res-trash" data-action="ev-del-event" data-id="${e.id}" title="${esc(V.remove)}" aria-label="${esc(V.remove)}">${RDOC_DEL}</button></div>
    </div>
    ${att && att.id === e.id ? `<div class="admin-card" style="font-size:12.5px;">
      <div style="font-weight:700; margin-bottom:4px;">${V.yes} (${att.yes.length})</div>${att.yes.length ? chips(att.yes) : `<span style="color:var(--g500);">${V.nobody}</span>`}
      <div style="font-weight:700; margin:10px 0 4px;">${V.no} (${att.no.length})</div>${att.no.length ? chips(att.no) : '—'}</div>` : ''}`)
    .join('');
  return `<div class="bk-list">${cards}</div>`;
}

// One poll: the question, who answered, and a bar per answer; the leading answer is highlighted.
function pollView(p) {
  const V = L.eventsV;
  const top = Math.max(0, ...p.options.map(o => o.votes));
  const turnout = p.audience ? Math.round((p.total / p.audience) * 100) : 0;
  const bars = p.options
    .map(o => ({ ...o, pct: p.total ? Math.round((o.votes * 100) / p.total) : 0, lead: top > 0 && o.votes === top ? 'lead' : '' }))
    .map(o => `<div class="pl-opt ${o.lead}"><span>${esc(o.label)}</span><i><u style="width:${o.pct}%"></u></i><b>${o.votes}${p.total ? ' · ' + o.pct + '%' : ''}</b></div>`)
    .join('');
  return `<div class="admin-card pl-card ${p.closed ? 'closed' : ''}">
    <div class="pl-head">
      <div class="pl-main">
        <div class="pl-q">${esc(p.question)} ${p.closed ? `<span class="task-chip">${V.closedL}</span>` : ''}</div>
        <div class="pl-meta">${p.buildingCode ? esc(p.buildingName || p.buildingCode) : V.allB} · ${V.votes.replace('{n}', p.total).replace('{a}', p.audience)}</div>
      </div>
      <div class="pl-turnout" title="${esc(V.votes.replace('{n}', p.total).replace('{a}', p.audience))}"><b>${turnout}%</b><i><u style="width:${turnout}%"></u></i></div>
      <button class="btn btn-secondary btn-sm" data-action="ev-close-poll" data-id="${p.id}" data-c="${p.closed ? 0 : 1}">${p.closed ? V.reopen : V.close}</button>
      <button class="res-trash" data-action="ev-del-poll" data-id="${p.id}" title="${esc(V.remove)}" aria-label="${esc(V.remove)}">${RDOC_DEL}</button>
    </div>
    <div class="pl-opts">${bars}</div>
  </div>`;
}

  const V = L.eventsV;

  const att = state.evAtt;
  return shell('', `
    <h1 class="page-title" style="margin-bottom:2px;">${V.title}</h1>
    <p style="color:var(--g500); font-size:13px; margin:0 0 20px;">${V.subtitle}</p>
    <div class="ev-tiles">
      ${repTile(NAV_ICONS.events, state.eventsList.filter(e => e.date >= today).length, V.eventsH, '')}
      ${repTile(NAV_ICONS.reports, state.pollsList.filter(p => !p.closed).length, V.pollsH, '')}
      ${repTile('<path d="M5 12l4 4 10-10"/>', state.pollsList.filter(p => p.closed).length, V.closedL, '')}
    </div>
    ${state.evError ? `<div style="color:#8a1f1f; font-size:12.5px; font-weight:600; margin-bottom:10px;">${esc(state.evError)}</div>` : ''}

    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
      <h2 style="font-size:16px; font-weight:800; margin:0;">${V.eventsH}</h2>
      <button class="btn btn-primary" style="width:auto;" data-action="ev-toggle" data-k="event">${V.newEvent}</button>
    </div>
    ${state.evOpen === 'event' ? `<div class="admin-card" style="max-width:640px; margin-bottom:14px;">
      <div class="field"><label>${V.fTitle}</label><input id="evTitle" maxlength="150" value="${esc(ed ? ed.title : '')}"></div>
      <div class="grid-2"><div class="field"><label>${V.fDate}</label><input id="evDate" type="date" ${ed ? '' : `min="${today}"`} value="${ed ? esc(ed.date) : today}"></div>
        <div class="field"><label>${V.fPlace}</label><input id="evPlace" maxlength="150" value="${esc(ed ? ed.location || '' : '')}"></div></div>
      <div class="grid-2"><div class="field"><label>${V.fStart}</label><input id="evStart" type="time" value="${esc(ed ? ed.startTime || '' : '')}"></div>
        <div class="field"><label>${V.fEnd}</label><input id="evEnd" type="time" value="${esc(ed ? ed.endTime || '' : '')}"></div></div>
      <div class="field"><label>${V.fBuilding}</label>${bsel('evBuilding', ed ? ed.buildingCode : '')}</div>
      <div class="field"><label>${V.fBody}</label><textarea id="evBody" style="min-height:90px;" maxlength="2000">${esc(ed ? ed.body || '' : '')}</textarea></div>
      <div style="font-size:11.5px; color:var(--g500); margin-bottom:10px;">${ed ? V.editHint : V.hint}</div>
      <button class="btn btn-primary" style="width:auto;" data-action="ev-save-event" ${state.busy ? 'disabled' : ''}>${ed ? V.save : V.publish}</button>${ed ? ` <button class="btn btn-secondary" style="width:auto;" data-action="ev-edit-cancel">${V.cancelEdit}</button>` : ''}
    </div>` : ''}
    ${evGroup(state.eventsList.filter(e => e.date >= today), V, att, chips, false) || emptyState(NAV_ICONS.events, V.noEvents)}
    ${(() => {
      const earlier = state.eventsList.filter(e => e.date < today).reverse();
      return earlier.length ? `<h3 class="ev-sub">${V.past}</h3>${evGroup(earlier, V, att, chips, true)}` : '';
    })()}
    <div style="margin-bottom:24px;"></div>

    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
      <h2 style="font-size:16px; font-weight:800; margin:0;">${V.pollsH}</h2>
      <button class="btn btn-primary" style="width:auto;" data-action="ev-toggle" data-k="poll">${V.newPoll}</button>
    </div>
    ${state.evOpen === 'poll' ? `<div class="admin-card" style="max-width:640px; margin-bottom:14px;">
      <div class="field"><label>${V.pQuestion}</label><input id="plQuestion" maxlength="200" value="${esc(state.plQ || '')}"></div>
      ${(state.plOpts || ['', '']).map((o, i) => `<div class="field"><label>${V.pAnswer.replace('{n}', i + 1)}</label><input class="plOpt" maxlength="100" value="${esc(o)}"></div>`).join('')}

async function inspReload() { state.inspDetail = await adminApi.getInspection(state.inspDetail.id); render(); }

document.addEventListener('click', async (e) => {
  const btn = e.target.closest('[data-action^="insp-"]'); if (!btn) return;
  const V = L.inspV; const a = btn.dataset.action; const val = (id) => (document.getElementById(id) || {}).value || '';
  state.inspError = null;
  try {
    if (a === 'insp-toggle-form') { state.inspForm = !state.inspForm; render(); return; }
    if (a === 'insp-back') { e.preventDefault(); loadInspections(); return; }
    if (a === 'insp-open') { state.inspDetail = await adminApi.getInspection(btn.dataset.id); state.view = 'inspectionDetail'; render(); return; }
    if (a === 'insp-create') {
      const residentId = parseInt(val('inResident'), 10) || null;
      if (!residentId && !val('inApt').trim()) { state.inspError = V.targetErr; render(); return; }
      const r = await adminApi.createInspection({ kind: val('inKind'), date: val('inDate'), residentId, apartment: val('inApt').trim(), residentName: val('inName').trim(), rooms: val('inRooms').split('\n').map(s => s.trim()).filter(Boolean) });
      state.inspForm = false; state.inspDetail = await adminApi.getInspection(r.id); state.view = 'inspectionDetail'; render(); return;
    }
    const id = state.inspDetail && state.inspDetail.id;
    if (a === 'insp-status') { await adminApi.patchInspection(id, { status: btn.dataset.s }); await inspReload(); return; }
    if (a === 'insp-delete') { if (!confirm(V.confirmDel)) return; await adminApi.deleteInspection(id); loadInspections(); return; }
    if (a === 'insp-cond') {
      await adminApi.patchInspItem(id, btn.dataset.item, { condition: btn.dataset.v });
      const it = state.inspDetail.items.find(x => String(x.id) === btn.dataset.item);
      if (it) it.condition = btn.dataset.v;
      render();
      return;
    }
    if (a === 'insp-add-item') { const room = val('inNewRoom').trim(); if (!room) return; await adminApi.addInspItem(id, room); await inspReload(); return; }
    if (a === 'insp-del-item') { if (!confirm(V.confirmDelItem)) return; await adminApi.deleteInspItem(id, btn.dataset.item); await inspReload(); return; }
    if (a === 'insp-del-photo') { await adminApi.deleteInspPhoto(id, btn.dataset.photo); await inspReload(); return; }
    if (a === 'insp-photo') {
      const imgs = [...document.querySelectorAll('img[data-insp-thumb]')]; const i0 = imgs.indexOf(btn);
      const u = await inspBlob(id, btn.dataset.photo); window.open(u, '_blank', 'noopener'); return;
    }
    if (a === 'insp-print') { await inspPrint(); return; }

document.addEventListener('change', async (e) => {

async function inspPrint() {
  const V = L.inspV; const d = state.inspDetail; const kindName = { in: V.kIn, out: V.kOut, other: V.kOther };
  const cond = { good: V.condGood, fair: V.condFair, damaged: V.condDamaged };
  const urls = {}; for (const it of d.items) for (const p of it.photos) { try { urls[p.id] = await inspBlob(d.id, p.id); } catch (_) {} }
  const w = window.open('', '_blank'); if (!w) return; w.opener = null;
  // Built from elements and textContent, never from a string of HTML: a field can not turn into markup here.
  const doc = w.document; doc.title = `${kindName[d.kind]} ${d.date}`;
  const css = doc.createElement('style');
  css.textContent = 'body{font-family:Inter,Arial,sans-serif;max-width:780px;margin:24px auto;padding:0 16px;color:#1b1c1b}h1{font-size:22px;margin:0}h2{font-size:15px;margin:22px 0 4px;border-bottom:1px solid #ddd;padding-bottom:4px}.m{color:#666;font-size:13px}.c{font-weight:700}.d{color:#a11}.f{color:#a60}.g{color:#161}img{width:150px;height:150px;object-fit:cover;border:1px solid #ccc;margin:6px 6px 0 0}.s{margin-top:60px;display:flex;gap:40px}.s div{flex:1;border-top:1px solid #333;padding-top:4px;font-size:12px}p{white-space:pre-wrap;font-size:13px;margin:4px 0}';
  doc.head.append(css); // text is set from JavaScript strings, so no charset is needed
  const add = (parent, tag, text, cls) => { const e = doc.createElement(tag); if (text != null) e.textContent = text; if (cls) e.className = cls; parent.append(e); return e; };
  const body = doc.body;
  add(body, 'h1', `${V.title} — ${kindName[d.kind]}`);
  add(body, 'div', `${d.date} · ${d.residentName} · ${d.buildingCode} ${d.apartment}`, 'm');
  for (const it of d.items) {
    const head = add(body, 'h2', `${it.room} — `);
    add(head, 'span', cond[it.condition], `c ${it.condition === 'damaged' ? 'd' : it.condition === 'fair' ? 'f' : 'g'}`);
    if (it.note) add(body, 'p', it.note);
    for (const p of it.photos) if (urls[p.id]) { const img = add(body, 'img'); img.src = urls[p.id]; }
  }
  if (d.notes) { add(body, 'h2', V.general); add(body, 'p', d.notes); }
  const sign = add(body, 'div', null, 's'); add(sign, 'div', V.signLine); add(sign, 'div', `${V.by} ${d.createdBy || ''}`);
  w.document.close();
  setTimeout(() => { try { w.print(); } catch (_) {} }, 700);
}
</script>

async function incReload() { state.incDetail = await adminApi.getIncident(state.incDetail.id); render(); }

document.addEventListener('click', async (e) => {
  const btn = e.target.closest('[data-action^="inc-"]'); if (!btn) return;
  const V = L.incV; const a = btn.dataset.action; const val = (id) => (document.getElementById(id) || {}).value || '';
  state.incError = null; state.incMsg = null;
  try {
    if (a === 'inc-filter') { state.incFilter = btn.dataset.f; render(); return; }
    if (a === 'inc-toggle-form') { state.incForm = !state.incForm; render(); return; }
    if (a === 'inc-back') { e.preventDefault(); loadIncidents(); return; }
    if (a === 'inc-open') { state.incDetail = await adminApi.getIncident(btn.dataset.id); state.view = 'incidentDetail'; render(); return; }
    if (a === 'inc-create') {
      if (!val('icTitle').trim()) { state.incError = V.titleErr; render(); return; }
      const r = await adminApi.createIncident({ kind: val('icKind'), occurredOn: val('icDate'), residentId: parseInt(val('icResident'), 10) || null, title: val('icTitle').trim(), description: val('icDesc').trim() });
      state.incForm = false; state.incDetail = await adminApi.getIncident(r.id); state.view = 'incidentDetail'; render(); return;
    }
    const id = state.incDetail && state.incDetail.id;
    if (a === 'inc-publish') { await adminApi.patchIncident(id, { publish: true }); await incReload(); return; }
    if (a === 'inc-status') { await adminApi.patchIncident(id, { status: btn.dataset.s }); await incReload(); return; }
    if (a === 'inc-delete') { if (!confirm(V.confirmDel)) return; await adminApi.deleteIncident(id); loadIncidents(); return; }
    if (a === 'inc-del-photo') { await adminApi.deleteIncPhoto(id, btn.dataset.photo); await incReload(); return; }
    if (a === 'inc-photo') { window.open(await incBlob(id, btn.dataset.photo), '_blank', 'noopener'); return; }
    if (a === 'inc-reply') { const body = val('incReply').trim(); if (!body) return; await adminApi.commentIncident(id, body); await incReload(); return; }
  } catch (err) { state.incError = err.message; try { if (state.incDetail) state.incDetail = await adminApi.getIncident(state.incDetail.id); } catch (_) {} render(); }
});

document.addEventListener('change', async (e) => {
  const t = e.target; if (!t || !state.incDetail) return;
  const d = state.incDetail;
  if (t.dataset && t.dataset.incUpload !== undefined) {
    state.incError = null;
    try { for (const f of t.files) await adminApi.uploadIncPhoto(d.id, f); } catch (err) { state.incError = err.message; }

    catch (err) { state.incError = err.message; render(); }
  }
});

<script>// Request attachments in The Office: thumbnails + a full-screen viewer (photo / video) with prev/next/download.
// Files sit behind the admin token, so each one is fetched with it and shown from a blob URL (cached per file).
const adminBlobCache = new Map();

function adminBlob(req, att) {
  const k = req + '/' + att;
  if (!adminBlobCache.has(k)) {
    const token = adminApi.getToken();
    adminBlobCache.set(k, fetch(`/api/admin/requests/${req}/attachments/${att}`, { headers: token ? { Authorization: `Bearer ${token}` } : {} })
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.blob(); })
      .then(b => URL.createObjectURL(b)));
  }
  return adminBlobCache.get(k);
}

// Thumbnails are drawn by the view as empty <img data-admin-thumb>; fill them in as they appear.
function fillAdminThumbs() {
  document.querySelectorAll('img[data-admin-thumb]:not([src])').forEach(img => {
    img.src = 'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
    adminBlob(img.dataset.req, img.dataset.att).then(u => { img.src = u; }).catch(() => {});
  });
}
new MutationObserver(fillAdminThumbs).observe(document.documentElement, { childList: true, subtree: true });

function openAdminMedia(btn) {
  const items = [...btn.closest('[data-att-grid]').querySelectorAll('button[data-att]')].map(b => ({ req: b.dataset.req, att: b.dataset.att, mime: b.dataset.mime, name: b.dataset.name }));
  let i = items.findIndex(x => x.att === btn.dataset.att);
  const esc2 = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const lb = document.createElement('div');
  lb.className = 'media-lb';
  lb.innerHTML = `<div class="media-lb-bar"><span class="nm"></span><a class="media-lb-btn" data-dl>${esc2(L.requestDetail.mediaDownload)}</a><button class="media-lb-btn" data-x>✕ ${esc2(L.requestDetail.mediaClose)}</button></div>
    <div class="media-lb-stage"><button class="media-lb-nav prev" aria-label="${esc2(L.requestDetail.mediaPrev)}">‹</button><div data-slot></div><button class="media-lb-nav next" aria-label="${esc2(L.requestDetail.mediaNext)}">›</button></div>`;
  const slot = lb.querySelector('[data-slot]');
  slot.style.cssText = 'max-width:100%;max-height:100%;display:flex;align-items:center;justify-content:center;';
  const close = () => { lb.remove(); document.removeEventListener('keydown', onKey, true); };
  const show = async (n) => {
    i = (n + items.length) % items.length; const it = items[i];
    lb.querySelector('.nm').textContent = (items.length > 1 ? `${i + 1}/${items.length} · ` : '') + it.name;
    slot.innerHTML = '';
    lb.querySelectorAll('.media-lb-nav').forEach(b => { b.style.display = items.length > 1 ? '' : 'none'; });
    try {
      const u = await adminBlob(it.req, it.att); if (items[i] !== it) return;
      const el = document.createElement(it.mime.startsWith('video/') ? 'video' : 'img');
      el.src = u; if (el.tagName === 'VIDEO') { el.controls = true; el.autoplay = true; el.style.maxHeight = '100%'; }
      slot.appendChild(el);
      const dl = lb.querySelector('[data-dl]'); dl.href = u; dl.download = it.name || 'file';
    } catch (e) { slot.textContent = e.message; slot.style.color = '#fff'; }
  };
  const onKey = (e) => {
    if (e.key === 'Escape') { e.stopPropagation(); close(); }
    else if (e.key === 'ArrowLeft') show(i - 1);
    else if (e.key === 'ArrowRight') show(i + 1);
  };
  lb.addEventListener('click', (e) => { if (e.target === lb || e.target.closest('[data-x]')) close(); else if (e.target.closest('.prev')) show(i - 1); else if (e.target.closest('.next')) show(i + 1); });
  document.addEventListener('keydown', onKey, true);
  document.body.appendChild(lb);
  show(i);
}

// The picture of an ad (or any notice) in The Office: behind the admin token, so it is fetched with it.
const adPicCache = new Map();
function adPic(id) {
  if (!adPicCache.has(id)) {
    const token = adminApi.getToken();
    adPicCache.set(id, fetch(`/api/admin/news/${id}/image`, { headers: token ? { Authorization: `Bearer ${token}` } : {} })
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.blob(); })
      .then(b => URL.createObjectURL(b)));
  }
  return adPicCache.get(id);
}
function fillAdPics() {
  document.querySelectorAll('img[data-ad-pic]:not([src])').forEach(img => {
    img.src = 'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
    adPic(img.dataset.adPic).then(u => { img.src = u; }).catch(() => {});
  });
}
new MutationObserver(fillAdPics).observe(document.documentElement, { childList: true, subtree: true });
</script>

        <button class="btn btn-secondary" style="width:auto; padding:6px 12px; font-size:11.5px;" data-action="su-reject" data-id="${s.id}" ${state.busy ? 'disabled' : ''}>${V.reject}</button></div>
