  const btn = e.target.closest('[data-action^="sch-"]'); if (!btn) return;
  const V = L.schedV; const a = btn.dataset.action; const id = btn.dataset.id; state.schMsg = null;
  try {
    if (a === 'sch-toggle-add') { state.schAdd = state.schAdd || { type: 'snow', title: '', buildingCode: '', error: null }; state.schAdd.open = !state.schAdd.open; render(); if (state.schAdd.open) { const c = document.getElementById('schAddCard'); if (c) c.scrollIntoView({ block: 'center', behavior: 'smooth' }); } return; }
    if (a === 'sch-add') {
      const x = state.schAdd; x.error = null;
      if (x.type === 'custom' && !x.title.trim()) { x.error = V.needTitle; render(); return; }
      await adminApi._request('/api/admin/schedule/sections', { method: 'POST', body: JSON.stringify({ type: x.type, title: x.title, buildingCode: x.buildingCode }) });
      state.schAdd = { type: 'snow', title: '', buildingCode: '', open: false, error: null };
    }
    if (a === 'sch-del') { if (!confirm(V.confirmDel)) return; await adminApi._request('/api/admin/schedule/sections/' + id, { method: 'DELETE' }); }
    if (a === 'sch-entry-del') await adminApi._request('/api/admin/schedule/entries/' + id, { method: 'DELETE' });
    if (a === 'sch-day') {
      const f = (state.schForm = state.schForm || {})[id] || (state.schForm[id] = {});
      const day = Number(btn.dataset.day);
      const days = f.days || [];
      f.days = days.includes(day) ? days.filter(d => d !== day) : [...days, day];
      f.error = null;
      render();
      return;
    }
    if (a === 'sch-entry-add') {
      const f = (state.schForm = state.schForm || {})[id] || (state.schForm[id] = {});
      f.error = null;
      const days = f.days || [];
      const section = (state.schedList || []).find(x => String(x.id) === String(id));
      // A weekly section needs days (or one date); snow only takes dates.
      if (!days.length && !f.date && section && section.type !== 'snow') {
        f.error = V.pickDays;
        render();
        return;
      }
      const body = { time: f.time, endTime: f.endTime, note: f.note };
      const url = '/api/admin/schedule/sections/' + id + '/entries';
      try {
        if (days.length && !f.date) {
          for (const weekday of days) {
            await adminApi._request(url, { method: 'POST', body: JSON.stringify({ ...body, weekday }) });
          }
        } else {
          await adminApi._request(url, { method: 'POST', body: JSON.stringify({ ...body, date: f.date }) });
        }
        state.schForm[id] = {};
      } catch (err) {
        f.error = err.message;
        render();
        return;
      }
    }
    if (a === 'sch-remind') {
      if (!confirm(V.remConfirm)) return;
      try { const r = await adminApi._request('/api/admin/schedule/sections/' + id + '/remind', { method: 'POST' }); state.schMsg = { ok: true, text: V.remSent.replace('{n}', r.sent) }; }
      catch (err) { state.schMsg = { ok: false, text: err.message }; render(); return; }
      render(); return;
    }
  } catch (err) { state.schMsg = { ok: false, text: err.message }; }
  try { state.schedList = await adminApi._request('/api/admin/schedule'); } catch (_) {}
  render();
});
</script>
<script>// Law 25 in The Office: privacy requests card, export of a resident's data, "departed" status. Own handlers (prefix "pr-").
function privacyCard() {
  const V = L.privacyV; const list = state.privacyRequests || [];
  if (!list.length) return '';
  const today = new Date().toISOString().slice(0, 10);
  return `<div class="admin-card" style="margin-bottom:16px;">
    <h3 style="font-size:14px; font-weight:800; margin:0 0 4px 0;">${V.reqTitle} <span class="task-badge today">${list.length}</span></h3>
    <p style="font-size:12px; color:var(--g500); margin:0 0 10px 0;">${V.reqNote}</p>
    ${state.privacyError ? `<div style="color:#8a1f1f; font-size:12.5px; font-weight:600; margin-bottom:8px;">${esc(state.privacyError)}</div>` : ''}
    ${list.map(q => `<div style="display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; padding:10px 0; border-top:1px solid var(--g150);">
      <div style="min-width:0;"><div style="font-weight:700; font-size:13px;">${esc(q.name || '—')}</div>
        <div style="font-size:12px; color:var(--g500);">${esc(q.email || '')}${q.apartment ? ' · ' + esc(q.apartment) : ''} · <span style="${q.dueDate < today ? 'color:#8a1f1f; font-weight:700;' : ''}">${V.due.replace('{date}', esc(q.dueDate))}</span></div></div>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        ${q.residentId ? `<button class="btn btn-secondary" style="width:auto; padding:6px 12px; font-size:11.5px;" data-action="pr-export" data-id="${q.residentId}">${V.export_}</button>` : ''}
        <button class="btn btn-primary" style="width:auto; padding:6px 12px; font-size:11.5px;" data-action="pr-delete" data-id="${q.id}">${V.delData}</button>
        <button class="btn btn-secondary" style="width:auto; padding:6px 12px; font-size:11.5px;" data-action="pr-keep" data-id="${q.id}">${V.keepData}</button></div>
    </div>`).join('')}
  </div>`;
}
function residentPrivacyCard(r) {
  const V = L.privacyV; const days = r.retentionDays || 730;
  return `<div class="admin-card" style="max-width:560px; margin-bottom:16px;">
    <div style="font-size:12px; color:var(--g500); margin-bottom:10px; line-height:1.5;">${(r.departedAt ? V.departedNote : V.activeNote).replace('{days}', days)}${r.departedAt ? ` (${esc(r.departedAt)})` : ''}</div>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <button class="btn btn-secondary" style="width:auto; padding:6px 12px; font-size:11.5px;" data-action="pr-export" data-id="${r.id}">${V.export_}</button>
      <button class="btn btn-secondary" style="width:auto; padding:6px 12px; font-size:11.5px;" data-action="pr-departed" data-id="${r.id}" data-v="${r.departedAt ? 0 : 1}">${r.departedAt ? V.reactivate : V.markDeparted}</button>
    </div></div>`;
}
async function prDownloadExport(id) {
  const res = await fetch(`/api/admin/residents/${id}/export`, { headers: { Authorization: 'Bearer ' + adminApi.getToken() } });
  if (!res.ok) throw new Error('Export failed');
  const url = URL.createObjectURL(await res.blob()); const a = document.createElement('a'); a.href = url; a.download = `resident-${id}-data.json`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
}
document.addEventListener('click', async (e) => {
  const btn = e.target.closest('[data-action^="pr-"]'); if (!btn) return;
  const V = L.privacyV; const a = btn.dataset.action; state.privacyError = null;
  try {
    if (a === 'pr-export') { await prDownloadExport(btn.dataset.id); return; }
    if (a === 'pr-delete') { if (!confirm(V.confirmDelete)) return; await adminApi.completePrivacyRequest(btn.dataset.id, 'deleted'); }
    if (a === 'pr-keep') { if (!confirm(V.confirmKeep)) return; await adminApi.completePrivacyRequest(btn.dataset.id, 'kept'); }
    if (a === 'pr-departed') {
      const dep = btn.dataset.v === '1'; if (dep && !confirm(V.confirmDeparted)) return;
      await adminApi.setDeparted(btn.dataset.id, dep); state.residentDetail = await adminApi.getResident(btn.dataset.id); render(); return;
    }
  } catch (err) { state.privacyError = err.message; }
  try { state.privacyRequests = await adminApi.getPrivacyRequests(); state.residents = await adminApi.getResidents(); if (window.refreshSignupCount) window.refreshSignupCount(); } catch (_) {}
  render();
});

    state.forgotPasswordError = null;
    state.pwdError = null;
    render();
  }
});

// Amenity form: show/hide quantity, grey out the hours when "open 24 hours" is ticked.
document.addEventListener('change', (e) => {
  if (e.target.id === 'amenBookable') {
    document.getElementById('amenQtyField').style.display = e.target.checked ? '' : 'none';
    document.getElementById('amenBookableText').textContent = e.target.checked ? L.amenityForm.bookingYes : L.amenityForm.bookingNo;
  }
  if (e.target.id === 'amenAllDay') {
    ['amenOpen', 'amenClose'].forEach((id) => { document.getElementById(id).disabled = e.target.checked; });
    document.getElementById('amenTimes').style.opacity = e.target.checked ? '.45' : '';
  }
});
</script>
<script>// Live updates in The Office (WebSocket /ws): a new resident message shows up in the open Messages screen
// without refreshing. The socket only says "a thread changed"; the data is fetched through the normal API.
(function () {
  let ws = null, retry = 1000, timer = null;

  async function refreshMessages(residentId) {
    if (state.view !== 'messages') return;
    try {
      state.threads = await adminApi.getMessageThreads();
      if (state.activeThreadResidentId && (!residentId || state.activeThreadResidentId === residentId)) {
        state.messages = await adminApi.getMessageThread(state.activeThreadResidentId);
      }
      const inp = document.getElementById('replyInput');
      const val = inp ? inp.value : '', focus = document.activeElement === inp;
      render();
      const n = document.getElementById('replyInput');
      if (n) {
        n.value = val; if (focus) { n.focus(); n.setSelectionRange(val.length, val.length); }
        const pane = n.parentElement && n.parentElement.previousElementSibling;
        if (pane) pane.scrollTop = pane.scrollHeight;
      }
    } catch (e) { /* offline or signed out */ }
  }

  // Pending sign-up requests: red badge on "Residents". Refreshed on the live event, every minute, and after a decision.
  async function refreshSignupCount() {
    if (!adminApi.getToken() || state.view === 'login') return;
    try {
      const n = (await adminApi.getSignupCount()).count;
      if (n !== state.signupCount) {
        state.signupCount = n;
        if (state.view === 'residents') { try { state.signups = await adminApi.getSignups(); } catch (_) {} }
        const a = document.activeElement;
        if (!(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))) render(); // never redraw under someone who is typing
      }
    } catch (_) { /* offline or signed out */ }
  }
  window.refreshSignupCount = refreshSignupCount;
  setInterval(refreshSignupCount, 60000);

  function connect() {
    const token = adminApi.getToken();
    if (!token || ws) return;
    try {
      const s = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws?as=admin&token=${encodeURIComponent(token)}`);
      ws = s;
      s.onopen = () => { retry = 1000; refreshMessages(); refreshSignupCount(); };
      s.onmessage = (m) => { let e; try { e = JSON.parse(m.data); } catch (_) { return; } if (e.type === 'message') refreshMessages(e.residentId); if (e.type === 'signup') refreshSignupCount(); };
      s.onclose = () => { if (ws === s) ws = null; clearTimeout(timer); timer = setTimeout(connect, retry); retry = Math.min(retry * 2, 15000); };
      s.onerror = () => { try { s.close(); } catch (_) {} };
    } catch (e) { ws = null; }
  }

  // Sign-in happens after the page loads, so keep checking; open the connection once there is a session.
  setInterval(() => { if (adminApi.getToken() && state.view !== 'login') connect(); else if (ws) { const s = ws; ws = null; try { s.close(); } catch (_) {} } }, 2000);
})();
</script>
<script>// The Office signs you out after a stretch without activity (the limit comes from the server, 30 minutes
// by default). "Activity" is a mouse move, click, key, scroll or touch. While you are active we tell the
// server every half minute; two minutes before the end a banner counts down, and "Stay signed in" keeps you in.
(function () {
  const PING_EVERY_MS = 30 * 1000;
  let limitSeconds = 0;
  let lastActive = Date.now();
  let lastPing = 0;
  let banner = null;

  const markActive = () => {
    lastActive = Date.now();
  };
  ['mousemove', 'mousedown', 'keydown', 'scroll', 'touchstart'].forEach(name =>
    window.addEventListener(name, markActive, { passive: true, capture: true })
  );

  const warnSeconds = () => Math.min(120, Math.max(5, Math.floor(limitSeconds / 4)));
  const clock = seconds => `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, '0')}`;

  function hideBanner() {
    if (banner) banner.remove();
    banner = null;
  }

  function showBanner(secondsLeft) {
    if (!banner) {
      banner = document.createElement('div');
      banner.setAttribute('role', 'alert');
      banner.style.cssText =
        'position:fixed; top:0; left:0; right:0; z-index:9999; display:flex; gap:14px; ' +
        'align-items:center; justify-content:center; padding:10px 16px; background:#8a1f1f; ' +
        'color:#fff; font-size:13px; font-weight:700;';
      banner.innerHTML = '<span data-idle-text></span><button type="button" data-idle-stay></button>';
      const button = banner.querySelector('[data-idle-stay]');
      button.style.cssText =
        'background:#fff; color:#8a1f1f; border:0; border-radius:8px; padding:6px 12px; font-weight:800; cursor:pointer;';
      button.addEventListener('click', () => {
        markActive();
        ping();
      });
      document.body.appendChild(banner);
    }
    banner.querySelector('[data-idle-text]').textContent = L.idleV.warn.replace('{time}', clock(secondsLeft));
    banner.querySelector('[data-idle-stay]').textContent = L.idleV.stay;
  }

  function endSession() {
    hideBanner();
    handleLogout();
    state.loginError = L.idleV.ended;
    render();
  }

  async function ping() {
    lastPing = Date.now();
    try {
      const answer = await adminApi._request('/api/admin/auth/activity', { method: 'POST', body: '{}' });
      limitSeconds = answer.idleSeconds || 0;
    } catch (err) {
      if (err.status === 401) endSession();
    }
  }

  async function tick() {
    if (!adminApi.getToken()) {
      hideBanner();
      return;
    }
    if (!limitSeconds) {
      if (!lastPing || Date.now() - lastPing > 60 * 1000) await ping();
      if (!limitSeconds) return; // the server has no limit: nothing to watch
    }
    const idleSeconds = Math.floor((Date.now() - lastActive) / 1000);
    const left = limitSeconds - idleSeconds;
    if (left <= 0) return endSession();
    if (left <= warnSeconds()) showBanner(left);
    else {
      hideBanner();
      if (lastActive > lastPing && Date.now() - lastPing > PING_EVERY_MS) ping();
    }
  }

  setInterval(tick, 1000);
})();
</script>
<script>// init() – start of the app
// Part of the admin app: plain <script> files share one global scope; load order is set in index.html.
(async function init() {
  // An admin arriving via their invitation/activation email link —
  // ?activate=TOKEN&email=... — takes priority over an existing session.
  const params = new URLSearchParams(window.location.search);
  const activateToken = params.get('activate');
  const activateEmail = params.get('email');
  if (activateToken && activateEmail) {
    state.pendingActivationToken = activateToken;
    state.pendingActivationEmail = activateEmail;
    state.view = 'createPassword';
    window.void({}, '', window.location.pathname);
    render();
    return;
  }

  if (adminApi.getToken()) {
    state.adminName = adminApi.getName() || null;
    try {
      const me = await adminApi.getMe(); state.adminRole = me.role; state.intercomEnabled = !!me.intercomEnabled;
      if (me.mustChangePassword) showMustChangePassword();
      else if (me.mustSetup2fa) showMust2fa();
      else {
        const want = location.hash.slice(1);  // the section the person was in before the refresh
        try { await (Object.hasOwn(SECTION_OPEN, want) ? SECTION_OPEN[want] : SECTION_OPEN.dashboard)(); } catch (_) { await loadDashboard(); }
      }
    }
    catch (err) { adminApi.clearToken(); adminApi.clearName(); render(); }
  } else {
    render();
  }
})();
</script>
