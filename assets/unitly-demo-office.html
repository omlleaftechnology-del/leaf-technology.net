    : Math.max(2, Math.min(8, Math.ceil((Number(b.units) || 24) / 8)));
  const roof = BUILDING_ROOFS.includes(b.roof) ? b.roof : BUILDING_ROOFS[(id * 7) % 3];
  const tone = BUILDING_TONES.includes(b.tone) ? b.tone : BUILDING_TONES[(id * 5) % 4];
  return { w: 4 + (id % 2), d: 3 + ((id >> 1) % 2), floors, roof, tone, seed: 1000 + id * 77 };
}

// One card. mode: 'enter' (staggered drop-up on load), 'fresh' (just created) or '' (static).
function buildingCardHtml(b, idx, mode) {
  const spec = buildingSpec(b);
  const base = mode === 'fresh' ? 0.3 : idx * 0.12 + 0.35;
  const bv = L.buildingsV;
  return `
    <div class="bld-slot">
      <div class="bld-card ${mode}" style="--idx:${idx}" data-go="buildingForm" data-building="${b.id}" tabindex="0">
        ${mode === 'fresh' ? `<span class="bld-badge">${esc(bv.newBadge)}</span>` : ''}
        <button class="bld-del" data-action="delete-building" data-building="${b.id}" title="${esc(L.common.delete)}" aria-label="${esc(L.common.delete)}">×</button>
        <div class="bld-scene">${buildingScene(spec, base)}</div>
        <div class="bld-meta">
          <div class="bld-name">${esc(b.name)} <span class="bld-code">(${esc(b.code)})</span></div>
          <div class="bld-addr">${esc(b.address || '—')}</div>
          <div class="bld-chips">
            <span class="bld-chip"><b>${esc(b.units || '—')}</b> ${esc(bv.unitsChip)}</span>
            <span class="bld-chip"><b>${b.residentCount}</b> ${esc(bv.residentsChip(b.residentCount))}</span>
            <span class="bld-chip"><b>${spec.floors + (spec.roof === 'terrace' ? 1 : 0)}</b> ${esc(bv.floorsChip)}</span>
          </div>
        </div>
      </div>
    </div>`;
}

// Count-up for the three numbers on top of the Buildings screen.
function buildingsCountUp() {
  if (!buildingAnimOn()) return;
  document.querySelectorAll('.bld-stat b[data-to]').forEach((el) => {
    const to = Number(el.dataset.to) || 0, t0 = performance.now();
    (function step(t) {
      if (!el.isConnected) return;
      const p = Math.min(1, (t - t0) / 700), e = 1 - Math.pow(1 - p, 3);
      el.textContent = Math.round(to * e);
      if (p < 1) requestAnimationFrame(step);
    })(t0);
  });
}

// Hover tilt (mouse only). Delegated, because the whole screen is redrawn by render().
document.addEventListener('pointermove', (e) => {
  if (e.pointerType === 'touch' || !buildingAnimOn()) return;
  const card = e.target.closest && e.target.closest('.bld-card, .dist-bld');
  if (!card || card.classList.contains('removing')) return;
  const q = card.getBoundingClientRect();
  card.style.setProperty('--ry', (((e.clientX - q.left) / q.width - 0.5) * 12).toFixed(2) + 'deg');
  card.style.setProperty('--rx', (-((e.clientY - q.top) / q.height - 0.5) * 10).toFixed(2) + 'deg');
});
document.addEventListener('pointerout', (e) => {
  const card = e.target.closest && e.target.closest('.bld-card, .dist-bld');
  if (card && !card.contains(e.relatedTarget)) { card.style.setProperty('--rx', '0deg'); card.style.setProperty('--ry', '0deg'); }
});

// Building form: floors / roof / colour pickers with a live preview.
function buildingFormLook() {
  const pick = (id) => { const on = document.querySelector('#' + id + ' .on'); return on ? on.dataset.v : null; };
  const f = parseInt(document.getElementById('bfFloors').value, 10);
  return { floors: Number.isInteger(f) ? Math.max(2, Math.min(8, f)) : null, roof: pick('bfRoof'), tone: pick('bfTone') };
}
function buildingFormPreview() {
  const box = document.getElementById('bfPreview');
  if (!box) return;
  const look = buildingFormLook();
  const id = state.buildingFormMode === 'add' ? 1 : state.activeBuildingId;
  const spec = buildingSpec({ id, floors: look.floors, roof: look.roof, tone: look.tone, units: parseInt(document.getElementById('bfUnits').value, 10) || null });
  box.innerHTML = buildingScene(spec, 0.05);
  const lbl = document.getElementById('bfFloorsV');
  if (lbl) lbl.textContent = spec.floors;
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-seg] button');
  if (!b) return;
  b.parentElement.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b));
  buildingFormPreview();
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'bfFloors' || e.target.id === 'bfUnits') buildingFormPreview();
});
document.addEventListener('change', (e) => {
  if (!e.target.matches || !e.target.matches('[data-action="toggle-building-anim"]')) return;
  try { localStorage.setItem('buildingsAnim', e.target.checked ? '1' : '0'); } catch (_) {}
  state.buildingsAnim = e.target.checked;
  render();
});


// ---- Dashboard "district": every building in one scene, day / night, open-request tags ----
// Night = the hours 19:00–06:59 on the viewer's clock, unless they flipped the sun/moon switch.
function districtIsNight() {
  if (typeof state.distNight === 'boolean') return state.distNight;
  const h = new Date().getHours();
  return h >= 19 || h < 7;
}

function districtHtml(buildings, enter) {
  const dv = L.districtV;
  const night = districtIsNight();
  if (!buildings || !buildings.length) {
    return `<div class="admin-card" style="margin-bottom:22px;"><p style="margin:0; color:var(--g500); font-size:13px;">${dv.empty} <a href="#" data-go="buildings" style="color:var(--brand-dark); font-weight:700;">${L.nav.buildings} →</a></p></div>`;
  }
  const items = buildings.map((b, i) => {
    // Windows: the scene always draws the "night" set of lit windows; CSS dims most of them in daytime.
    const spec = { ...buildingSpec(b), lit: 0.9 };
    const open = b.openRequests || 0;
    const tag = open
      ? `<span class="dist-open ${b.urgentRequests ? 'urgent' : ''}"><i></i>${dv.open(open)}</span>`
      : `<span class="dist-open calm">${dv.allClear}</span>`;
    return `<div class="dist-bld ${enter ? 'enter' : ''}" style="--idx:${i}" data-go="requests" tabindex="0" title="${esc(b.name)}">
      <div class="dist-tag"><b>${esc(b.name)}</b>${tag}<small>${b.residentCount} ${esc(L.buildingsV.residentsChip(b.residentCount))}</small></div>
      <div class="dist-svg">${buildingScene(spec, i * 0.28 + 0.2)}</div>
    </div>`;
  }).join('');
  return `
  <div class="bld dist ${night ? 'night' : ''} ${buildingAnimOn() ? '' : 'no-anim'}" id="district">
    <div class="dist-sky dist-sky-day"></div>
    <div class="dist-sky dist-sky-night"></div>
    <div class="dist-cloud c1"></div><div class="dist-cloud c2"></div><div class="dist-cloud c3"></div>
    <div class="dist-stars"></div>
    <button class="dist-orb" data-action="toggle-daynight" title="${esc(dv.toggle)}" aria-label="${esc(dv.toggle)}"><span class="sun"></span><span class="moon"></span></button>
    <div class="dist-row">${items}</div>
  </div>`;
}

// Flips day / night without redrawing (so buildings do not rebuild themselves) and remembers it for this visit.
function toggleDayNight() {
  const el = document.getElementById('district');
  if (!el) return;
  state.distNight = !el.classList.contains('night');
  el.classList.toggle('night', state.distNight);
}

// Count-up for the big numbers on the dashboard.
function dashCountUp() {
  if (!buildingAnimOn()) return;
  document.querySelectorAll('[data-count-to]').forEach((el) => {
    const to = Number(el.dataset.countTo) || 0, t0 = performance.now();
    if (!to) return;
    (function step(t) {
      if (!el.isConnected) return;
      const p = Math.min(1, (t - t0) / 800), e = 1 - Math.pow(1 - p, 3);
      el.textContent = String(Math.round(to * e));
      if (p < 1) requestAnimationFrame(step);
    })(t0);
  });
}
</script>
<script>// Building form: apartments (area, size, parking, equipment) and numbered parking spots.
// Part of the admin app: plain <script> files share one global scope; load order is set in index.html.
// state.bfu = { areaUnit, parkingTotal, rows: [{ number, area, rooms, parking, equipment, spots }], loaded }

function bfuBlank() { return { areaUnit: 'sqft', parkingTotal: '', rows: [], loaded: true }; }

async function bfuLoad(buildingId) {
  state.bfu = { areaUnit: 'sqft', parkingTotal: '', rows: [], loaded: false };
  try {
    const d = await adminApi.getBuildingUnits(buildingId);
    state.bfu = { areaUnit: d.areaUnit || 'sqft', parkingTotal: d.parkingTotal == null ? '' : d.parkingTotal, loaded: true,
      rows: (d.units || []).map(u => ({ number: u.number, area: u.area == null ? '' : u.area, rooms: u.rooms || '', parking: u.parking || 0, equipment: u.equipment || '', spots: u.spots || [], resident: u.resident })) };
  } catch (_) { state.bfu.loaded = true; }
}

// Apartment numbers typed in the form ("101-120, 201-220"), or 1..N from the units field.
function bfuNumbers() {
  const txt = (document.getElementById('bfApts') || {}).value || '';
  const out = [];
  for (const part of txt.split(/[,;\n]+/).map(x => x.trim()).filter(Boolean)) {
    const m = /^(\d{1,5})\s*-\s*(\d{1,5})$/.exec(part);
    if (m) { const a = +m[1], b = +m[2]; if (b >= a && b - a <= 999) for (let i = a; i <= b; i++) out.push(String(i)); }
    else out.push(part);
  }
  if (!out.length) { const n = parseInt((document.getElementById('bfUnits') || {}).value, 10); if (n > 0 && n <= 2000) for (let i = 1; i <= n; i++) out.push(String(i)); }
  return [...new Set(out)];
}

function bfuRowsHtml() {
  const rows = state.bfu.rows;
  const bf = L.buildingForm;
  if (!rows.length) return `<tr><td colspan="6" style="color:var(--g500);">${bf.rowsEmpty}</td></tr>`;
  return rows.map((r, i) => `<tr>
    <td style="font-weight:700;">${esc(r.number)}${r.resident ? `<div style="font-weight:400; font-size:11px; color:var(--g500);">${esc(r.resident)}</div>` : ''}</td>
    <td><input data-bfu="${i}:area" type="number" min="0" step="any" value="${esc(r.area)}" style="width:92px;"></td>
    <td><input data-bfu="${i}:rooms" value="${esc(r.rooms)}" placeholder="${bf.roomsPh}" style="width:70px;"></td>
    <td><select data-bfu="${i}:parking" style="width:64px;">${[0, 1, 2, 3, 4, 5].map(n => `<option ${+r.parking === n ? 'selected' : ''}>${n}</option>`).join('')}</select></td>
    <td><input data-bfu="${i}:equipment" value="${esc(r.equipment)}" placeholder="${bf.equipPh}" style="width:100%; min-width:140px;"></td>
    <td style="white-space:nowrap; color:var(--g600);">${r.spots && r.spots.length ? esc(r.spots.join(', ')) : (+r.parking ? bf.spotsAuto : '—')}</td>
  </tr>`).join('');
}

function bfuSummary() {
  const need = state.bfu.rows.reduce((s, r) => s + (+r.parking || 0), 0);
  const total = parseInt((document.getElementById('bfParkTotal') || {}).value, 10) || 0;
  return { text: L.buildingForm.assigned.replace('{a}', need).replace('{n}', total), over: need > total };
}

function bfuRefresh() {
  const body = document.getElementById('bfuBody'); if (body) body.innerHTML = bfuRowsHtml();
  const sum = document.getElementById('bfuSum');
  if (sum) { const s = bfuSummary(); sum.textContent = s.text; sum.style.color = s.over ? '#8a1f1f' : 'var(--g600)'; }
}

function bfuCardHtml() {
  const bf = L.buildingForm; const u = state.bfu || bfuBlank();
  const s = { text: bf.assigned.replace('{a}', u.rows.reduce((x, r) => x + (+r.parking || 0), 0)).replace('{n}', u.parkingTotal || 0) };
  return `<div class="admin-card" style="margin-top:20px;">
    <h2 style="font-size:17px; margin:0 0 4px;">${bf.unitsTitle}</h2>
    <p style="font-size:12.5px; color:var(--g500); margin:0 0 14px;">${bf.unitsHint}</p>
    <div style="display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end;">
      <div class="field" style="margin:0;"><label>${bf.areaUnit}</label><select id="bfAreaUnit"><option value="sqft" ${u.areaUnit === 'sqft' ? 'selected' : ''}>${bf.areaSqft}</option><option value="m2" ${u.areaUnit === 'm2' ? 'selected' : ''}>${bf.areaM2}</option></select></div>
      <div class="field" style="margin:0;"><label>${bf.parkingTotal}</label><input id="bfParkTotal" type="number" min="0" max="2000" value="${esc(u.parkingTotal)}" style="width:120px;"></div>
      <button type="button" class="btn" style="width:auto;" data-action="bfu-build">${bf.buildRows}</button>
    </div>
    <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; margin-top:16px; padding:12px; background:var(--g50,#f7f7f7); border-radius:12px;">
      <b style="font-size:12.5px; align-self:center;">${bf.bulkTitle}</b>
      <input id="bfuAllArea" type="number" min="0" step="any" placeholder="${bf.colArea}" style="width:100px;">
      <input id="bfuAllRooms" placeholder="${bf.colRooms} (${bf.roomsPh})" style="width:120px;">
      <select id="bfuAllPark" style="width:70px;">${[0, 1, 2, 3].map(n => `<option>${n}</option>`).join('')}</select>
      <button type="button" class="btn" style="width:auto;" data-action="bfu-apply">${bf.applyAll}</button>
    </div>
    <div style="overflow-x:auto; margin-top:14px;"><table class="admin-table">
      <thead><tr><th>${bf.colApt}</th><th>${bf.colArea}</th><th>${bf.colRooms}</th><th>${bf.colParking}</th><th>${bf.colEquip}</th><th>${bf.colSpots}</th></tr></thead>
      <tbody id="bfuBody">${bfuRowsHtml()}</tbody></table></div>
    <div id="bfuSum" style="font-size:12.5px; font-weight:700; margin-top:10px; color:var(--g600);">${s.text}</div>
  </div>`;
}

// Data for the save request. Rows are sent only when the list exists, so an empty list never wipes saved apartments.
function bfuPayload() {
  const u = state.bfu; if (!u) return {};
  const pt = (document.getElementById('bfParkTotal') || {}).value;
  const out = { areaUnit: (document.getElementById('bfAreaUnit') || {}).value || 'sqft', parkingTotal: pt === '' || pt == null ? null : parseInt(pt, 10) };
  if (u.rows.length) out.unitsList = u.rows.map(r => ({ number: r.number, area: r.area === '' ? null : r.area, rooms: r.rooms, parking: +r.parking || 0, equipment: r.equipment }));
  return out;
}

document.addEventListener('input', (e) => {
  const t = e.target; const k = t && t.dataset && t.dataset.bfu; if (k === undefined || !state.bfu) return;
  const [i, f] = k.split(':'); const row = state.bfu.rows[+i]; if (!row) return;
  row[f] = t.value; if (f === 'parking') row.spots = [];
  bfuRefresh2();
});
document.addEventListener('change', (e) => { if (e.target && e.target.dataset && e.target.dataset.bfu !== undefined) bfuRefresh2(); });
document.addEventListener('input', (e) => { if (e.target && e.target.id === 'bfParkTotal') { if (state.bfu) state.bfu.parkingTotal = e.target.value; bfuRefresh2(); } });
document.addEventListener('change', (e) => { if (e.target && e.target.id === 'bfAreaUnit' && state.bfu) state.bfu.areaUnit = e.target.value; });
function bfuRefresh2() {   // only the summary line: re-drawing the table would take focus away from the field being typed in
  const sum = document.getElementById('bfuSum');
  if (sum) { const s = bfuSummary(); sum.textContent = s.text; sum.style.color = s.over ? '#8a1f1f' : 'var(--g600)'; }
}

document.addEventListener('click', (e) => {
  const b = e.target.closest && e.target.closest('[data-action="bfu-build"], [data-action="bfu-apply"]'); if (!b || !state.bfu) return;
  if (b.dataset.action === 'bfu-build') {
    const old = new Map(state.bfu.rows.map(r => [r.number, r]));
    state.bfu.rows = bfuNumbers().map(n => old.get(n) || { number: n, area: '', rooms: '', parking: 0, equipment: '', spots: [] });
  } else {
    const area = document.getElementById('bfuAllArea').value, rooms = document.getElementById('bfuAllRooms').value.trim(), park = +document.getElementById('bfuAllPark').value;
    state.bfu.rows.forEach(r => { if (area !== '') r.area = area; if (rooms) r.rooms = rooms; r.parking = park; r.spots = []; });
  }
  bfuRefresh();
});
</script>

<script>// Screens: requests, request detail, bookings, guest parking, dashboard
// Part of the admin app: plain <script> files share one global scope; load order is set in index.html.
// Pager under a long list: "1–50 of 5 549" and previous / next. list = 'requests' | 'bookings' | 'guestParking'.
function pagerHtml(list, meta) {
  if (!meta || meta.total <= meta.pageSize) return '';
  const p = L.pager, from = meta.page * meta.pageSize + 1, to = Math.min(meta.total, from + meta.pageSize - 1);
  const last = Math.ceil(meta.total / meta.pageSize) - 1;
  const btn = (page, label, off) => `<button class="btn btn-secondary" ${off ? 'disabled' : ''} data-action="page" data-list="${list}" data-page="${page}">${label}</button>`;
  return `<div class="pager">${btn(meta.page - 1, p.prev, meta.page <= 0)}<span>${p.range.replace('{a}', from).replace('{b}', to).replace('{n}', meta.total)}</span>${btn(meta.page + 1, p.next, meta.page >= last)}</div>`;
}

function reqPipeline(filter, enter) {
  // Counts come from the server for ALL requests (the list itself holds only the current page).
  const counts = (state.requestsMeta && state.requestsMeta.counts) || {};
  const cnt = {}; STATUS_ORDER.forEach(k => cnt[k] = counts[k] ? counts[k].n : 0);
  const allCount = Object.values(cnt).reduce((a, b) => a + b, 0);
  const max = Math.max(1, ...Object.values(cnt));
  const play = buildingAnimOn();
  return `<div class="rq-pipe ${enter && play ? 'enter' : ''}">
    <button class="rq-all ${filter === 'all' ? 'active' : ''}" data-action="filter-requests" data-filter="all"><b>${allCount}</b><span>${L.requestsV.allTab}</span></button>
    ${STATUS_ORDER.map((k, i) => {
      const urgent = counts[k] ? counts[k].urgent : 0;
      return `<button class="rq-stage ${k} ${filter === k ? 'active' : ''} ${urgent ? 'has-urgent' : ''}" style="--i:${i}" data-action="filter-requests" data-filter="${k}">
        <span class="rq-num" ${enter && play ? `data-count-to="${cnt[k]}">0` : `>${cnt[k]}`}</span>
        <span class="rq-lbl">${L.status[k]}</span>
        <span class="rq-bar"><i style="width:${Math.round(cnt[k] / max * 100)}%"></i></span>
        ${urgent ? '<span class="rq-dot"></span>' : ''}
      </button>`;
    }).join('')}
  </div>`;
}

views.requests = () => {

          ${filtered.map((r, idx) => `

              <td><div class="booking-row-type"><span class="dash-cat-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${CATEGORY_ICONS[r.category] || CATEGORY_ICONS.other}</svg></span><span>${L.category[r.category] || r.category}</span></div></td>
              <td style="white-space:nowrap;">${dueCell(r)}</td>

                ${r.isUrgent ? `<span class="status-pill urgent" style="margin-bottom:4px; display:inline-flex;"><svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor" style="margin-right:3px;"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z"/></svg>${L.dash.urgent}</span><br>` : ''}

function guestParkingStatus(g) {
  const today = new Date().toISOString().slice(0, 10);
  if (g.endDate < today) return { key: 'past', label: L.guestParkingV.statusPast, pill: 'completed' };
  if (g.startDate > today) return { key: 'upcoming', label: L.guestParkingV.statusUpcoming, pill: 'reviewed' };
  return { key: 'active', label: L.guestParkingV.statusActive, pill: 'scheduled' };
}

<script>const RDOC_FILE = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>';

// Screens: residents, buildings, contractors and their forms

    ${privacyCard()}
    ${adoptionCard()}
    ${state.buildingsList.length === 0 ? `<div class="admin-card" style="color:var(--g500);">${rv.noBuildingsYet}</div>` : `
    <div style="display:flex; flex-direction:column; gap:12px;">
      ${state.buildingsList.map((b, bi) => {

        const n = residentsInBuilding.length;
        const occ = b.units ? Math.min(1, n / b.units) : null;
        // The little building: windows lit in proportion to how many apartments have a resident.
        const mini = buildingScene({ ...buildingSpec(b), lit: occ === null ? 0.58 : 0.25 + 0.75 * occ }, bi * 0.1 + 0.1);

        <div class="admin-card" style="padding:0; overflow:hidden;">
          <button data-action="toggle-building" data-code="${esc(b.code)}" style="display:flex; justify-content:space-between; align-items:center; width:100%; text-align:left; background:none; border:none; padding:12px 18px; cursor:pointer;">

                    <td>${esc(r.apartmentNumber)}${hmaBadge(r)}${vhaPlates(r)}</td>
                    <td>${esc(r.parkingSpot) || '—'}</td>
                    <td>${esc(r.monthlyRent)} ${esc(r.currency)}</td>
                    <td>${esc(r.email)}</td>

      <div style="margin-top:12px; display:flex; gap:8px; align-items:center;">
        <input type="file" id="sharedDocFile" style="font-size:12.5px;">

        <select id="sharedDocBuilding" style="font-size:12.5px; padding:6px 8px; border:1px solid var(--g200); border-radius:8px;">
          <option value="">${rv.sharedDocsAll}</option>

        <button class="btn btn-secondary" style="width:auto; padding:7px 12px; font-size:12px;" data-action="upload-shared-doc" ${state.busy ? 'disabled' : ''}>${state.busy ? '…' : rv.sharedDocsUpload}</button>
      </div>
      ${state.sharedDocError ? `<div style="color:#8a1f1f; font-size:12px; font-weight:600; margin-top:8px;">${state.sharedDocError}</div>` : ''}
    </div>
    </div>
  `);
};

      ${(state.residentNotes || []).map(n => `

          <div class="note-meta">${n.apartmentNote ? `<span class="task-badge today">${L.notesV.scopeApartment}</span>` : ''} ${esc(n.createdBy || '')} · ${fmtDate(n.createdAt)}
            <button class="note-del" data-action="delete-note" data-note="${n.id}">${L.common.delete}</button></div>

    </div>
    </div>`}

  `);
};

function newsReadersBlock(d) {
  const E = L.engageV;
  const chips = (arr) => arr.map(r => `<span style="display:inline-block;background:var(--g100);border-radius:999px;padding:3px 10px;margin:2px 4px 2px 0;font-size:12px;">${esc(r.buildingCode)} · ${esc(r.apartmentNumber)} ${esc(r.firstName)} ${esc(r.lastName)}</span>`).join('');
  if (d.loading) return '…';
  return `<div style="padding:6px 2px;font-size:12.5px;">
    <div style="font-weight:700;margin-bottom:4px;">${E.unread} (${d.unread.length})</div>
    ${d.unread.length ? chips(d.unread) : `<span style="color:var(--g500);">${E.all}</span>`}
    <div style="font-weight:700;margin:10px 0 4px;">${E.readers} (${d.read.length})</div>
    ${chips(d.read) || '—'}
  </div>`;
}

<script>// The Interphones screen, built from small blocks: connection card, SIP settings card, add form, devices,
// recent calls and the event journal.

const IC_SMALL_BTN = 'width:auto; padding:6px 10px; font-size:11px;';
const IC_CARD_BTN = 'width:auto; padding:6px 12px; font-size:12px;';
const IC_CHIP_BTN = 'width:auto; padding:5px 10px; font-size:11.5px;';
const IC_TH_MARGIN = 'font-size:14px; font-weight:800; margin:26px 0 10px 0;';

function icEventLabel(t) {
  const v = L.intercomV;
  if (v['ev' + t]) return v['ev' + t];
  return t < 40 ? v.evNormal : t < 80 ? v.evWarn : t < 120 ? v.evAlarm : t < 166 ? v.evState : v.evOther;
}
function icEventColor(t) { return t >= 80 && t < 120 ? '#d92d20' : t >= 40 && t < 80 ? '#b54708' : 'inherit'; }

const icBtn = (action, id, label, disabled) =>
  `<button class="btn btn-secondary" style="${IC_SMALL_BTN}" data-action="${action}" data-id="${id}" ${disabled ? 'disabled' : ''}>${label}</button>`;
const icNone = (cols) => `<tr><td colspan="${cols}" style="color:var(--g500);">—</td></tr>`;

function icMessage() {
  const m = state.intercomMsg;
  if (!m) return '';
  const color = m.ok ? 'var(--brand-dark)' : '#8a1f1f';
  return `<div style="font-size:12.5px; font-weight:600; margin:0 0 12px 0; color:${color};">${esc(m.text)}</div>`;
}

// Where the manufacturer-protocol door stations must connect (or a note that nothing is switched on).
function icConnectionCard(d) {
  const v = L.intercomV;
  if (d.connection.enabled === false) {
    if (d.sip && d.sip.enabled) return '';
    return `<div class="admin-card" style="max-width:640px; margin-bottom:16px;">${v.off}</div>`;
  }
  return `<div class="admin-card" style="max-width:640px; margin-bottom:16px;">
    <div style="font-size:12px; color:var(--g500);">${v.connTitle}</div>
    <div style="font-size:18px; font-weight:800; margin:4px 0 6px 0; user-select:all;">${esc(d.connection.address || '')}</div>
    <p style="font-size:12px; color:var(--g500); margin:0; line-height:1.5;">${v.connNote}</p>
  </div>`;
}

// The SIP account to type into a panel; shown after adding one or on "SIP settings".
function icSipCard() {
  const s = state.intercomSip, v = L.intercomV;
  if (!s) return '';
  const rows = [['sipServer', s.server], ['sipPort', s.port], ['sipUser', s.username], ['sipPass', s.password],
    ['sipCodecs', s.codecs], ['sipDtmf', s.dtmf]];
  const cells = rows.map(([k, val]) => `<tr><td style="color:var(--g500); width:130px;">${v[k]}</td>
    <td style="font-weight:700; user-select:all; font-family:monospace;">${esc(String(val))}</td></tr>`).join('');
  const btn = (action, label) =>
    `<button class="btn btn-secondary" style="${IC_CARD_BTN}" data-action="${action}" data-id="${s.id}">${label}</button>`;
  return `<div class="admin-card" style="max-width:640px; margin-bottom:16px; border:2px solid #111;">
    <h3 style="font-size:14px; font-weight:800; margin:0 0 4px 0;">${v.sipTitle}${s.name ? ' — ' + esc(s.name) : ''}</h3>
    <p style="font-size:12px; color:var(--g500); margin:0 0 12px 0; line-height:1.5;">${v.sipNote}</p>
    <table class="admin-table" style="margin-bottom:12px;"><tbody>${cells}</tbody></table>
    ${btn('ic-sip-reset', v.sipReset)} ${btn('ic-sip-close', v.sipClose)}
  </div>`;
}

function icAddForm(d) {
  const v = L.intercomV;
  const sipOption = d.sip && d.sip.enabled ? `<option value="sip">${v.typeSip}</option>` : '';
  const buildings = state.buildingsList
    .map(b => `<option value="${esc(b.code)}">${esc(b.name)} (${esc(b.code)})</option>`).join('');
  const chip = (k) =>
    `<button class="btn btn-secondary" style="${IC_CHIP_BTN}" data-action="ic-fill" data-sn="${esc(k.sn)}">${esc(k.sn)}</button>`;
  const knocking = d.knocking.length
    ? `<div style="margin-top:14px; font-size:12px; color:var(--g500);"><b>${v.knockTitle}</b> — ${v.knockNote}
        <div style="margin-top:6px; display:flex; gap:6px; flex-wrap:wrap;">${d.knocking.map(chip).join('')}</div></div>`
    : '';
  return `<div class="admin-card" style="max-width:640px; margin-bottom:16px;">
    <h3 style="font-size:14px; font-weight:800; margin:0 0 12px 0;">${v.addTitle}</h3>
    <div class="field"><label>${v.typeLabel}</label><select id="icType"><option value="vendor">${v.typeVendor}</option>${sipOption}</select></div>
    <div class="field">
      <label>${v.snLabel} <span style="color:var(--g500); font-weight:400;">${v.snHint}</span></label>
      <input id="icSn" maxlength="40" autocomplete="off">
    </div>
    <div class="field"><label>${v.nameLabel}</label><input id="icName" maxlength="60" placeholder="${esc(v.namePh)}"></div>
    <div class="field" style="margin-bottom:0;"><label>${v.buildingLabel}</label>
      <select id="icBuilding"><option value="">${v.noBuilding}</option>${buildings}</select></div>
    ${knocking}
    <button class="btn btn-primary" style="width:auto; margin-top:16px;" data-action="ic-add"
      ${state.busy ? 'disabled' : ''}>${state.busy ? '…' : v.addBtn}</button>
  </div>`;
}

function icDeviceRow(x) {
  const v = L.intercomV, isSip = x.driver === 'sip';
  const tag = isSip ? ` <span class="status-pill submitted" style="margin-left:6px;">${v.typeSipTag}</span>` : '';
  const status = isSip ? '—'
    : `<span class="status-pill ${x.online ? 'completed' : 'submitted'}">${x.online ? v.online : v.offline}</span>`;
  const buttons = isSip
    ? icBtn('ic-sip', x.id, v.sipBtn)
    : icBtn('ic-open', x.id, v.openBtn, !x.online) + ' ' + icBtn('ic-sync', x.id, v.syncBtn, !(x.online && x.buildingCode));
  return `<tr>
    <td style="font-weight:700;">${esc(x.name)}${tag}</td><td>${isSip ? '—' : esc(x.sn)}</td><td>${esc(x.buildingCode || '—')}</td>
    <td>${status}</td>
    <td style="text-align:right; white-space:nowrap;">${buttons} ${icBtn('ic-del', x.id, v.delBtn)}</td></tr>`;
}

function icDevicesTable(d) {
  const v = L.intercomV;
  return `<h3 style="font-size:14px; font-weight:800; margin:22px 0 10px 0;">${v.devicesTitle}</h3>
  <div class="admin-card" style="padding:0; overflow:auto;"><table class="admin-table">
    <thead><tr><th>${v.colName}</th><th>${v.colSn}</th><th>${v.colBuilding}</th><th>${v.colStatus}</th><th></th></tr></thead>
    <tbody>${d.devices.map(icDeviceRow).join('') || `<tr><td colspan="5" style="color:var(--g500);">${v.empty}</td></tr>`}</tbody>
  </table></div>`;
}

function icCallsTable(d) {
  const v = L.intercomV;
  const rows = d.calls.map(c => `<tr><td>${fmtDate(c.startedAt)}</td><td>${esc(c.room || '—')}</td><td>${esc(c.device)}</td>
    <td>${v['st_' + c.state] || esc(c.state)}</td><td>${esc(c.openedByName || '—')}</td></tr>`).join('');
  return `<h3 style="${IC_TH_MARGIN}">${v.callsTitle}</h3>
  <div class="admin-card" style="padding:0; overflow:auto;"><table class="admin-table">
    <thead><tr><th>${v.colTime}</th><th>${v.colRoom}</th><th>${v.colName}</th><th>${v.colResult}</th><th>${v.colOpenedBy}</th></tr></thead>
    <tbody>${rows || icNone(5)}</tbody>
  </table></div>`;
}

function icEventsTable(d) {
  const v = L.intercomV;
  const rows = d.events.map(e => {
    const strong = e.type >= 40 && e.type < 120;
    return `<tr><td>${esc(e.at || '—')}</td><td>${esc(e.device)}</td>
      <td style="color:${icEventColor(e.type)}; font-weight:${strong ? 700 : 400};">${esc(icEventLabel(e.type))}</td></tr>`;
  }).join('');
  return `<h3 style="${IC_TH_MARGIN}">${v.eventsTitle}</h3>
  <div class="admin-card" style="padding:0; overflow:auto;"><table class="admin-table">
    <thead><tr><th>${v.colTime}</th><th>${v.colName}</th><th>${v.colEvent}</th></tr></thead>
    <tbody>${rows || icNone(3)}</tbody>
  </table></div>`;
}

views.intercom = () => {
  const v = L.intercomV;
  const d = state.intercomData || { devices: [], knocking: [], events: [], calls: [], connection: {} };
  return shell(v.title, `
  <p style="color:var(--g500); font-size:13px; margin:-6px 0 16px 0; max-width:640px;">${v.subtitle}</p>
  ${icConnectionCard(d)}
  ${icSipCard()}
  ${icMessage()}
  ${icAddForm(d)}
  ${icDevicesTable(d)}
  ${icCallsTable(d)}
  ${icEventsTable(d)}`);
};
</script>
<script>// Screens: settings (services, admins, password), admin invite form, messages
// Part of the admin app: plain <script> files share one global scope; load order is set in index.html.
const SERVICE_ORDER = ['cleaning', 'moving', 'drycleaning', 'carwash', 'furniture', 'plumbing', 'electrical', 'repairs', 'other'];
const PRICED_SERVICES = ['cleaning', 'moving', 'drycleaning', 'carwash', 'furniture'];

// Working copy of the service on/off + price form. Kept in state (not read
// back from the DOM) because every toggle re-renders the whole screen —
// without this a price typed into one field would vanish on the next click.
function svcDraft() {
  if (state.serviceDraft) return state.serviceDraft;
  const d = {};
  Object.entries(state.serviceSettings || {}).forEach(([k, v]) => { d[k] = { enabled: v.enabled, price: v.price === null ? '' : String(v.price) }; });
  return d;
}

async function handleSaveServices() {
  const draft = svcDraft();
  const payload = {};
  state.serviceError = null; state.serviceSaved = false;
  for (const cat of SERVICE_ORDER) {
    const d = draft[cat] || { enabled: true, price: '' };
    let price = null;
    if (PRICED_SERVICES.includes(cat) && String(d.price).trim() !== '') {
      const n = Number(String(d.price).replace(',', '.').trim());
      if (!Number.isFinite(n) || n < 0 || n > 100000 || Math.round(n * 100) / 100 !== n) {
        state.serviceError = L.settingsV.serviceErrPrice(L.category[cat]); render(); return;
      }
      price = n;
    }
    payload[cat] = { enabled: !!d.enabled, price };
  }
  if (!Object.values(payload).some(p => p.enabled)) { state.serviceError = L.settingsV.serviceErrNone; render(); return; }
  state.busy = true; render();
  try {
    state.serviceSettings = await adminApi.saveServiceSettings(payload);
    state.serviceDraft = null; state.serviceSaved = true;
  } catch (err) { state.serviceError = err.message; }
  state.busy = false; render();
}

function tfaCard() {
  const t = L.tfa, s = state.tfa || { enabled: false, step: 'idle' };
  const err = s.error ? `<div style="color:#8a1f1f; font-size:12.5px; font-weight:600; margin-top:12px;">${esc(s.error)}</div>` : '';
  let body;
  if (s.step === 'setup') {
    body = `<p style="font-size:12px; color:var(--g500); margin:0 0 12px 0; line-height:1.5;">${t.scan}</p>
      <img src="${s.qr}" alt="QR" style="width:180px; height:180px; display:block; margin:0 0 10px 0;">
      <p style="font-size:11.5px; color:var(--g500); margin:0 0 4px 0;">${t.manual}</p>
      <code style="font-size:12.5px; word-break:break-all; user-select:all;">${esc(s.secret)}</code>
      <div class="field" style="margin:14px 0 0 0;"><label>${t.codeLabel}</label><input id="tfaCode" inputmode="numeric" autocomplete="one-time-code" maxlength="8"></div>${err}
      <div style="display:flex; gap:10px; margin-top:14px;">
        <button class="btn btn-primary" style="width:auto;" data-action="tfa-confirm" ${state.busy ? 'disabled' : ''}>${t.confirm}</button>
        <button class="btn btn-secondary" style="width:auto;" data-action="tfa-cancel">${t.cancel}</button></div>`;
  } else if (s.step === 'codes') {
    body = `<h4 style="font-size:13px; margin:0 0 6px 0;">${t.recTitle}</h4>
      <p style="font-size:12px; color:var(--g500); margin:0 0 10px 0; line-height:1.5;">${t.recNote}</p>
      <pre id="tfaCodes" style="font-size:14px; line-height:1.7; background:var(--g100,#f4f4f4); padding:12px; border-radius:8px; margin:0 0 14px 0; user-select:all;">${s.codes.map(esc).join('\n')}</pre>
      <button class="btn btn-primary" style="width:auto;" data-action="tfa-done">${t.recDone}</button>`;
  } else if (s.enabled) {
    body = `<p style="font-size:12px; color:var(--g500); margin:0 0 10px 0;">${t.disNote}</p>
      <div class="field"><label>${t.pwd}</label><input type="password" id="tfaPwd" autocomplete="current-password"></div>
      <div class="field" style="margin-bottom:0;"><label>${t.codeLabel}</label><input id="tfaOff" autocomplete="one-time-code" maxlength="24"></div>${err}
      <button class="btn btn-secondary" style="width:auto; margin-top:14px;" data-action="tfa-disable" ${state.busy ? 'disabled' : ''}>${t.disBtn}</button>`;
  } else {
    body = `<p style="font-size:12px; color:var(--g500); margin:0 0 14px 0; line-height:1.5;">${t.note}</p>${err}
      <button class="btn btn-primary" style="width:auto;" data-action="tfa-start" ${state.busy ? 'disabled' : ''}>${t.enable}</button>`;
  }
  return `<div class="admin-card" id="tfaCard" style="max-width:480px; margin-top:16px;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
      <h3 style="font-size:14px; font-weight:800; margin:0;">${t.title}</h3>
      <span class="status-pill ${s.enabled ? 'completed' : 'submitted'}">${s.enabled ? t.on : t.off}</span></div>${body}</div>`;
}

views.settings = () => {
  const sv = L.settingsV;
  return shell(sv.title, `
    <div class="isl-grid">
    <div class="isl-col">
    ${state.adminRole === 'owner' ? `
    <div class="admin-card" style="max-width:480px; margin-bottom:16px;">
      <div class="field" style="margin-bottom:6px;"><label>${sv.phoneLabel}</label><input id="settingsPhone" value="${esc(state.settingsData.management_phone || '')}"></div>
      <p style="font-size:11.5px; color:var(--g500); margin:0 0 16px 0;">${sv.phoneNote}</p>
      <div class="field" style="margin-bottom:6px;"><label>${sv.emailLabel}</label><input id="settingsEmail" type="email" value="${esc(state.settingsData.management_email || '')}"></div>
      <p style="font-size:11.5px; color:var(--g500); margin:0 0 16px 0;">${sv.emailNote}</p>
      ${state.settingsSaved ? `<div style="color:var(--brand-dark); font-size:12.5px; font-weight:600; margin-bottom:12px;">${sv.saved}</div>` : ''}
      <button class="btn btn-primary" style="width:auto;" data-action="save-settings" ${state.busy ? 'disabled' : ''}>${state.busy ? '…' : sv.save}</button>
    </div>
    <div class="admin-card" style="max-width:480px; margin-bottom:16px;">
      <h3 style="font-size:14px; font-weight:800; margin:0 0 4px 0;">${sv.serviceTitle}</h3>
      <p style="font-size:12px; color:var(--g500); margin:0 0 6px 0; line-height:1.5;">${sv.serviceNote}</p>
      ${SERVICE_ORDER.map(cat => {
        const d = svcDraft()[cat] || { enabled: true, price: '' };
        return `<div class="svc-setting-row">
          <span class="svc-setting-name">${L.category[cat]}</span>

<script>// Auto-created tasks store language-neutral markers ("@moving|…"); render them in the current admin language.
const TASK_MOVING_TXT = {
  fr: { t: (n, a, b) => `Déménagement : ${n}, app. ${a} (${b})`, n: (id, d, x) => `Service de déménagement demandé (demande n° ${id}) pour le ${d}. ${x}` },
  en: { t: (n, a, b) => `Moving: ${n}, apt ${a} (${b})`, n: (id, d, x) => `Moving service requested (request #${id}) for ${d}. ${x}` },
  uk: { t: (n, a, b) => `Переїзд: ${n}, кв. ${a} (${b})`, n: (id, d, x) => `Замовлено послугу переїзду (заявка №${id}) на ${d}. ${x}` },
  es: { t: (n, a, b) => `Mudanza: ${n}, apto. ${a} (${b})`, n: (id, d, x) => `Servicio de mudanza solicitado (solicitud n.º ${id}) para el ${d}. ${x}` },
  ru: { t: (n, a, b) => `Переезд: ${n}, кв. ${a} (${b})`, n: (id, d, x) => `Заказана услуга переезда (заявка №${id}) на ${d}. ${x}` },
  zh: { t: (n, a, b) => `搬家：${n}，${a}室（${b}）`, n: (id, d, x) => `已申请搬家服务（请求 #${id}），日期 ${d}。${x}` }
};
function taskText(str) {
  if (typeof str !== 'string' || !str.startsWith('@moving|')) return str;
  const f = str.split('|'); const T = TASK_MOVING_TXT[state.lang] || TASK_MOVING_TXT.en;
  return f.length >= 4 && /^\d+$/.test(f[1]) ? T.n(f[1], f[2], f.slice(3).join('|')).trim() : T.t(f[1], f[2], f.slice(3).join('|'));
}
// Screen: tasks and reminders for the management team
// Part of the admin app: plain <script> files share one global scope; load order is set in index.html.

        <div class="task-row ${t.active ? '' : 'done'}">
          <div class="task-main"><div class="task-title" style="${t.active ? '' : 'text-decoration:none;'}">${esc(t.title)}</div>
            <div class="task-meta"><span>${R.everyFmt.replace('{n}', t.repeatEvery).replace('{u}', unitName[t.repeatUnit])}</span><span>${R.next}: ${esc(t.nextDue)}</span>${t.active ? '' : `<span class="task-badge">${R.paused}</span>`}</div></div>
          <button class="btn btn-secondary" style="width:auto; padding:5px 10px; font-size:11px;" data-action="tpl-toggle" data-id="${t.id}" data-a="${t.active ? 0 : 1}">${t.active ? R.pause : R.resume}</button>
          <button class="btn btn-secondary" style="width:auto; padding:5px 10px; font-size:11px;" data-action="tpl-del" data-id="${t.id}">${R.del}</button>
        </div>`).join('') || `<div style="padding:18px; color:var(--g500); font-size:13px;">${R.empty}</div>`}
    </div>`;
}

document.addEventListener('click', async (e) => {
  const btn = e.target.closest('[data-action^="tpl-"]'); if (!btn) return;
  const R = L.recurV; const a = btn.dataset.action; state.tplError = null;
  try {
    if (a === 'tpl-add') {
      const title = document.getElementById('tplTitle').value.trim(); const first = document.getElementById('tplFirst').value;
      const every = parseInt(document.getElementById('tplEvery').value, 10);
      if (!title || !first || !every) { state.tplError = R.required; render(); return; }
      await adminApi.createTemplate({ title, repeatEvery: every, repeatUnit: document.getElementById('tplUnit').value, nextDue: first });
    } else if (a === 'tpl-toggle') await adminApi.updateTemplate(btn.dataset.id, { active: btn.dataset.a === '1' });
    else if (a === 'tpl-del') { if (!confirm(R.confirmDel)) return; await adminApi.deleteTemplate(btn.dataset.id); }
  } catch (err) { state.tplError = err.message; }
  try { state.tplList = await adminApi.getTemplates(); state.tasksList = await adminApi.getTasks(state.tasksFilter); } catch (_) {}
  render();
});

<script>// Screen: bookings calendar — a month grid where every booking is one floor of a tiny building, and a day panel
// with an "equalizer" per amenity (one column per opening hour, filled by how many units are taken).
// Part of the admin app: plain <script> files share one global scope; load order is set in index.html.

const calPad = (n) => String(n).padStart(2, '0');
const calKey = (y, m, d) => `${y}-${calPad(m + 1)}-${calPad(d)}`;
const calToday = () => { const t = new Date(); return calKey(t.getFullYear(), t.getMonth(), t.getDate()); };
const calToMin = (hhmm) => { const [h, m] = String(hhmm).split(':').map(Number); return h * 60 + (m || 0); };
const calLocale = () => ({ fr: 'fr-CA', en: 'en-CA', uk: 'uk-UA', es: 'es-MX', ru: 'ru-RU', zh: 'zh-CN' }[state.lang] || 'fr-CA');

// Length of a booking in minutes (older rows only have whole hours).
function calDur(b) { return b.durationMin || (Number(b.duration) || 1) * 60; }

// A tiny isometric tower: `n` floors (max 6). Same slab drawing language as the Buildings screen.
function calTower(n, bad) {
  const floors = Math.min(n, 6);
  let out = '';
  for (let k = 0; k < floors; k++) {
    const y = 41 - k * 5;
    out += `<g class="cal-fl" style="--k:${k}">
      <polygon class="f-left" points="7,${y} 15,${y + 4.6} 15,${y + 9.6} 7,${y + 5}"/>
      <polygon class="f-right" points="15,${y + 4.6} 23,${y} 23,${y + 5} 15,${y + 9.6}"/>
      <polygon class="f-top" points="7,${y} 15,${y - 4.6} 23,${y} 15,${y + 4.6}"/></g>`;
  }
  return `<svg viewBox="0 0 30 52" class="cal-tower ${bad ? 'cal-bad' : 'tone-sage'}" aria-hidden="true">${out}</svg>`;
}

// Peak simultaneous bookings of one amenity inside [s, e) minutes of one day.
function calPeak(list, s, e) {
  let peak = 0;
  list.forEach((b) => {
    const bs = calToMin(b.timeSlot), be = bs + calDur(b);
    if (bs < e && be > s) peak = Math.max(peak, list.filter(x => { const xs = calToMin(x.timeSlot), xe = xs + calDur(x); return xs < be && xe > bs; }).length);
  });
  return peak;
}

function calMonthCells(y, m) {
  const first = new Date(y, m, 1);
  const lead = (first.getDay() + 6) % 7; // Monday first
  const days = new Date(y, m + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < lead; i++) cells.push(null);
  for (let d = 1; d <= days; d++) cells.push(d);
  while (cells.length % 7) cells.push(null);
  return cells;
}

views.calendar = () => {
  const cv = L.calendarV;
  const now = new Date();
  if (!state.calMonth) state.calMonth = { y: now.getFullYear(), m: now.getMonth() };
  if (!state.calDay) state.calDay = calToday();
  const { y, m } = state.calMonth;
  const anim = state.calAnim; state.calAnim = null;
  const play = buildingAnimOn();
  const byDate = {};
  (state.calendarBookings || []).forEach(b => { (byDate[b.date] = byDate[b.date] || []).push(b); });
  const today = calToday();
  const monthTitle = new Date(y, m, 1).toLocaleDateString(calLocale(), { month: 'long', year: 'numeric' });
  const wd = [...Array(7)].map((_, i) => new Date(2024, 0, 1 + i).toLocaleDateString(calLocale(), { weekday: 'short' }));
  const cells = calMonthCells(y, m);

  const grid = cells.map((d, i) => {
    if (!d) return `<div class="cal-cell empty"></div>`;
    const key = calKey(y, m, d), list = byDate[key] || [];
    // conflict = more bookings of one amenity at the same moment than it has units
    const bad = list.some(b => calPeak(list.filter(x => x.amenityId === b.amenityId), calToMin(b.timeSlot), calToMin(b.timeSlot) + calDur(b)) > (b.quantity || 1));
    return `<button class="cal-cell ${key === today ? 'today' : ''} ${key === state.calDay ? 'sel' : ''} ${list.length ? 'has' : ''}" data-action="cal-day" data-day="${key}" style="--d:${(i % 7) * 0.03 + Math.floor(i / 7) * 0.06}s">
      <span class="cal-num">${d}</span>

    </button>`;
  }).join('');

  // ---- the selected day ----
  const day = state.calDay;
  const dayList = byDate[day] || [];
  const dayTitle = new Date(day + 'T12:00:00').toLocaleDateString(calLocale(), { weekday: 'long', day: 'numeric', month: 'long' });
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const amenities = (state.amenitiesList || []).filter(a => a.bookable);

      const s = h * 60, e = s + 60;
      const conc = list.filter(b => { const bs = calToMin(b.timeSlot), be = bs + calDur(b); return bs < e && be > s; }).length;
      const pct = Math.min(100, Math.round((conc / qty) * 100));
      cols += `<div class="eq-col ${conc > qty ? 'over' : conc === qty ? 'full' : ''}" title="${calPad(h)}:00 — ${conc}/${qty}"><i style="--p:${pct}%; --i:${h - h0}"></i><span>${(h - h0) % 3 === 0 ? h : ''}</span></div>`;
    }
    const marker = day === today && nowMin > h0 * 60 && nowMin < h1 * 60 ? `<div class="eq-now" style="left:${(((nowMin - h0 * 60) / ((h1 - h0) * 60)) * 100).toFixed(2)}%"></div>` : '';
    return `<div class="eq-row">

      <div class="eq-bars" style="--cols:${h1 - h0}">${cols}${marker}</div>
    </div>`;
  }).join('');

  const rows = [...dayList].sort((a, b) => a.timeSlot.localeCompare(b.timeSlot)).map(b => {
    const s = calToMin(b.timeSlot), e = s + calDur(b);
    const range = `${b.timeSlot} – ${calPad(Math.floor(e / 60) % 24)}:${calPad(e % 60)}`;
    const started = day < today || (day === today && s <= nowMin);

    </div>`;
  }).join('');

  return shell(cv.title, `
    <div class="isl-grid cal-wrap ${play ? '' : 'no-anim'}">
      <div class="isl-col">
        <div class="admin-card">
          <div class="cal-nav">
            <button class="cal-arrow" data-action="cal-nav" data-dir="-1" aria-label="${esc(cv.prev)}">‹</button>
            <div class="cal-title">${esc(monthTitle)}</div>

            <button class="btn btn-secondary" style="width:auto; padding:6px 12px; font-size:12px; margin-left:8px;" data-action="cal-today">${cv.todayBtn}</button>
          </div>

          <div class="cal-grid ${anim ? 'flip-' + anim : ''}">${grid}</div>
          <p class="cal-legend"><span class="cal-dot"></span>${cv.legend}</p>
        </div>

          <h3 style="font-size:15px; font-weight:800; margin:0; text-transform:capitalize;">${esc(dayTitle)} ${day === today ? `<span class="cal-today-pill">${cv.todayBtn}</span>` : ''}</h3>

<script>// render(), data loaders (load*) and open*/view* helpers
// Part of the admin app: plain <script> files share one global scope; load order is set in index.html.
function render() {
  L = ADMIN_I18N[state.lang];
  document.documentElement.lang = state.lang; document.documentElement.dir = state.lang === 'ar' ? 'rtl' : 'ltr';
  // Motion layer: entrance animations play only when the screen really changes (not on busy/error redraws).
  const root = document.getElementById('viewRoot');
  let TOP = []; try { TOP = navKeys(); } catch (_) {}
  const entering = state.view !== state._shown;
  const wasTop = TOP.includes(state._shown), isTop = TOP.includes(state.view);
  root.dataset.dir = !entering ? '' : (isTop ? (wasTop ? 'fade' : 'back') : 'forward');
  root.dataset.view = state.view;
  document.body.dataset.enter = entering ? '1' : '0';
  document.body.classList.toggle('no-anim', typeof buildingAnimOn === 'function' && !buildingAnimOn());
  state._shown = state.view;
  // The side menu is rebuilt with every screen; keep its scroll position so choosing an item does not jump to the top.
  const sbOld = root.querySelector('.admin-sidebar');
  const sbTop = sbOld ? sbOld.scrollTop : 0, sbLeft = sbOld ? sbOld.scrollLeft : 0;
  // Redrawing the same screen (adding a row, opening a form…) must not throw the page back to the top.
  const ctOld = root.querySelector('.content'); const ctTop = ctOld ? ctOld.scrollTop : 0;
  const ghostFrom = entering && ctOld && sectionGhostOk() ? ctOld.getBoundingClientRect() : null;
  root.innerHTML = views[state.view] ? views[state.view]() : views.login();
  if (ghostFrom && root.querySelector('.content')) sectionGhost(ctOld, ghostFrom, ctTop, root.dataset.dir);
  if (!entering && ctTop) { const ctNew = root.querySelector('.content'); if (ctNew) ctNew.scrollTop = ctTop; }
  const sbNew = root.querySelector('.admin-sidebar');
  if (sbNew && sbOld) {
    sbNew.scrollTop = sbTop; sbNew.scrollLeft = sbLeft;
    const act = sbNew.querySelector('.admin-nav-item.active');   // an item opened from elsewhere must still be visible
    if (act) {
      const a = act.getBoundingClientRect(), b = sbNew.getBoundingClientRect();
      if (a.bottom > b.bottom) sbNew.scrollTop += a.bottom - b.bottom + 8;
      else if (a.top < b.top) sbNew.scrollTop -= b.top - a.top + 8;
      if (a.right > b.right) sbNew.scrollLeft += a.right - b.right + 8;
      else if (a.left < b.left) sbNew.scrollLeft -= b.left - a.left + 8;
    }
  }
  if (entering) setTimeout(() => countUpText(root), 0);
}

// Section change: the old page stays a moment on top and fades out while the new one comes in, so the switch
// is a cross-fade instead of a cut. The DOM is already the new screen (render stays synchronous); the ghost
// is the old .content node, detached, frozen at its old place and scroll, and never clickable.
function sectionGhostOk() {
  return !document.body.classList.contains('no-anim') && !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
}
function sectionGhost(oldContent, rect, scrollTop, dir) {
  document.querySelectorAll('.section-ghost').forEach((g) => g.remove());
  const g = oldContent;
  g.classList.add('section-ghost', 'ghost-' + (dir || 'fade'));
  g.setAttribute('aria-hidden', 'true'); g.inert = true;
  Object.assign(g.style, { top: rect.top + 'px', left: rect.left + 'px', width: rect.width + 'px', height: rect.height + 'px' });
  document.body.appendChild(g);
  g.scrollTop = scrollTop;
  const done = () => g.remove();
  g.addEventListener('animationend', done, { once: true });
  setTimeout(done, 600);
}

// Count-up for plain-number cards ("12", "45%", "3.5 h") on the Reports screen.
function countUpText(root) {
  if (state.view !== 'reports' || typeof buildingAnimOn !== 'function' || !buildingAnimOn()) return;
  root.querySelectorAll('.admin-card .n').forEach((el) => {
    const m = el.textContent.trim().match(/^(-?\d+(?:\.\d+)?)(.*)$/);
    if (!m) return;
    const to = parseFloat(m[1]), suffix = m[2], dec = (m[1].split('.')[1] || '').length, t0 = performance.now();
    if (!to) return;
    (function step(t) {
      if (!el.isConnected) return;
      const p = Math.min(1, (t - t0) / 900), e = 1 - Math.pow(1 - p, 3);
      el.textContent = (to * e).toFixed(dec) + suffix;
      if (p < 1) requestAnimationFrame(step);
    })(t0);
  });
}

// Requests, bookings and guest parking come one page (50 rows) at a time; filters and sorting are applied by the server.
// A page that became empty (rows deleted meanwhile) falls back to the last page that still has rows.
async function loadPaged(fetchPage, pageKey) {
  let data = await fetchPage(state[pageKey] || 0);
  if (!data.rows.length && data.total > 0 && state[pageKey] > 0) {
    state[pageKey] = Math.ceil(data.total / data.pageSize) - 1;
    data = await fetchPage(state[pageKey]);
  }
  return data;
}
async function loadRequests() {
  const data = await loadPaged((page) => adminApi.getRequestsPage({ page, status: state.requestsFilter || 'all', sort: state.requestsSort || 'new' }), 'requestsPage');
  state.requests = data.rows; state.requestsMeta = data; state.view = 'requests'; render();
}
async function loadBookings() {
  const data = await loadPaged((page) => adminApi.getAmenityBookingsPage({ page, amenity: state.bookingsFilter || 'all' }), 'bookingsPage');
  state.bookings = data.rows; state.bookingsMeta = data; state.view = 'bookings'; render();
}
async function loadEvents() {
  [state.eventsList, state.pollsList] = await Promise.all([adminApi.getEvents(), adminApi.getPolls()]);
  if (!state.buildingsList.length) { try { state.buildingsList = await adminApi.getBuildings(); } catch (_) {} }
  state.view = 'events'; render();
}
async function loadMoves() { state.movesList = await adminApi.getMoves(); state.view = 'moves'; render(); }
async function loadGuestParking() {
  const data = await loadPaged((page) => adminApi.getGuestParkingPage(page), 'guestParkingPage');
  state.guestParking = data.rows; state.guestParkingMeta = data; state.view = 'guestParking'; render();
}
async function loadResidents(animate = false) {
  state.residents = await adminApi.getResidents();
  state.buildingsList = await adminApi.getBuildings();
  state.sharedDocuments = await adminApi.getSharedDocuments();

  switch (e.type) {
    case 'account': return h.account;
    case 'request': return h.request(e.requestId, (L.category && L.category[e.category]) || e.category);
    case 'request_status': return h.requestStatus(e.requestId, st(e.status), e.note);
    case 'booking': return h.booking(e.amenity, e.date, e.time);
    case 'booking_cancelled': return h.bookingCancelled(e.amenity, e.date, e.time, e.by);
    case 'guest_parking': return h.guest(e.guest, e.from, e.to);
    case 'document': return h.document(e.name);
    case 'note': return h.note(e.apartmentNote, e.by, e.body);
    default: return e.type;
  }
}

<script>// Actions: sign in, admin accounts, requests and replies, residents and their documents
// Part of the admin app: plain <script> files share one global scope; load order is set in index.html.
// The password typed at sign-in, kept in memory only until the "choose your password" screen has used it (never stored).
let signInPassword = null;

async function handleAdminLogin(email, password) {
  state.busy = true; state.loginError = null; render();
  signInPassword = password;
  try {
    const r = await adminApi.login(email, password);
    if (r.mfaRequired) { state.busy = false; state.mfaToken = r.mfaToken; state.loginError = null; state.view = 'login2fa'; render(); return; }
    await finishLogin(r);
  } catch (err) {
    signInPassword = null;
    state.busy = false;
    state.loginError = err.message;
    render();
  }
}

async function handleAdminLogin2fa(code) {
  state.busy = true; state.loginError = null; render();
  try {
    await finishLogin(await adminApi.login2fa(state.mfaToken, code));
  } catch (err) {
    state.busy = false;
    state.loginError = err.message;
    if (/expired/i.test(err.message) || /Too many/i.test(err.message)) { state.mfaToken = null; state.view = 'login'; }
    render();
  }
}

async function finishLogin({ token, name, mustChangePassword }) {
  {
    state.mfaToken = null;
    adminApi.setToken(token);
    adminApi.setName(name);
    state.adminName = name;
    try { const me = await adminApi.getMe(); state.adminRole = me.role; state.intercomEnabled = !!me.intercomEnabled; } catch (_) {}
    state.busy = false;
    if (mustChangePassword) { showMustChangePassword(); return; }
    signInPassword = null;
    await loadDashboard();
  }
}

// After a temporary password: nothing else opens (the server refuses too) until the admin picks their own password.
function showMustChangePassword() {
  state.busy = false; state.mustChangeError = null;
  state.view = 'mustChangePassword'; render();
}

async function handleMustChangePassword(current, newPassword, confirmPassword) {
  const sv = L.settingsV;
  const cur = signInPassword || current;
  if (!cur || !newPassword || !confirmPassword) { state.mustChangeError = sv.pwdAllRequired; render(); return; }
  if (newPassword.length < 8) { state.mustChangeError = sv.pwdTooShort; render(); return; }
  if (newPassword !== confirmPassword) { state.mustChangeError = sv.pwdMismatch; render(); return; }

  state.busy = true; state.mustChangeError = null; render();
  try {
    const { token } = await adminApi.changePassword(cur, newPassword);
    if (token) adminApi.setToken(token); // the change signs out every older session, this one included
    signInPassword = null;
    try { const me = await adminApi.getMe(); state.adminRole = me.role; state.intercomEnabled = !!me.intercomEnabled; } catch (_) {}
    state.busy = false;
    await loadDashboard();
  } catch (err) {
    state.busy = false;
    state.mustChangeError = err.code === 'wrong_password' ? L.mustChange.wrong : err.message;
    render();
  }
}

async function handleAdminForgotPassword(email) {
  state.busy = true; state.forgotPasswordError = null; render();
  try {
    await adminApi.forgotPassword(email);
    state.busy = false;
    state.forgotPasswordSent = true;
    render();
  } catch (err) {
    state.busy = false;
    state.forgotPasswordError = err.message;
    render();
  }
}

async function handleAdminCheckEmail(email) {

  try {

    render();
  } catch (err) {
    state.busy = false;
    state.firstTimeError = err.message;
    render();
  }
}

async function handleAdminCreatePassword(password, confirmPassword) {
  const sv = L.settingsV;
  if (password.length < 8) { state.createPasswordError = sv.pwdTooShort; render(); return; }
  if (password !== confirmPassword) { state.createPasswordError = sv.pwdMismatch; render(); return; }

  state.busy = true; state.createPasswordError = null; render();
  try {
    const { token, name } = await adminApi.setPassword(state.pendingActivationEmail, state.pendingActivationToken, password);
    adminApi.setToken(token);
    adminApi.setName(name);
    state.adminName = name;
    try { const me = await adminApi.getMe(); state.adminRole = me.role; state.intercomEnabled = !!me.intercomEnabled; } catch (_) {}
    state.busy = false;
    state.pendingActivationEmail = null;
    state.pendingActivationToken = null;
    await loadDashboard();
  } catch (err) {
    state.busy = false;
    state.createPasswordError = err.message;
    render();
  }
}

async function handleSaveRequestStatus() {
  const status = document.getElementById('statusSelect').value;
  const note = document.getElementById('statusNote').value.trim();
  const scheduledDate = document.getElementById('scheduledDateInput').value;
  const scheduledTime = document.getElementById('scheduledTimeInput').value;

  // Assignment comes from whichever control is actually showing: a
  // chosen contractor's id, or free-typed text — never both.
  const urgentEl = document.getElementById('urgentCheckbox');
  const patch = { status, note, scheduledDate, scheduledTime, isUrgent: urgentEl ? urgentEl.checked : false };
  if (state.assignedMode === 'other') {
    patch.assignedTo = document.getElementById('assignedInput').value.trim();
  } else {
    const selectEl = document.getElementById('assignedContractorSelect');
    const val = selectEl ? selectEl.value : '';
    patch.assignedContractorId = val ? parseInt(val, 10) : null;
  }

  state.busy = true; render();
  try {
    await adminApi.updateRequest(state.requestDetail.id, patch);
    state.assignedContractorDraft = null;
    // Must be cleared on success too — it used to stay true forever, leaving every
    // button disabled (including the chat's send arrow) until the page was reloaded.
    state.busy = false;
    await openRequestDetail(state.requestDetail.id);

  const buildingCode = document.getElementById('rfBuilding').value.trim();

  state.busy = true; state.residentFormError = null; render();
  try {
    if (state.residentFormMode === 'add') {
      const created = await adminApi.createResident({ firstName, lastName, email, phone, apartmentNumber, buildingCode, parkingSpot, monthlyRent, leaseEnd, currency: 'CAD' });
      for (const doc of state.pendingResidentDocs) {

      }
      state.pendingResidentDocs = [];
      state.busy = false;
      await openResidentDetail(created.id);
    } else {
      await adminApi.updateResident(state.residentDetail.id, { firstName, lastName, phone, apartmentNumber, buildingCode, parkingSpot, monthlyRent, leaseEnd });

      await openResidentDetail(state.residentDetail.id);

document.addEventListener('change', (e) => { if (e.target && e.target.id === 'docFileInput') handleUploadResidentDoc(); });
async function handleUploadResidentDoc() {
  const docType = document.getElementById('docTypeSelect').value;
  const fileInput = document.getElementById('docFileInput');
  const file = fileInput.files && fileInput.files[0];
  if (!file) return;
  fileInput.value = '';

  if (state.residentFormMode === 'add') {
    state.pendingResidentDocs.push({ file, docType });
    render();
    return;
  }

  state.busy = true; render();
  try {
    await adminApi.uploadResidentDocument(state.residentDetail.id, file, docType);
    state.busy = false;
    await openResidentDetail(state.residentDetail.id);
  } catch (err) {
    state.busy = false;
    alert(err.message);
    render();
  }
}

async function viewResidentDocument(residentId, docId) {
  try {
    const token = adminApi.getToken();
    const res = await fetch(`/api/admin/residents/${residentId}/documents/${docId}`, {
      headers: token ? { Authorization: `Bearer ${token}` } : {},
    });
    if (!res.ok) throw new Error('Error');
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    window.open(url, '_blank');
  } catch (err) {
    alert(err.message);
  }
}

async function handleDeleteResidentDoc(docId) {
  if (!confirm(L.residentForm.docDeleteConfirm)) return;
  await adminApi.deleteResidentDocument(state.residentDetail.id, docId);
  await openResidentDetail(state.residentDetail.id);
}

async function downloadResidentDocument(residentId, docId, name) {
  try {
    const token = adminApi.getToken();
    const res = await fetch(`/api/admin/residents/${residentId}/documents/${docId}`, { headers: token ? { Authorization: `Bearer ${token}` } : {} });
    if (!res.ok) throw new Error('Error');
    const url = URL.createObjectURL(await res.blob());
    const a = document.createElement('a'); a.href = url; a.download = name || 'document';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  } catch (err) { alert(err.message); }
}

async function handleSavePassword() {
  const sv = L.settingsV;
  const currentPassword = document.getElementById('pwdCurrent').value;
  const newPassword = document.getElementById('pwdNew').value;
  const confirmPassword = document.getElementById('pwdConfirm').value;

  if (!currentPassword || !newPassword || !confirmPassword) {
    state.pwdError = sv.pwdAllRequired; state.pwdSaved = false; render(); return;
  }
  if (newPassword.length < 8) {
    state.pwdError = sv.pwdTooShort; state.pwdSaved = false; render(); return;
  }
  if (newPassword !== confirmPassword) {
    state.pwdError = sv.pwdMismatch; state.pwdSaved = false; render(); return;
  }

  state.busy = true; state.pwdError = null; state.pwdSaved = false; render();
  try {
    const { token } = await adminApi.changePassword(currentPassword, newPassword);
    // Same reasoning as the resident side: changing the password
    // revokes every token issued before now, including the one that
    // just made this request — the fresh one from the response has to
    // replace it.
    if (token) adminApi.setToken(token);
    state.busy = false;
    state.pwdSaved = true;
    render();
  } catch (err) {
    state.busy = false;
    state.pwdError = err.message;
    render();
  }
}

<script>// Actions: CSV import of residents, invitations, adoption card
// Part of the admin app: plain <script> files share one global scope; load order is set in index.html.
state.imp = null; state.onboarding = null; state.pendingOpen = false; state.obMsg = null;

// Excel in French writes ANSI files, newer exports use UTF-8: try UTF-8 first, fall back to Windows-1252.
function obDecode(buf) {
  try { return new TextDecoder('utf-8', { fatal: true }).decode(buf); } catch (_) { return new TextDecoder('windows-1252').decode(buf); }
}

function obReadForm() {
  if (!state.imp) return;
  const ta = document.getElementById('impText'); if (ta) state.imp.csv = ta.value;
  const b = document.getElementById('impBuilding'); if (b) state.imp.buildingCode = b.value;
  const c = document.getElementById('impSend'); if (c) state.imp.sendInvites = c.checked;
}

async function obImportOpen() {
  if (!state.buildingsList.length) { try { state.buildingsList = await adminApi.getBuildings(); } catch (_) {} }
  state.imp = { csv: '', buildingCode: '', preview: null, result: null, error: null, sendInvites: true };
  state.view = 'residentImport'; render();
}

async function obPreview() {
  obReadForm(); const t = L.onboardV;
  state.imp.error = null; state.imp.preview = null;
  if (!state.imp.csv.trim()) { state.imp.error = t.f_empty; render(); return; }
  state.busy = true; render();
  try { state.imp.preview = await adminApi.importPreview(state.imp.csv, state.imp.buildingCode); }
  catch (err) { state.imp.error = t['f_' + err.message] || err.message; }
  state.busy = false; render();
}

async function obCommit() {
  obReadForm(); const t = L.onboardV;
  state.busy = true; state.imp.error = null; render();
  try { state.imp.result = await adminApi.importCommit(state.imp.csv, state.imp.buildingCode, state.imp.sendInvites); obPoll(); }
  catch (err) { state.imp.error = t['f_' + err.message] || err.message; }
  state.busy = false; render();
}

function obTemplate() {
  const d = state.lang === 'fr' ? ';' : ',';
  const rows = [['First name', 'Last name', 'Email', 'Apartment', 'Building', 'Phone', 'Parking', 'Rent', 'Lease end'], ['Anna', 'Tremblay', 'anna@example.com', '101', (state.buildingsList[0] || {}).code || 'A', '514-555-0101', '', '1250', '2027-06-30']];
  const csv = '﻿' + rows.map(r => r.join(d)).join('\r\n') + '\r\n';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); a.download = 'residents-template.csv';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// While invitations are being sent in the background, refresh the numbers until the queue is empty.
function obPoll() {
  setTimeout(async () => {
    if (state.view !== 'residents') return;
    try { state.onboarding = await adminApi.getOnboarding(); } catch (_) { return; }
    render();
    if (state.onboarding.queue > 0) obPoll();
  }, 1500);
}

async function obInviteNeeded() {
  const o = state.onboarding; if (!o) return; const t = L.onboardV;
  const n = o.counts.not_invited + o.counts.expired; if (!n) return;
  if (!confirm(fmt(t.confirmInvite, { n }))) return;
  try { const r = await adminApi.inviteNeeded(); state.obMsg = fmt(t.invitesQueued, { n: r.queued }); } catch (err) { state.obMsg = err.message; }
  try { state.onboarding = await adminApi.getOnboarding(); } catch (_) {}
  render(); obPoll();
}

async function obInviteOne(id) {
  const t = L.onboardV; state.busy = true; state.obMsg = null; render();
  try { const r = await adminApi.inviteResident(id); state.obMsg = r.sent ? t.resent : t.resendFail; } catch (err) { state.obMsg = err.message; }
  try { state.onboarding = await adminApi.getOnboarding(); } catch (_) {}
  state.busy = false; render();
}

document.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-action^="ob-"]'); if (!btn) return;
  const a = btn.dataset.action;
  if (a === 'ob-import-open') obImportOpen();
  else if (a === 'ob-import-preview') obPreview();
  else if (a === 'ob-import-commit') obCommit();
  else if (a === 'ob-import-template') obTemplate();
  else if (a === 'ob-invite-needed') obInviteNeeded();
  else if (a === 'ob-invite-one') obInviteOne(btn.dataset.id);
  else if (a === 'ob-news-readers') {
    const id = parseInt(btn.dataset.news, 10);
    if (state.newsReaders && state.newsReaders.id === id) { state.newsReaders = null; render(); return; }
    state.newsReaders = { id, loading: true, read: [], unread: [] }; render();
    adminApi._request(`/api/admin/news/${id}/readers`).then((d) => { state.newsReaders = { id, ...d }; render(); }).catch(() => { state.newsReaders = null; render(); });
  }
  else if (a === 'ob-toggle-pending') { state.pendingOpen = !state.pendingOpen; render(); }
});

document.addEventListener('change', (e) => {
  if (!e.target || e.target.id !== 'impFile') return;
  const f = e.target.files && e.target.files[0]; if (!f) return;
  if (f.size > 95000) { state.imp.error = L.onboardV.f_too_many; render(); return; }
  f.arrayBuffer().then((buf) => { obReadForm(); state.imp.csv = obDecode(buf); state.imp.preview = null; state.imp.error = null; render(); });
});
</script>

document.addEventListener('click', async (e) => {
  const btn = e.target.closest('[data-action^="ev-"]'); if (!btn) return;
  const V = L.eventsV; const a = btn.dataset.action; const val = (id) => (document.getElementById(id) || {}).value || '';
  state.evError = null;
  try {
    if (a === 'ev-toggle') { state.evEditId = null; state.evOpen = state.evOpen === btn.dataset.k ? null : btn.dataset.k; render(); return; }
    if (a === 'ev-edit') { state.evEditId = parseInt(btn.dataset.id, 10); state.evOpen = 'event'; render(); const f = document.getElementById('evTitle'); if (f) f.scrollIntoView({ block: 'center' }); return; }
    if (a === 'ev-edit-cancel') { state.evEditId = null; state.evOpen = null; render(); return; }
    if (a === 'ev-att') {
      const id = parseInt(btn.dataset.id, 10);
      if (state.evAtt && state.evAtt.id === id) { state.evAtt = null; render(); return; }
      state.evAtt = { id, ...(await adminApi.getAttendees(id)) }; render(); return;
    }
    if (a === 'ev-save-event') {
      const title = val('evTitle').trim(); const date = val('evDate');
      if (!title || !date) { state.evError = V.required; render(); return; }
      state.busy = true; render();
      try { const body = { title, date, location: val('evPlace').trim(), startTime: val('evStart'), endTime: val('evEnd'), buildingCode: val('evBuilding'), body: val('evBody').trim() };
        if (state.evEditId) await adminApi.updateEvent(state.evEditId, body); else await adminApi.createEvent(body);
        state.evOpen = null; state.evEditId = null; }
      finally { state.busy = false; }
    }
    if (a === 'ev-save-poll') {
      const question = val('plQuestion').trim(); const options = val('plOptions').split('\n').map(s => s.trim()).filter(Boolean);
      if (!question || options.length < 2) { state.evError = V.pRequired; render(); return; }
      state.busy = true; render();
      try { await adminApi.createPoll({ question, options, buildingCode: val('plBuilding') }); state.evOpen = null; }
      finally { state.busy = false; }
    }
    if (a === 'ev-del-event') { if (!confirm(V.confirmDel)) return; await adminApi.deleteEvent(btn.dataset.id); state.evAtt = null; }
    if (a === 'ev-del-poll') { if (!confirm(V.confirmDel)) return; await adminApi.deletePoll(btn.dataset.id); }
    if (a === 'ev-close-poll') await adminApi.setPollClosed(btn.dataset.id, btn.dataset.c === '1');
  } catch (err) { state.evError = err.message; }
  try { [state.eventsList, state.pollsList] = await Promise.all([adminApi.getEvents(), adminApi.getPolls()]); } catch (_) {}
  render();
});
</script>
<script>// Inspection reports: list, creation form, and the room-by-room editor with photos.
const inspBlobCache = new Map();
function inspBlob(id, photoId) {
  const k = id + '/' + photoId;
  if (!inspBlobCache.has(k)) {
    const t = adminApi.getToken();
    inspBlobCache.set(k, fetch(`/api/admin/inspections/${id}/photos/${photoId}`, { headers: t ? { Authorization: `Bearer ${t}` } : {} })
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.blob(); }).then(b => URL.createObjectURL(b)));
  }
  return inspBlobCache.get(k);
}
function fillInspThumbs() {
  document.querySelectorAll('[data-insp-thumb]:not([src])').forEach(img => {
    if (img.tagName !== 'VIDEO') img.src = 'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
    inspBlob(img.dataset.insp, img.dataset.photo).then(u => { img.src = u; }).catch(() => {});
  });
}
new MutationObserver(fillInspThumbs).observe(document.documentElement, { childList: true, subtree: true });

async function inspReload() { state.inspDetail = await adminApi.getInspection(state.inspDetail.id); render(); }

document.addEventListener('click', async (e) => {
  const btn = e.target.closest('[data-action^="insp-"]'); if (!btn) return;
  const V = L.inspV; const a = btn.dataset.action; const val = (id) => (document.getElementById(id) || {}).value || '';
  state.inspError = null;
  try {
    if (a === 'insp-toggle-form') { state.inspForm = !state.inspForm; render(); return; }
    if (a === 'insp-back') { e.preventDefault(); loadInspections(); return; }
    if (a === 'insp-open') { state.inspDetail = await adminApi.getInspection(btn.dataset.id); state.view = 'inspectionDetail'; render(); return; }
    if (a === 'insp-create') {
      const residentId = parseInt(val('inResident'), 10) || null;
      if (!residentId && !val('inApt').trim()) { state.inspError = V.targetErr; render(); return; }
      const r = await adminApi.createInspection({ kind: val('inKind'), date: val('inDate'), residentId, apartment: val('inApt').trim(), residentName: val('inName').trim(), rooms: val('inRooms').split('\n').map(s => s.trim()).filter(Boolean) });
      state.inspForm = false; state.inspDetail = await adminApi.getInspection(r.id); state.view = 'inspectionDetail'; render(); return;
    }
    const id = state.inspDetail && state.inspDetail.id;
    if (a === 'insp-status') { await adminApi.patchInspection(id, { status: btn.dataset.s }); await inspReload(); return; }
    if (a === 'insp-delete') { if (!confirm(V.confirmDel)) return; await adminApi.deleteInspection(id); loadInspections(); return; }
    if (a === 'insp-add-item') { const room = val('inNewRoom').trim(); if (!room) return; await adminApi.addInspItem(id, room); await inspReload(); return; }

<script>// Request attachments in The Office: thumbnails + a full-screen viewer (photo / video) with prev/next/download.
// Files sit behind the admin token, so each one is fetched with it and shown from a blob URL (cached per file).
const adminBlobCache = new Map();

function adminBlob(req, att) {
  const k = req + '/' + att;
  if (!adminBlobCache.has(k)) {
    const token = adminApi.getToken();
    adminBlobCache.set(k, fetch(`/api/admin/requests/${req}/attachments/${att}`, { headers: token ? { Authorization: `Bearer ${token}` } : {} })
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.blob(); })
      .then(b => URL.createObjectURL(b)));
  }
  return adminBlobCache.get(k);
}

// Thumbnails are drawn by the view as empty <img data-admin-thumb>; fill them in as they appear.
function fillAdminThumbs() {
  document.querySelectorAll('img[data-admin-thumb]:not([src])').forEach(img => {
    img.src = 'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
    adminBlob(img.dataset.req, img.dataset.att).then(u => { img.src = u; }).catch(() => {});
  });
}
new MutationObserver(fillAdminThumbs).observe(document.documentElement, { childList: true, subtree: true });

function openAdminMedia(btn) {
  const items = [...btn.closest('[data-att-grid]').querySelectorAll('button[data-att]')].map(b => ({ req: b.dataset.req, att: b.dataset.att, mime: b.dataset.mime, name: b.dataset.name }));
  let i = items.findIndex(x => x.att === btn.dataset.att);
  const esc2 = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const lb = document.createElement('div');
  lb.className = 'media-lb';
  lb.innerHTML = `<div class="media-lb-bar"><span class="nm"></span><a class="media-lb-btn" data-dl>${esc2(L.requestDetail.mediaDownload)}</a><button class="media-lb-btn" data-x>${esc2(L.requestDetail.mediaClose)}</button></div>
    <div class="media-lb-stage"><button class="media-lb-nav prev" aria-label="${esc2(L.requestDetail.mediaPrev)}">‹</button><div data-slot></div><button class="media-lb-nav next" aria-label="${esc2(L.requestDetail.mediaNext)}">›</button></div>`;
  const slot = lb.querySelector('[data-slot]');
  slot.style.cssText = 'max-width:100%;max-height:100%;display:flex;align-items:center;justify-content:center;';
  const close = () => { lb.remove(); document.removeEventListener('keydown', onKey, true); };
  const show = async (n) => {
    i = (n + items.length) % items.length; const it = items[i];
    lb.querySelector('.nm').textContent = (items.length > 1 ? `${i + 1}/${items.length} · ` : '') + it.name;
    slot.innerHTML = '';
    lb.querySelectorAll('.media-lb-nav').forEach(b => { b.style.display = items.length > 1 ? '' : 'none'; });
    try {
      const u = await adminBlob(it.req, it.att); if (items[i] !== it) return;
      const el = document.createElement(it.mime.startsWith('video/') ? 'video' : 'img');
      el.src = u; if (el.tagName === 'VIDEO') { el.controls = true; el.autoplay = true; el.style.maxHeight = '100%'; }
      slot.appendChild(el);
      const dl = lb.querySelector('[data-dl]'); dl.href = u; dl.download = it.name || 'file';
    } catch (e) { slot.textContent = e.message; slot.style.color = '#fff'; }
  };
  const onKey = (e) => {
    if (e.key === 'Escape') { e.stopPropagation(); close(); }
    else if (e.key === 'ArrowLeft') show(i - 1);
    else if (e.key === 'ArrowRight') show(i + 1);
  };
  lb.addEventListener('click', (e) => { if (e.target === lb || e.target.closest('[data-x]')) close(); else if (e.target.closest('.prev')) show(i - 1); else if (e.target.closest('.next')) show(i + 1); });
  document.addEventListener('keydown', onKey, true);
  document.body.appendChild(lb);
  show(i);
}
</script>

<script>// Date-only values (YYYY-MM-DD) must not go through the timestamp formatter (it shifts them by the time zone).

document.addEventListener('input', (e) => {

document.addEventListener('change', async (e) => {

  if (t.dataset.schAdd !== undefined && state.schAdd && t.dataset.f !== 'title') { state.schAdd[t.dataset.f] = t.value; if (t.dataset.f === 'type') render(); return; }
  if (t.dataset.schAuto !== undefined) {

    const key = t.dataset.f; const val = t.type === 'checkbox' ? t.checked : (key === 'autoWeekday' ? Number(t.value) : t.value);
    try { await adminApi._request('/api/admin/schedule/sections/' + s.id, { method: 'PATCH', body: JSON.stringify({ [key]: val }) }); s[key] = val; } catch (err) { state.schMsg = { ok: false, text: err.message }; }

document.addEventListener('click', async (e) => {

  try {

<script>// Law 25 in The Office: privacy requests card, export of a resident's data, "departed" status. Own handlers (prefix "pr-").

        <button class="btn btn-primary" style="width:auto; padding:6px 12px; font-size:11.5px;" data-action="pr-delete" data-id="${q.id}">${V.delData}</button>
        <button class="btn btn-secondary" style="width:auto; padding:6px 12px; font-size:11.5px;" data-action="pr-keep" data-id="${q.id}">${V.keepData}</button></div>

  </div>`;
}
function residentPrivacyCard(r) {

    <div style="font-size:12px; color:var(--g500); margin-bottom:10px; line-height:1.5;">${(r.departedAt ? V.departedNote : V.activeNote).replace('{days}', days)}${r.departedAt ? ` (${esc(r.departedAt)})` : ''}</div>

async function prDownloadExport(id) {
  const res = await fetch(`/api/admin/residents/${id}/export`, { headers: { Authorization: 'Bearer ' + adminApi.getToken() } });
  if (!res.ok) throw new Error('Export failed');
  const url = URL.createObjectURL(await res.blob()); const a = document.createElement('a'); a.href = url; a.download = `resident-${id}-data.json`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
}
document.addEventListener('click', async (e) => {

<script>// Global event listeners (submit, input, change, keydown, click)
