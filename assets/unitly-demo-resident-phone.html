&lt;script&gt;// render(), initial data loading and navigation helpers
// Part of the resident app: plain &lt;script&gt; files share one global scope; load order is set in
// index.html.
// A refresh must bring the person back to the screen they were on. The section lives in the
// address (#messages);
// a detail screen counts as its list, the screens of signing in count as nothing.
const SECTION_PARENT = {
  detail: &#x27;requests&#x27;,
  newsDetail: &#x27;buildingNews&#x27;,
  requestForm: &#x27;services&#x27;,
  amenityBooking: &#x27;amenities&#x27;,
  reportForm: &#x27;record&#x27;,
  incident: &#x27;record&#x27;,
  myInspection: &#x27;record&#x27;,
};
const SECTION_OPEN = {
  home: () =&gt; showView(&#x27;home&#x27;),
  services: () =&gt; showView(&#x27;services&#x27;),
  requests: () =&gt; showView(&#x27;requests&#x27;),
  profile: () =&gt; showView(&#x27;profile&#x27;),
  guestParking: () =&gt; showView(&#x27;guestParking&#x27;),
  payments: () =&gt; showView(&#x27;payments&#x27;),
  buildingNews: () =&gt; openBuildingNews(),
  amenities: () =&gt; openAmenities(),
  myBookings: () =&gt; openMyBookings(),
  notifications: () =&gt; openNotifications(),
  documents: () =&gt; openDocuments(),
  messages: () =&gt; openMessages(),
  management: () =&gt; openManagement(),
  myVehicles: () =&gt; openVehicles(),
  anonReport: () =&gt; openAnon(),
  leaseRenewal: () =&gt; openLease(),
  schedule: () =&gt; openSchedule(),
  moves: () =&gt; openMoves(),
  community: () =&gt; openCommunity(),
  record: () =&gt; openRecord(),
  personalInfo: () =&gt; {
    showView(&#x27;personalInfo&#x27;);
    pvLoad();
    hhLoad();
  },
};
// Bottom bar and desktop menu: home, services, door phone, notices, profile.
const TAB_KEYS = [&#x27;home&#x27;, &#x27;services&#x27;, &#x27;notifications&#x27;, &#x27;profile&#x27;];
function navLabel(k) {
  if (k === &#x27;intercom&#x27;) return icT().title;
  if (k === &#x27;notifications&#x27;) return L.notif.title;
  return L.nav[k];
}
function rememberSection() {
  const sec = SECTION_PARENT[state.view] || (SECTION_OPEN[state.view] ? state.view : null);
  const base = location.pathname + location.search;
  if (sec) {
    if (location.hash !== &#x27;#&#x27; + sec) void(null, &#x27;&#x27;, base + &#x27;#&#x27; + sec);
  } else if (location.hash) void(null, &#x27;&#x27;, base); // sign-in screens: no section
}
function render() {
  // Screen change: take the old screen off before the header/layout changes, to cross-fade it
  // out below.
  const rootEl = document.getElementById(&#x27;viewRoot&#x27;);
  const SIGNIN = [&#x27;login&#x27;, &#x27;firstTime&#x27;, &#x27;forgotPassword&#x27;, &#x27;createPassword&#x27;, &#x27;signup&#x27;];
  // sign out / sign in: no transition, it only jerks
  const modeSwitch = SIGNIN.includes(state.view) !== SIGNIN.includes(state._shown);
  const ghost =
    state.view !== state._shown &amp;&amp; state._shown &amp;&amp; !modeSwitch &amp;&amp; rootEl.firstChild &amp;&amp; viewGhostOk()
      ? viewGhostTake(rootEl)
      : null;
  L = langFor();
  document.documentElement.lang = state.lang;
  document.documentElement.dir = state.lang === &#x27;ar&#x27; ? &#x27;rtl&#x27; : &#x27;ltr&#x27;;

  rememberSection();
  const isLogin =
    state.view === &#x27;login&#x27; ||
    state.view === &#x27;firstTime&#x27; ||
    state.view === &#x27;forgotPassword&#x27; ||
    state.view === &#x27;createPassword&#x27; ||
    state.view === &#x27;signup&#x27;;
  document.body.classList.toggle(&#x27;login-mode&#x27;, isLogin);
  document.querySelector(&#x27;header.site&#x27;).style.display = isLogin ? &#x27;none&#x27; : &#x27;&#x27;;
  document.getElementById(&#x27;tabBar&#x27;).style.display = isLogin ? &#x27;none&#x27; : &#x27;&#x27;;
  document.querySelector(&#x27;footer.site&#x27;).style.display = isLogin ? &#x27;none&#x27; : &#x27;&#x27;;

  if (!isLogin &amp;&amp; state.resident) {
    document.getElementById(&#x27;aptChip&#x27;).textContent =
      `${L.aptPrefix} ${state.resident.apartmentNumber}`;
    document.getElementById(&#x27;parkingChip&#x27;).textContent =
      `${L.parkingPrefix} ${state.resident.parkingSpot || &#x27;—&#x27;}`;
  }
  // Red bar under the header while an urgent alert from management is unread.
  const alertBar = document.getElementById(&#x27;alertBar&#x27;);
  if (alertBar) {
    const al = isLogin
      ? null
      : (state.notifications || []).find(n =&gt; n.kind === &#x27;alert&#x27; &amp;&amp; !n.read);
    alertBar.innerHTML = al
      ? `&lt;button class=&quot;alert-bar&quot; data-go=&quot;notifications&quot; role=&quot;alert&quot;&gt;&lt;span
        class=&quot;alert-bar-label&quot;&gt;${lineIcon(NOTIF_SHAPE.alert, 14, 2.2)}${esc(L.notif.urgent.toUpperCase())}&lt;/span&gt;&lt;span
          class=&quot;alert-bar-title&quot;&gt;${esc((al.params || {}).title || &#x27;&#x27;)}&lt;/span&gt;&lt;/button&gt;`
      : &#x27;&#x27;;
  }
  document.getElementById(&#x27;footerRights&#x27;).textContent = L.footer.rights;
  document.getElementById(&#x27;footerLinks&#x27;).innerHTML =
    `&lt;a href=&quot;#&quot;&gt;${L.footer.privacy}&lt;/a&gt;&lt;a href=&quot;#&quot;&gt;${L.footer.terms}&lt;/a&gt;&lt;a href=&quot;#&quot;&gt;${L.footer.contact}&lt;/a&gt;`;

  document.getElementById(&#x27;mainNav&#x27;).innerHTML = TAB_KEYS.map(
    k =&gt; `&lt;a href=&quot;#&quot; data-go=&quot;${k}&quot; class=&quot;${state.view === k ? &#x27;active&#x27; : &#x27;&#x27;}&quot;&gt;${navLabel(k)}&lt;/a&gt;`
  ).join(&#x27;&#x27;);

  // The bar is built once per language; a render only moves the highlight, so the pill glides
  // from one tab to the next.
  const tabBar = document.getElementById(&#x27;tabBar&#x27;);
  const tabKeys = TAB_KEYS;
  const sig = tabKeys.map(navLabel).join(&#x27;|&#x27;);
  if (tabBar.dataset.sig !== sig) {
    tabBar.dataset.sig = sig;
    tabBar.classList.remove(&#x27;ready&#x27;);
    tabBar.innerHTML =
      &#x27;&lt;span class=&quot;tab-pill&quot;&gt;&lt;/span&gt;&#x27; +
      tabKeys
        .map(
          k =&gt;
            `&lt;button class=&quot;tab-item&quot; data-go=&quot;${k}&quot;&gt;
        &lt;svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.7&quot;
          stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;&gt;${tabIcons[k]}&lt;/svg&gt;
        &lt;span class=&quot;tab-label&quot;&gt;${navLabel(k)}&lt;/span&gt;
      &lt;/button&gt;`
        )
        .join(&#x27;&#x27;);
  }
  // requests are part of Services, so that tab stays lit inside them
  const tabView = [&#x27;requests&#x27;, &#x27;detail&#x27;, &#x27;requestForm&#x27;].includes(state.view)
    ? &#x27;services&#x27;
    : state.view;
  const at = tabKeys.indexOf(tabView);
  tabBar.style.setProperty(&#x27;--n&#x27;, tabKeys.length);
  tabBar.querySelectorAll(&#x27;.tab-item&#x27;).forEach((b, i) =&gt; b.classList.toggle(&#x27;active&#x27;, i === at));
  tabBar.classList.toggle(&#x27;no-active&#x27;, at &lt; 0);
  tabBar
    .querySelector(&#x27;[data-go=&quot;notifications&quot;]&#x27;)
    .classList.toggle(&#x27;has-unread&#x27;, !!state.unreadCount);
  if (at &gt;= 0) tabBar.style.setProperty(&#x27;--i&#x27;, at);
  // no glide on the very first paint
  if (!tabBar.classList.contains(&#x27;ready&#x27;)) setTimeout(() =&gt; tabBar.classList.add(&#x27;ready&#x27;), 60);

  // Entrance motion plays only when the screen actually changes (not on every busy/error redraw).
  const TABS = TAB_KEYS;
  const entering = state.view !== state._shown;
  // Back to a tab or to the sign-in page slides from the left; anything deeper slides in from
  // the right.
  const dir =
    !entering || modeSwitch
      ? &#x27;&#x27;
      : TABS.includes(state.view)
        ? TABS.includes(state._shown)
          ? &#x27;fade&#x27;
          : &#x27;back&#x27;
        : state.view === &#x27;login&#x27;
          ? &#x27;back&#x27;
          : &#x27;forward&#x27;;
  document.body.dataset.enter = entering ? &#x27;1&#x27; : &#x27;0&#x27;;
  const root = document.getElementById(&#x27;viewRoot&#x27;);
  state._shown = state.view;
  root.innerHTML = views[state.view] ? views[state.view]() : views.login();
  const chat = root.querySelector(&#x27;.chat-list&#x27;);
  if (chat) chat.scrollTop = chat.scrollHeight; // chat: newest message in view
  // Restart the screen animation even when it is the same kind as the last one (tab → tab is
  // &quot;fade&quot; every time).
  root.removeAttribute(&#x27;data-dir&#x27;);
  void root.offsetWidth;
  root.dataset.dir = dir;
  if (ghost) viewGhostPlay(ghost, dir);
  if (entering) {
    revealOnScroll(root);
    // A new screen starts at the top at once (a smooth glide under the slide-in looks like a jolt);
    // a redraw of the same screen (busy, error, live update) keeps the reader where they are.
    window.scrollTo({ top: 0, behavior: &#x27;instant&#x27; });
    const m = document.querySelector(&#x27;main&#x27;);
    if (m) m.scrollTop = 0; // phones: &lt;main&gt; is the scroller
  }
}

// The old screen stays a moment as a frozen, non-clickable copy at its place and fades out while
// the new
// one comes in: a cross-fade instead of a cut. render() itself stays synchronous (the DOM is the
// new screen).
function viewGhostOk() {
  return !(window.matchMedia &amp;&amp; matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches);
}
function viewGhostTake(root) {
  document.querySelectorAll(&#x27;.view-ghost&#x27;).forEach(g =&gt; g.remove());
  const r = root.getBoundingClientRect();
  const g = document.createElement(&#x27;div&#x27;);
  g.className = &#x27;view-ghost&#x27;;
  g.setAttribute(&#x27;aria-hidden&#x27;, &#x27;true&#x27;);
  g.inert = true;
  Object.assign(g.style, {
    top: r.top + &#x27;px&#x27;,
    left: r.left + &#x27;px&#x27;,
    width: r.width + &#x27;px&#x27;,
    height: r.height + &#x27;px&#x27;,
  });
  while (root.firstChild) g.appendChild(root.firstChild);
  return g;
}
function viewGhostPlay(g, dir) {
  g.classList.add(&#x27;ghost-&#x27; + (dir || &#x27;fade&#x27;));
  document.body.appendChild(g);
  const done = () =&gt; g.remove();
  g.addEventListener(&#x27;animationend&#x27;, done, { once: true });
  setTimeout(done, 600);
}

async function loadInitialData() {
  const [resident, requests, settings] = await Promise.all([
    api.getMe(),
    api.getRequests(),
    api.getSettings().catch(() =&gt; null),
  ]);
  state.resident = resident;
  state.requests = requests;
  refreshNotifications(true);
  refreshSchedule();
  if (settings) {
    state.services = settings.services || null;
    state.managementPhone = settings.managementPhone || null;
    state.managementEmail = settings.managementEmail || null;
    state.managementWebsite = settings.managementWebsite || null;
    state.managementAddress = settings.managementAddress || null;
  }
}

// Services management currently offers, in display order. Before the
// settings have loaded (or if that call failed) everything is shown, so a
// hiccup never hides the whole services screen.
function enabledServices() {
  if (!state.services) return serviceOrder;
  return serviceOrder.filter(k =&gt; !state.services[k] || state.services[k].enabled);
}

function servicePrice(key) {
  const sv = state.services &amp;&amp; state.services[key];
  return sv &amp;&amp; sv.price !== null &amp;&amp; sv.price !== undefined ? sv.price : null;
}

function fmtPrice(n) {
  const localeMap = {
    fr: &#x27;fr-CA&#x27;,
    en: &#x27;en-CA&#x27;,
    uk: &#x27;uk-UA&#x27;,
    es: &#x27;es-MX&#x27;,
    ru: &#x27;ru-RU&#x27;,
    zh: &#x27;zh-CN&#x27;,
    ar: &#x27;ar&#x27;,
  };
  return new Intl.NumberFormat(localeMap[state.lang] || &#x27;fr-CA&#x27;, {
    style: &#x27;currency&#x27;,
    currency: &#x27;CAD&#x27;,
    minimumFractionDigits: Number.isInteger(n) ? 0 : 2,
  }).format(n);
}

async function goHome() {
  state.view = &#x27;home&#x27;;
  render();
}

async function showView(key) {
  state.view = key;
  state.loginError = null;
  state.formError = null;
  state.saveMessage = null;
  state.emailCodeError = null;
  state.firstTimeError = null;
  state.createPasswordError = null;
  state.pwdError = null;
  state.pwdSaved = false;
  state.firstTimeSent = false;
  state.firstTimeInfo = null;
  state.firstTimeDraft = null;
  state.forgotPasswordSent = false;
  state.forgotPasswordError = null;
  state.resetInfo = null;
  state.resetDraft = null;
  render();
}

// Rows below the fold wait and rise into place as they scroll into view (only on a screen change).
let revealObserver = null;
function revealOnScroll(root) {
  if (revealObserver) {
    revealObserver.disconnect();
    revealObserver = null;
  }
  if (
    !(&#x27;IntersectionObserver&#x27; in window) ||
    (window.matchMedia &amp;&amp; matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches)
  )
    return;
  const items = root.querySelectorAll(&#x27;.req-row, .svc-row, .notif-row, .section, .building-item&#x27;);
  const mn = document.querySelector(&#x27;main&#x27;);
  const fold = Math.min(
    window.innerHeight,
    mn ? mn.getBoundingClientRect().bottom : window.innerHeight
  ); // phones: above the tab bar
  const late = [...items].filter(el =&gt; el.getBoundingClientRect().top &gt; fold + 20);
  if (!late.length) return;
  revealObserver = new IntersectionObserver(
    entries =&gt; {
      entries.forEach(en =&gt; {
        if (en.isIntersecting) {
          en.target.classList.add(&#x27;in&#x27;);
          revealObserver.unobserve(en.target);
        }
      });
    },
    { rootMargin: &#x27;0px 0px -8% 0px&#x27; }
  );
  late.forEach(el =&gt; {
    el.classList.add(&#x27;rv&#x27;);
    revealObserver.observe(el);
  });
}
&lt;/script&gt;
&lt;script&gt;// Actions: sign in, passwords, requests, bookings, guest parking, messages, documents, profile,
// sign out
// Part of the resident app: plain &lt;script&gt; files share one global scope; load order is set in
// index.html.
async function handleLoginSubmit(email, password) {
  state.busy = true;
  state.loginError = null;
  render();
  try {
    const answer = await api.login(email, password);
    if (answer.needsCode) {
      // A new device: the password was right, now the code that was e-mailed must be typed.
      state.loginChallenge = { id: answer.challengeId, hint: answer.emailHint };
      state.loginInfo = null;
      state.busy = false;
      render();
      return;
    }
    await finishSignIn(answer.token);
  } catch (err) {
    state.busy = false;
    state.loginError = err.message;
    render();
  }
}

async function finishSignIn(token) {
  api.setToken(token);
  state.loginChallenge = null;
  await loadInitialData();
  state.busy = false;
  await goHome();
}

// What to tell the resident when the code step fails (the server&#x27;s words are English).
function loginCodeMessage(err) {
  if (err.code === &#x27;bad_code&#x27;) return L.login.codeBad;
  if (err.code === &#x27;expired&#x27;) return L.login.codeExpired;
  if (err.code === &#x27;too_many_codes&#x27;) return L.login.codeTooMany;
  return err.message;
}

async function handleLoginCode(code, remember) {
  state.busy = true;
  state.loginError = null;
  render();
  try {
    const answer = await api.loginCode(state.loginChallenge.id, code, remember);
    await finishSignIn(answer.token);
  } catch (err) {
    state.busy = false;
    state.loginError = loginCodeMessage(err);
    // An expired or burned code cannot be tried again: back to the password step.
    if (err.code === &#x27;expired&#x27;) state.loginChallenge = null;
    render();
  }
}

async function handleLoginCodeResend() {
  state.loginError = null;
  try {
    const answer = await api.loginCodeResend(state.loginChallenge.id);
    state.loginChallenge = { id: answer.challengeId, hint: answer.emailHint };
    state.loginInfo = L.login.codeResent;
  } catch (err) {
    state.loginInfo = null;
    state.loginError = loginCodeMessage(err);
    if (err.code === &#x27;expired&#x27;) state.loginChallenge = null;
  }
  render();
}

function handleLoginCodeBack() {
  state.loginChallenge = null;
  state.loginError = null;
  state.loginInfo = null;
  render();
}

// &quot;Forgot password&quot;: a 6-digit code goes to the account&#x27;s e-mail, then code + new password on
// the same page.
async function handleForgotPassword(email) {
  state.busy = true;
  state.forgotPasswordError = null;
  state.resetInfo = null;
  render();
  try {
    await api.forgotCode(email);
    state.resetEmail = email;
    state.forgotPasswordSent = true;
  } catch (err) {
    state.forgotPasswordError = err.message;
  }
  state.busy = false;
  render();
}

async function handleResendResetCode() {
  state.busy = true;
  state.forgotPasswordError = null;
  state.resetInfo = null;
  render();
  try {
    await api.forgotCode(state.resetEmail);
    state.resetInfo = L.firstTime.resent;
  } catch (err) {
    state.forgotPasswordError = err.message;
  }
  state.busy = false;
  render();
}

async function handleResetCode(code, password, confirmPassword) {
  state.resetInfo = null;
  // an error redraws the form: keep what was typed
  state.resetDraft = { code, password, confirmPassword };
  if (password.length &lt; 8) {
    state.forgotPasswordError = L.createPassword.tooShort;
    render();
    return;
  }
  if (password !== confirmPassword) {
    state.forgotPasswordError = L.createPassword.mismatch;
    render();
    return;
  }
  state.busy = true;
  state.forgotPasswordError = null;
  render();
  try {
    const { token } = await api.resetPasswordByCode(state.resetEmail, code, password);
    api.setToken(token);
    await loadInitialData();
    state.busy = false;
    state.resetEmail = null;
    state.forgotPasswordSent = false;
    state.resetDraft = null;
    await goHome();
  } catch (err) {
    state.busy = false;
    state.forgotPasswordError =
      err.code === &#x27;bad_code&#x27;
        ? L.firstTime.badCode
        : err.code === &#x27;too_many&#x27;
          ? L.firstTime.tooMany
          : err.message;
    render();
  }
}

// &quot;First time here&quot;: a 6-digit code goes to the e-mail, then code + new password are entered on
// the same page.
async function handleCheckEmail(email) {
  state.busy = true;
  state.firstTimeError = null;
  state.firstTimeInfo = null;
  render();
  try {
    await api.sendCode(email);
    state.busy = false;
    state.firstTimeEmail = email;
    state.firstTimeSent = true;
    render();
  } catch (err) {
    state.busy = false;
    state.firstTimeError = err.message;
    render();
  }
}

async function handleResendCode() {
  state.busy = true;
  state.firstTimeError = null;
  state.firstTimeInfo = null;
  render();
  try {
    await api.sendCode(state.firstTimeEmail);
    state.firstTimeInfo = L.firstTime.resent;
  } catch (err) {
    state.firstTimeError = err.message;
  }
  state.busy = false;
  render();
}

async function handleFirstTimeCode(code, password, confirmPassword) {
  state.firstTimeInfo = null;
  // an error redraws the form: keep what was typed
  state.firstTimeDraft = { code, password, confirmPassword };
  if (password.length &lt; 8) {
    state.firstTimeError = L.createPassword.tooShort;
    render();
    return;
  }
  if (password !== confirmPassword) {
    state.firstTimeError = L.createPassword.mismatch;
    render();
    return;
  }
  state.busy = true;
  state.firstTimeError = null;
  render();
  try {
    const { token } = await api.setPasswordByCode(state.firstTimeEmail, code, password);
    api.setToken(token);
    await loadInitialData();
    state.busy = false;
    state.firstTimeEmail = null;
    state.firstTimeSent = false;
    state.firstTimeDraft = null;
    await goHome();
  } catch (err) {
    state.busy = false;
    state.firstTimeError =
      err.code === &#x27;bad_code&#x27;
        ? L.firstTime.badCode
        : err.code === &#x27;too_many&#x27;
          ? L.firstTime.tooMany
          : err.message;
    render();
  }
}

async function handleCreatePassword(password, confirmPassword) {
  if (password.length &lt; 8) {
    state.createPasswordError = L.createPassword.tooShort;
    render();
    return;
  }
  if (password !== confirmPassword) {
    state.createPasswordError = L.createPassword.mismatch;
    render();
    return;
  }
  state.busy = true;
  state.createPasswordError = null;
  render();
  try {
    const { token } = await api.setPassword(
      state.pendingActivationEmail,
      state.pendingActivationToken,
      password
    );
    api.setToken(token);
    await loadInitialData();
    state.busy = false;
    state.pendingActivationEmail = undefined;
    state.pendingActivationToken = undefined;
    await goHome();
  } catch (err) {
    state.busy = false;
    state.createPasswordError = err.message;
    render();
  }
}

  const preferredDate = ymdLocal(formDays()[state.selectedDateIdx ?? 1]);
  const preferredTime = L.form.timeOptions[state.selectedTimeIdx ?? 1];
  state.busy = true;
  state.formError = null;
  render();
  try {
    const created = await api.createRequest({
      category: state.activeService,
      description,
      preferredDate,
      preferredTime,
    });

    // Upload any selected photo/video now that the request exists.
    // The request already exists: a file that fails is reported on the confirmation screen,
    // never by

    state.uploadWarn = null;
    for (const f of [state.reqPhotoFile, state.reqVideoFile]) {

    state.requests = await api.getRequests();
    state.selectedDateIdx = undefined;
    state.selectedTimeIdx = undefined;
    state.reqPhotoFile = undefined;
    state.reqPhotoName = undefined;
    state.reqVideoFile = undefined;
    state.reqVideoName = undefined;
    state.busy = false;
    state.confirmKind = undefined;
    showView(&#x27;confirm&#x27;);

async function refreshNotifications(silent) {
  try {
    const data = await api.getNotifications();
    const changed = data.unread !== state.unreadCount;
    state.notifications = data.items;
    state.unreadCount = data.unread;
    if (silent) {

    }
  } catch (err) {

  }
}

async function handleOpenNotification(id) {
  const n = (state.notifications || []).find(x =&gt; String(x.id) === String(id));
  if (!n) return;
  if (!n.read) {
    try {
      await api.readNotification(n.id);
    } catch (e) {}
    n.read = true;
    state.unreadCount = Math.max(0, (state.unreadCount || 0) - 1);
  }
  if (n.kind === &#x27;request_status&#x27;) return openRequestDetail(n.params.requestId);
  if (n.kind === &#x27;booking_cancelled&#x27; || n.kind === &#x27;booking_reminder&#x27;) return openMyBookings();
  if (n.kind === &#x27;move_status&#x27;) return openMoves();
  if (n.kind === &#x27;elevator_busy&#x27;) return;
  if (n.kind === &#x27;snow_move&#x27; || n.kind === &#x27;schedule&#x27;) return openSchedule();
  if (n.kind === &#x27;lease_offer&#x27; || n.kind === &#x27;lease_renewal&#x27;) return openLease();
  if (n.kind === &#x27;event&#x27; || n.kind === &#x27;poll&#x27;) return openCommunity();
  if (n.kind === &#x27;incident&#x27;) return openIncident((n.params || {}).incidentId);
  if (n.kind === &#x27;inspection&#x27;) return openMyInspection((n.params || {}).inspectionId);
  if (n.kind === &#x27;tires_season&#x27;) return openTires();
  if (n.kind === &#x27;news&#x27;) {
    // remember where the tap came from, so &quot;back&quot; returns there and not to the news list
    state.newsBack = state.view === &#x27;home&#x27; || state.view === &#x27;notifications&#x27; ? state.view : null;
    return openBuildingNews((n.params || {}).newsId);
  }
  if (n.kind === &#x27;document&#x27;) return openDocuments();
  if (n.kind === &#x27;message&#x27; || n.kind === &#x27;lease_renewal&#x27;) return openMessages();
  render();
}

// Documents (like attachments) are behind auth, so fetch with the token
// and open the result as a blob URL rather than using a plain &lt;a href&gt;.
async function viewDocument(docId, filename) {
  try {
    const token = api.getToken();
    const res = await fetch(`/api/documents/${docId}`, {
      headers: token ? { Authorization: `Bearer ${token}` } : {},
    });
    if (!res.ok) throw new Error(&#x27;Could not load the document.&#x27;);
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement(&#x27;a&#x27;);
    a.href = url;
    a.download = filename || &#x27;document&#x27;;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  } catch (err) {
    alert(err.message);
  }
}

async function downloadAllDocuments() {
  try {
    const token = api.getToken();
    const res = await fetch(&#x27;/api/documents/download-all&#x27;, {
      headers: token ? { Authorization: `Bearer ${token}` } : {},
    });
    if (!res.ok) throw new Error(L.documents.downloadAllError);
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement(&#x27;a&#x27;);
    a.href = url;
    a.download = `documents-${
      (window.COMPANY_NAME || &#x27;&#x27;)
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, &#x27;-&#x27;)
        .replace(/^-|-$/g, &#x27;&#x27;) || &#x27;all&#x27;
    }.zip`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  } catch (err) {
    alert(err.message);
  }
}

async function handleSaveContact() {
  const email = document.getElementById(&#x27;piEmail&#x27;).value.trim();
  const phone = document.getElementById(&#x27;piPhone&#x27;).value.trim();
  const emailChanged = email.toLowerCase() !== String(state.resident.email || &#x27;&#x27;).toLowerCase();
  const pwdEl = document.getElementById(&#x27;piEmailPwd&#x27;);
  if (emailChanged &amp;&amp; !(pwdEl &amp;&amp; pwdEl.value)) {
    // Changing the e-mail (= the login) needs the current password: reveal the field and stop here.
    document.getElementById(&#x27;piPwdWrap&#x27;).style.display = &#x27;&#x27;;
    if (pwdEl) pwdEl.focus();
    return;
  }
  state.busy = true;
  state.saveMessage = null;
  render();
  try {
    const r = await api.updateMe({
      phone,
      ...(emailChanged ? { email, currentPassword: pwdEl.value } : {}),
    });
    // A new e-mail is not the login yet: a code was sent to it (see handleConfirmEmail).
    if (r &amp;&amp; r.emailPending) {
      state.resident.pendingEmail = r.emailPending;
      state.emailCodeError = null;
    }
    state.resident.phone = phone;
    state.busy = false;
    state.saveMessage = r &amp;&amp; r.emailPending ? null : L.emailV.saved;
    render();
    if (r &amp;&amp; r.emailPending) {
      const c = document.getElementById(&#x27;piEmailCode&#x27;);
      if (c) c.focus();
    }
  } catch (err) {
    state.busy = false;
    state.saveMessage = err.code === &#x27;too_many_codes&#x27; ? L.emailV.tooMany : err.message;
    render();
  }
}

async function handleConfirmEmail() {
  const code = (document.getElementById(&#x27;piEmailCode&#x27;) || {}).value || &#x27;&#x27;;

}

async function handleSavePassword() {
  const pi = L.personalInfo;
  const currentPassword = document.getElementById(&#x27;piPwdCurrent&#x27;).value;
  const newPassword = document.getElementById(&#x27;piPwdNew&#x27;).value;
  const confirmPassword = document.getElementById(&#x27;piPwdConfirm&#x27;).value;

  if (!currentPassword || !newPassword || !confirmPassword) {
    state.pwdError = pi.pwdAllRequired;
    state.pwdSaved = false;
    render();
    return;
  }
  if (newPassword.length &lt; 8) {
    state.pwdError = pi.pwdTooShort;
    state.pwdSaved = false;
    render();
    return;
  }
  if (newPassword !== confirmPassword) {
    state.pwdError = pi.pwdMismatch;
    state.pwdSaved = false;
    render();
    return;
  }

  state.busy = true;
  state.pwdError = null;
  state.pwdSaved = false;
  render();
  try {
    const { token } = await api.changePassword(currentPassword, newPassword);
    // Changing the password revokes every token issued before this
    // moment — including the one this very request just used — so the
    // fresh one from the response has to replace it, or the next action
    // would otherwise fail as if logged out.
    if (token) api.setToken(token);
    state.busy = false;
    state.pwdSaved = true;
    render();
  } catch (err) {
    state.busy = false;
    state.pwdError = err.message;
    render();
  }
}

async function handleLogoutEverywhere() {
  if (!confirm(L.personalInfo.logoutEverywhereConfirm)) return;
  state.busy = true;
  render();
  try {
    await api.logoutEverywhere();
  } catch (err) {
    // Even a network hiccup here doesn&#x27;t change what happens next: the
    // call either revoked every token or it didn&#x27;t, but either way this
    // device&#x27;s own copy is about to be discarded regardless, so the
    // person still ends up signed out, which is what they asked for.
  }
  state.busy = false;
  handleLogout();
}

// Attachment downloads require the Bearer token, so a plain &lt;a href&gt; won&#x27;t
// work (the browser sends no custom headers on navigation). Fetch it with
// the token instead, then open the result as a blob URL.
async function viewAttachment(requestId, attachmentId) {
  try {
    const token = api.getToken();
    const res = await fetch(`/api/requests/${requestId}/attachments/${attachmentId}`, {
      headers: token ? { Authorization: `Bearer ${token}` } : {},
    });
    if (!res.ok) throw new Error(&#x27;HTTP &#x27; + res.status);
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    window.open(url, &#x27;_blank&#x27;, &#x27;noopener&#x27;);
  } catch (_) {
    // Missing on the server or no connection: say so next to the file instead of an English alert.
    state.attFailed = { ...(state.attFailed || {}), [attachmentId]: true };
    render();
  }
}

async function handleRateSend() {

  if (!r) return;
  const d = state.rateDraft &amp;&amp; state.rateDraft.id === r.id ? state.rateDraft : { id: r.id, n: 0 };
  const comment = rateCurrentComment();
  if (!d.n) {
    state.rateDraft = { id: r.id, n: 0, comment };
    state.rateError = L.rateV.pick;
    render();
    return;

  try {
    await api.rateRequest(r.id, d.n, comment.trim());
    state.rateError = null;
    state.rateDraft = null;
    state.requestDetail = await api.getRequest(r.id);
    render();
  } catch (err) {
    if (err.status === 401) {
      showView(&#x27;login&#x27;);
      return;
    }
    if (err.code === &#x27;rated&#x27;) {
      state.requestDetail = await api.getRequest(r.id);
      render();
      return;
    }
    state.rateDraft = { id: r.id, n: d.n, comment };
    state.rateError = err.message || &#x27;Error&#x27;;
    render();
  }
}

  const filterBtn = e.target.closest(&#x27;[data-filter]&#x27;);
  if (filterBtn) {
    state.filter = filterBtn.dataset.filter;
    render();
    return;
  }

  const slotEl = e.target.closest(&#x27;[data-amen-start]&#x27;);
  if (slotEl) {
    state.amenStart = slotEl.dataset.amenStart;
    const sel = state.amenAvail.slots.find(x =&gt; x.time === state.amenStart);
    if (!state.amenHours || state.amenHours &gt; sel.maxHours) state.amenHours = 1;
    state.amenBookingError = null;
    render();
    return;
  }
  const hoursEl = e.target.closest(&#x27;[data-amen-hours]&#x27;);
  if (hoursEl) {
    state.amenHours = parseInt(hoursEl.dataset.amenHours, 10);
    render();
    return;
  }

  const pillEl = e.target.closest(&#x27;.pill-row .pill&#x27;);
  if (pillEl) {
    const group = pillEl.closest(&#x27;[data-pillgroup]&#x27;).dataset.pillgroup;
    const idx = parseInt(pillEl.dataset.pill, 10);
    if (group === &#x27;date&#x27;) state.selectedDateIdx = idx;
    if (group === &#x27;time&#x27;) state.selectedTimeIdx = idx;
    if (group === &#x27;amenSlot&#x27;) state.amenSlotIdx = idx;
    if (group === &#x27;amenDuration&#x27;) state.amenDurationIdx = idx;
    render();
    return;
  }

  const actionBtn = e.target.closest(&#x27;[data-action]&#x27;);
  if (actionBtn) {
    e.preventDefault();
    const action = actionBtn.dataset.action;
    if (action === &#x27;submit-request&#x27;) handleSubmitRequest();
    if (action === &#x27;save-contact&#x27;) handleSaveContact();
    if (action === &#x27;confirm-email&#x27;) handleConfirmEmail();
    if (action === &#x27;save-password&#x27;) handleSavePassword();
    if (action === &#x27;logout-everywhere&#x27;) handleLogoutEverywhere();
    if (action === &#x27;logout&#x27;) handleLogout();
    if (action === &#x27;resend-code&#x27;) handleResendCode();
    if (action === &#x27;resend-reset-code&#x27;) handleResendResetCode();
    if (action === &#x27;rate-pick&#x27;) {
      handleRatePick(parseInt(actionBtn.dataset.n, 10));
    }
    if (action === &#x27;rate-send&#x27;) handleRateSend();
    if (action === &#x27;view-attachment&#x27;) viewAttachment(actionBtn.dataset.req, actionBtn.dataset.att);
    if (action === &#x27;submit-amenity-booking&#x27;) handleSubmitAmenityBooking();
    if (action === &#x27;open-notification&#x27;) handleOpenNotification(actionBtn.dataset.id);
    if (action === &#x27;read-all-notifications&#x27;) handleReadAllNotifications();
    if (action === &#x27;login-code-resend&#x27;) handleLoginCodeResend();
    if (action === &#x27;login-code-back&#x27;) handleLoginCodeBack();
    if (action === &#x27;ads-off&#x27; || action === &#x27;ads-on&#x27;) handleAds(action === &#x27;ads-off&#x27;);
    if (action === &#x27;cancel-my-booking&#x27;) handleCancelMyBooking(actionBtn.dataset.booking);
    if (action === &#x27;submit-guest-parking&#x27;) handleSubmitGuestParking();
    if (action === &#x27;send-message&#x27;) handleSendMessage();
    if (action === &#x27;view-document&#x27;) viewDocument(actionBtn.dataset.doc, actionBtn.dataset.name);
    if (action === &#x27;download-all-documents&#x27;) downloadAllDocuments();
    return;
  }

  const goEl = e.target.closest(&#x27;[data-go]&#x27;);
  if (goEl) {
    e.preventDefault();
    const key = goEl.dataset.go;
    if (key === &#x27;requestForm&#x27;) {
      state.activeService = goEl.dataset.svc || &#x27;plumbing&#x27;;
      showView(&#x27;requestForm&#x27;);
      return;
    }
    if (key === &#x27;newsDetail&#x27;) {
      state.activeNews = parseInt(goEl.dataset.news, 10);
      markNewsRead(state.activeNews);
      state.newsBack = null; // opened from the news list
      showView(&#x27;newsDetail&#x27;);
      return;
    }
    if (key === &#x27;amenityBooking&#x27;) {
      state.activeAmenityId = parseInt(goEl.dataset.amenity, 10);
      state.amenDate = localDateStr(0);
      state.amenStart = null;
      state.amenHours = null;
      state.amenAvail = null;
      state.amenBookingError = null;
      showView(&#x27;amenityBooking&#x27;);
      loadAmenityAvailability();
      return;
    }
    if (key === &#x27;detail&#x27;) {
      openRequestDetail(goEl.dataset.req);
      return;
    }
    if (key === &#x27;buildingNews&#x27;) {
      openBuildingNews();
      return;
    }
    if (key === &#x27;signup&#x27;) {
      openSignup();
      return;
    }
    if (key === &#x27;myVehicles&#x27;) {
      openVehicles();
      return;
    }
    if (key === &#x27;anonReport&#x27;) {
      openAnon();
      return;
    }
    if (key === &#x27;leaseRenewal&#x27;) {
      openLease();
      return;
    }
    if (key === &#x27;schedule&#x27;) {
      openSchedule();
      return;
    }
    if (key === &#x27;personalInfo&#x27;) {
      showView(&#x27;personalInfo&#x27;);
      pvLoad();
      return;
    }
    if (key === &#x27;moves&#x27;) {
      openMoves();
      return;
    }
    if (key === &#x27;community&#x27;) {
      openCommunity();
      return;
    }
    if (key === &#x27;record&#x27;) {
      openRecord();
      return;
    }
    if (key === &#x27;amenities&#x27;) {
      openAmenities();
      return;
    }
    if (key === &#x27;myBookings&#x27;) {
      openMyBookings();
      return;
    }
    if (key === &#x27;notifications&#x27;) {
      openNotifications();
      return;
    }
    if (key === &#x27;documents&#x27;) {
      openDocuments();
      return;
    }
    if (key === &#x27;messages&#x27;) {
      openMessages();
      return;
    }
    if (key === &#x27;management&#x27;) {
      openManagement();
      return;
    }
    showView(key);
  }
});

// Amenity booking: a new date means new availability.
document.addEventListener(&#x27;change&#x27;, e =&gt; {
  if (e.target.id !== &#x27;amenDate&#x27;) return;
  state.amenDate = e.target.value || localDateStr(0);
  state.amenBookingError = null;
  loadAmenityAvailability();
});

// Personal info: the &quot;current password&quot; box appears as soon as the e-mail is edited (it is
// required to change it).
document.addEventListener(&#x27;input&#x27;, e =&gt; {
  if (!e.target || e.target.id !== &#x27;piEmail&#x27;) return;
  const wrap = document.getElementById(&#x27;piPwdWrap&#x27;);
  if (wrap)
    wrap.style.display =
      e.target.value.trim().toLowerCase() !==
      String((state.resident &amp;&amp; state.resident.email) || &#x27;&#x27;).toLowerCase()
        ? &#x27;&#x27;
        : &#x27;none&#x27;;
});
&lt;/script&gt;
&lt;script&gt;// Live updates (WebSocket /ws): new chat messages and notifications appear without refreshing.
// The socket only says &quot;something changed&quot;; the data is then fetched through the normal API.
// If the connection drops it reconnects by itself; the 60 s notification poll stays as a safety
// net.
(function () {
  let ws = null,
    retry = 1000,
    timer = null;

  // Re-render the open chat without losing what the resident is typing.
  async function refreshChat() {
    try {
      state.messages = await api.getMessages();
      if (state.view !== &#x27;messages&#x27;) return;
      const inp = document.getElementById(&#x27;messageInput&#x27;);
      const val = inp ? inp.value : &#x27;&#x27;,
        focus = document.activeElement === inp;
      render();
      const n = document.getElementById(&#x27;messageInput&#x27;);
      if (n) {
        n.value = val;
        if (focus) {
          n.focus();
          n.setSelectionRange(val.length, val.length);
        }
      }
    } catch (e) {
      /* offline or signed out */
    }
  }

  function connect() {
    const token = api.getToken();
    if (!token || !state.resident || ws) return;
    try {
      const s = new WebSocket(
        `${location.protocol === &#x27;https:&#x27; ? &#x27;wss&#x27; : &#x27;ws&#x27;}://${location.host}/ws?token=${encodeURIComponent(token)}`
      );
      ws = s;
      s.onopen = () =&gt; {
        retry = 1000;
        refreshNotifications(true);
        if (state.view === &#x27;messages&#x27;) refreshChat();
      };
      s.onmessage = m =&gt; {
        let e;
        try {
          e = JSON.parse(m.data);
        } catch (_) {
          return;
        }
        if (e.type === &#x27;notification&#x27;) refreshNotifications(true);
        if (e.type === &#x27;message&#x27;) refreshChat();
      };
      s.onclose = () =&gt; {
        if (ws === s) ws = null;
        clearTimeout(timer);
        timer = setTimeout(connect, retry);
        retry = Math.min(retry * 2, 15000);
      };
      s.onerror = () =&gt; {
        try {
          s.close();
        } catch (_) {}
      };
    } catch (e) {
      ws = null;
    }
  }

  // Sign-in happens after the page loads, so keep checking; the connection opens once there is
  // a session.
  setInterval(() =&gt; {
    if (api.getToken() &amp;&amp; state.resident) connect();
    else if (ws) {
      const s = ws;
      ws = null;
      try {
        s.close();
      } catch (_) {}
    }
  }, 2000);
})();
&lt;/script&gt;
&lt;script&gt;// init() – start of the app
// Part of the resident app: plain &lt;script&gt; files share one global scope; load order is set in
// index.html.
(async function init() {
  L = langFor();

  // A resident arriving via their activation email link — ?activate=TOKEN&amp;email=...
  // Takes priority over an existing session: if someone is testing a
  // second account on the same browser, the link should still work.
  const params = new URLSearchParams(window.location.search);
  const joinCode = params.get(&#x27;join&#x27;);
  if (joinCode &amp;&amp; !api.getToken()) {
    window.void({}, &#x27;&#x27;, window.location.pathname);
    openSignup(joinCode);
    return;
  }
  const activateToken = params.get(&#x27;activate&#x27;);
  const activateEmail = params.get(&#x27;email&#x27;);
  if (activateToken &amp;&amp; activateEmail) {
    state.pendingActivationToken = activateToken;
    state.pendingActivationEmail = activateEmail;
    state.view = &#x27;createPassword&#x27;;
    window.void({}, &#x27;&#x27;, window.location.pathname);
    render();
    return;
  }

  if (api.getToken()) {
    try {
      await loadInitialData();
      state.view = &#x27;home&#x27;;
      const want = location.hash.slice(1); // the screen the person was on before the refresh
      if (Object.hasOwn(SECTION_OPEN, want) &amp;&amp; want !== &#x27;home&#x27;) {
        try {
          await SECTION_OPEN[want]();
        } catch (_) {
          state.view = &#x27;home&#x27;;
        }
      }
    } catch (err) {
      api.clearToken();
      state.view = &#x27;login&#x27;;
    }
  }
  render();
})();
