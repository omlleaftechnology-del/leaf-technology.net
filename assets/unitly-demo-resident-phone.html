&lt;script&gt;// api.js — thin wrapper around fetch() for talking to the backend.
// The login token itself lives in an HttpOnly cookie (server/webCookie.ts), out of reach of page
// scripts.
// localStorage keeps only the placeholder &quot;cookie&quot; as the &quot;signed in&quot; flag; it is sent as
// &quot;Bearer cookie&quot; and
// tells the server to read the cookie. On a 401 we clear the flag — the caller redirects to the
// login view.

const TOKEN_KEY = &#x27;pivert_token&#x27;;

const api = {
  getToken() {
    const t = localStorage.getItem(TOKEN_KEY);
    if (t &amp;&amp; t !== &#x27;cookie&#x27;) {
      localStorage.removeItem(TOKEN_KEY);
      return null;
    } // a real token stored by an older version
    return t;
  },
  setToken(token) {
    localStorage.setItem(TOKEN_KEY, token);
  },
  clearToken() {
    localStorage.removeItem(TOKEN_KEY);
  },

  async _request(path, options = {}) {
    const headers = {
      &#x27;Content-Type&#x27;: &#x27;application/json&#x27;,
      &#x27;X-Web-Client&#x27;: &#x27;1&#x27;,
      ...(options.headers || {}),
    };
    const token = api.getToken();
    if (token) headers.Authorization = `Bearer ${token}`;

    const res = await fetch(path, { ...options, headers });

    if (res.status === 401) {
      if (token) wipeSession(); // the session ended: nothing of it stays in the page
      api.clearToken();
      const err = new Error(&#x27;Unauthorized&#x27;);
      err.status = 401;
      throw err;
    }

    let body = null;
    try {
      body = await res.json();
    } catch (_) {
      /* no body */
    }

    if (!res.ok) {
      const err = new Error((body &amp;&amp; body.error) || `Request failed (${res.status})`);
      err.status = res.status;
      if (body &amp;&amp; body.code) err.code = body.code;
      // Password refused by the server&#x27;s policy: say why, in the resident&#x27;s language.
      if (err.code &amp;&amp; L &amp;&amp; L.pwPolicy &amp;&amp; L.pwPolicy[err.code]) err.message = L.pwPolicy[err.code];
      throw err;
    }
    return body;
  },

  login(email, password) {
    return api._request(&#x27;/api/auth/login&#x27;, {
      method: &#x27;POST&#x27;,
      body: JSON.stringify({ email, password }),
    });
  },

  // Second sign-in step on a new device: the code from the e-mail. `remember` keeps this browser trusted for 30 days.
  loginCode(challengeId, code, remember) {
    return api._request(&#x27;/api/auth/login-code&#x27;, {
      method: &#x27;POST&#x27;,
      body: JSON.stringify({ challengeId, code, remember }),
    });
  },

  loginCodeResend(challengeId) {
    return api._request(&#x27;/api/auth/login-code/resend&#x27;, {
      method: &#x27;POST&#x27;,
      body: JSON.stringify({ challengeId }),
    });
  },

  getMe() {
    return api._request(&#x27;/api/me&#x27;);
  },

  updateMe(patch) {
    return api._request(&#x27;/api/me&#x27;, { method: &#x27;PATCH&#x27;, body: JSON.stringify(patch) });
  },
  confirmEmail(code) {
    return api._request(&#x27;/api/me/email-confirm&#x27;, {
      method: &#x27;POST&#x27;,
      body: JSON.stringify({ code }),
    });
  },

  getRequests() {
    return api._request(&#x27;/api/requests&#x27;);
  },

  getRequest(id) {
    return api._request(`/api/requests/${id}`);
  },

  rateRequest(id, rating, comment) {
    return api._request(`/api/requests/${id}/rating`, {
      method: &#x27;POST&#x27;,
      body: JSON.stringify({ rating, comment }),
    });
  },

  markNewsRead(id) {
    return api._request(`/api/news/${id}/read`, { method: &#x27;POST&#x27;, body: &#x27;{}&#x27; });
  },

  createRequest(payload) {
    return api._request(&#x27;/api/requests&#x27;, { method: &#x27;POST&#x27;, body: JSON.stringify(payload) });
  },

  sendCode(email) {
    return api._request(&#x27;/api/auth/send-code&#x27;, { method: &#x27;POST&#x27;, body: JSON.stringify({ email }) });
  },

  setPasswordByCode(email, code, password) {
    return api._request(&#x27;/api/auth/set-password-code&#x27;, {
      method: &#x27;POST&#x27;,
      body: JSON.stringify({ email, code, password }),
    });
  },

  setPassword(email, token, password) {
    return api._request(&#x27;/api/auth/set-password&#x27;, {
      method: &#x27;POST&#x27;,
      body: JSON.stringify({ email, token, password }),
    });
  },

  // File uploads use FormData — never set Content-Type manually here,
  // the browser needs to add its own multipart boundary.
  async uploadAttachment(requestId, file) {
    const formData = new FormData();
    formData.append(&#x27;file&#x27;, file);
    const token = api.getToken();
    const res = await fetch(`/api/requests/${requestId}/attachments`, {
      method: &#x27;POST&#x27;,
      headers: token ? { Authorization: `Bearer ${token}` } : {},
      body: formData,
    });
    if (res.status === 401) {
      if (token) wipeSession();
      api.clearToken();
      throw new Error(&#x27;Unauthorized&#x27;);
    }
    let body = null;
    try {
      body = await res.json();
    } catch (_) {
      /* no body */
    }
    if (!res.ok) {
      const e = new Error((body &amp;&amp; body.error) || `Upload failed (${res.status})`);
      e.code = body &amp;&amp; body.code;
      throw e;
    }
    return body;
  },

  getAmenities() {
    return api._request(&#x27;/api/amenities&#x27;);
  },
  getAmenityAvailability(id, date) {
    return api._request(`/api/amenities/${id}/availability?date=${encodeURIComponent(date)}`);
  },
  getNotifications() {
    return api._request(&#x27;/api/notifications&#x27;);
  },
  readNotification(id) {
    return api._request(`/api/notifications/${id}/read`, { method: &#x27;POST&#x27; });
  },
  setAdsOff(off) {
    return api._request(&#x27;/api/me/ads&#x27;, { method: &#x27;PATCH&#x27;, body: JSON.stringify({ off }) });
  },
  readAllNotifications() {
    return api._request(&#x27;/api/notifications/read-all&#x27;, { method: &#x27;POST&#x27; });
  },
  getMyBookings() {
    return api._request(&#x27;/api/amenities/bookings/mine&#x27;);
  },
  cancelBooking(id) {
    return api._request(`/api/amenities/bookings/${id}`, { method: &#x27;DELETE&#x27; });
  },
  bookAmenity(id, payload) {
    return api._request(`/api/amenities/${id}/bookings`, {
      method: &#x27;POST&#x27;,
      body: JSON.stringify(payload),
    });
  },

  createGuestParking(payload) {
    return api._request(&#x27;/api/guest-parking&#x27;, { method: &#x27;POST&#x27;, body: JSON.stringify(payload) });
  },

  getMessages() {
    return api._request(&#x27;/api/messages&#x27;);
  },
  sendMessage(body) {
    return api._request(&#x27;/api/messages&#x27;, { method: &#x27;POST&#x27;, body: JSON.stringify({ body }) });
  },

  getNews() {
    return api._request(&#x27;/api/news&#x27;);
  },

  getDocuments() {
    return api._request(&#x27;/api/documents&#x27;);
  },
  getSettings() {
    return api._request(&#x27;/api/settings&#x27;);
  },
  logoutEverywhere() {
    return api._request(&#x27;/api/auth/logout-everywhere&#x27;, { method: &#x27;POST&#x27; });
  },
  // Ends this device&#x27;s session on the server too; never blocks signing out.
  logout() {
    if (api.getToken()) api._request(&#x27;/api/auth/logout&#x27;, { method: &#x27;POST&#x27; }).catch(() =&gt; {});
  },
  forgotCode(email) {
    return api._request(&#x27;/api/auth/forgot-code&#x27;, {
      method: &#x27;POST&#x27;,
      body: JSON.stringify({ email }),
    });
  },
  resetPasswordByCode(email, code, password) {
    return api._request(&#x27;/api/auth/reset-password-code&#x27;, {
      method: &#x27;POST&#x27;,
      body: JSON.stringify({ email, code, password }),
    });
  },
  changePassword(currentPassword, newPassword) {
    return api._request(&#x27;/api/auth/change-password&#x27;, {
      method: &#x27;POST&#x27;,
      body: JSON.stringify({ currentPassword, newPassword }),
    });
  },
};

          out += `&lt;polygon class=&quot;door&quot; points=&quot;${[
            [a, y1, 0],
            [b, y1, 0],
            [b, y1, 0.78],
            [a, y1, 0.78],
          ]
            .map(p =&gt; P(...p))
            .join(&#x27; &#x27;)}&quot;/&gt;`;
          continue;
        }
        const lit = r() &lt; (spec.lit ?? 0.58),
          still = r() &lt; 0.7,
          mine = spec.mine &amp;&amp; spec.mine.floor === k &amp;&amp; spec.mine.idx === i;
        out += `&lt;polygon
          class=&quot;win${lit || mine ? &#x27; lit&#x27; : &#x27;&#x27;}${still ? &#x27; still&#x27; : &#x27;&#x27;}${mine ? &#x27; mine&#x27; : &#x27;&#x27;}&quot;
          style=&quot;${winDelay()}&quot; points=&quot;${[
            [a, y1, z0 + 0.28],
            [b, y1, z0 + 0.28],
            [b, y1, z0 + 0.72],
            [a, y1, z0 + 0.72],
          ]
            .map(p =&gt; P(...p))
            .join(&#x27; &#x27;)}&quot;/&gt;`;
      }
      return out;
    };
    const tree = (x, y, i) =&gt; {
      const [X, Y] = pt(x, y, 0);
      return `&lt;g transform=&quot;translate(${X.toFixed(1)} ${Y.toFixed(1)})&quot;&gt;&lt;g class=&quot;tree-in&quot;
        style=&quot;--i:${i}&quot;&gt;&lt;rect class=&quot;trunk&quot; x=&quot;-1.2&quot; y=&quot;-9&quot; width=&quot;2.4&quot; height=&quot;9&quot; rx=&quot;1&quot;/&gt;&lt;ellipse
        class=&quot;canopy&quot; cx=&quot;0&quot; cy=&quot;-15&quot; rx=&quot;6.8&quot; ry=&quot;8.2&quot;/&gt;&lt;ellipse class=&quot;canopy&quot; cx=&quot;-2&quot; cy=&quot;-17&quot;
        rx=&quot;3&quot; ry=&quot;3.6&quot; style=&quot;opacity:.55;fill:#fff&quot;/&gt;&lt;/g&gt;&lt;/g&gt;`;
    };

    // Own random stream, so adding balconies never changes which windows are lit.
    const rb = rng(seed + 7);
    const balconies = (k, z0) =&gt; {
      if (k &lt; 1) return &#x27;&#x27;;
      let out = &#x27;&#x27;;
      for (let i = 0; i &lt; w; i++) {
        if (rb() &gt; 0.3) continue;
        const a = i + 0.1,
          b = i + 0.9;
        out +=
          box(a, d, b, d + 0.32, z0 + 0.02, z0 + 0.1) +
          poly(
            [
              [a, d + 0.32, z0 + 0.1],
              [b, d + 0.32, z0 + 0.1],
              [b, d + 0.32, z0 + 0.42],
              [a, d + 0.32, z0 + 0.42],
            ],
            &#x27;rail&#x27;
          );
      }
      return out;
    };
    const ledge = z1 =&gt;
      poly(
        [
          [0, d, z1 - 0.08],
          [w, d, z1 - 0.08],
          [w, d, z1],
          [0, d, z1],
        ],
        &#x27;ledge&#x27;
      ) +
      poly(
        [
          [w, 0, z1 - 0.08],
          [w, d, z1 - 0.08],
          [w, d, z1],
          [w, 0, z1],
        ],
        &#x27;ledge&#x27;
      );
    const bush = (x, y, i) =&gt; {
      const [X, Y] = pt(x, y, 0);
      return `&lt;g transform=&quot;translate(${X.toFixed(1)} ${Y.toFixed(1)})&quot;&gt;&lt;g class=&quot;tree-in&quot;
        style=&quot;--i:${i}&quot;&gt;&lt;ellipse class=&quot;bush&quot; cx=&quot;0&quot; cy=&quot;-2.6&quot; rx=&quot;4.2&quot; ry=&quot;3.2&quot;/&gt;&lt;/g&gt;&lt;/g&gt;`;
    };
    const di = Math.floor(w / 2);

    let html = `&lt;g class=&quot;ground&quot;&gt;${poly(
      [
        [w + m, -m, 0],
        [w + m, d + m, 0],
        [w + m, d + m, -0.4],
        [w + m, -m, -0.4],
      ],
      &#x27;g-right&#x27;
    )}${poly(
      [
        [-m, d + m, 0],
        [w + m, d + m, 0],
        [w + m, d + m, -0.4],
        [-m, d + m, -0.4],
      ],
      &#x27;g-left&#x27;
    )}${poly(
      [
        [-m, -m, 0],
        [w + m, -m, 0],
        [w + m, d + m, 0],
        [-m, d + m, 0],
      ],
      &#x27;g-top&#x27;
    )}&lt;/g&gt;`;
    // soft shadow to the right and front, a path to the door and shrubs along the front wall
    html += poly(
      [
        [w, 0, 0.02],
        [w + 1.2, 0.8, 0.02],
        [w + 1.2, d + 0.8, 0.02],
        [0, d + 0.8, 0.02],
        [0, d, 0.02],
        [w, d, 0.02],
      ],
      &#x27;g-shadow&#x27;
    );
    html += poly(
      [
        [di + 0.12, d, 0.03],
        [di + 0.88, d, 0.03],
        [di + 0.88, d + m, 0.03],
        [di + 0.12, d + m, 0.03],
      ],
      &#x27;g-path&#x27;
    );
    for (let x = 0.5, bi = 0; x &lt; w; x += 0.9, bi++)
      if (Math.abs(x - (di + 0.5)) &gt; 0.8) html += bush(x, d + 0.55, bi);
    html += tree(-0.55, 0.3, 0);
    const total = floors + (roof === &#x27;terrace&#x27; ? 1 : 0);
    for (let k = 0; k &lt; floors; k++) {
      const z0 = k * FH,
        z1 = z0 + FH,
        last = k === floors - 1 &amp;&amp; roof === &#x27;flat&#x27;;
      html += `&lt;g class=&quot;floor&quot; style=&quot;--i:${k}&quot;&gt;&lt;g
        class=&quot;faces&quot;&gt;${box(0, 0, w, d, z0, z1, last)}${ledge(z1)}&lt;/g&gt;&lt;g
          class=&quot;wins&quot;&gt;${wins(0, 0, w, d, z0, k === 0, k)}${balconies(k, z0)}&lt;/g&gt;&lt;/g&gt;`;
    }
    const zt = floors * FH;
    let ri = floors;
    if (roof === &#x27;flat&#x27;) {
      // small air-conditioning box on the roof, left of the lift housing
      const acUnit = box(w * 0.16, d * 0.5, w * 0.16 + 0.9, d * 0.5 + 0.8, zt, zt + 0.5);
      html += `&lt;g class=&quot;roof&quot; style=&quot;--i:${ri}&quot;&gt;&lt;g class=&quot;faces&quot;&gt;${poly(
        [
          [0.28, 0.28, zt],
          [w - 0.28, 0.28, zt],
          [w - 0.28, d - 0.28, zt],
          [0.28, d - 0.28, zt],
        ],
        &#x27;r-inner&#x27;
      )}${box(
        w * 0.5,
        d * 0.18,
        w * 0.5 + 1.1,
        d * 0.18 + 1.1,
        zt,
        zt + 0.95
      )}${acUnit}&lt;/g&gt;&lt;path class=&quot;antenna&quot; d=&quot;M${P(w * 0.5 + 0.55, d * 0.18 + 0.55, zt + 0.95)} L${P(
        w * 0.5 + 0.55,
        d * 0.18 + 0.55,
        zt + 2.4
      )}&quot;/&gt;&lt;circle class=&quot;beacon&quot; cx=&quot;${pt(w * 0.5 + 0.55, d * 0.18 + 0.55, zt + 2.4)[0].toFixed(
        1
      )}&quot; cy=&quot;${pt(w * 0.5 + 0.55, d * 0.18 + 0.55, zt + 2.4)[1].toFixed(1)}&quot; r=&quot;1.5&quot;/&gt;&lt;/g&gt;`;
    } else if (roof === &#x27;gable&#x27;) {
      const rh = d * 0.38;
      html += `&lt;g class=&quot;roof&quot; style=&quot;--i:${ri}&quot;&gt;&lt;g class=&quot;faces&quot;&gt;${poly(
        [
          [w, 0, zt],
          [w, d, zt],
          [w, d / 2, zt + rh],
        ],
        &#x27;r-gable&#x27;
      )}${poly(
        [
          [-0.3, -0.3, zt],
          [w + 0.3, -0.3, zt],
          [w + 0.3, d / 2, zt + rh],
          [-0.3, d / 2, zt + rh],
        ],
        &#x27;r-slope2&#x27;
      )}${poly(
        [
          [-0.3, d + 0.3, zt],
          [w + 0.3, d + 0.3, zt],
          [w + 0.3, d / 2, zt + rh],
          [-0.3, d / 2, zt + rh],
        ],
        &#x27;r-slope&#x27;
      )}${box(w * 0.62, d * 0.55, w * 0.62 + 0.7, d * 0.55 + 0.7, zt + rh * 0.4, zt + rh * 0.4 + 0.9)}&lt;/g&gt;&lt;/g&gt;`;
    } else {
      const a = 0.85,
        z0 = zt,
        z1 = zt + FH;
      html += `&lt;g class=&quot;floor&quot; style=&quot;--i:${floors}&quot;&gt;&lt;g
        class=&quot;faces&quot;&gt;${box(a, a, w - a, d - a, z0, z1, false)}&lt;/g&gt;&lt;g
          class=&quot;wins&quot;&gt;${wins(a, a, w - a, d - a, z0, false, -1)}&lt;/g&gt;&lt;/g&gt;`;
      html += `&lt;g class=&quot;roof&quot; style=&quot;--i:${floors + 1}&quot;&gt;&lt;g class=&quot;faces&quot;&gt;${poly(
        [
          [a - 0.2, a - 0.2, z1],
          [w - a + 0.2, a - 0.2, z1],
          [w - a + 0.2, d - a + 0.2, z1],
          [a - 0.2, d - a + 0.2, z1],
        ],
        &#x27;f-top&#x27;
      )}${poly(
        [
          [a + 0.2, a + 0.2, z1],
          [w - a - 0.2, a + 0.2, z1],
          [w - a - 0.2, d - a - 0.2, z1],
          [a + 0.2, d - a - 0.2, z1],
        ],
        &#x27;r-inner&#x27;
      )}&lt;/g&gt;&lt;/g&gt;`;
    }
    html += `&lt;g class=&quot;awning&quot;&gt;${box(di + 0.02, d, di + 0.98, d + 0.55, 0.84, 0.94)}&lt;/g&gt;`;
    html += tree(w + 0.75, d + 0.85, 1) + tree(-0.7, d + 0.7, 2);
    if (spec.mine) {
      const [cx, cy] = pt(spec.mine.idx + 0.5, d, spec.mine.floor * FH + 0.5),
        label = String(spec.mine.label || &#x27;&#x27;),
        pw = Math.max(34, label.length * 7 + 16),
        px = 4 + pw / 2;
      const delay = (base + 0.35 + (floors + 1) * 0.15 + 1.2).toFixed(2);
      html += `&lt;g class=&quot;mine-pin&quot; style=&quot;--pd:${delay}s&quot;&gt;&lt;path
        d=&quot;M${(px + pw / 2).toFixed(1)},${cy.toFixed(1)} L${cx.toFixed(1)},${cy.toFixed(1)}&quot;/&gt;&lt;circle
        class=&quot;mine-ring&quot; cx=&quot;${cx.toFixed(1)}&quot; cy=&quot;${cy.toFixed(1)}&quot; r=&quot;5&quot;/&gt;&lt;rect x=&quot;4&quot;
        y=&quot;${(cy - 9).toFixed(1)}&quot; width=&quot;${pw}&quot; height=&quot;18&quot; rx=&quot;9&quot;/&gt;&lt;text x=&quot;${px.toFixed(1)}&quot;
        y=&quot;${(cy + 3.6).toFixed(1)}&quot;
          text-anchor=&quot;middle&quot;&gt;${label.replace(/&amp;/g, &#x27;&amp;amp;&#x27;).replace(/&lt;/g, &#x27;&amp;lt;&#x27;)}&lt;/text&gt;&lt;/g&gt;`;
    }
    html += &#x27;&#x27;;
    return `&lt;svg viewBox=&quot;0 0 260 220&quot; class=&quot;tone-${spec.tone}&quot;
      style=&quot;--b:${base.toFixed(2)}s;--n:${total}&quot; aria-hidden=&quot;true&quot;&gt;${WIN_DEFS}${html}&lt;/svg&gt;`;
  }

  return scene;
})();

// Window glass: a light top fading to a deeper bottom; lit windows are warm yellow.
const glass = (id, top, bottom) =&gt;
  `&lt;linearGradient id=&quot;${id}&quot; x1=&quot;0&quot; y1=&quot;0&quot; x2=&quot;0&quot; y2=&quot;1&quot;&gt;` +
  `&lt;stop offset=&quot;0&quot; stop-color=&quot;${top}&quot;/&gt;&lt;stop offset=&quot;1&quot; stop-color=&quot;${bottom}&quot;/&gt;` +
  `&lt;/linearGradient&gt;`;
const WIN_DEFS =
  &#x27;&lt;defs&gt;&#x27; +
  glass(&#x27;winLit&#x27;, &#x27;#ffeaa9&#x27;, &#x27;#ffc24d&#x27;) +
  glass(&#x27;winOff&#x27;, &#x27;#d3dbe6&#x27;, &#x27;#a7b2c0&#x27;) +
  &#x27;&lt;/defs&gt;&#x27;;
const BUILDING_TONES = [&#x27;stone&#x27;, &#x27;sand&#x27;, &#x27;sage&#x27;, &#x27;slate&#x27;];
const BUILDING_ROOFS = [&#x27;flat&#x27;, &#x27;gable&#x27;, &#x27;terrace&#x27;];

// Animations on/off: remembered per browser (never required), default follows the system &quot;reduce
// motion&quot; setting.
function buildingAnimOn() {
  try {
    const saved = localStorage.getItem(&#x27;buildingsAnim&#x27;);
    if (saved === &#x27;0&#x27;) return false;
    if (saved === &#x27;1&#x27;) return true;
  } catch (_) {}
  return !(window.matchMedia &amp;&amp; matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches);
}

// What to draw for a building: its own floors / roof / colour if set, otherwise a stable default
// derived from it.
function buildingSpec(b) {
  const id = Number(b.id) || 1;
  const floors =
    Number.isInteger(b.floors) &amp;&amp; b.floors &gt;= 2 &amp;&amp; b.floors &lt;= 8
      ? b.floors
      : Math.max(2, Math.min(8, Math.ceil((Number(b.units) || 24) / 8)));
  const roof = BUILDING_ROOFS.includes(b.roof) ? b.roof : BUILDING_ROOFS[(id * 7) % 3];
  const tone = BUILDING_TONES.includes(b.tone) ? b.tone : BUILDING_TONES[(id * 5) % 4];
  const kind = [&#x27;shop&#x27;, &#x27;office&#x27;, &#x27;factory&#x27;, &#x27;mixed&#x27;].includes(b.kind) ? b.kind : &#x27;residential&#x27;;
  return {
    w: 4 + (id % 2),
    d: 3 + ((id &gt;&gt; 1) % 2),
    floors,
    roof,
    tone,
    kind,
    seed: 1000 + id * 77,
  };
}

// Which window is &quot;mine&quot;: floor from the apartment number (402 -&gt; 4th floor), place along the
// front wall from its last two digits.
function myWindow(resident, spec) {
  const raw = String(resident.apartmentNumber || &#x27;&#x27;).match(/\d+/);
  const n = raw ? parseInt(raw[0], 10) : 1;
  let floor = n &gt;= 100 ? Math.floor(n / 100) - 1 : Math.floor((n - 1) / 4);
  floor = Math.max(0, Math.min(spec.floors - 1, floor));
  let idx = ((n % 100 || n) - 1) % spec.w;
  if (idx &lt; 0) idx = 0;
  // that slot is the front door
  if (floor === 0 &amp;&amp; idx === Math.floor(spec.w / 2)) idx = (idx + 1) % spec.w;
  return { floor, idx, label: String(resident.apartmentNumber || &#x27;&#x27;) };
}

// Isometric parking lot: two rows of spots, a few parked cars, the resident&#x27;s own spot lit with
// a pin (none without a spot).
function parkingScene(spotLabel, seed, base) {
  const U = 13,
    C = 0.866 * U,
    S = 0.5 * U,
    W = 5,
    D = 5.2,
    m = 1.1;
  const ox = 130 - ((W - D) * C) / 2,
    oy = 190 - (W + D + 2 * m) * S;
  const pt = (x, y, z) =&gt; [ox + (x - y) * C, oy + (x + y) * S - z * U];
  const P = (x, y, z) =&gt;
    pt(x, y, z)
      .map(n =&gt; n.toFixed(1))
      .join(&#x27;,&#x27;);
  const poly = (pts, cls, extra = &#x27;&#x27;) =&gt;
    `&lt;polygon class=&quot;${cls}&quot; ${extra} points=&quot;${pts.map(p =&gt; P(...p)).join(&#x27; &#x27;)}&quot;/&gt;`;
  let r = seed &gt;&gt;&gt; 0 || 7;
  const rnd = () =&gt; {
    r = (Math.imul(r, 1664525) + 1013904223) &gt;&gt;&gt; 0;
    return r / 4294967296;
  };
  const digits = String(spotLabel).match(/\d+/);
  const n = digits ? parseInt(digits[0], 10) : 1;
  const mineIdx = spotLabel ? (n - 1) % 10 : -1;
  const rows = [
    [0, 1.9],
    [3.3, 5.2],
  ]; // y-ranges of the two rows of spots
  const palettes = [
    [&#x27;#f4f1ea&#x27;, &#x27;#d9d4c7&#x27;, &#x27;#bfb9aa&#x27;],
    [&#x27;#7d99b3&#x27;, &#x27;#5f7c97&#x27;, &#x27;#4d6a84&#x27;],
    [&#x27;#c9d3c4&#x27;, &#x27;#a9b8a3&#x27;, &#x27;#8fa089&#x27;],
    [&#x27;#8a8f98&#x27;, &#x27;#6c717a&#x27;, &#x27;#585d66&#x27;],
    [&#x27;#d9a066&#x27;, &#x27;#bb8350&#x27;, &#x27;#9c6a3f&#x27;],
  ];
  let html = `&lt;g class=&quot;ground&quot;&gt;${poly(
    [
      [W + m, -m, 0],
      [W + m, D + m, 0],
      [W + m, D + m, -0.4],
      [W + m, -m, -0.4],
    ],
    &#x27;g-right&#x27;
  )}${poly(
    [
      [-m, D + m, 0],
      [W + m, D + m, 0],
      [W + m, D + m, -0.4],
      [-m, D + m, -0.4],
    ],
    &#x27;g-left&#x27;
  )}${poly(
    [
      [-m, -m, 0],
      [W + m, -m, 0],
      [W + m, D + m, 0],
      [-m, D + m, 0],
    ],
    &#x27;g-top&#x27;
  )}&lt;/g&gt;`;
  // asphalt, lane arrows (dashes) and spot lines
  html += `&lt;g class=&quot;lot-marks&quot;&gt;${poly(
    [
      [0, 1.9, 0.02],
      [W, 1.9, 0.02],
      [W, 3.3, 0.02],
      [0, 3.3, 0.02],
    ],
    &#x27;lot-lane&#x27;
  )}`;
  for (let k = 0; k &lt;= W; k++)
    rows.forEach(([a, b]) =&gt; {
      html += poly(
        [
          [k - 0.03, a, 0.03],
          [k + 0.03, a, 0.03],
          [k + 0.03, b, 0.03],
          [k - 0.03, b, 0.03],
        ],
        &#x27;lot-line&#x27;
      );
    });
  for (let k = 0; k &lt; W; k += 1)
    html += poly(
      [
        [k + 0.3, 2.56, 0.03],
        [k + 0.7, 2.56, 0.03],
        [k + 0.7, 2.64, 0.03],
        [k + 0.3, 2.64, 0.03],
      ],
      &#x27;lot-dash&#x27;
    );
  html += &#x27;&lt;/g&gt;&#x27;;
  const car = (x, y, pal, i) =&gt; {
    const [t, l, rr] = pal,
      x0 = x + 0.17,
      x1 = x + 0.83,
      y0 = y + 0.18,
      y1 = y + 1.55,
      h = 0.5;
    const face = (pts, c) =&gt; poly(pts, &#x27;car-f&#x27;, `style=&quot;fill:${c}&quot;`);
    const body =
      face(
        [
          [x0, y1, 0.08],
          [x1, y1, 0.08],
          [x1, y1, h],
          [x0, y1, h],
        ],
        l
      ) +
      face(
        [
          [x1, y0, 0.08],
          [x1, y1, 0.08],
          [x1, y1, h],
          [x1, y0, h],
        ],
        rr
      ) +
      face(
        [
          [x0, y0, h],
          [x1, y0, h],
          [x1, y1, h],
          [x0, y1, h],
        ],
        t
      );
    const cx0 = x0 + 0.06,
      cx1 = x1 - 0.06,
      cy0 = y0 + 0.4,
      cy1 = y1 - 0.38,
      ch = h + 0.34;
    const cab =
      face(
        [
          [cx0, cy1, h],
          [cx1, cy1, h],
          [cx1, cy1, ch],
          [cx0, cy1, ch],
        ],
        &#x27;#dfe8ef&#x27;
      ) +
      face(
        [
          [cx1, cy0, h],
          [cx1, cy1, h],
          [cx1, cy1, ch],
          [cx1, cy0, ch],
        ],
        &#x27;#b9c7d2&#x27;
      ) +
      face(
        [
          [cx0, cy0, ch],
          [cx1, cy0, ch],
          [cx1, cy1, ch],
          [cx0, cy1, ch],
        ],
        t
      );
    const shadow = poly(
      [
        [x1, y0 + 0.05, 0.035],
        [x1 + 0.4, y0 + 0.2, 0.035],
        [x1 + 0.4, y1 + 0.2, 0.035],
        [x1, y1, 0.035],
      ],
      &#x27;car-sh&#x27;
    );
    const lamps = [x0 + 0.08, x1 - 0.2]
      .map(lx =&gt;
        poly(
          [
            [lx, y1, 0.2],
            [lx + 0.12, y1, 0.2],
            [lx + 0.12, y1, 0.3],
            [lx, y1, 0.3],
          ],
          &#x27;car-lamp&#x27;
        )
      )
      .join(&#x27;&#x27;);
    return `&lt;g class=&quot;car&quot; style=&quot;--i:${i}&quot;&gt;${shadow}${body}${cab}${lamps}&lt;/g&gt;`;
  };
  let ci = 0;
  rows.forEach(([a], ri) =&gt; {
    for (let k = 0; k &lt; W; k++) {
      const idx = ri * W + k;
      if (idx === mineIdx) continue;
      if (rnd() &lt; 0.72)
        html += car(k, a + (ri ? 0.1 : 0.05), palettes[Math.floor(rnd() * palettes.length)], ci++);
    }
  });
  // street lamps at both ends of the lane, each with a warm pool of light
  [-0.6, W + 0.6].forEach(lxp =&gt; {
    const [bx, by] = pt(lxp, 2.6, 0),
      [tx, ty] = pt(lxp, 2.6, 3.4);
    const foot = `${bx.toFixed(1)},${by.toFixed(1)}`,
      head = `${tx.toFixed(1)},${ty.toFixed(1)}`;
    html += `&lt;g class=&quot;lamp&quot;&gt;
      &lt;ellipse class=&quot;lamp-pool&quot; cx=&quot;${bx.toFixed(1)}&quot; cy=&quot;${by.toFixed(1)}&quot; rx=&quot;24&quot; ry=&quot;12&quot;/&gt;
      &lt;path d=&quot;M${foot} L${head}&quot;/&gt;
      &lt;circle class=&quot;lamp-head&quot; cx=&quot;${tx.toFixed(1)}&quot; cy=&quot;${ty.toFixed(1)}&quot; r=&quot;2.6&quot;/&gt;&lt;/g&gt;`;
  });
  if (mineIdx &gt;= 0) {
    const [ra, rb] = rows[Math.floor(mineIdx / W)],
      mk = mineIdx % W;
    html += `&lt;g class=&quot;spot-mine&quot;&gt;${poly(
      [
        [mk + 0.05, ra + 0.05, 0.04],
        [mk + 0.95, ra + 0.05, 0.04],
        [mk + 0.95, rb - 0.05, 0.04],
        [mk + 0.05, rb - 0.05, 0.04],
      ],
      &#x27;spot-glow&#x27;
    )}&lt;/g&gt;`;
    const [px, py] = pt(mk + 0.5, (ra + rb) / 2, 0.04),
      label = String(spotLabel).replace(/&amp;/g, &#x27;&amp;amp;&#x27;).replace(/&lt;/g, &#x27;&amp;lt;&#x27;),
      pw = Math.max(36, label.length * 7.2 + 16);
    const delay = (base + 0.9).toFixed(2);
    html += `&lt;g class=&quot;spot-pin&quot; style=&quot;--pd:${delay}s&quot;&gt;&lt;path
      d=&quot;M${px.toFixed(1)},${(py - 4).toFixed(1)} L${px.toFixed(1)},${(py - 26).toFixed(1)}&quot;/&gt;&lt;circle
      class=&quot;mine-ring&quot; cx=&quot;${px.toFixed(1)}&quot; cy=&quot;${py.toFixed(1)}&quot; r=&quot;6&quot;/&gt;&lt;rect
      x=&quot;${(px - pw / 2).toFixed(1)}&quot; y=&quot;${(py - 44).toFixed(1)}&quot; width=&quot;${pw}&quot; height=&quot;19&quot;
      rx=&quot;9.5&quot;/&gt;&lt;text x=&quot;${px.toFixed(1)}&quot; y=&quot;${(py - 30.8).toFixed(1)}&quot;
        text-anchor=&quot;middle&quot;&gt;${label}&lt;/text&gt;&lt;/g&gt;`;
  }
  const [lx, ly] = pt(W + 0.5, -0.5, 0);
  html += `&lt;g transform=&quot;translate(${lx.toFixed(1)} ${ly.toFixed(1)})&quot;&gt;&lt;g class=&quot;tree-in&quot;
    style=&quot;--i:0&quot;&gt;&lt;rect class=&quot;trunk&quot; x=&quot;-1.2&quot; y=&quot;-9&quot; width=&quot;2.4&quot; height=&quot;9&quot; rx=&quot;1&quot;/&gt;&lt;ellipse
    class=&quot;canopy&quot; cx=&quot;0&quot; cy=&quot;-15&quot; rx=&quot;6.8&quot; ry=&quot;8.2&quot;/&gt;&lt;/g&gt;&lt;/g&gt;`;
  const [bx2, by2] = pt(-0.6, D + 0.5, 0);
  html += `&lt;g transform=&quot;translate(${bx2.toFixed(1)} ${by2.toFixed(1)})&quot;&gt;&lt;g class=&quot;tree-in&quot;
    style=&quot;--i:1&quot;&gt;&lt;rect class=&quot;trunk&quot; x=&quot;-1.2&quot; y=&quot;-9&quot; width=&quot;2.4&quot; height=&quot;9&quot; rx=&quot;1&quot;/&gt;&lt;ellipse
    class=&quot;canopy&quot; cx=&quot;0&quot; cy=&quot;-15&quot; rx=&quot;6.8&quot; ry=&quot;8.2&quot;/&gt;&lt;ellipse class=&quot;canopy&quot; cx=&quot;-2&quot; cy=&quot;-17&quot;
    rx=&quot;3&quot; ry=&quot;3.6&quot; style=&quot;opacity:.55;fill:#fff&quot;/&gt;&lt;/g&gt;&lt;/g&gt;`;
  return `&lt;svg viewBox=&quot;42 58 176 150&quot; style=&quot;--b:${base.toFixed(2)}s;--n:3&quot; aria-hidden=&quot;true&quot;&gt;${html}&lt;/svg&gt;`;
}

function homeHouseHtml(resident) {
  const b = resident.building;
  if (!b) return &#x27;&#x27;;
  const spec = buildingSpec(b);
  spec.mine = myWindow(resident, spec);
  spec.mine.label = String(resident.apartmentNumber || &#x27;&#x27;);
  spec.lit = 0.22;
  const floorNo = spec.mine.floor + 1;
  // A shop, office, factory or mixed building has no window of the resident&#x27;s to point at: the model only.
  const modelOnly = b.kind &amp;&amp; b.kind !== &#x27;residential&#x27;;
  const spot = resident.parkingSpot &amp;&amp; String(resident.parkingSpot).trim();
  return `&lt;div class=&quot;home-house hh-two ${buildingAnimOn() ? &#x27;&#x27; : &#x27;no-anim&#x27;}&quot;&gt;
    &lt;div class=&quot;hh-col&quot;&gt;
      &lt;div class=&quot;hh-scene&quot;&gt;${buildingScene(spec, 0.15)}&lt;/div&gt;
      &lt;div class=&quot;hh-cap&quot;&gt;
        ${modelOnly ? &#x27;&#x27; : `&lt;div class=&quot;hh-lbl&quot;&gt;${L.home.houseHint}&lt;/div&gt;`}
        &lt;div class=&quot;hh-num&quot;&gt;${L.home.aptLabel} ${esc(resident.apartmentNumber)}&lt;/div&gt;
        ${modelOnly ? &#x27;&#x27; : `&lt;div class=&quot;hh-chip&quot;&gt;${L.home.houseFloor.replace(&#x27;{n}&#x27;, floorNo)}&lt;/div&gt;`}
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;button class=&quot;hh-col hh-lot&quot; data-go=&quot;myVehicles&quot; aria-label=&quot;${esc(L.vehiclesV.title)}&quot;&gt;
      &lt;div class=&quot;hh-scene&quot;&gt;${parkingScene(spot || &#x27;&#x27;, 1000 + (Number(b.id) || 1) * 31, 0.45)}&lt;/div&gt;
      &lt;div class=&quot;hh-cap&quot;&gt;
        &lt;div class=&quot;hh-lbl&quot;&gt;${L.home.houseSpot}&lt;/div&gt;
        &lt;div class=&quot;hh-num&quot;&gt;${spot ? esc(spot) : L.home.noSpot}&lt;/div&gt;
        &lt;div class=&quot;hh-chip&quot;&gt;${L.vehiclesV.tile}&amp;nbsp;→&lt;/div&gt;
      &lt;/div&gt;
    &lt;/button&gt;
  &lt;/div&gt;`;
}
&lt;/script&gt;
&lt;script&gt;// 3D models of commercial buildings (1.1): a shop, an office tower, a factory, and a mixed building (shops below,
// apartments above). The same isometric drawing and CSS classes as buildingScene.js (boxes made of three faces,
// windows, ground, trees); buildingScene() hands over to this when the building&#x27;s kind is not residential.
// The admin Buildings screen has its own copy of this file (kept in sync by hand), like buildingScene.js.

const commercialScene = (() =&gt; {
  const U = 13;
  const C = 0.866 * U;
  const S = 0.5 * U;
  const FH = 0.95; // height of one storey

  const rng = (seed) =&gt; {
    let t = seed &gt;&gt;&gt; 0;
    return () =&gt; {
      t += 0x6d2b79f5;
      let x = Math.imul(t ^ (t &gt;&gt;&gt; 15), 1 | t);
      x ^= x + Math.imul(x ^ (x &gt;&gt;&gt; 7), 61 | x);
      return ((x ^ (x &gt;&gt;&gt; 14)) &gt;&gt;&gt; 0) / 4294967296;
    };
  };

  function scene(spec, base) {
    const { w, d, tone, seed, kind } = spec;
    const r = rng(seed);
    const m = 1.3;
    const lit = spec.lit ?? 0.58;
    const ox = 130 - ((w - d) * C) / 2;
    const oy = 198 - (w + d + 2 * m) * S;
    const pt = (x, y, z) =&gt; [ox + (x - y) * C, oy + (x + y) * S - z * U];
    const P = (x, y, z) =&gt; pt(x, y, z).map((n) =&gt; n.toFixed(1)).join(&#x27;,&#x27;);
    const poly = (pts, cls) =&gt; `&lt;polygon class=&quot;${cls}&quot; points=&quot;${pts.map((p) =&gt; P(...p)).join(&#x27; &#x27;)}&quot;/&gt;`;
    const box = (x0, y0, x1, y1, z0, z1, top = true) =&gt;
      poly([[x0, y1, z0], [x1, y1, z0], [x1, y1, z1], [x0, y1, z1]], &#x27;f-left&#x27;) +
      poly([[x1, y0, z0], [x1, y1, z0], [x1, y1, z1], [x1, y0, z1]], &#x27;f-right&#x27;) +
      (top ? poly([[x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]], &#x27;f-top&#x27;) : &#x27;&#x27;);

    // A window on the front face (the plane y = d) or on the right face (the plane x = w).
    const delay = () =&gt; `--wd:${(base + 0.8 + r() * 1.4).toFixed(2)}s`;
    const winClass = (litChance) =&gt; `win${r() &lt; litChance ? &#x27; lit&#x27; : &#x27;&#x27;}${r() &lt; 0.7 ? &#x27; still&#x27; : &#x27;&#x27;}`;
    const winFront = (x0, x1, z0, z1, litChance = lit) =&gt;
      `&lt;polygon class=&quot;${winClass(litChance)}&quot; style=&quot;${delay()}&quot; points=&quot;${[[x0, d, z0], [x1, d, z0], [x1, d, z1], [x0, d, z1]].map((p) =&gt; P(...p)).join(&#x27; &#x27;)}&quot;/&gt;`;
    const winSide = (y0, y1, z0, z1, litChance = lit) =&gt;
      `&lt;polygon class=&quot;${winClass(litChance)}&quot; style=&quot;${delay()}&quot; points=&quot;${[[w, y0, z0], [w, y1, z0], [w, y1, z1], [w, y0, z1]].map((p) =&gt; P(...p)).join(&#x27; &#x27;)}&quot;/&gt;`;
    const door = (x0, x1, z1) =&gt; poly([[x0, d, 0], [x1, d, 0], [x1, d, z1], [x0, d, z1]], &#x27;door&#x27;);

    const tree = (x, y, i) =&gt; {
      const [X, Y] = pt(x, y, 0);
      return `&lt;g transform=&quot;translate(${X.toFixed(1)} ${Y.toFixed(1)})&quot;&gt;&lt;g class=&quot;tree-in&quot; style=&quot;--i:${i}&quot;&gt;&lt;rect class=&quot;trunk&quot; x=&quot;-1.2&quot; y=&quot;-9&quot; width=&quot;2.4&quot; height=&quot;9&quot; rx=&quot;1&quot;/&gt;&lt;ellipse class=&quot;canopy&quot; cx=&quot;0&quot; cy=&quot;-15&quot; rx=&quot;6.8&quot; ry=&quot;8.2&quot;/&gt;&lt;ellipse class=&quot;canopy&quot; cx=&quot;-2&quot; cy=&quot;-17&quot; rx=&quot;3&quot; ry=&quot;3.6&quot; style=&quot;opacity:.55;fill:#fff&quot;/&gt;&lt;/g&gt;&lt;/g&gt;`;
    };
    const bush = (x, y, i) =&gt; {
      const [X, Y] = pt(x, y, 0);
      return `&lt;g transform=&quot;translate(${X.toFixed(1)} ${Y.toFixed(1)})&quot;&gt;&lt;g class=&quot;tree-in&quot; style=&quot;--i:${i}&quot;&gt;&lt;ellipse class=&quot;bush&quot; cx=&quot;0&quot; cy=&quot;-2.6&quot; rx=&quot;4.2&quot; ry=&quot;3.2&quot;/&gt;&lt;/g&gt;&lt;/g&gt;`;
    };

    const di = w / 2; // the entrance is in the middle of the front face
    const ground = () =&gt; {
      let out = `&lt;g class=&quot;ground&quot;&gt;${poly([[w + m, -m, 0], [w + m, d + m, 0], [w + m, d + m, -0.4], [w + m, -m, -0.4]], &#x27;g-right&#x27;)}${poly([[-m, d + m, 0], [w + m, d + m, 0], [w + m, d + m, -0.4], [-m, d + m, -0.4]], &#x27;g-left&#x27;)}${poly([[-m, -m, 0], [w + m, -m, 0], [w + m, d + m, 0], [-m, d + m, 0]], &#x27;g-top&#x27;)}&lt;/g&gt;`;
      out += poly([[w, 0, 0.02], [w + 1.2, 0.8, 0.02], [w + 1.2, d + 0.8, 0.02], [0, d + 0.8, 0.02], [0, d, 0.02], [w, d, 0.02]], &#x27;g-shadow&#x27;);
      out += poly([[di - 0.4, d, 0.03], [di + 0.4, d, 0.03], [di + 0.4, d + m, 0.03], [di - 0.4, d + m, 0.03]], &#x27;g-path&#x27;);
      return out;
    };
    const group = (cls, i, faces, wins = &#x27;&#x27;) =&gt; `&lt;g class=&quot;${cls}&quot; style=&quot;--i:${i}&quot;&gt;&lt;g class=&quot;faces&quot;&gt;${faces}&lt;/g&gt;${wins ? `&lt;g class=&quot;wins&quot;&gt;${wins}&lt;/g&gt;` : &#x27;&#x27;}&lt;/g&gt;`;
    const flatRoof = (z, i, inset = 0.28) =&gt;
      group(&#x27;roof&#x27;, i, poly([[inset, inset, z], [w - inset, inset, z], [w - inset, d - inset, z], [inset, d - inset, z]], &#x27;r-inner&#x27;) +
        box(w * 0.55, d * 0.2, w * 0.55 + 1.0, d * 0.2 + 1.0, z, z + 0.7) +
        box(w * 0.14, d * 0.5, w * 0.14 + 0.9, d * 0.5 + 0.8, z, z + 0.45));
    const awning = (x0, x1, z) =&gt; `&lt;g class=&quot;awning&quot;&gt;${box(x0, d, x1, d + 0.7, z, z + 0.1)}&lt;/g&gt;`;
    const sign = (x0, x1, z0, z1) =&gt; poly([[x0, d, z0], [x1, d, z0], [x1, d, z1], [x0, d, z1]], &#x27;sign&#x27;);

    // The glass front of a shop at the foot of a building: panes either side of the door.
    const shopFront = (z0, z1) =&gt; {
      let out = &#x27;&#x27;;
      const pane = (a, b) =&gt; {
        const n = Math.max(1, Math.round((b - a) / 0.95));
        const step = (b - a) / n;
        for (let i = 0; i &lt; n; i++) out += winFront(a + i * step + 0.06, a + (i + 1) * step - 0.06, z0, z1, 0.9);
      };
      pane(0.3, di - 0.55);
      pane(di + 0.55, w - 0.3);
      out += door(di - 0.4, di + 0.4, z1 - 0.05);
      return out;
    };

    let html = ground();
    let total = 2;

    if (kind === &#x27;shop&#x27;) {
      const h = 1.8;
      html += group(&#x27;floor&#x27;, 0, box(0, 0, w, d, 0, h, true), shopFront(0.16, 1.1) + winSide(0.6, 1.4, 0.5, 1.3, 0.8) + winSide(d - 1.4, d - 0.6, 0.5, 1.3, 0.8));
      html += awning(0.12, w - 0.12, 1.22) + group(&#x27;floor&#x27;, 1, sign(0.7, w - 0.7, 1.4, 1.72));
      html += flatRoof(h, 2);
      html += bush(di - 1.0, d + 0.9, 1) + bush(di + 1.0, d + 0.9, 2);
      total = 4;
    } else if (kind === &#x27;office&#x27;) {
      const n = Math.max(4, Math.min(8, (spec.floors || 4) + 2));
      for (let k = 0; k &lt; n; k++) {
        const z0 = k * FH;
        const z1 = z0 + FH;
        let wins = &#x27;&#x27;;
        if (k === 0) {
          wins += door(di - 0.45, di + 0.45, 0.78);
          wins += winFront(0.3, di - 0.7, z0 + 0.2, z0 + 0.8, 0.8) + winFront(di + 0.7, w - 0.3, z0 + 0.2, z0 + 0.8, 0.8);
        } else {
          const cols = Math.max(3, Math.round(w * 2));
          for (let i = 0; i &lt; cols; i++) wins += winFront((i + 0.1) * (w / cols), (i + 0.9) * (w / cols), z0 + 0.2, z0 + 0.8);
        }
        const rows = Math.max(3, Math.round(d * 2));
        for (let j = 0; j &lt; rows; j++) wins += winSide((j + 0.1) * (d / rows), (j + 0.9) * (d / rows), z0 + 0.2, z0 + 0.8);
        html += group(&#x27;floor&#x27;, k, box(0, 0, w, d, z0, z1, k === n - 1), wins);
      }
      html += awning(di - 1.0, di + 1.0, 0.86);
      html += flatRoof(n * FH, n);
      html += tree(w + 0.75, d + 0.85, 1);
      total = n + 3;
    } else if (kind === &#x27;factory&#x27;) {
      const h = 1.5;
      let wins = &#x27;&#x27;;
      for (let i = 0; i &lt; Math.max(3, Math.round(w)); i++) {
        const cols = Math.max(3, Math.round(w));
        if (Math.abs((i + 0.5) * (w / cols) - di) &lt; 1.0) continue;
        wins += winFront((i + 0.15) * (w / cols), (i + 0.85) * (w / cols), 0.85, 1.25, 0.5);
      }
      wins += door(di - 0.8, di + 0.8, 1.15);
      for (let j = 0; j &lt; Math.max(2, Math.round(d)); j++) wins += winSide((j + 0.15) * (d / Math.max(2, Math.round(d))), (j + 0.85) * (d / Math.max(2, Math.round(d))), 0.85, 1.25, 0.5);
      html += group(&#x27;floor&#x27;, 0, box(0, 0, w, d, 0, h, false), wins);
      // a sawtooth roof: every tooth is a slope with a glass wall on its tall side
      const teeth = 3;
      const tw = w / teeth;
      let roof = &#x27;&#x27;;
      for (let i = 0; i &lt; teeth; i++) {
        const x0 = i * tw;
        const x1 = x0 + tw;
        roof += poly([[x0, 0, h], [x0, d, h], [x1, d, h + 0.8], [x1, 0, h + 0.8]], &#x27;r-slope&#x27;);
        roof += poly([[x0, d, h], [x1, d, h], [x1, d, h + 0.8]], &#x27;r-gable&#x27;);
        roof += poly([[x1, 0, h], [x1, d, h], [x1, d, h + 0.8], [x1, 0, h + 0.8]], &#x27;f-right&#x27;);
        roof += `&lt;polygon class=&quot;win lit still&quot; style=&quot;${delay()}&quot; points=&quot;${[[x1, 0.3, h + 0.15], [x1, d - 0.3, h + 0.15], [x1, d - 0.3, h + 0.65], [x1, 0.3, h + 0.65]].map((p) =&gt; P(...p)).join(&#x27; &#x27;)}&quot;/&gt;`;
      }
      html += group(&#x27;roof&#x27;, 1, roof);
      // the chimney beside the hall, with smoke
      const cx = w + 0.45;
      html += group(&#x27;roof&#x27;, 2, box(cx, 0.2, cx + 0.7, 0.9, 0, 3.8) + box(cx - 0.08, 0.12, cx + 0.78, 0.98, 3.55, 3.8));
      const [sx, sy] = pt(cx + 0.35, 0.55, 3.95);
      html += [0, 1, 2].map((i) =&gt; `&lt;ellipse class=&quot;smoke&quot; style=&quot;--sd:${(i * 1.6).toFixed(1)}s&quot; cx=&quot;${(sx + i * 1.5).toFixed(1)}&quot; cy=&quot;${(sy - i * 3).toFixed(1)}&quot; rx=&quot;${4 + i}&quot; ry=&quot;${3 + i * 0.6}&quot;/&gt;`).join(&#x27;&#x27;);
      html += bush(0.4, d + 0.9, 1) + bush(w - 0.4, d + 0.9, 2);
      total = 4;
    } else {
      // mixed: shops on the ground floor, apartments above
      const n = Math.max(4, Math.min(6, spec.floors || 4));
      const gh = 1.25;
      html += group(&#x27;floor&#x27;, 0, box(0, 0, w, d, 0, gh, false), shopFront(0.16, 1.0) + winSide(0.6, 1.4, 0.4, 1.0, 0.8) + winSide(d - 1.4, d - 0.6, 0.4, 1.0, 0.8));
      for (let k = 1; k &lt; n; k++) {
        const z0 = gh + (k - 1) * FH;
        const z1 = z0 + FH;
        let wins = &#x27;&#x27;;
        for (let i = 0; i &lt; Math.max(2, Math.round(w)); i++) {
          const cols = Math.max(2, Math.round(w));
          wins += winFront((i + 0.22) * (w / cols), (i + 0.78) * (w / cols), z0 + 0.28, z0 + 0.72);
        }
        for (let j = 0; j &lt; Math.max(2, Math.round(d)); j++) {
          const rows = Math.max(2, Math.round(d));
          wins += winSide((j + 0.22) * (d / rows), (j + 0.78) * (d / rows), z0 + 0.28, z0 + 0.72);
        }
        html += group(&#x27;floor&#x27;, k, box(0, 0, w, d, z0, z1, k === n - 1), wins);
      }
      html += awning(0.12, w - 0.12, 1.02);
      html += flatRoof(gh + (n - 1) * FH, n);
      html += tree(w + 0.75, d + 0.85, 1);
      total = n + 3;
    }
    html += tree(-0.7, d + 0.7, 2);

    return `&lt;svg viewBox=&quot;0 0 260 220&quot; class=&quot;tone-${tone}&quot; style=&quot;--b:${base.toFixed(2)}s;--n:${total}&quot; aria-hidden=&quot;true&quot;&gt;${typeof WIN_DEFS === &#x27;string&#x27; ? WIN_DEFS : &#x27;&#x27;}${html}&lt;/svg&gt;`; // the admin screen has no window gradients
  }

  return scene;
})();
&lt;/script&gt;
&lt;script&gt;// Language picker; login / forgot password / first-time / create password screens
// Part of the resident app: plain &lt;script&gt; files share one global scope; load order is set in
// index.html.
// Compact language picker: one button showing the current language that opens
// a small menu with a check mark on the active one. Replaces the row of pills,
// which wrapped unevenly on phones (ragged widths, a lone &quot;Español&quot; on line two).
function langPicker() {
  const current = (LANG_NAMES.find(([c]) =&gt; c === state.lang) || LANG_NAMES[0])[1];
  // the tick shown next to the language in use
  const check = lineIcon(&#x27;&lt;path d=&quot;M5 13l4.5 4.5L19 8&quot;/&gt;&#x27;, 16, 2.4);
  return `&lt;div class=&quot;lang-menu-wrap&quot;&gt;
    &lt;button type=&quot;button&quot; class=&quot;lang-trigger&quot; data-action=&quot;toggle-lang-menu&quot;
      aria-haspopup=&quot;listbox&quot; aria-expanded=&quot;${state.langMenuOpen ? &#x27;true&#x27; : &#x27;false&#x27;}&quot; aria-label=&quot;${L.profile.languageTitle}&quot;&gt;
      ${lineIcon(
        `&lt;circle cx=&quot;12&quot; cy=&quot;12&quot; r=&quot;8.5&quot;/&gt;&lt;path d=&quot;M3.5 12h17M12 3.5c2.5 2.3 3.8 5.3 3.8 8.5S14.5 18.2 12 20.5C9.5 18.2 8.2 15.2 8.2 12S9.5 5.8 12 3.5Z&quot;/&gt;`,
        15,
        1.7
      )}
      &lt;span&gt;${current}&lt;/span&gt;
      ${lineIcon(`&lt;path d=&quot;M6 9l6 6 6-6&quot;/&gt;`, 12, 2.4)}

// The second sign-in step: the code that was e-mailed (shown instead of the password form).
const loginCodeForm = () =&gt; `
      &lt;h1&gt;${L.login.codeTitle}&lt;/h1&gt;
      &lt;p class=&quot;sub&quot;&gt;${L.login.codeSent.replace(&#x27;{email}&#x27;, esc(state.loginChallenge.hint))}&lt;/p&gt;
      &lt;form id=&quot;loginCodeForm&quot;&gt;
        &lt;div class=&quot;field&quot; style=&quot;margin-bottom:8px;&quot;&gt;
          &lt;label&gt;${L.login.codeLabel}&lt;/label&gt;
          &lt;input type=&quot;text&quot; id=&quot;loginCode&quot; inputmode=&quot;numeric&quot; autocomplete=&quot;one-time-code&quot;
            maxlength=&quot;12&quot; autofocus&gt;
        &lt;/div&gt;
        &lt;label style=&quot;display:flex; gap:8px; align-items:center; font-size:13px; margin:12px 0;&quot;&gt;
          &lt;input type=&quot;checkbox&quot; id=&quot;loginRemember&quot; checked&gt; ${L.login.codeRemember}
        &lt;/label&gt;
        ${
          state.loginInfo
            ? `&lt;div style=&quot;color:var(--brand-dark); font-size:12.5px; font-weight:600;
            margin-bottom:14px;&quot;&gt;${esc(state.loginInfo)}&lt;/div&gt;`
            : &#x27;&#x27;
        }
        ${
          state.loginError
            ? `&lt;div style=&quot;color:#8a1f1f; font-size:12.5px; font-weight:600;
            margin-bottom:14px;&quot;&gt;${esc(state.loginError)}&lt;/div&gt;`
            : &#x27;&#x27;
        }
        &lt;div class=&quot;login-actions&quot;&gt;
          &lt;button class=&quot;btn btn-primary&quot; type=&quot;submit&quot; ${
            state.busy ? &#x27;disabled&#x27; : &#x27;&#x27;
          }&gt;${state.busy ? &#x27;…&#x27; : L.login.codeBtn}&lt;/button&gt;
          &lt;button class=&quot;btn btn-secondary&quot; type=&quot;button&quot;
            data-action=&quot;login-code-resend&quot;&gt;${L.login.codeResend}&lt;/button&gt;
        &lt;/div&gt;
      &lt;/form&gt;
      &lt;button class=&quot;btn btn-secondary&quot; style=&quot;width:100%; margin-top:10px;&quot;
        data-action=&quot;login-code-back&quot;&gt;${L.login.codeBack}&lt;/button&gt;`;

// Code + new password: shared by &quot;first visit&quot; and &quot;forgot password&quot; (ids are prefixed, e.g.
// firstTimeCode / resetCode).
function codeStep({ id, email, draft, error, info, submitLabel, resendAction }) {
  const d = draft || {};
  return `
        &lt;p style=&quot;font-size:13px; color:var(--g700); line-height:1.6; margin:16px 0;&quot;&gt;${L.firstTime.codeSent.replace(
          &#x27;{email}&#x27;,
          `&lt;b&gt;${esc(email || &#x27;&#x27;)}&lt;/b&gt;`
        )}&lt;/p&gt;
        &lt;form id=&quot;${id}CodeForm&quot;&gt;
          &lt;div class=&quot;field&quot;&gt;
            &lt;label&gt;${L.firstTime.codeLabel}&lt;/label&gt;
            &lt;input type=&quot;text&quot; id=&quot;${id}Code&quot; inputmode=&quot;numeric&quot;
              autocomplete=&quot;one-time-code&quot; maxlength=&quot;7&quot; placeholder=&quot;123 456&quot;
              style=&quot;letter-spacing:3px; font-size:18px;&quot; value=&quot;${esc(d.code || &#x27;&#x27;)}&quot;&gt;
          &lt;/div&gt;
          &lt;div class=&quot;field&quot;&gt;
            &lt;label&gt;${L.createPassword.passwordLabel}&lt;/label&gt;
            &lt;input type=&quot;password&quot; id=&quot;${id}Password&quot; autocomplete=&quot;new-password&quot; value=&quot;${esc(d.password || &#x27;&#x27;)}&quot;&gt;
          &lt;/div&gt;
          &lt;div class=&quot;field&quot; style=&quot;margin-bottom:8px;&quot;&gt;
            &lt;label&gt;${L.createPassword.confirmLabel}&lt;/label&gt;
            &lt;input type=&quot;password&quot; id=&quot;${id}Confirm&quot; autocomplete=&quot;new-password&quot; value=&quot;${esc(d.confirmPassword || &#x27;&#x27;)}&quot;&gt;
          &lt;/div&gt;
          ${
            error
              ? `&lt;div
            style=&quot;color:#8a1f1f; font-size:12.5px; font-weight:600;
              margin:10px 0;&quot;&gt;${esc(error)}&lt;/div&gt;`
              : &#x27;&#x27;
          }
          ${
            info
              ? `&lt;div
            style=&quot;color:var(--brand-dark); font-size:12.5px; font-weight:600;
              margin:10px 0;&quot;&gt;${esc(info)}&lt;/div&gt;`
              : &#x27;&#x27;
          }
          &lt;button class=&quot;btn btn-primary&quot; type=&quot;submit&quot; style=&quot;margin-top:8px;&quot; ${
            state.busy ? &#x27;disabled&#x27; : &#x27;&#x27;
          }&gt;${state.busy ? &#x27;…&#x27; : submitLabel}&lt;/button&gt;
        &lt;/form&gt;
        &lt;button class=&quot;btn btn-secondary&quot; style=&quot;margin-top:10px;&quot;
          data-action=&quot;${resendAction}&quot; ${state.busy ? &#x27;disabled&#x27; : &#x27;&#x27;}&gt;${L.firstTime.resend}&lt;/button&gt;
        &lt;button class=&quot;btn btn-secondary&quot; style=&quot;margin-top:10px;&quot; data-go=&quot;login&quot;&gt;${L.firstTime.backToLogin}&lt;/button&gt;`;
}

&lt;script&gt;// Self-registration for new residents: a form on the login screen. Nothing is created until
// management approves it in The Office.
// Own handlers (prefix &quot;su-&quot;), own state (state.su). The captcha is a small signed sum served by
// our own server.
function suReset() {
  state.su = {
    first: &#x27;&#x27;,
    last: &#x27;&#x27;,
    email: &#x27;&#x27;,
    phone: &#x27;&#x27;,
    building: &#x27;&#x27;,
    apt: &#x27;&#x27;,
    answer: &#x27;&#x27;,
    website: &#x27;&#x27;,
    q: null,
    token: null,
    buildings: [],
    free: null,
    hasPets: null,
    sent: false,
    error: null,
    busy: false,
  };
}
async function suLoadApts() {
  const s = state.su;
  s.free = null;
  if (s.building) {
    try {
      s.free = (
        await api._request(&#x27;/api/signup/apartments?building=&#x27; + encodeURIComponent(s.building))
      ).free;
    } catch (_) {}
  }
  if (s.free &amp;&amp; !s.free.includes(s.apt)) s.apt = &#x27;&#x27;;
  render();
}
async function suLoad() {
  if (!state.su) suReset();
  try {
    const [c, b] = await Promise.all([
      api._request(&#x27;/api/signup/captcha&#x27;),
      api._request(&#x27;/api/signup/buildings&#x27;),
    ]);
    state.su.q = c.question;
    state.su.token = c.token;
    state.su.buildings = b;
    if (b.length === 1 &amp;&amp; !state.su.building) state.su.building = b[0].code;
  } catch (e) {
    state.su.error = e.message;
  }
  await suLoadApts();
}
function openSignup(prefillBuilding) {
  suReset();
  if (prefillBuilding) state.su.building = prefillBuilding;
  state.view = &#x27;signup&#x27;;
  render();
  suLoad();
}

// Links to the legal pages (open in a new tab, in the resident&#x27;s language where we have it:
// French or English).

  const q = state.lang === &#x27;en&#x27; ? &#x27;?lang=en&#x27; : &#x27;&#x27;;
  const V = L.signupV;

    href=&quot;/privacy${q}&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;${V.privacy}&lt;/a&gt;`;
}

document.addEventListener(&#x27;input&#x27;, e =&gt; {
  const id = e.target &amp;&amp; e.target.id;
  if (!id || !id.startsWith(&#x27;su_&#x27;) || !state.su) return;
  const map = {
    su_first: &#x27;first&#x27;,
    su_last: &#x27;last&#x27;,
    su_email: &#x27;email&#x27;,
    su_phone: &#x27;phone&#x27;,
    su_building: &#x27;building&#x27;,
    su_apt: &#x27;apt&#x27;,
    su_answer: &#x27;answer&#x27;,
    su_website: &#x27;website&#x27;,
  };
  if (map[id]) state.su[map[id]] = e.target.value;
});
document.addEventListener(&#x27;click&#x27;, e =&gt; {
  const b = e.target.closest(&#x27;[data-action=&quot;su-pets&quot;]&#x27;);
  if (!b || !state.su) return;
  state.su.hasPets = b.dataset.answer === &#x27;true&#x27;;
  render();
});
document.addEventListener(&#x27;change&#x27;, e =&gt; {
  if (e.target &amp;&amp; e.target.id === &#x27;su_building&#x27; &amp;&amp; state.su) {
    state.su.building = e.target.value;
    state.su.apt = &#x27;&#x27;;
    suLoadApts();
  }
});
document.addEventListener(&#x27;submit&#x27;, async e =&gt; {
  if (!e.target || e.target.id !== &#x27;signupForm&#x27;) return;
  e.preventDefault();
  const s = state.su;
  const V = L.signupV;
  if (
    !s.first.trim() ||
    !s.last.trim() ||
    !s.email.trim() ||
    !s.building ||
    !s.apt.trim() ||
    !s.answer.trim()
  ) {
    s.error = V.required;
    render();
    return;
  }
  s.busy = true;
  s.error = null;
  render();
  try {
    await api._request(&#x27;/api/signup&#x27;, {
      method: &#x27;POST&#x27;,
      body: JSON.stringify({
        firstName: s.first.trim(),
        lastName: s.last.trim(),
        email: s.email.trim(),
        phone: s.phone.trim(),
        buildingCode: s.building,
        apartmentNumber: s.apt.trim(),
        ...(s.hasPets === null ? {} : { hasPets: s.hasPets }),
        website: s.website,
        captchaToken: s.token,
        captchaAnswer: s.answer.trim(),
        lang: state.lang,
      }),
    });
    s.sent = true;
  } catch (err) {
    s.error =
      err.message === &#x27;captcha&#x27;
        ? V.errCaptcha
        : err.message === &#x27;invalid&#x27;
          ? V.errInvalid
          : err.message;
    s.answer = &#x27;&#x27;;
    s.busy = false;
    render();
    suLoad();
    return;
  }
  s.busy = false;
  render();
});
&lt;/script&gt;
&lt;script&gt;// Pets: the one household question we ask, answered yes or no. Shown in Profile → Personal
// information and in the sign-up form (see signup.js). Replaces the old list of household members.
function petsButtons(action, value) {
  const V = L.householdV;
  const button = (choice, caption) =&gt;
    `&lt;button type=&quot;button&quot; class=&quot;btn ${value === choice ? &#x27;btn-primary&#x27; : &#x27;btn-secondary&#x27;}&quot;

&lt;script&gt;// Profile → Personal information: download my data, ask for deletion (Law 25). Own handlers,

function pvSection() {
  const V = L.privacyV;
  const open = (state.pvRequests || []).find(r =&gt; r.status === &#x27;open&#x27;);
  const q = state.lang === &#x27;en&#x27; ? &#x27;?lang=en&#x27; : &#x27;&#x27;;
  return `
    &lt;div style=&quot;height:1px; background:var(--g200); margin:28px 0 22px 0;&quot;&gt;&lt;/div&gt;
    &lt;h2 style=&quot;font-size:15px; font-weight:800; margin:0 0 6px 0;&quot;&gt;${V.title}&lt;/h2&gt;
    &lt;p style=&quot;font-size:12.5px; color:var(--g500); margin:0 0 12px 0; line-height:1.5;&quot;&gt;${V.note}&lt;/p&gt;
    &lt;div style=&quot;display:flex; gap:8px; flex-wrap:wrap;&quot;&gt;
      &lt;button class=&quot;btn btn-secondary&quot; style=&quot;width:auto;&quot; data-action=&quot;pv-export&quot;&gt;${V.download}&lt;/button&gt;
      ${open ? &#x27;&#x27; : `&lt;button class=&quot;btn btn-secondary&quot; style=&quot;width:auto;&quot; data-action=&quot;pv-delete&quot;&gt;${V.del_}&lt;/button&gt;`}
    &lt;/div&gt;
    ${
      open
        ? `&lt;div
      style=&quot;font-size:12.5px; color:var(--brand-dark); font-weight:600;
        margin-top:10px;&quot;&gt;${V.requested.replace(
          &#x27;{date}&#x27;,
          esc(String(open.createdAt).slice(0, 10))
        )}&lt;/div&gt;`
        : &#x27;&#x27;
    }
    ${
      state.pvMsg
        ? `&lt;div
      style=&quot;font-size:12.5px; color:#8a1f1f; font-weight:600;
        margin-top:10px;&quot;&gt;${esc(state.pvMsg)}&lt;/div&gt;`
        : &#x27;&#x27;
    }
    &lt;div style=&quot;margin-top:12px; font-size:12px;&quot;&gt;&lt;a href=&quot;/privacy${q}&quot; target=&quot;_blank&quot;
      rel=&quot;noopener&quot;&gt;${V.policy}&lt;/a&gt;&lt;/div&gt;`;
}
document.addEventListener(&#x27;click&#x27;, async e =&gt; {
  const btn = e.target.closest(&#x27;[data-action^=&quot;pv-&quot;]&#x27;);
  if (!btn) return;
  const V = L.privacyV;
  state.pvMsg = null;
  try {
    if (btn.dataset.action === &#x27;pv-export&#x27;) {
      const res = await fetch(&#x27;/api/privacy/export&#x27;, {
        headers: { Authorization: &#x27;Bearer &#x27; + api.getToken() },
      });
      if (!res.ok) throw new Error((await res.json().catch(() =&gt; ({}))).error || &#x27;Error&#x27;);
      const url = URL.createObjectURL(await res.blob());
      const a = document.createElement(&#x27;a&#x27;);
      a.href = url;
      a.download = &#x27;my-data.json&#x27;;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() =&gt; URL.revokeObjectURL(url), 2000);
      return;
    }
    if (btn.dataset.action === &#x27;pv-delete&#x27;) {
      if (!confirm(V.confirmDel)) return;
      await api._request(&#x27;/api/privacy/delete-request&#x27;, { method: &#x27;POST&#x27; });
    }
  } catch (err) {
    state.pvMsg = err.message;
  }
  await pvLoad();
});

document.addEventListener(&#x27;input&#x27;, e =&gt; {

document.addEventListener(&#x27;click&#x27;, async e =&gt; {

  if (!btn || !state.vh) return;
  const V = L.vehiclesV;
  const h = state.vh;
  const a = btn.dataset.action;
  h.error = null;
  try {
    if (a === &#x27;vh-edit&#x27;) {
      const c = h.list.find(x =&gt; String(x.id) === btn.dataset.id);
      if (c) {
        h.editId = c.id;

    if (a === &#x27;vh-cancel&#x27;) {
      h.editId = null;
      h.form = { plate: &#x27;&#x27;, make: &#x27;&#x27;, model: &#x27;&#x27;, color: &#x27;&#x27; };
      render();
      return;

    if (a === &#x27;vh-del&#x27;) {
      if (!confirm(V.confirmDel)) return;

      else await api._request(&#x27;/api/vehicles&#x27;, { method: &#x27;POST&#x27;, body });
      h.editId = null;
      h.form = { plate: &#x27;&#x27;, make: &#x27;&#x27;, model: &#x27;&#x27;, color: &#x27;&#x27; };
    }
  } catch (err) {
    h.error =
      err.message === &#x27;Invalid vehicle (a licence plate is required).&#x27; ? V.error : err.message;
  }
  await vhLoad();
});

    day: &#x27;numeric&#x27;,

function starRow(n, active, interactive) {
  let out = &#x27;&#x27;;
  for (let i = 1; i &lt;= 5; i++) {

      fill=&quot;${on ? &#x27;var(--brand)&#x27; : &#x27;none&#x27;}&quot; stroke=&quot;var(--brand)&quot; stroke-width=&quot;1.6&quot;
      stroke-linejoin=&quot;round&quot;&gt;&lt;path d=&quot;M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9L12 3Z&quot;/&gt;&lt;/svg&gt;`;
    out += interactive
      ? `&lt;button type=&quot;button&quot; data-action=&quot;rate-pick&quot; data-n=&quot;${i}&quot; aria-label=&quot;${i}&quot;
          style=&quot;background:none;border:none;padding:2px;cursor:pointer;&quot;&gt;${svg}&lt;/button&gt;`

function ratingBlock(r, bucket) {
  const T = L.rateV;
  if (!T || bucket !== &#x27;done&#x27;) return &#x27;&#x27;;
  if (r.rating) {
    return `&lt;div style=&quot;border:1px solid var(--g200);border-radius:12px;padding:14px;margin:8px 0 16px;&quot;&gt;
      &lt;div style=&quot;font-size:12px;font-weight:700;color:var(--g500);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;&quot;&gt;${T.yours}&lt;/div&gt;
      ${starRow(r.rating, false, false)}
      ${
        r.ratingComment
          ? `&lt;p
        style=&quot;font-size:13px;color:var(--g700);margin:8px 0 0;&quot;&gt;${esc(r.ratingComment)}&lt;/p&gt;`
          : &#x27;&#x27;
      }
    &lt;/div&gt;`;
  }
  const n = state.rateDraft &amp;&amp; state.rateDraft.id === r.id ? state.rateDraft.n : 0;
  const c = state.rateDraft &amp;&amp; state.rateDraft.id === r.id ? state.rateDraft.comment : &#x27;&#x27;;
  return `&lt;div style=&quot;border:1px solid var(--g200);border-radius:12px;padding:14px;margin:8px 0 16px;&quot;&gt;
    &lt;div style=&quot;font-size:15px;font-weight:800;margin-bottom:4px;&quot;&gt;${T.title}&lt;/div&gt;
    &lt;div style=&quot;font-size:12px;color:var(--g500);margin-bottom:10px;&quot;&gt;${T.note}&lt;/div&gt;
    ${starRow(n, true, true)}
    ${
      n
        ? `&lt;div
      style=&quot;font-size:12.5px;font-weight:600;color:var(--brand-dark);margin:2px 0 6px;&quot;&gt;${T.stars[n - 1]}&lt;/div&gt;`
        : &#x27;&#x27;
    }
    &lt;textarea id=&quot;rate-comment&quot; rows=&quot;3&quot; maxlength=&quot;1000&quot; placeholder=&quot;${T.ph}&quot;
      style=&quot;${RATE_COMMENT_STYLE}&quot;&gt;${esc(c)}&lt;/textarea&gt;
    ${
      state.rateError
        ? `&lt;div
      style=&quot;color:#b3261e;font-size:12.5px;margin-top:6px;&quot;&gt;${esc(state.rateError)}&lt;/div&gt;`

    }

  &lt;/div&gt;`;
}

// Day heading of the notification list: &quot;today&quot;, &quot;yesterday&quot; or the date, in the reader&#x27;s language.
function notifDayTitle(iso) {
  const startOfDay = d =&gt; new Date(d).setHours(0, 0, 0, 0);
  const daysAgo = Math.round((startOfDay(Date.now()) - startOfDay(serverDate(iso))) / 86400000);
  const text =
    daysAgo &gt;= 0 &amp;&amp; daysAgo &lt;= 1
      ? new Intl.RelativeTimeFormat(state.lang, { numeric: &#x27;auto&#x27; }).format(-daysAgo, &#x27;day&#x27;)
      : serverDate(iso).toLocaleDateString(state.lang, { day: &#x27;numeric&#x27;, month: &#x27;long&#x27; });
  return text.charAt(0).toUpperCase() + text.slice(1);
}

// One notification as a card: icon, text, time, a dot while unread. Urgent notices are red,
// advertising is orange with its label so it cannot be mistaken for a message from management.
function notifCard(n, nt) {
  const p = n.params || {};
  const isAlert = n.kind === &#x27;alert&#x27;;
  const isAd = isAdNews(n);
  const inner = isAlert
    ? `&lt;span class=&quot;nt-chip&quot;&gt;${lineIcon(NOTIF_SHAPE.alert, 14, 2.2)}${esc(nt.urgent)}&lt;/span&gt;&lt;span class=&quot;nt-title&quot;&gt;${esc(p.title || &#x27;&#x27;)}&lt;/span
      &gt;&lt;span class=&quot;nt-text&quot;&gt;${esc(p.body || &#x27;&#x27;)}&lt;/span&gt;`
    : isAd
      ? `&lt;span class=&quot;pin-chip&quot;&gt;${esc(L.adsV[p.ad] || nt.ad)}&lt;/span&gt;&lt;span class=&quot;nt-title&quot;&gt;${esc(p.title || &#x27;&#x27;)}&lt;/span&gt;`
      : `&lt;span class=&quot;nt-title&quot;&gt;${esc(notifText(n))}&lt;/span&gt;`;
  const icon = isAd ? NOTIF_ICON.ad : notifIcon(n);
  return `&lt;button class=&quot;nt-card ${n.read ? &#x27;&#x27; : &#x27;unread&#x27;} ${isAlert ? &#x27;alert&#x27; : &#x27;&#x27;} ${isAd ? &#x27;pin&#x27; : &#x27;&#x27;}&quot;
    data-action=&quot;open-notification&quot; data-id=&quot;${n.id}&quot;&gt;
    &lt;span class=&quot;nt-ic&quot;&gt;${lineIcon(icon, 20)}&lt;/span&gt;
    &lt;span class=&quot;nt-body&quot;&gt;${inner}&lt;span class=&quot;nt-time&quot;&gt;${esc(notifAgo(n.createdAt))}&lt;/span&gt;&lt;/span&gt;
    ${n.read ? &#x27;&#x27; : &#x27;&lt;span class=&quot;nt-dot&quot;&gt;&lt;/span&gt;&#x27;}
  &lt;/button&gt;`;
}

// The whole list, newest first as the server sends it, with a heading for each day.
function notifListHtml(list, nt) {
  let lastDay = &#x27;&#x27;;
  return list
    .filter(n =&gt; !(n.kind === &#x27;promo&#x27; &amp;&amp; state.resident.adsOff))
    .map(n =&gt; {
      const day = serverDate(n.createdAt).toDateString();
      const heading =
        day === lastDay ? &#x27;&#x27; : `&lt;h3 class=&quot;nt-day&quot;&gt;${esc(notifDayTitle(n.createdAt))}&lt;/h3&gt;`;
      lastDay = day;
      return heading + (n.kind === &#x27;promo&#x27; ? promoCard(n, nt) : notifCard(n, nt));
    })
    .join(&#x27;&#x27;);
}

// An advertisement from the central dashboard: always marked &quot;Ad&quot;, with the sponsor&#x27;s name,
// text, pictures and a link.
const promoCard = (n, nt) =&gt; {
  const p = n.params || {};
  if (!p.title) return &#x27;&#x27;;
  const imgs = (p.images || [])
    .map(u =&gt; `&lt;img src=&quot;${esc(u)}&quot; alt=&quot;&quot; loading=&quot;lazy&quot; referrerpolicy=&quot;no-referrer&quot;&gt;`)
    .join(&#x27;&#x27;);
  return `&lt;div class=&quot;notif-promo ${n.read ? &#x27;&#x27; : &#x27;unread&#x27;}&quot;&gt;
    &lt;button type=&quot;button&quot; class=&quot;offer-head&quot; data-action=&quot;open-notification&quot; data-id=&quot;${n.id}&quot;&gt;
      &lt;span class=&quot;offer-tag&quot;&gt;${esc(nt.ad.toUpperCase())} · ${esc(p.sponsor)}&lt;/span&gt;
      &lt;span class=&quot;offer-title&quot;&gt;${esc(p.title)}&lt;/span&gt;
      ${p.body ? `&lt;span class=&quot;offer-body&quot;&gt;${esc(p.body)}&lt;/span&gt;` : &#x27;&#x27;}
    &lt;/button&gt;
    ${imgs ? `&lt;div class=&quot;offer-imgs n${Math.min((p.images || []).length, 5)}&quot;&gt;${imgs}&lt;/div&gt;` : &#x27;&#x27;}
    ${
      p.url
        ? `&lt;a class=&quot;offer-more&quot; href=&quot;${esc(p.url)}&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer sponsored&quot;&gt;${esc(nt.adMore)} →&lt;/a&gt;`
        : &#x27;&#x27;
    }
    &lt;div class=&quot;offer-foot&quot;&gt;&lt;span class=&quot;notif-time&quot;&gt;${esc(notifAgo(n.createdAt))}&lt;/span&gt;&lt;button
      type=&quot;button&quot; class=&quot;offer-stop&quot; data-action=&quot;ads-off&quot;&gt;${esc(nt.adStop)}&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;`;
};

// &quot;Today&quot; / &quot;Tomorrow&quot; label for a booking date, in the reader&#x27;s language; empty for other days.
function bookingSoon(date) {
  const startOfDay = d =&gt; new Date(d).setHours(0, 0, 0, 0);
  const days = Math.round((startOfDay(date + &#x27;T00:00&#x27;) - startOfDay(Date.now())) / 86400000);
  if (days &lt; 0 || days &gt; 1) return &#x27;&#x27;;
  const word = new Intl.RelativeTimeFormat(state.lang, { numeric: &#x27;auto&#x27; }).format(days, &#x27;day&#x27;);
  return word.charAt(0).toUpperCase() + word.slice(1);
}

// One booking as a card: a date tile (day and month), the place, the time and the weekday, and on
// the right &quot;Cancel&quot; (upcoming) or &quot;Past&quot;.
function bookingCard(b) {
  const mb = L.myBookings;
  const d = new Date(b.date + &#x27;T12:00:00&#x27;);
  const month = d.toLocaleDateString(state.lang, { month: &#x27;short&#x27; });
  const weekday = d.toLocaleDateString(state.lang, { weekday: &#x27;long&#x27; });
  const soon = b.canCancel ? bookingSoon(b.date) : &#x27;&#x27;;
  const action = b.canCancel
    ? `&lt;button class=&quot;bk-cancel&quot; data-action=&quot;cancel-my-booking&quot; data-booking=&quot;${b.id}&quot;&gt;${mb.cancel}&lt;/button&gt;`
    : `&lt;span class=&quot;bk-done&quot;&gt;${mb.past}&lt;/span&gt;`;
  return `&lt;div class=&quot;bk-card ${b.canCancel ? &#x27;&#x27; : &#x27;past&#x27;}&quot;&gt;
    &lt;div class=&quot;bk-date&quot;&gt;&lt;b&gt;${d.getDate()}&lt;/b&gt;&lt;span&gt;${esc(month)}&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;bk-main&quot;&gt;
      &lt;div class=&quot;bk-name&quot;&gt;${esc(b.amenityName)}${soon ? `&lt;i class=&quot;bk-soon&quot;&gt;${esc(soon)}&lt;/i&gt;` : &#x27;&#x27;}&lt;/div&gt;
      &lt;div class=&quot;bk-time&quot;&gt;${esc(bookingRangeText(b))}&lt;/div&gt;
      &lt;div class=&quot;bk-sub&quot;&gt;${esc(weekday)}&lt;/div&gt;
    &lt;/div&gt;
    ${action}
  &lt;/div&gt;`;
}

// One row of the management screen: a big island with an icon, a name and (optionally) a detail
// line. `tag` is &quot;a&quot; for a link, &quot;button&quot; for an action, &quot;div&quot; for plain information.
function mgmtRow({ tag = &#x27;div&#x27;, attrs = &#x27;&#x27;, icon, name, detail = &#x27;&#x27;, danger = false }) {
  return `&lt;${tag} class=&quot;svc-row ${danger ? &#x27;danger&#x27; : &#x27;&#x27;}&quot; ${attrs}&gt;
    &lt;div class=&quot;svc-ic&quot;&gt;${lineIcon(icon, 20)}&lt;/div&gt;
    &lt;div class=&quot;svc-info&quot;&gt;&lt;div class=&quot;svc-name&quot;&gt;${esc(name)}&lt;/div&gt;${
      detail ? `&lt;div class=&quot;svc-desc&quot;&gt;${esc(detail)}&lt;/div&gt;` : &#x27;&#x27;
    }&lt;/div&gt;
  &lt;/${tag}&gt;`;
}

// The company&#x27;s website (only a plain http(s) link is shown) and head-office address, set in the
// Office settings.
function managementExtraRows() {
  const url = state.managementWebsite;
  const isSafeLink = url &amp;&amp; /^https?:\/\/[^\s]+$/i.test(url);
  let host = &#x27;&#x27;;
  try {
    host = new URL(url).host;
  } catch (_) {}
  const site = isSafeLink
    ? mgmtRow({
        tag: &#x27;a&#x27;,
        attrs: `href=&quot;${esc(url)}&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;`,
        icon: MGMT_ICON.globe,
        name: L.management.websiteBtn,
        detail: host,
      })
    : &#x27;&#x27;;
  const place = state.managementAddress
    ? mgmtRow({
        icon: MGMT_ICON.pin,
        name: L.management.addressLabel,
        detail: state.managementAddress,
      })
    : &#x27;&#x27;;
  return site + place;
}

function icState() {
  if (!state.ic) {

      min = 60000;
    state.ic = {
      entrance: &#x27;main&#x27;,

      history: [
        { id: 1, kind: &#x27;courier&#x27;, entrance: &#x27;main&#x27;, state: &#x27;opened&#x27;, at: now - 35 * min },
        { id: 2, kind: &#x27;visitor&#x27;, entrance: &#x27;main&#x27;, state: &#x27;missed&#x27;, at: now - 5 * 60 * min },

}

const icClock = ms =&gt; {
  const d = new Date(ms);
  return d.toLocaleTimeString(state.lang, { hour: &#x27;2-digit&#x27;, minute: &#x27;2-digit&#x27;, hourCycle: &#x27;h23&#x27; });
};
const icDay = ms =&gt; {
  const T = icT(),
    a = new Date(ms),
    b = new Date();
  return a.toDateString() === b.toDateString()
    ? T.today
    : b - a &lt; 2 * 86400000 &amp;&amp; a.getDate() !== b.getDate()
      ? T.yesterday
      : a.toLocaleDateString(state.lang, { day: &#x27;numeric&#x27;, month: &#x27;short&#x27; });
};

function icCallOverlay() {
  const T = icT(),
    ic = icState();
  if (!ic.call) return &#x27;&#x27;;
  const ringing = ic.call === &#x27;ringing&#x27;;
  return `&lt;div class=&quot;ic-call ${ringing ? &#x27;ringing&#x27; : &#x27;active&#x27;}&quot; role=&quot;dialog&quot; aria-modal=&quot;true&quot;&gt;
    &lt;div class=&quot;ic-video&quot;&gt;&lt;div class=&quot;ic-noise&quot;&gt;&lt;/div&gt;${icVisitor()}&lt;span
      class=&quot;ic-live&quot;&gt;&lt;i&gt;&lt;/i&gt;${T.live}&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;ic-call-top&quot;&gt;&lt;div class=&quot;ic-call-title&quot;&gt;${ringing ? T.incoming : T.kinds[ic.callKind]}&lt;/div&gt;
      &lt;div
        class=&quot;ic-call-sub&quot;&gt;${
          ringing
            ? `${T.kinds[ic.callKind]} ${T.calling} ${T.entrances[ic.callEntrance]}`
            : `${T.entrances[ic.callEntrance]} · &lt;span class=&quot;ic-timer&quot;&gt;0:00&lt;/span&gt;`
        }&lt;/div&gt;&lt;/div&gt;
    ${
      ringing
        ? `
      &lt;div class=&quot;ic-call-actions two&quot;&gt;
        &lt;button class=&quot;ic-round decline&quot; data-ic=&quot;decline&quot;
          aria-label=&quot;${T.decline}&quot;&gt;${icSvg(&#x27;phone&#x27;, 26)}&lt;span&gt;${T.decline}&lt;/span&gt;&lt;/button&gt;
        &lt;button class=&quot;ic-round answer&quot; data-ic=&quot;answer&quot;
          aria-label=&quot;${T.answer}&quot;&gt;${icSvg(&#x27;phone&#x27;, 26)}&lt;span&gt;${T.answer}&lt;/span&gt;&lt;/button&gt;
      &lt;/div&gt;`
        : `
      &lt;div class=&quot;ic-call-actions&quot;&gt;
        &lt;button class=&quot;ic-round small ${ic.mute ? &#x27;off&#x27; : &#x27;&#x27;}&quot; data-ic=&quot;mute&quot;
          aria-pressed=&quot;${ic.mute}&quot;&gt;${icSvg(&#x27;mic&#x27;, 22)}&lt;span&gt;${T.mute}&lt;/span&gt;&lt;/button&gt;
        &lt;button class=&quot;ic-round small ${ic.speaker ? &#x27;&#x27; : &#x27;off&#x27;}&quot; data-ic=&quot;speaker&quot;
          aria-pressed=&quot;${ic.speaker}&quot;&gt;${icSvg(&#x27;spk&#x27;, 22)}&lt;span&gt;${T.speaker}&lt;/span&gt;&lt;/button&gt;
        &lt;button class=&quot;ic-round small door ${ic.door === &#x27;open&#x27; ? &#x27;done&#x27; : &#x27;&#x27;}&quot;
          data-ic=&quot;open&quot;
            ${ic.door === &#x27;open&#x27; ? &#x27;disabled&#x27; : &#x27;&#x27;}&gt;${icSvg(
              ic.door === &#x27;open&#x27; ? &#x27;unlock&#x27; : &#x27;lock&#x27;,
              22
            )}&lt;span&gt;${ic.door === &#x27;open&#x27; ? T.opening : T.open}&lt;/span&gt;&lt;/button&gt;
        &lt;button class=&quot;ic-round small decline&quot;
          data-ic=&quot;hangup&quot;&gt;${icSvg(&#x27;phone&#x27;, 22)}&lt;span&gt;${T.hangup}&lt;/span&gt;&lt;/button&gt;
      &lt;/div&gt;`
    }
  &lt;/div&gt;`;
}

// Redraw without the entrance animations and without jumping to the top of the page.
function icRefresh() {
  if (state.view !== &#x27;intercom&#x27;) return;
  document.body.dataset.enter = &#x27;0&#x27;;
  const mn = document.querySelector(&#x27;main&#x27;),
    y = window.scrollY,
    my = mn ? mn.scrollTop : 0;
  document.getElementById(&#x27;viewRoot&#x27;).innerHTML = views.intercom();
  window.scrollTo(0, y);
  if (mn) mn.scrollTop = my; // phones scroll inside &lt;main&gt;
}
function icPush(kind, st) {
  const ic = icState();

function icOpenDoor() {

document.addEventListener(&#x27;click&#x27;, e =&gt; {

  e.preventDefault();

    v = t.dataset.v,
    a = t.dataset.ic;

  } else if (a === &#x27;open&#x27;) icOpenDoor();
  else if (a === &#x27;hours&#x27;) {
    ic.hours = Number(v);
    icRefresh();
  } else if (a === &#x27;pass&#x27;) {
    const code = String(Math.floor(100000 + Math.random() * 900000));
    ic.passes.unshift({ id: Date.now(), code, until: Date.now() + ic.hours * 3600000 });
    icRefresh();

  } else if (a === &#x27;sim&#x27;) {

    ic.callKind = [&#x27;visitor&#x27;, &#x27;courier&#x27;, &#x27;unknown&#x27;][Math.floor(Math.random() * 3)];
    icRefresh();
    clearTimeout(icTimers.miss);
    icTimers.miss = setTimeout(() =&gt; {

function mvReadForm() {
  const f =
    state.mvForm ||

      start: &#x27;&#x27;,

  if (g(&#x27;mvDate&#x27;)) f.date = g(&#x27;mvDate&#x27;).value;
  if (g(&#x27;mvElev&#x27;)) f.elev = g(&#x27;mvElev&#x27;).checked;
  if (g(&#x27;mvStart&#x27;)) f.start = g(&#x27;mvStart&#x27;).value;
  if (g(&#x27;mvHours&#x27;)) f.hours = parseInt(g(&#x27;mvHours&#x27;).value, 10);
  if (g(&#x27;mvNotes&#x27;)) f.notes = g(&#x27;mvNotes&#x27;).value;

async function openMoves() {

        elev: false,
        start: &#x27;&#x27;,
        hours: 2,

document.addEventListener(&#x27;click&#x27;, async e =&gt; {

  if (!btn) return;
  const T = L.moveV;
  if (btn.dataset.action === &#x27;mv-send&#x27;) {
    const f = mvReadForm();
    if (f.elev &amp;&amp; !f.start) {
      state.mvError = T.from_ + &#x27; — ?&#x27;;
      state.mvOk = null;
      render();
      return;
    }
    state.busy = true;
    state.mvError = null;
    state.mvOk = null;
    render();
    try {

      if (f.elev) {
        body.startTime = f.start;
        body.hours = f.hours;
      }

        method: &#x27;POST&#x27;,
        body: JSON.stringify(body),

async function openCommunity() {
  try {
    const [ev, polls] = await Promise.all([
      api._request(&#x27;/api/community/events&#x27;),
      api._request(&#x27;/api/community/polls&#x27;),
    ]);
    state.comm = { today: ev.today, events: ev.events, polls };
    state.commError = null;
    showView(&#x27;community&#x27;);
  } catch (err) {
    if (err.status === 401) showView(&#x27;login&#x27;);
  }
}

document.addEventListener(&#x27;click&#x27;, async e =&gt; {
  const btn = e.target.closest(&#x27;[data-action^=&quot;cm-&quot;]&#x27;);
  if (!btn) return;
  state.commError = null;
  try {
    if (btn.dataset.action === &#x27;cm-rsvp&#x27;) {
      const ev = state.comm.events.find(x =&gt; String(x.id) === btn.dataset.id);
      const r = await api._request(`/api/community/events/${btn.dataset.id}/rsvp`, {
        method: &#x27;POST&#x27;,
        body: JSON.stringify({ status: btn.dataset.s }),
      });
      ev.myRsvp = btn.dataset.s;
      ev.going = r.going;
    } else if (btn.dataset.action === &#x27;cm-vote&#x27;) {
      const p = await api._request(`/api/community/polls/${btn.dataset.id}/vote`, {
        method: &#x27;POST&#x27;,
        body: JSON.stringify({ optionId: Number(btn.dataset.o) }),
      });
      state.comm.polls = state.comm.polls.map(x =&gt; (x.id === p.id ? p : x));
    }
  } catch (err) {
    if (err.status === 401) {
      showView(&#x27;login&#x27;);
      return;
    }
    state.commError =
      err.code === &#x27;voted&#x27;
        ? L.commV.errVoted
        : err.code === &#x27;closed&#x27;
          ? L.commV.errClosed
          : err.message;
    try {
      await openCommunity();
      state.commError =
        err.code === &#x27;voted&#x27;
          ? L.commV.errVoted
          : err.code === &#x27;closed&#x27;
            ? L.commV.errClosed
            : err.message;
    } catch (_) {}
  }
  render();
});

&lt;script&gt;// Insurance and lease: nothing is uploaded. The resident answers &quot;is the apartment insured?&quot;
// (yes / no) and can ask management for a copy of the lease by e-mail or on paper.
document.addEventListener(&#x27;click&#x27;, async e =&gt; {
  const btn = e.target.closest(&#x27;[data-action=&quot;ins-set&quot;],[data-action=&quot;lease-request&quot;]&#x27;);
  if (!btn || !state.resident) return;
  state.insError = null;
  try {

      const has = btn.dataset.answer === &#x27;true&#x27;;
      await api._request(&#x27;/api/me/insurance&#x27;, { method: &#x27;PATCH&#x27;, body: JSON.stringify({ has }) });
      state.resident.hasInsurance = has;
    } else {
      const body = JSON.stringify({ method: btn.dataset.method });
      await api._request(&#x27;/api/documents/request-lease&#x27;, { method: &#x27;POST&#x27;, body });

&lt;script&gt;// Notices, incidents (with photos and replies) and finished inspection reports — what management
// has published for this resident.
function insAuth() {
  const t = api.getToken();
  return t ? { Authorization: &#x27;Bearer &#x27; + t } : {};
}
const recBlobs = new Map();
function recBlob(url) {
  if (!recBlobs.has(url))
    recBlobs.set(
      url,
      fetch(url, { headers: insAuth() })
        .then(r =&gt; {
          if (!r.ok) throw new Error(&#x27;HTTP &#x27; + r.status);
          return r.blob();
        })
        .then(b =&gt; URL.createObjectURL(b))
    );
  return recBlobs.get(url);
}
function fillRecThumbs() {
  document.querySelectorAll(&#x27;[data-rec-src]:not([src])&#x27;).forEach(img =&gt; {
    if (img.tagName !== &#x27;VIDEO&#x27;)
      img.src = &#x27;data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==&#x27;;
    recBlob(img.dataset.recSrc)
      .then(u =&gt; {
        img.src = u;
      })
      .catch(() =&gt; {});
  });
}
new MutationObserver(fillRecThumbs).observe(document.documentElement, {
  childList: true,
  subtree: true,
});

function recDate(iso) {
  const d = new Date(String(iso).replace(&#x27; &#x27;, &#x27;T&#x27;) + (String(iso).length &gt; 10 ? &#x27;Z&#x27; : &#x27;T00:00&#x27;));
  return isNaN(d)
    ? &#x27;&#x27;
    : d.toLocaleDateString(state.lang, { day: &#x27;numeric&#x27;, month: &#x27;short&#x27;, year: &#x27;numeric&#x27; });
}

document.addEventListener(&#x27;click&#x27;, async e =&gt; {
  const btn = e.target.closest(&#x27;[data-action^=&quot;rec-&quot;]&#x27;);
  if (!btn) return;
  const T = L.recV;
  const a = btn.dataset.action;
  const g = id =&gt; document.getElementById(id);
  if (a === &#x27;rec-open&#x27;) {
    openIncident(btn.dataset.id);
    return;
  }
  if (a === &#x27;rec-open-insp&#x27;) {
    openMyInspection(btn.dataset.id);
    return;
  }
  if (a === &#x27;rec-back&#x27;) {
    openRecord();
    return;
  }
  if (a === &#x27;rec-photo&#x27;) {
    try {
      window.open(await recBlob(btn.dataset.recSrc), &#x27;_blank&#x27;, &#x27;noopener&#x27;);
    } catch (_) {}
    return;
  }
  if (a === &#x27;rec-reply&#x27;) {
    const body = g(&#x27;recReply&#x27;).value.trim();
    if (!body) return;
    try {
      await api._request(`/api/record/incidents/${state.recDetail.id}/comments`, {
        method: &#x27;POST&#x27;,
        body: JSON.stringify({ body }),
      });
      state.recError = null;
    } catch (err) {
      if (err.status === 401) {
        showView(&#x27;login&#x27;);
        return;
      }
      state.recError = err.message;
    }
    try {
      state.recDetail = await api._request(`/api/record/incidents/${state.recDetail.id}`);
    } catch (_) {}
    render();
    return;
  }
  if (a === &#x27;rec-send&#x27;) {
    state.recForm = {
      title: g(&#x27;rfTitle&#x27;).value,
      desc: g(&#x27;rfDesc&#x27;).value,
      about: g(&#x27;rfAbout&#x27;).value,
    };
    const files = [...(g(&#x27;rfPhotos&#x27;).files || [])].slice(0, 10);
    if (!state.recForm.title.trim()) {
      state.recError = T.titleErr;
      render();
      return;
    }
    state.busy = true;
    state.recError = null;
    render();
    try {
      const c = await api._request(&#x27;/api/record/incidents&#x27;, {
        method: &#x27;POST&#x27;,
        body: JSON.stringify({
          title: state.recForm.title.trim(),
          description: state.recForm.desc.trim(),
          about: state.recForm.about.trim(),
        }),
      });
      for (const f of files) {
        const fd = new FormData();
        fd.append(&#x27;file&#x27;, f);
        await fetch(`/api/record/incidents/${c.id}/photos`, {
          method: &#x27;POST&#x27;,
          headers: insAuth(),
          body: fd,
        });
      }
      state.recForm = {};
      state.busy = false;
      await openIncident(c.id);
      return;
    } catch (err) {
      if (err.status === 401) {
        state.busy = false;

});

document.addEventListener(&#x27;click&#x27;, e =&gt; {
