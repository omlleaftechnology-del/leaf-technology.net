<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Unitly — Resident app (demo)</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>window.COMPANY_NAME = "Unitly";</script>
<style>
  :root{
    --brand:#111111;
    --brand-dark:#000000;
    --brand-tint:#F2F2F2;
    --brand-tint-2:#E3E3E3;
    --black:#1B1C1B;
    --white:#FFFFFF;
    --g50:#FAFAF9;
    --g100:#F2F2F1;
    --g200:#E4E5E3;
    --g300:#CDCEC9;
    --g500:#84867F;
    --g600:#6B6E68;
    --g700:#4C4E49;
    --font:-apple-system,"SF Pro Display","SF Pro Text","Inter","Helvetica Neue",Arial,sans-serif;
    --ease:cubic-bezier(.22,.61,.36,1);
    --nav-h:64px;
    --safe-b:env(safe-area-inset-bottom,0px);
    --safe-t:env(safe-area-inset-top,0px);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{
    font-family:var(--font);
    color:var(--black);
    background:var(--white);
    -webkit-font-smoothing:antialiased;
    padding-bottom:calc(var(--nav-h) + var(--safe-b) + 8px);
  }
  button,input,select,textarea{font-family:var(--font);}
  button{cursor:pointer;}
  a{color:inherit; text-decoration:none;}
  ::selection{background:var(--brand); color:#fff;}

  /* ===== Header (mobile: minimal, top-bar only) ===== */
  header.site{
    position:sticky; top:0; z-index:40; background:rgba(255,255,255,.94); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--g200);
    padding-top:var(--safe-t);
  }
  .header-inner{
    padding:12px 18px;
    display:flex; align-items:center; justify-content:space-between; gap:14px;
  }
  .logo-mark{height:28px; display:block;}
  nav.main-nav{display:none;}
  .header-right{display:flex; align-items:center; gap:10px;}
  .apt-chip{font-size:11.5px; font-weight:700; color:var(--brand-dark); background:var(--brand-tint); border:1px solid var(--brand-tint-2); padding:5px 10px; border-radius:20px; white-space:nowrap;}
  .apt-chip.parking-chip{color:var(--g700); background:var(--g100); border-color:var(--g200);}
  .avatar{width:30px;height:30px;border-radius:50%; background:var(--g100); border:1px solid var(--g200); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:var(--g700); flex:0 0 auto;}

  /* ===== Bottom tab bar (mobile primary nav) ===== */
  nav.tab-bar{
    position:fixed; left:0; right:0; bottom:0; z-index:50;
    display:flex; background:rgba(255,255,255,.96); backdrop-filter:blur(10px);
    border-top:1px solid var(--g200);
    padding:8px 6px calc(8px + var(--safe-b)) 6px;
  }
  .tab-item{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;
    background:none; border:none; color:var(--g500); font-size:10.5px; font-weight:700; padding:4px 2px;
  }
  .tab-item svg{width:22px; height:22px;}
  .tab-item.active{color:var(--brand-dark);}

  /* ===== Layout shell ===== */
  main{padding:0 18px;}
  .view{display:none;}
  .view.active{display:block; animation:fadeUp .3s var(--ease);}
  @keyframes fadeUp{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  /* ===== Home hero ===== */
  .hero{padding:24px 0 20px 0; border-bottom:1px solid var(--g200);}
  .hero h1{font-size:26px; font-weight:800; letter-spacing:-0.015em; line-height:1.16; margin:0 0 10px 0;}
  .hero .eyebrow{font-size:12.5px; font-weight:700; color:var(--brand-dark); margin:0 0 8px 0;}
  .hero p.sub{font-size:14px; color:var(--g600); line-height:1.55; margin:0 0 20px 0;}
  .hero-apt{border-top:2px solid var(--brand); padding-top:14px;}
  .hero-apt .lbl{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--g500); font-weight:700; margin-bottom:5px;}
  .hero-apt .num{font-size:18px; font-weight:800; letter-spacing:-0.01em;}
  .hero-apt .addr{font-size:12.5px; color:var(--g600); margin-top:3px;}

  /* ===== Quick action grid ===== */
  .quick-row{display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:20px 0; border-bottom:1px solid var(--g200);}
  .quick-item{
    text-align:left; background:none; border:1px solid var(--g200); border-radius:12px; padding:16px 14px;
    display:flex; flex-direction:column; gap:8px; transition:border-color .15s var(--ease), background .15s var(--ease);
  }
  .quick-item:active{background:var(--g50);}
  .quick-item .qi-ic{width:26px;height:26px; color:var(--brand-dark);}
  .quick-item .qi-label{font-size:13.5px; font-weight:700;}
  .quick-item .qi-note{font-size:11.5px; color:var(--g500); line-height:1.3;}

  /* ===== Section headers ===== */
  .section{padding:28px 0; border-bottom:1px solid var(--g200);}
  .section:last-child{border-bottom:none;}
  .section-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:16px;}
  .section-head h2{font-size:17px; font-weight:800; letter-spacing:-0.01em; margin:0;}
  .section-head a.see-all{font-size:12.5px; font-weight:700; color:var(--brand-dark); border-bottom:1px solid var(--brand-tint-2); white-space:nowrap;}

  /* ===== Request list rows ===== */
  .req-row{
    display:grid; grid-template-columns:18px 1fr auto; align-items:center; gap:12px;
    padding:14px 0; border-bottom:1px solid var(--g200); cursor:pointer; width:100%; background:none; border-left:none; border-right:none; border-top:none; text-align:left;
  }
  .req-row:last-child{border-bottom:none;}
  .req-dot{width:7px;height:7px;border-radius:50%; background:var(--g300); flex:0 0 auto;}
  .req-dot.live{background:var(--brand);}
  .req-main{min-width:0;}
  .req-main .req-cat{font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--g500); font-weight:700;}
  .req-main .req-title{font-size:13.5px; font-weight:600; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .req-main .req-when{font-size:11.5px; color:var(--g500); margin-top:2px;}
  .req-status{font-size:11px; font-weight:700; white-space:nowrap; text-align:right;}
  .req-status.live{color:var(--brand-dark);}
  .req-status.done{color:var(--g500);}
  .req-status.new{color:var(--black);}

  .empty-note{padding:24px 0; color:var(--g500); font-size:13.5px;}

  /* ===== Services list ===== */
  .svc-list{display:flex; flex-direction:column;}
  .svc-row{
    display:flex; align-items:center; gap:14px; padding:16px 0; border-bottom:1px solid var(--g200);
    background:none; border-left:none; border-right:none; border-top:none; width:100%; text-align:left;
  }
  .svc-row:first-child{padding-top:0;}
  .svc-row:last-child{border-bottom:none;}
  .svc-ic{width:40px;height:40px; flex:0 0 auto; color:var(--brand-dark); display:flex; align-items:center; justify-content:center; border:1px solid var(--g200); border-radius:10px;}
  .svc-info{flex:1; min-width:0;}
  .svc-info .svc-name{font-size:14.5px; font-weight:700;}
  .svc-info .svc-desc{font-size:12px; color:var(--g600); margin-top:2px;}
  .svc-arrow{color:var(--g500); flex:0 0 auto;}
  .svc-price{font-size:13px; font-weight:800; color:var(--brand-dark); flex:0 0 auto; margin-right:6px;}
  .svc-price-note{display:inline-block; background:var(--brand-tint); border:1px solid var(--brand-tint-2); color:var(--brand-dark); border-radius:12px; padding:8px 14px; font-size:13px; margin:2px 0 14px 0;}

  /* ===== Building shortcuts ===== */
  .building-row{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .building-item{padding:16px 14px; border:1px solid var(--g200); border-radius:12px; font-size:13px; font-weight:700; display:flex; align-items:center; gap:9px;}
  .building-item svg{color:var(--brand-dark); flex:0 0 auto;}

  /* ===== Form (request creation) ===== */
  .form-shell{padding:24px 0;}
  .back-link{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; color:var(--g600); margin-bottom:16px;}
  .form-card{border:1px solid var(--g200); border-radius:16px; padding:22px;}
  .form-card h1{font-size:20px; font-weight:800; letter-spacing:-0.01em; margin:0 0 6px 0;}
  .form-card p.lead{font-size:13px; color:var(--g600); margin:0 0 22px 0; line-height:1.5;}
  .field{margin-bottom:18px;}
  .field label{display:block; font-size:12px; font-weight:700; color:var(--g700); margin-bottom:7px;}
  .field input, .field textarea, .field select{
    width:100%; border:1.4px solid var(--g200); background:var(--g50); border-radius:10px; padding:12px 14px;
    font-size:14px; color:var(--black);
  }
  .field textarea{min-height:100px; resize:vertical;}
  .field input:focus, .field textarea:focus, .field select:focus{outline:none; border-color:var(--brand); background:var(--white);}
  .field input:disabled{background:var(--g100); color:var(--g600); cursor:not-allowed;}
  .pill-row{display:flex; gap:8px; flex-wrap:wrap;}
  .pill{border:1.4px solid var(--g200); background:var(--white); border-radius:20px; padding:8px 14px; font-size:12.5px; font-weight:600; color:var(--g700);}
  .pill.active{background:var(--brand); border-color:var(--brand); color:#fff;}
  .attach-row{display:flex; gap:10px;}
  .attach-box{flex:1; border:1.6px dashed var(--g300); border-radius:10px; padding:16px 8px; text-align:center; color:var(--g500); font-size:11.5px; font-weight:600;}

  .btn{
    border-radius:10px; border:none; padding:14px 20px; font-size:14px; font-weight:700;
    display:inline-flex; align-items:center; justify-content:center; gap:8px; width:100%;
  }
  .btn-primary{background:var(--brand); color:#fff;}
  .btn-primary:active{background:var(--brand-dark);}
  .btn-secondary{background:transparent; color:var(--black); border:1.4px solid var(--g300);}

  /* ===== Login (full-screen, no header/tab-bar chrome) ===== */
  body.login-mode{padding-bottom:0;}
  .login-wrap{min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:32px 20px; background:var(--brand-tint);}
  .login-card{width:100%; max-width:380px; background:#fff; border:1px solid var(--g200); border-radius:18px; padding:32px 28px;}
  .login-logo{height:36px; margin-bottom:28px; display:block;}
  .login-card h1{font-size:21px; font-weight:800; margin:0 0 6px 0;}
  .login-card p.sub{font-size:13px; color:var(--g600); margin:0 0 24px 0; line-height:1.5;}
  .login-forgot{display:block; text-align:right; font-size:12px; font-weight:700; color:var(--brand-dark); margin:-8px 0 20px 0;}
  .login-note{font-size:11.5px; color:var(--g500); line-height:1.55; margin-top:20px; padding-top:18px; border-top:1px solid var(--g200);}

  /* ===== Confirmation ===== */
  .confirm-shell{padding:56px 0; text-align:center;}
  .confirm-mark{width:52px;height:52px;border-radius:50%; background:var(--brand); display:flex; align-items:center; justify-content:center; margin:0 auto 20px auto;}
  .confirm-shell h1{font-size:21px; font-weight:800; margin:0 0 10px 0;}
  .confirm-shell p{font-size:13.5px; color:var(--g600); line-height:1.6; margin:0 0 26px 0;}
  .confirm-actions{display:flex; flex-direction:column; gap:10px;}

  /* ===== Request detail ===== */
  .detail-shell{padding:24px 0;}
  .detail-head{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:22px;}
  .detail-head h1{font-size:19px; font-weight:800; margin:6px 0 4px 0;}
  .detail-head .meta{font-size:12px; color:var(--g500);}
  .t-row{display:flex; gap:12px;}
  .t-dotcol{display:flex; flex-direction:column; align-items:center;}
  .t-dot{width:9px;height:9px;border-radius:50%; margin-top:4px;}
  .t-line{width:1.4px; flex:1; background:var(--g200); min-height:24px;}
  .t-body{padding-bottom:20px;}
  .t-title{font-size:13.5px; font-weight:700;}
  .t-when{font-size:12px; color:var(--g500); margin-top:2px;}

  .segment{display:inline-flex; background:var(--g100); border-radius:10px; padding:3px; gap:2px; margin-bottom:20px; width:100%;}
  .segment button{flex:1; border:none; background:transparent; padding:9px 10px; border-radius:8px; font-size:12.5px; font-weight:700; color:var(--g600);}
  .segment button.active{background:#fff; color:var(--black); box-shadow:0 1px 3px rgba(0,0,0,.08);}

  /* ===== Profile ===== */
  .profile-head{text-align:center; padding:24px 0 8px 0;}
  .profile-head .av{width:64px;height:64px;border-radius:50%; background:var(--brand-tint); border:1px solid var(--brand-tint-2); color:var(--brand-dark); display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:800; margin:0 auto 12px auto;}
  .profile-head .name{font-size:17px; font-weight:800;}
  .profile-head .apt{font-size:12.5px; color:var(--g500); margin-top:2px;}
  .profile-list{margin-top:8px;}
  .profile-row{display:flex; align-items:center; gap:12px; padding:15px 0; border-bottom:1px solid var(--g200); width:100%; background:none; border-left:none; border-right:none; border-top:none; text-align:left;}
  .profile-row:last-child{border-bottom:none;}
  .profile-row .pr-ic{width:34px;height:34px; border:1px solid var(--g200); border-radius:9px; display:flex; align-items:center; justify-content:center; color:var(--brand-dark); flex:0 0 auto;}
  .profile-row span{font-size:13.5px; font-weight:600; flex:1;}

  /* ===== Footer (desktop only, hidden on mobile to save space above tab bar) ===== */
  footer.site{display:none;}

  /* =========================================================
     DESKTOP ENHANCEMENT — everything above is the mobile base
     ========================================================= */
  @media (min-width:900px){
    :root{--nav-h:0px;}
    body{padding-bottom:0;}
    main{max-width:1180px; margin:0 auto; padding:0 32px;}

    header.site{padding-top:0;}
    .header-inner{max-width:1180px; margin:0 auto; padding:14px 32px;}
    .logo-mark{height:38px;}
    nav.main-nav{display:flex; gap:32px; align-items:center;}
    nav.main-nav a{font-size:14px; font-weight:600; color:var(--g600); padding:6px 0; border-bottom:2px solid transparent; transition:color .15s var(--ease), border-color .15s var(--ease);}
    nav.main-nav a:hover{color:var(--black);}
    nav.main-nav a.active{color:var(--black); border-color:var(--brand);}
    .header-right{gap:16px;}
    .apt-chip{font-size:12.5px; padding:6px 12px;}
    .avatar{width:34px;height:34px; font-size:12px;}

    nav.tab-bar{display:none;}

    .hero{padding:56px 0 40px 0; display:grid; grid-template-columns:1.3fr 1fr; gap:48px; align-items:end;}
    .hero h1{font-size:38px; margin-bottom:12px;}
    .hero .eyebrow{font-size:13px;}
    .hero p.sub{font-size:15.5px; max-width:440px; margin-bottom:0;}
    .hero-apt{border-top:none; border-left:2px solid var(--brand); padding-top:0; padding-left:20px;}
    .hero-apt .num{font-size:22px;}
    .hero-apt .addr{font-size:13.5px;}

    .quick-row{grid-template-columns:repeat(4,1fr); gap:0; padding:0; display:flex;}
    .quick-item{flex:1; border:none; border-right:1px solid var(--g200); border-radius:0; padding:26px 16px;}
    .quick-item:last-child{border-right:none;}
    .quick-item:hover{background:var(--g50);}
    .quick-item .qi-ic{width:30px;height:30px;}
    .quick-item .qi-label{font-size:14px;}
    .quick-item .qi-note{font-size:12px;}

    .section{padding:44px 0;}
    .section-head{margin-bottom:22px;}
    .section-head h2{font-size:20px;}
    .section-head a.see-all{font-size:13px;}

    .req-row{grid-template-columns:22px 1fr auto auto; gap:16px; padding:16px 0;}
    .req-row:hover .req-title{color:var(--brand-dark);}
    .req-main .req-title{font-size:14.5px; white-space:normal;}
    .req-main .req-when{display:none;}
    .req-when-col{display:block;}

    .svc-row{gap:18px; padding:20px 0;}
    .svc-ic{width:44px;height:44px; border-radius:10px;}
    .svc-row:hover .svc-ic{border-color:var(--brand); background:var(--brand-tint);}
    .svc-info .svc-name{font-size:16px;}
    .svc-info .svc-desc{font-size:13px;}
    .svc-arrow{transition:transform .15s var(--ease);}
    .svc-row:hover .svc-arrow{transform:translateX(3px); color:var(--brand-dark);}

    .building-row{grid-template-columns:repeat(4,1fr); gap:0; border:1px solid var(--g200); border-radius:12px; overflow:hidden;}
    .building-item{border:none; border-right:1px solid var(--g200); border-radius:0; padding:18px 20px;}
    .building-item:last-child{border-right:none;}
    .building-item:hover{background:var(--g50);}

    .form-shell{max-width:640px; margin:0 auto; padding:48px 0;}
    .form-shell .back-link{margin-bottom:20px;}
    .form-card{padding:36px;}
    .form-card h1{font-size:24px;}
    .form-card p.lead{font-size:14px; margin-bottom:28px;}
    .btn{width:auto; padding:13px 22px;}
    .btn-primary{width:100%;}
    .btn-secondary{width:100%;}

    .confirm-shell{max-width:520px; margin:0 auto; padding:90px 0;}
    .confirm-shell h1{font-size:24px;}
    .confirm-shell p{font-size:14.5px; margin-bottom:30px;}
    .confirm-actions{max-width:280px; margin:0 auto;}

    .detail-shell{max-width:760px; margin:0 auto; padding:44px 0;}
    .detail-head h1{font-size:22px;}
    .detail-head .meta{font-size:13px;}

    .segment{width:auto;}
    .segment button{flex:none; padding:8px 18px;}

    .profile-head{padding:32px 0 8px 0;}
    .profile-list{max-width:420px; margin:0 auto;}

    footer.site{display:block; border-top:1px solid var(--g200); margin-top:20px;}
    .footer-inner{max-width:1180px; margin:0 auto; padding:28px 32px; display:flex; align-items:center; justify-content:space-between; gap:20px;}
    .footer-inner .fl{display:flex; align-items:center; gap:12px;}
    .footer-inner img{height:22px; opacity:.7;}
    .footer-inner span{font-size:12px; color:var(--g500);}
    .footer-links{display:flex; gap:20px;}
    .footer-links a{font-size:12.5px; color:var(--g600); font-weight:600;}
    .footer-links a:hover{color:var(--black);}
  }

  /* ===== Language switcher ===== */
  .login-top{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:28px;}
  .login-top .login-logo{margin-bottom:0;}
  .lang-menu-wrap{position:relative; display:inline-block;}
  .lang-trigger{display:inline-flex; align-items:center; gap:7px; height:38px; padding:0 12px; border:1.4px solid var(--g200); background:var(--white); border-radius:20px; font-size:13px; font-weight:700; color:var(--black); cursor:pointer; white-space:nowrap;}
  .lang-trigger svg{color:var(--g600); flex:0 0 auto;}
  .lang-trigger[aria-expanded="true"]{border-color:var(--brand);}
  .lang-menu{position:absolute; right:0; top:calc(100% + 8px); min-width:184px; background:var(--white); border:1px solid var(--g200); border-radius:16px; box-shadow:0 14px 34px rgba(0,0,0,.14); padding:6px; z-index:60;}
  .lang-opt{display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%; padding:11px 12px; border:none; background:none; border-radius:10px; font-size:14px; font-weight:600; color:var(--black); text-align:left; cursor:pointer;}
  .lang-opt:hover{background:var(--g100);}
  .lang-opt.active{background:var(--brand-tint); color:var(--brand-dark); font-weight:800;}
  .icon-btn{width:34px;height:34px;border-radius:50%; border:1px solid var(--g200); background:none; display:flex; align-items:center; justify-content:center; color:var(--g600); flex:0 0 auto;}
  .desktop-lang{display:none;}
  @media (min-width:900px){
    .desktop-lang{display:flex; gap:4px; background:var(--g100); border-radius:10px; padding:3px;}
    .desktop-lang button{border:none; background:transparent; padding:7px 10px; border-radius:7px; font-size:11.5px; font-weight:800; color:var(--g600);}
    .desktop-lang button.active{background:#fff; color:var(--black); box-shadow:0 1px 3px rgba(0,0,0,.08);}
    .mobile-lang-btn{display:none;}
  }

/* Amenities: zones without reservation, disabled time pills */
.svc-row.svc-static{cursor:default;}
.amen-note{flex:0 0 auto; font-size:11.5px; font-weight:700; color:var(--g600); border:1.3px dashed var(--g300); border-radius:20px; padding:5px 11px; margin-left:8px; text-align:center;}
.pill{font-family:inherit; cursor:pointer;}
.pill.disabled{opacity:.35; text-decoration:line-through; cursor:not-allowed;}
input[type=date]{font-family:inherit;}

/* My bookings */
.my-bookings-link{width:100%; margin:0 0 14px 0;}
.mb-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px 0; border-bottom:1px solid var(--g200);}
.mb-info{min-width:0; flex:1 1 auto;}
.mb-cancel{flex:0 0 auto; width:auto; padding:8px 14px; font-size:13px;}
.mb-sub{font-size:13px; font-weight:800; color:var(--g600); margin:22px 0 4px 0; text-transform:uppercase; letter-spacing:.04em;}

/* Notifications */

/* ---- motion: staggered entrances, press feedback, timeline, confirmation, bell ---- */
.view.active .quick-item, .view.active .req-row, .view.active .svc-row, .view.active .building-item,
.view.active .t-row, .view.active .section-head, .view.active .hero-apt{animation:itemIn .42s var(--ease) both; animation-delay:calc(var(--i,0)*55ms + 60ms);}
.view.active .hero h1, .view.active .hero .eyebrow{animation:itemIn .5s var(--ease) both;}
.view.active .hero h1{animation-delay:.08s;}
@keyframes itemIn{from{opacity:0; transform:translateY(12px);}to{opacity:1; transform:none;}}
.quick-item:nth-child(1),.req-row:nth-child(1),.svc-row:nth-child(1),.building-item:nth-child(1),.t-row:nth-child(1){--i:0}
.quick-item:nth-child(2),.req-row:nth-child(2),.svc-row:nth-child(2),.building-item:nth-child(2),.t-row:nth-child(2){--i:1}
.quick-item:nth-child(3),.req-row:nth-child(3),.svc-row:nth-child(3),.building-item:nth-child(3),.t-row:nth-child(3){--i:2}
.quick-item:nth-child(4),.req-row:nth-child(4),.svc-row:nth-child(4),.building-item:nth-child(4),.t-row:nth-child(4){--i:3}
.req-row:nth-child(5),.svc-row:nth-child(5),.t-row:nth-child(5){--i:4}
.req-row:nth-child(n+6),.svc-row:nth-child(n+6),.t-row:nth-child(n+6){--i:5}
.quick-item,.svc-row,.req-row,.building-item,.btn,.tab-item{transition:transform .15s var(--ease), background-color .2s, box-shadow .2s;}
.quick-item:active,.svc-row:active,.building-item:active,.btn:active{transform:scale(.97);}
.tab-item svg{transition:transform .25s cubic-bezier(.3,1.6,.5,1);}
.tab-item.active svg{transform:translateY(-2px) scale(1.12);}
.qi-ic{transition:transform .3s cubic-bezier(.3,1.6,.5,1);}
.quick-item:hover .qi-ic,.quick-item:active .qi-ic{transform:translateY(-2px) rotate(-6deg) scale(1.08);}
/* timeline: dots pop in, connecting lines draw downwards */
.view.active .t-dot{animation:dotPop .45s cubic-bezier(.3,1.6,.5,1) both; animation-delay:calc(var(--i,0)*120ms + 200ms);}
.view.active .t-line{transform-origin:top; animation:lineDraw .45s var(--ease) both; animation-delay:calc(var(--i,0)*120ms + 300ms);}
.t-row:last-child .t-dot{box-shadow:0 0 0 0 rgba(17,17,17,.45); animation:dotPop .45s cubic-bezier(.3,1.6,.5,1) both, dotPulse 2.2s infinite 1.2s; animation-delay:calc(var(--i,0)*120ms + 200ms), 0s;}
@keyframes dotPop{from{transform:scale(0);}to{transform:scale(1);}}
@keyframes lineDraw{from{transform:scaleY(0);}to{transform:scaleY(1);}}
@keyframes dotPulse{0%{box-shadow:0 0 0 0 rgba(17,17,17,.45)}70%{box-shadow:0 0 0 8px rgba(17,17,17,0)}100%{box-shadow:0 0 0 0 rgba(17,17,17,0)}}
/* confirmation: circle pops, tick draws, soft ring ripples out */
.confirm-mark{position:relative; animation:dotPop .55s cubic-bezier(.3,1.6,.5,1) both;}
.confirm-mark::after{content:''; position:absolute; inset:0; border-radius:50%; border:2px solid var(--brand); animation:ripple 1.4s ease-out .35s 2 both;}
.confirm-mark path{stroke-dasharray:24; stroke-dashoffset:24; animation:tick .45s ease-out .45s forwards;}
.confirm-shell h1,.confirm-shell p,.confirm-actions{animation:itemIn .5s var(--ease) both;}
.confirm-shell h1{animation-delay:.5s;}.confirm-shell p{animation-delay:.6s;}.confirm-actions{animation-delay:.7s;}
@keyframes tick{to{stroke-dashoffset:0;}}
@keyframes ripple{from{opacity:.7; transform:scale(1);}to{opacity:0; transform:scale(2.1);}}
/* bell: rings when a new notification arrives */
.bell.ring svg{transform-origin:50% 15%; animation:bellRing 1s ease-in-out;}
.bell-badge.pop{animation:dotPop .5s cubic-bezier(.3,1.6,.5,1);}
@keyframes bellRing{0%,100%{transform:rotate(0)}15%{transform:rotate(16deg)}30%{transform:rotate(-14deg)}45%{transform:rotate(10deg)}60%{transform:rotate(-8deg)}75%{transform:rotate(4deg)}}
@media (prefers-reduced-motion:reduce){
  .view.active *, .confirm-mark, .confirm-mark::after, .confirm-mark path, .bell.ring svg{animation:none !important;}
  .confirm-mark path{stroke-dashoffset:0;}
}

/* ===== Home: the resident's 3D house (see js/buildingScene.js) ===== */
.home-house{--sky1:#eef2f7; --sky2:#fbfcfd; --ground:#e8ebee; --ground-side:#d3d8de; --ground-side2:#c3c9d1; --win-off:#b4bcc6; --win-on:#ffd36e; --tree:#8fb796; --trunk:#8b7a6a; --edge:rgba(0,0,0,.07);
  display:flex; align-items:center; gap:6px; margin:18px 0 4px; border:1px solid var(--g200); border-radius:22px; overflow:hidden; background:radial-gradient(120% 95% at 50% 100%, var(--sky2), var(--sky1)); animation:itemIn .6s var(--ease) both .1s;}
.hh-scene{flex:1.25; height:215px; min-width:0;}
.hh-scene svg{width:100%; height:100%; display:block; overflow:visible;}
.hh-text{flex:1; padding:0 18px 0 0;}
.hh-lbl{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--g500); font-weight:700;}
.hh-num{font-size:17px; font-weight:800; letter-spacing:-.01em; margin:4px 0 8px;}
.hh-chip{display:inline-block; font-size:11.5px; font-weight:700; background:#fff; border:1px solid var(--g200); border-radius:20px; padding:4px 11px; color:var(--g700);}
.tone-stone{--top:#f6f7f8; --left:#dfe3e8; --right:#c8ced6; --roof:#8e98a5; --roof2:#a9b2be;}
.tone-sand {--top:#f8f2e7; --left:#eadfca; --right:#d6c7aa; --roof:#a4795c; --roof2:#bf9577;}
.tone-sage {--top:#eff4ef; --left:#d4e0d5; --right:#bdcebf; --roof:#587b5b; --roof2:#729776;}
.tone-slate{--top:#eaeef3; --left:#c9d2de; --right:#aeb9c8; --roof:#46525f; --roof2:#5f6e7e;}
.f-top{fill:var(--top)} .f-left{fill:var(--left)} .f-right{fill:var(--right)}
.f-top,.f-left,.f-right{stroke:var(--edge); stroke-width:.6; stroke-linejoin:round;}
.r-slope{fill:var(--roof2)} .r-slope2{fill:var(--roof)} .r-gable{fill:var(--right)} .r-inner{fill:var(--left)}
.r-slope,.r-slope2,.r-gable,.r-inner{stroke:var(--edge); stroke-width:.6; stroke-linejoin:round;}
.g-top{fill:var(--ground)} .g-left{fill:var(--ground-side)} .g-right{fill:var(--ground-side2)}
.win{fill:var(--win-off); stroke:var(--edge); stroke-width:.4;}
.win.lit{fill:var(--win-on);}
.door{fill:#4b5563; stroke:var(--edge); stroke-width:.4;}
.canopy{fill:var(--tree)} .trunk{fill:var(--trunk)} .antenna{stroke:var(--roof); stroke-width:1; fill:none; stroke-linecap:round;} .beacon{fill:#ef4444;}
/* build-up: ground grows, floors drop in one by one, roof lands, windows switch on, trees pop */
.ground{transform-box:fill-box; transform-origin:50% 50%; animation:bldGroundIn .7s cubic-bezier(.2,.9,.3,1) backwards; animation-delay:var(--b);}
@keyframes bldGroundIn{from{opacity:0; transform:scale(.15) translateY(20px);}}
.floor{animation:bldFloorIn .8s cubic-bezier(.22,.9,.3,1) backwards; animation-delay:calc(var(--b) + .35s + var(--i) * .15s);}
@keyframes bldFloorIn{0%{opacity:0; transform:translateY(-80px);} 55%{opacity:1;} 100%{opacity:1; transform:none;}}
.roof{animation:bldRoofIn .9s cubic-bezier(.2,.9,.3,1.25) backwards; animation-delay:calc(var(--b) + .45s + var(--i) * .15s);}
@keyframes bldRoofIn{0%{opacity:0; transform:translateY(-110px);} 60%{opacity:1;} 100%{opacity:1; transform:none;}}
.win.lit{animation:bldWinOn .6s ease backwards, bldTwinkle 6s ease-in-out infinite; animation-delay:var(--wd), calc(var(--wd) + 1.2s);}
.win.lit.still{animation:bldWinOn .6s ease backwards; animation-delay:var(--wd);}
@keyframes bldWinOn{from{fill:var(--win-off);}}
@keyframes bldTwinkle{0%,100%{opacity:1} 50%{opacity:.78}}
.tree-in{transform-box:fill-box; transform-origin:50% 100%; animation:bldTreePop .6s cubic-bezier(.2,1.5,.4,1) backwards; animation-delay:calc(var(--b) + 1.1s + var(--i) * .15s);}
@keyframes bldTreePop{from{opacity:0; transform:scale(0);}}
.beacon{animation:bldBlink 1.8s ease-in-out infinite;} @keyframes bldBlink{0%,100%{opacity:1} 50%{opacity:.25}}
/* taken apart on delete */
/* my window: warm glow, pulsing outline, pin with the apartment number */
.win.mine{fill:#ffb703 !important; stroke:#e07a00; stroke-width:.9; filter:drop-shadow(0 0 3px rgba(255,183,3,.9)); animation:bldWinOn .6s ease backwards, mineGlow 2s ease-in-out infinite; animation-delay:var(--wd), calc(var(--wd) + .8s);}
@keyframes mineGlow{0%,100%{filter:drop-shadow(0 0 2px rgba(255,183,3,.7))}50%{filter:drop-shadow(0 0 7px rgba(255,183,3,1))}}
.mine-pin{animation:pinIn .5s cubic-bezier(.3,1.5,.5,1) backwards; animation-delay:var(--pd);}
.mine-pin path{stroke:var(--brand-dark); stroke-width:1; stroke-dasharray:2 2; fill:none;}
.mine-pin rect{fill:var(--brand-dark);}
.mine-pin text{fill:#fff; font:700 10px var(--font);}
.mine-ring{fill:none; stroke:#e07a00; stroke-width:1.4; transform-box:fill-box; transform-origin:center; animation:mineRing 1.8s ease-out infinite; animation-delay:var(--pd);}
@keyframes pinIn{from{opacity:0; transform:translateX(-10px);}}
@keyframes mineRing{from{opacity:.9; transform:scale(.5);}to{opacity:0; transform:scale(2.2);}}
@media (prefers-reduced-motion:reduce){ .home-house *{animation:none !important;} }
.home-house.no-anim *{animation:none !important;}

/* ---- motion round 2: screen transitions, scroll reveal, forms, feedback ---- */
/* a busy/error redraw of the same screen must not replay entrances */
body[data-enter="0"] .view.active .quick-item, body[data-enter="0"] .view.active .req-row, body[data-enter="0"] .view.active .svc-row,
body[data-enter="0"] .view.active .building-item, body[data-enter="0"] .view.active .t-row, body[data-enter="0"] .view.active .section-head,
body[data-enter="0"] .view.active .hero-apt, body[data-enter="0"] .view.active .hero h1, body[data-enter="0"] .view.active .hero .eyebrow,
body[data-enter="0"] .home-house, body[data-enter="0"] .view.active .t-line, body[data-enter="0"] .confirm-shell h1,
body[data-enter="0"] .confirm-shell p, body[data-enter="0"] .confirm-actions{animation:none;}
body[data-enter="0"] .view.active .t-dot{animation:none;}
body[data-enter="0"] .t-row:last-child .t-dot{animation:dotPulse 2.2s infinite;}
body[data-enter="0"] .view.active{animation:none;}
/* screen changes: forward slides in from the right, back from the left, tabs cross-fade */
#viewRoot[data-dir="forward"]{animation:scrFwd .34s var(--ease);}
#viewRoot[data-dir="back"]{animation:scrBack .34s var(--ease);}
#viewRoot[data-dir="fade"]{animation:scrFade .26s ease;}
@keyframes scrFwd{from{opacity:0; transform:translateX(28px);}to{opacity:1; transform:none;}}
@keyframes scrBack{from{opacity:0; transform:translateX(-28px);}to{opacity:1; transform:none;}}
@keyframes scrFade{from{opacity:0;}to{opacity:1;}}
/* below-the-fold rows rise in as they scroll into view */
.view.active .rv{animation:none; opacity:0; transform:translateY(18px); transition:opacity .5s var(--ease), transform .5s var(--ease);}
.view.active .rv.in{opacity:1; transform:none;}
/* forms */
.field input, .field textarea, .field select{transition:border-color .2s, box-shadow .25s, background-color .2s;}
.field input:focus, .field textarea:focus, .field select:focus{box-shadow:0 0 0 4px rgba(17,17,17,.14);}
.field:focus-within label{color:var(--brand-dark); transition:color .2s;}
.pill{transition:background-color .2s, color .2s, border-color .2s, transform .15s;}
.pill:active{transform:scale(.94);}
.pill.active{animation:pillPop .32s cubic-bezier(.3,1.6,.5,1);}
@keyframes pillPop{0%{transform:scale(.88);}100%{transform:scale(1);}}
.segment button.active{animation:pillPop .3s cubic-bezier(.3,1.6,.5,1);}
/* errors shake in, chat bubbles pop in */
main [style*="color:#8a1f1f"]{animation:errShake .45s ease, itemIn .3s var(--ease);}
@keyframes errShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
main [style*="max-width:82%"]{animation:bubbleIn .35s cubic-bezier(.3,1.4,.5,1) both; transform-origin:bottom;}
@keyframes bubbleIn{from{opacity:0; transform:translateY(10px) scale(.92);}to{opacity:1; transform:none;}}
/* a button that is working shows a sliding light instead of just greying out */
.btn:disabled{position:relative; overflow:hidden; opacity:.8; cursor:progress;}
.btn:disabled::after{content:''; position:absolute; inset:0; background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%); transform:translateX(-100%); animation:btnShine 1.1s infinite;}
@keyframes btnShine{to{transform:translateX(100%);}}
/* unread notifications breathe; the header chips and tab bar settle in after login */
.notif-row.unread .notif-dot{animation:dotPulse 2.2s infinite;}
header.site, #tabBar{animation:itemIn .5s var(--ease) both;}
.req-status.live{position:relative;}
.req-status.live::before{content:''; display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--brand); margin-right:5px; vertical-align:1px; animation:dotPulse 2s infinite;}
@media (prefers-reduced-motion:reduce){
  #viewRoot, header.site, #tabBar, main [style*="color:#8a1f1f"], main [style*="max-width:82%"], .pill.active, .segment button.active, .btn:disabled::after, .req-status.live::before{animation:none !important;}
  .view.active .rv{opacity:1; transform:none; transition:none;}
}

.ic-chip.opened{background:#e1f1e4; color:#2f6b3b;}
.ic-chip.missed{background:#fbe5e2; color:#a8372c;}
.ic-chip.declined{background:#f3ede0; color:#8a6a1f;}
.ic-chip.answered{background:#e3ecf5; color:#35607f;}
.ic-set{display:flex; align-items:center; justify-content:space-between; gap:14px; padding:12px 0; border-top:1px solid var(--g100); cursor:pointer;}
.ic-sw{position:relative; flex:0 0 48px; width:48px; height:28px; border-radius:99px; border:0; background:var(--g300); cursor:pointer; transition:background .2s; padding:0;}
.ic-sw i{position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.25); transition:transform .22s cubic-bezier(.3,1.4,.5,1);}
.ic-sw.on{background:var(--brand);}
.ic-sw.on i{transform:translateX(20px);}
/* call overlay */
.ic-call{position:fixed; inset:0; z-index:300; display:flex; flex-direction:column; justify-content:space-between; background:#111; color:#fff; animation:icCallIn .3s ease-out;}
@keyframes icCallIn{from{opacity:0; transform:scale(1.03);}to{opacity:1; transform:none;}}
.ic-video{position:absolute; inset:0; background:radial-gradient(circle at 50% 38%,#4a5a63,#1b2226 70%); overflow:hidden; display:flex; align-items:flex-end; justify-content:center;}
.ic-person{width:min(70vw,420px); fill:#0d1214; opacity:.85; filter:blur(.4px);}
.ic-noise{position:absolute; inset:0; opacity:.12; background-image:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 3px); animation:icNoise .5s steps(3) infinite;}
@keyframes icNoise{to{transform:translateY(3px);}}
.ic-live{position:absolute; top:max(env(safe-area-inset-top),16px); right:16px; display:flex; align-items:center; gap:6px; font-size:11px; font-weight:800; letter-spacing:.1em; background:rgba(0,0,0,.45); padding:5px 10px; border-radius:99px;}
.ic-live i{width:7px; height:7px; border-radius:50%; background:#ff4d4d; animation:icPulse 1.4s infinite;}
.ic-call-top{position:relative; z-index:1; padding:max(env(safe-area-inset-top),22px) 20px 0; text-shadow:0 1px 8px rgba(0,0,0,.6);}
.ic-call-title{font-size:26px; font-weight:800;}
.ic-call-sub{font-size:14px; opacity:.85; margin-top:3px;}
.ic-call-actions{position:relative; z-index:1; display:flex; justify-content:center; gap:18px; padding:20px 16px max(env(safe-area-inset-bottom),30px); background:linear-gradient(transparent,rgba(0,0,0,.65));}
.ic-call-actions.two{gap:64px;}
.ic-round{display:flex; flex-direction:column; align-items:center; gap:7px; border:0; background:none; color:#fff; font:600 12px var(--font); cursor:pointer;}
.ic-round svg{box-sizing:content-box; padding:18px; border-radius:50%; background:#fff; color:#222; transition:transform .12s;}
.ic-round:active svg{transform:scale(.92);}
.ic-round.answer svg{background:#2fb454; color:#fff;}
.ic-round.decline svg{background:#e0463a; color:#fff;}
.ic-round.decline svg{transform:rotate(135deg);}
.ic-round.decline:active svg{transform:rotate(135deg) scale(.92);}
.ic-round.small svg{padding:14px; background:rgba(255,255,255,.2); color:#fff; backdrop-filter:blur(8px);}
.ic-round.small.decline svg{background:#e0463a;}
.ic-round.small.off svg{background:#fff; color:#222;}
.ic-round.small.door svg{background:var(--brand); }
.ic-round.small.door.done svg{background:#2fb454;}
.ic-call.ringing .ic-round.answer svg{animation:icRing 1.1s infinite;}
@keyframes icRing{0%{box-shadow:0 0 0 0 rgba(47,180,84,.6);}100%{box-shadow:0 0 0 22px rgba(47,180,84,0);}}
@media (min-width:900px){ .ic-wrap{max-width:560px; margin:0 auto;} .ic-call{inset:auto; position:fixed; left:50%; top:50%; width:420px; height:720px; max-height:92vh; transform:translate(-50%,-50%); border-radius:28px; overflow:hidden; box-shadow:0 0 0 100vmax rgba(0,0,0,.5); animation:none;} }
@media (prefers-reduced-motion:reduce){ .ic-call,.ic-noise,.ic-online i,.ic-live i,.ic-round.answer svg{animation:none !important;} }
.ic-video{align-items:center;}
.ic-person{width:min(88vw,460px); margin-top:14vh; fill:#10171a; opacity:.9;}

.quick-item.soon{background:var(--g100); color:var(--g500); border-color:var(--g200); cursor:not-allowed; opacity:.75;}
.quick-item.soon .qi-ic, .quick-item.soon .qi-label{color:var(--g500);}
.quick-item.soon:hover .qi-ic{transform:none;}
.quick-item.soon .qi-note{font-weight:700; color:var(--g600);}
.logo-wordmark{font-weight:900; font-size:21px; letter-spacing:-.03em; color:var(--black); text-decoration:none;}
.login-wordmark{font-weight:900; font-size:28px; letter-spacing:-.03em; color:var(--black); margin-bottom:28px;}
.login-top .login-wordmark{margin-bottom:0;}
.demo-toast{position:fixed; left:50%; bottom:calc(var(--nav-h) + 20px); transform:translate(-50%,12px); background:#111; color:#fff; padding:11px 16px; border-radius:12px; font-size:13px; font-weight:600; opacity:0; transition:all .25s; z-index:9999; max-width:86%; text-align:center;}
.demo-toast.show{opacity:1; transform:translate(-50%,0);}

<script>
// ---------------------------------------------------------------------------
// DEMO BACKEND — replaces the real api.js. Nothing is sent anywhere: all data
// lives in memory and resets when the page is reloaded.
// ---------------------------------------------------------------------------
const api = (() => {
  let token = 'demo';
  const pad = (n) => String(n).padStart(2, '0');
  const stamp = (d) => d.toISOString().slice(0, 19).replace('T', ' ');
  const dateOnly = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const at = (days, h = 9, m = 0) => { const d = new Date(); d.setDate(d.getDate() + days); d.setHours(h, m, 0, 0); return d; };
  const clone = (v) => JSON.parse(JSON.stringify(v));
  const later = (v) => new Promise((res) => setTimeout(() => res(clone(v)), 140));
  const fail = (status, msg) => { const e = new Error(msg); e.status = status; return Promise.reject(e); };

  const me = { id: 1, firstName: 'Alex', lastName: 'Morgan', email: 'alex.morgan@example.com', phone: '+1 555 010 0142',
    apartmentNumber: '402', buildingCode: 'A', buildingName: 'Building A', buildingAddress: '120 Meadow Lane, Springfield',
    parkingSpot: 'A-24', monthlyRent: 1240, currency: 'CAD', managedByAdmin: true };

  const requests = [
    { id: 1, category: 'cleaning', description: 'Deep cleaning before the weekend.', status: 'completed', preferredDate: dateOnly(at(-13)), preferredTime: 'Morning',
      assignedTo: 'CleanHome Crew', scheduledDate: null, scheduledTime: null, createdAt: stamp(at(-14, 9, 5)), updatedAt: stamp(at(-12, 15)),
      timeline: [
        { status: 'submitted', note: 'Request submitted', createdAt: stamp(at(-14, 9, 5)) },
        { status: 'reviewed', note: 'Reviewed by management', createdAt: stamp(at(-14, 10, 30)) },
        { status: 'assigned', note: 'Cleaning crew assigned', createdAt: stamp(at(-13, 8, 0)) },
        { status: 'completed', note: 'Job completed', createdAt: stamp(at(-12, 15, 0)) }], attachments: [] },
    { id: 2, category: 'electrical', description: 'Outlet not working in the bedroom.', status: 'submitted', preferredDate: dateOnly(at(1)), preferredTime: 'Afternoon',
      assignedTo: null, scheduledDate: null, scheduledTime: null, createdAt: stamp(at(-1, 8, 40)), updatedAt: stamp(at(-1, 8, 40)),
      timeline: [{ status: 'submitted', note: 'Request submitted', createdAt: stamp(at(-1, 8, 40)) }], attachments: [] },
    { id: 3, category: 'plumbing', description: 'Kitchen sink is leaking under the cabinet.', status: 'scheduled', preferredDate: dateOnly(at(-1)), preferredTime: 'Afternoon',
      assignedTo: 'Mike Turner', scheduledDate: dateOnly(at(1)), scheduledTime: '10:00', createdAt: stamp(at(-3, 9, 12)), updatedAt: stamp(at(-1, 16, 0)),
      timeline: [
        { status: 'submitted', note: 'Request submitted', createdAt: stamp(at(-3, 9, 12)) },
        { status: 'reviewed', note: 'Reviewed by management', createdAt: stamp(at(-3, 11, 40)) },
        { status: 'assigned', note: 'Technician assigned: Mike Turner', createdAt: stamp(at(-2, 8, 5)) },
        { status: 'scheduled', note: 'Visit confirmed for tomorrow at 10 AM', createdAt: stamp(at(-1, 16, 0)) }], attachments: [] },
  ];
  let nextRequestId = 4, nextAttachmentId = 1;

  const amenities = [
    { id: 1, key: 'gym', name: 'Gym', hours: '06:00 – 23:00', bookable: true, quantity: 1, openTime: '06:00', closeTime: '23:00' },
    { id: 2, key: 'party', name: 'Party room', hours: '09:00 – 23:00', bookable: true, quantity: 1, openTime: '09:00', closeTime: '23:00' },
    { id: 3, key: 'bbq', name: 'BBQ area', hours: '10:00 – 21:00', bookable: true, quantity: 5, openTime: '10:00', closeTime: '21:00' },
    { id: 4, key: 'cinema', name: 'Cinema room', hours: '18:00 – 23:00', bookable: true, quantity: 1, openTime: '18:00', closeTime: '23:00' },
    { id: 5, key: 'pool', name: 'Pool', hours: '07:00 – 22:00', bookable: false, quantity: 1, openTime: '07:00', closeTime: '22:00' },   // information only
    { id: 6, key: 'pingpong', name: 'Ping-pong', hours: '09:00 – 22:00', bookable: true, quantity: 2, openTime: '09:00', closeTime: '22:00' },
  ];
  // Other residents' bookings, so the demo shows taken ("Full") times: the gym is booked tomorrow 18:00, 4 of 5 BBQs at noon.
  const bookings = [{ id: 1, amenityId: 1, date: dateOnly(at(1)), timeSlot: '18:00', duration: '1h' }];
  for (let i = 0; i < 4; i++) bookings.push({ id: 2 + i, amenityId: 3, date: dateOnly(at(1)), timeSlot: '12:00', duration: '1h' });
  // The demo resident's own bookings (shown under "My bookings", can be cancelled).
  bookings.push({ id: 20, amenityId: 6, date: dateOnly(at(1)), timeSlot: '17:00', duration: '1h', mine: true, createdAt: stamp(at(0, 9)) });
  bookings.push({ id: 21, amenityId: 4, date: dateOnly(at(3)), timeSlot: '20:00', duration: '2h', mine: true, createdAt: stamp(at(0, 9, 30)) });
  let nextBookingId = 100;

  // Same rules as the real server: an amenity has `quantity` identical units; a booking takes one for its whole duration.
  const DUR = { '1h': 1, '2h': 2, '3h': 3 };
  const toMin = (t) => { const m = /^(\d{1,2}):(\d{2})$/.exec(String(t || '')); return m ? Number(m[1]) * 60 + Number(m[2]) : null; };
  const fmtMin = (m) => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
  const freeUnits = (a, date, start, end) => {
    const iv = bookings.filter((x) => x.amenityId === a.id && x.date === date).map((x) => [toMin(x.timeSlot), toMin(x.timeSlot) + 60 * parseFloat(x.duration)]);
    const pts = [start, ...iv.map((i) => i[0]).filter((v) => v > start && v < end)];
    return Math.max(0, a.quantity - Math.max(...pts.map((pt) => iv.filter(([s0, e0]) => s0 <= pt && pt < e0).length)));
  };
  const passed = (date, start) => { const n = new Date(); return date === dateOnly(n) && start <= n.getHours() * 60 + n.getMinutes(); };

  const news = [
    { id: 3, tag: 'Notice', title: 'Fire alarm test tomorrow, 10 AM', body: 'A routine fire alarm test will take place in Building A tomorrow at 10 AM. No action is needed on your side.', publishedAt: stamp(at(-1, 9, 0)) },
    { id: 2, tag: 'News', title: 'New rooftop lounge is now open', body: 'The redesigned rooftop lounge is open daily from 8 AM to 10 PM. Reservations are available right here in the app.', publishedAt: stamp(at(-9, 9, 0)) },
    { id: 1, tag: 'Notice', title: 'Elevator B maintenance this weekend', body: 'Elevator B will be out of service on Saturday from 8 AM to 2 PM for scheduled maintenance. Thank you for your patience.', publishedAt: stamp(at(-12, 9, 0)) },
  ];

  const documents = [
    { id: 'shared-1', originalName: 'House rules.pdf', docType: 'rules', mimeType: 'application/pdf', sizeBytes: 182400, uploadedAt: stamp(at(-120, 10, 0)) },
    { id: 1, originalName: 'Lease agreement.pdf', docType: 'lease', mimeType: 'application/pdf', sizeBytes: 311200, uploadedAt: stamp(at(-200, 10, 0)) },
  ];

  const messages = [
    { id: 1, sender: 'resident', body: 'Hi, when can the plumber come to fix the leak?', createdAt: stamp(at(-2, 14, 10)) },
    { id: 2, sender: 'management', body: 'Hi Alex, a technician will come tomorrow at 10 AM. We’ll message you if anything changes.', createdAt: stamp(at(-1, 16, 5)) },
  ];
  let nextMessageId = 3;

  const guestParking = [
    { id: 1, guestName: 'Sophie Martin', licensePlate: 'ABC 123', startDate: dateOnly(at(1)), endDate: dateOnly(at(2)), createdAt: stamp(at(-1, 11, 0)) },
  ];
  let nextGuestId = 2;

  const settings = { managementPhone: '+1 555 010 0100', managementEmail: 'office@unitly.example', services: {
    plumbing: { enabled: true, price: null }, electrical: { enabled: true, price: null },
    cleaning: { enabled: true, price: 80 }, moving: { enabled: true, price: 249.5 },
    drycleaning: { enabled: true, price: 45 }, carwash: { enabled: true, price: 35 }, furniture: { enabled: true, price: 120 },
    repairs: { enabled: true, price: null }, other: { enabled: true, price: null } } };

  const listShape = (r) => { const { timeline, attachments, ...rest } = r; return rest; };

  const base = {
    getToken() { return token; },
    setToken(t) { token = t; },
    clearToken() { token = null; },

    login() { token = 'demo'; return later({ token: 'demo', mustChangePassword: false }); },
    getMe() { return later(me); },
    updateMe(patch) { Object.assign(me, patch || {}); return later(me); },

    getRequests() { return later(requests.slice().sort((a, b) => (a.createdAt < b.createdAt ? 1 : -1)).map(listShape)); },
    getRequest(id) { const r = requests.find((x) => String(x.id) === String(id)); return r ? later(r) : fail(404, 'Request not found.'); },
    createRequest(p) {
      const now = new Date();
      const r = { id: nextRequestId++, category: p.category, description: p.description, status: 'submitted',
        preferredDate: p.preferredDate || null, preferredTime: p.preferredTime || null, assignedTo: null, scheduledDate: null, scheduledTime: null,
        createdAt: stamp(now), updatedAt: stamp(now),
        timeline: [{ status: 'submitted', note: 'Request submitted', createdAt: stamp(now) }], attachments: [] };
      requests.push(r);
      return later(listShape(r));
    },
    uploadAttachment(requestId, file) {
      const r = requests.find((x) => String(x.id) === String(requestId));
      const a = { id: nextAttachmentId++, originalName: (file && file.name) || 'photo.jpg', mimeType: (file && file.type) || 'image/jpeg', sizeBytes: (file && file.size) || 0 };
      if (r) r.attachments.push(a);
      return later(a);
    },

    checkEmail() { return later({ ok: true }); },
    setPassword() { token = 'demo'; return later({ token: 'demo' }); },
    forgotPassword() { return later({ ok: true }); },
    changePassword() { return later({ ok: true, token: 'demo' }); },
    logoutEverywhere() { return later({ ok: true }); },

    getAmenities() { return later(amenities); },
    getMyBookings() {
      const now = new Date();
      return later(bookings.filter((b) => b.mine && new Date(`${b.date}T${b.timeSlot}:00`) > now).sort((x, y) => (x.date + x.timeSlot < y.date + y.timeSlot ? -1 : 1))
        .map((b) => { const a = amenities.find((x) => x.id === b.amenityId); return { id: b.id, amenityId: a.id, amenityName: a.name, amenityKey: a.key, date: b.date, timeSlot: b.timeSlot, duration: b.duration, createdAt: b.createdAt }; }));
    },
    cancelBooking(id) {
      const i = bookings.findIndex((b) => b.mine && String(b.id) === String(id));
      if (i < 0) return fail(404, 'Booking not found.');
      bookings.splice(i, 1);                       // frees the time again
      return later({ ok: true });
    },
    getAmenityAvailability(id, date, duration) {
      const a = amenities.find((x) => x.id === Number(id)); if (!a) return fail(404, 'Amenity not found.');
      const h = DUR[duration] || 1, open = toMin(a.openTime), close = toMin(a.closeTime), slots = [];
      if (a.bookable) for (let st = open; st + h * 60 <= close; st += 60) slots.push({ time: fmtMin(st), left: passed(date, st) ? 0 : freeUnits(a, date, st, st + h * 60) });
      return later({ amenityId: a.id, bookable: a.bookable, quantity: a.quantity, date, duration, slots, problem: null });
    },
    bookAmenity(id, p) {
      const a = amenities.find((x) => x.id === Number(id)); if (!a) return fail(404, 'Amenity not found.');
      if (!a.bookable) return fail(400, 'This space does not need a reservation.');
      const h = DUR[p.duration], st = toMin(p.timeSlot);
      if (!h || st === null || !/^\d{4}-\d{2}-\d{2}$/.test(p.date || '')) return fail(400, 'Please pick a date, a time and a duration.');
      if (p.date < dateOnly(new Date()) || passed(p.date, st)) return fail(400, 'That time has already passed.');
      if (st < toMin(a.openTime) || st + h * 60 > toMin(a.closeTime)) return fail(400, `This space is open ${a.hours}.`);
      if (freeUnits(a, p.date, st, st + h * 60) < 1) return fail(409, 'This time is no longer available.');
      const newId = nextBookingId++;
      bookings.push({ id: newId, amenityId: a.id, date: p.date, timeSlot: p.timeSlot, duration: p.duration, mine: true, createdAt: stamp(new Date()) });
      return later({ id: newId, amenityId: a.id, date: p.date, timeSlot: p.timeSlot, duration: p.duration });
    },

    getGuestParking() { return later(guestParking.slice().reverse()); },
    createGuestParking(p) {
      const g = { id: nextGuestId++, guestName: p.guestName, licensePlate: p.licensePlate, startDate: p.startDate, endDate: p.endDate, createdAt: stamp(new Date()) };
      guestParking.push(g);
      return later(g);
    },

    getMessages() { return later(messages); },
    sendMessage(body) {
      const m = { id: nextMessageId++, sender: 'resident', body, createdAt: stamp(new Date()) };
      messages.push(m);
      // A friendly canned reply shows up a moment later (visible when the thread is reopened).
      setTimeout(() => messages.push({ id: nextMessageId++, sender: 'management', body: 'Thanks for your message — our team will get back to you shortly.', createdAt: stamp(new Date()) }), 2500);
      return later(m);
    },

    getNews() { return later(news); },
    getDocuments() { return later(documents); },
    getSettings() { return later(settings); },
  };

  // ===================== NEW IN THIS VERSION =====================
  me.building = { id: 1, units: 82, floors: 6, roof: 'flat', tone: 'stone' };
  const utc = (d) => d.toISOString().slice(0, 19).replace('T', ' ');
  const notifs = [
    { id: 3, kind: 'request_status', params: { requestId: 3, status: 'scheduled' }, read: false, createdAt: utc(at(-1, 16, 1)) },
    { id: 2, kind: 'news', params: { title: 'Fire alarm test tomorrow, 10 AM' }, read: false, createdAt: utc(at(-1, 9, 1)) },
    { id: 1, kind: 'booking_cancelled', params: { amenity: 'Cinema room', date: dateOnly(at(-2)), time: '20:00' }, read: true, createdAt: utc(at(-3, 12, 0)) },
  ];

  const durH = (b) => parseFloat(b.duration) || 1;
  const peakOf = (a, date, s, e) => {
    const iv = bookings.filter((x) => x.amenityId === a.id && x.date === date).map((x) => [toMin(x.timeSlot), toMin(x.timeSlot) + 60 * durH(x)]);
    const pts = [s, ...iv.map((i) => i[0]).filter((v) => v > s && v < e)];
    return Math.max(...pts.map((pt) => iv.filter(([s0, e0]) => s0 <= pt && pt < e0).length));
  };
  const extra = {
    getMyBookings() {
      const now = new Date();
      return later(bookings.filter((b) => b.mine).sort((x, y) => (x.date + x.timeSlot < y.date + y.timeSlot ? 1 : -1))
        .map((b) => { const a = amenities.find((x) => x.id === b.amenityId); return { id: b.id, amenityId: a.id, amenityName: a.name, amenityKey: a.key, date: b.date, timeSlot: b.timeSlot, duration: b.duration, durationMin: durH(b) * 60, createdAt: b.createdAt, canCancel: new Date(`${b.date}T${b.timeSlot}:00`) > now }; }));
    },
    getAmenityAvailability(id, date) {
      const a = amenities.find((x) => x.id === Number(id)); if (!a) return fail(404, 'Amenity not found.');
      const open = toMin(a.openTime), close = toMin(a.closeTime), slots = [];
      if (a.bookable) for (let s = open; s + 60 <= close; s += 60) {
        let maxHours = 0;
        if (!passed(date, s)) for (const h of [1, 2, 3]) { const e = s + h * 60; if (e > close) break; if (peakOf(a, date, s, e) >= a.quantity) break; maxHours = h; }
        slots.push({ time: fmtMin(s), maxHours, left: Math.max(0, a.quantity - peakOf(a, date, s, s + 60)) });
      }
      return later({ id: a.id, key: a.key, name: a.name, bookable: a.bookable, quantity: a.quantity, allDay: false, open: a.openTime, close: a.closeTime, date, slots, durations: [1, 2, 3] });
    },
    bookAmenity(id, p) {
      const a = amenities.find((x) => x.id === Number(id)); if (!a) return fail(404, 'Amenity not found.');
      const h = Number(p.hours), st = toMin(p.start);
      if (!h || st === null || !/^\d{4}-\d{2}-\d{2}$/.test(p.date || '')) return fail(400, 'Please pick a date, a time and a duration.');
      if (p.date < dateOnly(new Date()) || passed(p.date, st)) return fail(400, 'That time has already passed.');
      if (st < toMin(a.openTime) || st + h * 60 > toMin(a.closeTime)) return fail(400, `This space is open ${a.hours}.`);
      if (peakOf(a, p.date, st, st + h * 60) >= a.quantity) return fail(409, 'This time is no longer available.');
      const newId = nextBookingId++;
      bookings.push({ id: newId, amenityId: a.id, date: p.date, timeSlot: p.start, duration: h + 'h', mine: true, createdAt: stamp(new Date()) });
      return later({ id: newId, amenityId: a.id, date: p.date, start: p.start, hours: h });
    },
    getAmenities() { return later(amenities.map((a) => ({ ...a, allDay: false, open: a.openTime, close: a.closeTime }))); },
    getNotifications() { return later({ unread: notifs.filter((n) => !n.read).length, items: notifs.slice().sort((a, b) => b.id - a.id) }); },
    readNotification(id) { const n = notifs.find((x) => String(x.id) === String(id)); if (n) n.read = true; return later({ ok: true }); },
    readAllNotifications() { notifs.forEach((n) => { n.read = true; }); return later({ ok: true }); },
  };
  return Object.assign(base, extra);
})();

// Escapes text before it goes into an HTML template string. Every field
// that came from user input (request descriptions, chat messages, names,
// etc.) MUST be wrapped in this before being interpolated into a `` ` ``
// template that becomes innerHTML — otherwise a resident could store a
// <script> tag that runs in another resident's, or the admin's, browser.
function esc(value) {
  if (value === null || value === undefined) return '';
  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function svcIcon(path, size) {

}

function statusBucket(status) {
  if (status === 'completed') return 'done';
  if (status === 'submitted') return 'new';
  return 'live'; // reviewed | assigned | scheduled
}

function formatDate(iso) {
  if (!iso) return '';
  // Server times are UTC without a zone marker: read them as UTC so they show in the viewer's local time.
  const d = new Date(/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}/.test(iso) ? iso.replace(' ', 'T') + 'Z' : iso);
  if (isNaN(d)) return iso;
  return d.toLocaleDateString(state.lang, { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
}

// "2026-10-05" + "10:00" -> "Oct 5, 10:00" (date only if no time was set)
function formatVisit(date, time) {
  if (!date) return '';
  if (time) return formatDate(`${date} ${time}`);
  const d = new Date(`${date}T00:00:00`);
  if (isNaN(d)) return date;
  return d.toLocaleDateString(state.lang, { day: 'numeric', month: 'short' });
}

}

<script>
// 3D house on the home screen: the resident's building in isometric SVG with their own window lit.
// Same drawing as the admin Buildings screen (kept in sync by hand), pure CSS/SVG, no libraries.

const buildingScene = (() => {
  const U = 13, C = 0.866 * U, S = 0.5 * U, FH = 0.95;
  const rng = (seed) => { let t = seed >>> 0; return () => { t += 0x6D2B79F5; let r = Math.imul(t ^ t >>> 15, 1 | t); r ^= r + Math.imul(r ^ r >>> 7, 61 | r); return ((r ^ r >>> 14) >>> 0) / 4294967296; }; };

  function scene(spec, base) {
    const { w, d, floors, roof, tone, seed } = spec, r = rng(seed), m = 1.3;
    const ox = 130 - ((w - d) * C) / 2, oy = 198 - (w + d + 2 * m) * S;
    const pt = (x, y, z) => [ox + (x - y) * C, oy + (x + y) * S - z * U];
    const P = (x, y, z) => pt(x, y, z).map((n) => n.toFixed(1)).join(',');
    const poly = (pts, cls) => `<polygon class="${cls}" points="${pts.map((p) => P(...p)).join(' ')}"/>`;
    const box = (x0, y0, x1, y1, z0, z1, top = true) =>
      poly([[x0, y1, z0], [x1, y1, z0], [x1, y1, z1], [x0, y1, z1]], 'f-left') + poly([[x1, y0, z0], [x1, y1, z0], [x1, y1, z1], [x1, y0, z1]], 'f-right') + (top ? poly([[x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]], 'f-top') : '');
    const winDelay = () => `--wd:${(base + 0.35 + (floors + 1) * 0.15 + 0.5 + r() * 1.4).toFixed(2)}s`;
    const wins = (x0, y0, x1, y1, z0, ground, k) => {
      let out = '';
      for (let j = 0; j < Math.round(y1 - y0); j++) { const a = y0 + j + 0.22, b = y0 + j + 0.78; out += `<polygon class="win${r() < (spec.lit ?? 0.58) ? ' lit' : ''}${r() < 0.7 ? ' still' : ''}" style="${winDelay()}" points="${[[x1, a, z0 + 0.28], [x1, b, z0 + 0.28], [x1, b, z0 + 0.72], [x1, a, z0 + 0.72]].map((p) => P(...p)).join(' ')}"/>`; }
      for (let i = 0; i < Math.round(x1 - x0); i++) {
        const a = x0 + i + 0.22, b = x0 + i + 0.78;
        if (ground && i === Math.floor((x1 - x0) / 2)) { out += `<polygon class="door" points="${[[a, y1, 0], [b, y1, 0], [b, y1, 0.78], [a, y1, 0.78]].map((p) => P(...p)).join(' ')}"/>`; continue; }
        const lit = r() < (spec.lit ?? 0.58), still = r() < 0.7, mine = spec.mine && spec.mine.floor === k && spec.mine.idx === i;
        out += `<polygon class="win${lit || mine ? ' lit' : ''}${still ? ' still' : ''}${mine ? ' mine' : ''}" style="${winDelay()}" points="${[[a, y1, z0 + 0.28], [b, y1, z0 + 0.28], [b, y1, z0 + 0.72], [a, y1, z0 + 0.72]].map((p) => P(...p)).join(' ')}"/>`;
      }
      return out;
    };
    const tree = (x, y, i) => { const [X, Y] = pt(x, y, 0); return `<g transform="translate(${X.toFixed(1)} ${Y.toFixed(1)})"><g class="tree-in" style="--i:${i}"><rect class="trunk" x="-1.2" y="-9" width="2.4" height="9" rx="1"/><ellipse class="canopy" cx="0" cy="-15" rx="6.8" ry="8.2"/><ellipse class="canopy" cx="-2" cy="-17" rx="3" ry="3.6" style="opacity:.55;fill:#fff"/></g></g>`; };

    let html = `<g class="ground">${poly([[w + m, -m, 0], [w + m, d + m, 0], [w + m, d + m, -0.4], [w + m, -m, -0.4]], 'g-right')}${poly([[-m, d + m, 0], [w + m, d + m, 0], [w + m, d + m, -0.4], [-m, d + m, -0.4]], 'g-left')}${poly([[-m, -m, 0], [w + m, -m, 0], [w + m, d + m, 0], [-m, d + m, 0]], 'g-top')}</g>`;
    html += tree(-0.55, 0.3, 0);
    const total = floors + (roof === 'terrace' ? 1 : 0);
    for (let k = 0; k < floors; k++) {
      const z0 = k * FH, z1 = z0 + FH, last = k === floors - 1 && roof === 'flat';
      html += `<g class="floor" style="--i:${k}"><g class="faces">${box(0, 0, w, d, z0, z1, last)}</g><g class="wins">${wins(0, 0, w, d, z0, k === 0, k)}</g></g>`;
    }
    const zt = floors * FH; let ri = floors;
    if (roof === 'flat') {
      html += `<g class="roof" style="--i:${ri}"><g class="faces">${poly([[0.28, 0.28, zt], [w - 0.28, 0.28, zt], [w - 0.28, d - 0.28, zt], [0.28, d - 0.28, zt]], 'r-inner')}${box(w * 0.5, d * 0.18, w * 0.5 + 1.1, d * 0.18 + 1.1, zt, zt + 0.95)}</g><path class="antenna" d="M${P(w * 0.5 + 0.55, d * 0.18 + 0.55, zt + 0.95)} L${P(w * 0.5 + 0.55, d * 0.18 + 0.55, zt + 2.4)}"/><circle class="beacon" cx="${pt(w * 0.5 + 0.55, d * 0.18 + 0.55, zt + 2.4)[0].toFixed(1)}" cy="${pt(w * 0.5 + 0.55, d * 0.18 + 0.55, zt + 2.4)[1].toFixed(1)}" r="1.5"/></g>`;
    } else if (roof === 'gable') {
      const rh = d * 0.38;
      html += `<g class="roof" style="--i:${ri}"><g class="faces">${poly([[w, 0, zt], [w, d, zt], [w, d / 2, zt + rh]], 'r-gable')}${poly([[-0.3, -0.3, zt], [w + 0.3, -0.3, zt], [w + 0.3, d / 2, zt + rh], [-0.3, d / 2, zt + rh]], 'r-slope2')}${poly([[-0.3, d + 0.3, zt], [w + 0.3, d + 0.3, zt], [w + 0.3, d / 2, zt + rh], [-0.3, d / 2, zt + rh]], 'r-slope')}${box(w * 0.62, d * 0.55, w * 0.62 + 0.7, d * 0.55 + 0.7, zt + rh * 0.4, zt + rh * 0.4 + 0.9)}</g></g>`;
    } else {
      const a = 0.85, z0 = zt, z1 = zt + FH;
      html += `<g class="floor" style="--i:${floors}"><g class="faces">${box(a, a, w - a, d - a, z0, z1, false)}</g><g class="wins">${wins(a, a, w - a, d - a, z0, false, -1)}</g></g>`;
      html += `<g class="roof" style="--i:${floors + 1}"><g class="faces">${poly([[a - 0.2, a - 0.2, z1], [w - a + 0.2, a - 0.2, z1], [w - a + 0.2, d - a + 0.2, z1], [a - 0.2, d - a + 0.2, z1]], 'f-top')}${poly([[a + 0.2, a + 0.2, z1], [w - a - 0.2, a + 0.2, z1], [w - a - 0.2, d - a - 0.2, z1], [a + 0.2, d - a - 0.2, z1]], 'r-inner')}</g></g>`;
    }
    html += tree(w + 0.75, d + 0.85, 1) + tree(-0.7, d + 0.7, 2);
    if (spec.mine) {
      const [cx, cy] = pt(spec.mine.idx + 0.5, d, spec.mine.floor * FH + 0.5), label = String(spec.mine.label || ''), pw = Math.max(34, label.length * 7 + 16), px = 4 + pw / 2;
      const delay = (base + 0.35 + (floors + 1) * 0.15 + 1.2).toFixed(2);
      html += `<g class="mine-pin" style="--pd:${delay}s"><path d="M${(px + pw / 2).toFixed(1)},${cy.toFixed(1)} L${cx.toFixed(1)},${cy.toFixed(1)}"/><circle class="mine-ring" cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="5"/><rect x="4" y="${(cy - 9).toFixed(1)}" width="${pw}" height="18" rx="9"/><text x="${px.toFixed(1)}" y="${(cy + 3.6).toFixed(1)}" text-anchor="middle">${label.replace(/&/g, '&amp;').replace(/</g, '&lt;')}</text></g>`;
    }
    html += '';
    return `<svg viewBox="0 0 260 220" class="tone-${spec.tone}" style="--b:${base.toFixed(2)}s;--n:${total}" aria-hidden="true">${html}</svg>`;
  }

  return scene;
})();

const BUILDING_TONES = ['stone', 'sand', 'sage', 'slate'];
const BUILDING_ROOFS = ['flat', 'gable', 'terrace'];

// Animations on/off: remembered per browser (never required), default follows the system "reduce motion" setting.
function buildingAnimOn() {
  try {
    const saved = localStorage.getItem('buildingsAnim');
    if (saved === '0') return false;
    if (saved === '1') return true;
  } catch (_) {}
  return !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
}

// What to draw for a building: its own floors / roof / colour if set, otherwise a stable default derived from it.
function buildingSpec(b) {
  const id = Number(b.id) || 1;
  const floors = Number.isInteger(b.floors) && b.floors >= 2 && b.floors <= 8
    ? b.floors
    : Math.max(2, Math.min(8, Math.ceil((Number(b.units) || 24) / 8)));
  const roof = BUILDING_ROOFS.includes(b.roof) ? b.roof : BUILDING_ROOFS[(id * 7) % 3];
  const tone = BUILDING_TONES.includes(b.tone) ? b.tone : BUILDING_TONES[(id * 5) % 4];
  return { w: 4 + (id % 2), d: 3 + ((id >> 1) % 2), floors, roof, tone, seed: 1000 + id * 77 };
}

// Which window is "mine": floor from the apartment number (402 -> 4th floor), place along the front wall from its last two digits.
function myWindow(resident, spec) {
  const raw = String(resident.apartmentNumber || '').match(/\d+/);
  const n = raw ? parseInt(raw[0], 10) : 1;
  let floor = n >= 100 ? Math.floor(n / 100) - 1 : Math.floor((n - 1) / 4);
  floor = Math.max(0, Math.min(spec.floors - 1, floor));
  let idx = ((n % 100 || n) - 1) % spec.w;
  if (idx < 0) idx = 0;
  if (floor === 0 && idx === Math.floor(spec.w / 2)) idx = (idx + 1) % spec.w; // that slot is the front door
  return { floor, idx, label: String(resident.apartmentNumber || "") };
}

// Isometric parking lot: two rows of spots, a few parked cars, the resident's own spot lit with a pin.
function parkingScene(spotLabel, seed, base) {
  const U = 13, C = 0.866 * U, S = 0.5 * U, W = 5, D = 5.2, m = 1.1;
  const ox = 130 - ((W - D) * C) / 2, oy = 190 - (W + D + 2 * m) * S;
  const pt = (x, y, z) => [ox + (x - y) * C, oy + (x + y) * S - z * U];
  const P = (x, y, z) => pt(x, y, z).map((n) => n.toFixed(1)).join(',');
  const poly = (pts, cls, extra = '') => `<polygon class="${cls}" ${extra} points="${pts.map((p) => P(...p)).join(' ')}"/>`;
  let r = (seed >>> 0) || 7; const rnd = () => { r = (Math.imul(r, 1664525) + 1013904223) >>> 0; return r / 4294967296; };
  const digits = String(spotLabel).match(/\d+/); const n = digits ? parseInt(digits[0], 10) : 1;
  const mineIdx = (n - 1) % 10;
  const rows = [[0, 1.9], [3.3, 5.2]];                          // y-ranges of the two rows of spots
  const palettes = [['#f4f1ea', '#d9d4c7', '#bfb9aa'], ['#7d99b3', '#5f7c97', '#4d6a84'], ['#c9d3c4', '#a9b8a3', '#8fa089'], ['#8a8f98', '#6c717a', '#585d66'], ['#d9a066', '#bb8350', '#9c6a3f']];
  let html = `<g class="ground">${poly([[W + m, -m, 0], [W + m, D + m, 0], [W + m, D + m, -0.4], [W + m, -m, -0.4]], 'g-right')}${poly([[-m, D + m, 0], [W + m, D + m, 0], [W + m, D + m, -0.4], [-m, D + m, -0.4]], 'g-left')}${poly([[-m, -m, 0], [W + m, -m, 0], [W + m, D + m, 0], [-m, D + m, 0]], 'g-top')}</g>`;
  // asphalt, lane arrows (dashes) and spot lines
  html += `<g class="lot-marks">${poly([[0, 1.9, 0.02], [W, 1.9, 0.02], [W, 3.3, 0.02], [0, 3.3, 0.02]], 'lot-lane')}`;
  for (let k = 0; k <= W; k++) rows.forEach(([a, b]) => { html += poly([[k - 0.03, a, 0.03], [k + 0.03, a, 0.03], [k + 0.03, b, 0.03], [k - 0.03, b, 0.03]], 'lot-line'); });
  for (let k = 0; k < W; k += 1) html += poly([[k + 0.3, 2.56, 0.03], [k + 0.7, 2.56, 0.03], [k + 0.7, 2.64, 0.03], [k + 0.3, 2.64, 0.03]], 'lot-dash');
  html += '</g>';
  const car = (x, y, pal, i) => {
    const [t, l, rr] = pal, x0 = x + 0.17, x1 = x + 0.83, y0 = y + 0.18, y1 = y + 1.55, h = 0.5;
    const face = (pts, c) => poly(pts, 'car-f', `style="fill:${c}"`);
    const body = face([[x0, y1, 0.08], [x1, y1, 0.08], [x1, y1, h], [x0, y1, h]], l) + face([[x1, y0, 0.08], [x1, y1, 0.08], [x1, y1, h], [x1, y0, h]], rr) + face([[x0, y0, h], [x1, y0, h], [x1, y1, h], [x0, y1, h]], t);
    const cx0 = x0 + 0.06, cx1 = x1 - 0.06, cy0 = y0 + 0.4, cy1 = y1 - 0.38, ch = h + 0.34;
    const cab = face([[cx0, cy1, h], [cx1, cy1, h], [cx1, cy1, ch], [cx0, cy1, ch]], '#dfe8ef') + face([[cx1, cy0, h], [cx1, cy1, h], [cx1, cy1, ch], [cx1, cy0, ch]], '#b9c7d2') + face([[cx0, cy0, ch], [cx1, cy0, ch], [cx1, cy1, ch], [cx0, cy1, ch]], t);
    return `<g class="car" style="--i:${i}">${body}${cab}</g>`;
  };
  let ci = 0;
  rows.forEach(([a], ri) => { for (let k = 0; k < W; k++) {
    const idx = ri * W + k;
    if (idx === mineIdx) continue;
    if (rnd() < 0.72) html += car(k, a + (ri ? 0.1 : 0.05), palettes[Math.floor(rnd() * palettes.length)], ci++);
  } });
  const [ra, rb] = rows[Math.floor(mineIdx / W)], mk = mineIdx % W;
  html += `<g class="spot-mine">${poly([[mk + 0.05, ra + 0.05, 0.04], [mk + 0.95, ra + 0.05, 0.04], [mk + 0.95, rb - 0.05, 0.04], [mk + 0.05, rb - 0.05, 0.04]], 'spot-glow')}</g>`;
  const [px, py] = pt(mk + 0.5, (ra + rb) / 2, 0.04), label = String(spotLabel).replace(/&/g, '&amp;').replace(/</g, '&lt;'), pw = Math.max(36, label.length * 7.2 + 16);
  const delay = (base + 0.9).toFixed(2);
  html += `<g class="spot-pin" style="--pd:${delay}s"><path d="M${px.toFixed(1)},${(py - 4).toFixed(1)} L${px.toFixed(1)},${(py - 26).toFixed(1)}"/><circle class="mine-ring" cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="6"/><rect x="${(px - pw / 2).toFixed(1)}" y="${(py - 44).toFixed(1)}" width="${pw}" height="19" rx="9.5"/><text x="${px.toFixed(1)}" y="${(py - 30.8).toFixed(1)}" text-anchor="middle">${label}</text></g>`;
  const [lx, ly] = pt(W + 0.5, -0.5, 0);
  html += `<g transform="translate(${lx.toFixed(1)} ${ly.toFixed(1)})"><g class="tree-in" style="--i:0"><rect class="trunk" x="-1.2" y="-9" width="2.4" height="9" rx="1"/><ellipse class="canopy" cx="0" cy="-15" rx="6.8" ry="8.2"/></g></g>`;
  return `<svg viewBox="42 58 176 150" style="--b:${base.toFixed(2)}s;--n:3" aria-hidden="true">${html}</svg>`;
}

function homeHouseHtml(resident) {
  const b = resident.building;
  if (!b) return '';
  const spec = buildingSpec(b);
  spec.mine = myWindow(resident, spec);
  spec.mine.label = String(resident.apartmentNumber || '');
  spec.lit = 0.22;
  const floorNo = spec.mine.floor + 1;
  const spot = resident.parkingSpot && String(resident.parkingSpot).trim();
  return `<div class="home-house ${spot ? 'hh-two' : ''} ${buildingAnimOn() ? '' : 'no-anim'}">
    <div class="hh-col">
      <div class="hh-scene">${buildingScene(spec, 0.15)}</div>
      <div class="hh-cap">
        <div class="hh-lbl">${L.home.houseHint}</div>
        <div class="hh-num">${L.home.aptLabel} ${esc(resident.apartmentNumber)}</div>
        <div class="hh-chip">${L.home.houseFloor.replace('{n}', floorNo)}</div>
      </div>
    </div>
    ${spot ? `<button class="hh-col hh-lot" data-go="guestParking" aria-label="${esc(L.home.qParkingTitle)}">
      <div class="hh-scene">${parkingScene(spot, 1000 + (Number(b.id) || 1) * 31, 0.45)}</div>
      <div class="hh-cap">
        <div class="hh-lbl">${L.home.houseSpot}</div>
        <div class="hh-num">${esc(spot)}</div>
        <div class="hh-chip">${L.home.qParkingTitle} →</div>
      </div>
    </button>` : ''}
  </div>`;
}
