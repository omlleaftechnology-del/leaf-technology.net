          <label class="attach-box" style="cursor:pointer; display:block;">
            <input type="file" id="reqVideoInput" accept="video/*" style="display:none;">
            <span id="reqVideoLabel">${state.reqVideoName || L.form.addVideo}</span>
          </label>
        </div>
      </div>
      <div class="field">
        <label>${L.form.dateLabel}</label>
        <div class="pill-row" data-pillgroup="date">${L.form.dateOptions.map((d, i) => `<div class="pill ${i === (state.selectedDateIdx ?? 1) ? 'active' : ''}" data-pill="${i}">${d}</div>`).join('')}</div>
      </div>
      <div class="field" style="margin-bottom:24px;">
        <label>${L.form.timeLabel}</label>
        <div class="pill-row" data-pillgroup="time">${L.form.timeOptions.map((t, i) => `<div class="pill ${i === (state.selectedTimeIdx ?? 1) ? 'active' : ''}" data-pill="${i}">${t}</div>`).join('')}</div>
      </div>
      ${state.formError ? `<div style="color:#8a1f1f; font-size:12.5px; font-weight:600; margin-bottom:14px;">${state.formError}</div>` : ''}
      <button class="btn btn-primary" data-action="submit-request" ${state.busy ? 'disabled' : ''}>${state.busy ? '…' : L.form.submitBtn}</button>
    </div>
  </div>
`;};

views.confirm = () => `
  <div class="confirm-shell">
    <div class="confirm-mark"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4.5 4.5L19 8"/></svg></div>
    <h1>${state.confirmKind === 'booking' ? L.confirm.bookingTitle : L.confirm.title}</h1>
    <p>${state.confirmKind === 'booking' ? L.confirm.bookingBody : state.lastCreatedId ? L.confirm.body.replace(/[#№]2049/, (state.lang === 'uk' ? '№' : '#') + state.lastCreatedId) : L.confirm.body}</p>
    <div class="confirm-actions">
      ${state.confirmKind === 'booking'
        ? `<button class="btn btn-primary" data-go="myBookings">${L.myBookings.link}</button>
      <button class="btn btn-secondary" data-go="home">${L.confirm.back}</button>`
        : `<button class="btn btn-primary" data-go="requests">${L.confirm.view}</button>
      <button class="btn btn-secondary" data-go="home">${L.confirm.back}</button>`}
    </div>
  </div>
`;

views.requests = () => {
  const items = state.filter === 'all' ? state.requests : state.requests.filter(r => statusBucket(r.status) === state.filter);
  return `
  <div class="section" style="padding-top:24px; border-bottom:none;">
    <div class="section-head"><h2 style="font-size:22px;">${L.requests.title}</h2></div>
    <div class="segment">
      <button class="${state.filter === 'all' ? 'active' : ''}" data-filter="all">${L.requests.filterAll}</button>
      <button class="${state.filter === 'live' ? 'active' : ''}" data-filter="live">${L.requests.filterLive}</button>
      <button class="${state.filter === 'done' ? 'active' : ''}" data-filter="done">${L.requests.filterDone}</button>
    </div>
    ${items.map(reqRow).join('') || `<div class="empty-note">${L.requests.empty}</div>`}
  </div>
`;};

views.detail = () => {
  const r = state.requestDetail;
  if (!r) return `<div class="empty-note">…</div>`;
  const bucket = statusBucket(r.status);
  return `
  <div class="detail-shell">
    <a href="#" class="back-link" data-go="requests">${L.detail.back}</a>
    <div class="detail-head">
      <div>
        <div style="font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--g500); font-weight:700;">${L.categoryLabels[r.category] || r.category} · #${r.id}</div>
        <h1>${esc(r.description)}</h1>
        <div class="meta">${formatDate(r.createdAt)} · ${L.home.aptLabel}: ${esc(state.resident.apartmentNumber)}</div>
      </div>
      <span class="req-status ${bucket}" style="font-size:12.5px;">${L.statusLabels[r.status] || r.status}</span>
    </div>
    ${r.scheduledDate ? `
    <div style="background:var(--g100); border-radius:12px; padding:12px 14px; margin-bottom:16px; font-size:13px; color:var(--brand); font-weight:600;">
      ${L.detail.scheduledFor} ${esc(formatVisit(r.scheduledDate, r.scheduledTime))}
    </div>` : ''}
    <div class="timeline">
      ${r.timeline.map((ev, i, arr) => `
        <div class="t-row">
          <div class="t-dotcol"><div class="t-dot" style="background:var(--brand);"></div>${i < arr.length - 1 ? '<div class="t-line"></div>' : ''}</div>
          <div class="t-body"><div class="t-title">${ev.note ? esc(ev.note) : (L.statusLabels[ev.status] || ev.status)}</div><div class="t-when">${formatDate(ev.createdAt)}</div></div>
        </div>
      `).join('')}
    </div>
    <div style="margin-top:8px;">
      <h2 style="font-size:14px; font-weight:800; margin:0 0 10px 0;">${L.detail.attachmentsTitle}</h2>
      ${(r.attachments && r.attachments.length) ? r.attachments.map(a => `
        <button data-action="view-attachment" data-req="${r.id}" data-att="${a.id}" style="display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:none; border:1px solid var(--g200); border-radius:10px; padding:10px 12px; margin-bottom:8px; cursor:pointer;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="color:var(--brand-dark); flex:0 0 auto;">${a.mimeType && a.mimeType.startsWith('video/') ? '<path d="M4 6h11a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1Z"/><path d="M16 10l5-3v10l-5-3"/>' : '<rect x="3" y="4" width="18" height="14" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M4 16l4.5-4.5a1.5 1.5 0 0 1 2 0L14 15l2-2a1.5 1.5 0 0 1 2 0L20 15"/>'}</svg>
          <span style="font-size:12.5px; font-weight:600;">${esc(a.originalName)}</span>
        </button>
      `).join('') : `<p style="font-size:12.5px; color:var(--g500);">${L.detail.noAttachments}</p>`}
    </div>
    <button class="btn btn-secondary" style="margin-top:8px;" data-go="messages">${L.detail.messageBtn}</button>
  </div>
`;};

</script>
<script>
// Screens: profile, news, amenities, documents, payments, guest parking, management, messages, notifications, personal info; tab icons
// Part of the resident app: plain <script> files share one global scope; load order is set in index.html.
views.profile = () => `
  <div class="profile-head">
    <div class="av">${esc(state.resident.firstName[0])}${esc(state.resident.lastName[0])}</div>
    <div class="name">${esc(state.resident.firstName)} ${esc(state.resident.lastName)}</div>
    <div class="apt">${L.profile.aptPrefix} ${esc(state.resident.apartmentNumber)} · ${L.home.buildingWord} ${esc(state.resident.buildingCode)}</div>
  </div>
  <div class="profile-list" style="margin-top:8px;">
    <div class="profile-row" style="cursor:default;">
      <div class="pr-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.5 2.3 3.8 5.3 3.8 8.5S14.5 18.2 12 20.5C9.5 18.2 8.2 15.2 8.2 12S9.5 5.8 12 3.5Z"/></svg></div>
      <span>${L.profile.languageTitle}</span>
      <div style="margin-left:auto;">${langPicker()}</div>
    </div>
    <button class="profile-row" data-go="personalInfo"><div class="pr-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c1.2-3.6 4-5.4 7-5.4s5.8 1.8 7 5.4"/></svg></div><span>${L.profile.personalInfo}</span></button>
    <button class="profile-row" data-go="payments"><div class="pr-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/></svg></div><span>${L.profile.payments}</span></button>
    <button class="profile-row" data-go="notifications"><div class="pr-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 10a6 6 0 0 1 12 0c0 4 1.4 5.5 1.4 5.5H4.6S6 14 6 10Z"/><path d="M10 19a2 2 0 0 0 4 0"/></svg></div><span>${L.profile.notifications}</span></button>
    <button class="profile-row" data-go="management"><div class="pr-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M9.6 9.5a2.4 2.4 0 1 1 3.4 2.2c-.8.4-1 .8-1 1.6"/></svg></div><span>${L.profile.help}</span></button>
    <button class="profile-row" style="color:#8a1f1f;" data-action="logout"><div class="pr-ic" style="color:#8a1f1f; border-color:#f0d3d3;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4H6a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h3"/><path d="M14 8l4 4-4 4"/><path d="M18 12H9"/></svg></div><span style="color:#8a1f1f;">${L.profile.signOut}</span></button>
  </div>
`;

views.buildingNews = () => `
  <div class="section" style="padding-top:24px; border-bottom:none;">
    <a href="#" class="back-link" data-go="home">← ${L.nav.home}</a>
    <div class="section-head"><h2 style="font-size:22px;">${L.home.news}</h2></div>
    <div class="svc-list">
      ${(state.news || []).map(n => `
        <button class="svc-row" data-go="newsDetail" data-news="${n.id}">
          <div class="svc-ic" style="color:var(--brand-dark);"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H9l-5 4V6a1 1 0 0 1 1-1Z"/></svg></div>
          <div class="svc-info">
            <div style="font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--brand-dark); font-weight:700;">${esc(n.tag)} · ${formatDate(n.publishedAt)}</div>
            <div class="svc-name" style="margin-top:2px;">${esc(n.title)}</div>
            <div class="svc-desc">${esc(n.body)}</div>
          </div>
        </button>
      `).join('') || `<div class="empty-note">${L.requests.empty}</div>`}
    </div>
  </div>
`;

views.newsDetail = () => {
  const n = (state.news || []).find(x => x.id === state.activeNews) || {};
  return `
  <div class="detail-shell">
    <a href="#" class="back-link" data-go="buildingNews">← ${L.home.news}</a>
    <div style="font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--brand-dark); font-weight:700;">${esc(n.tag) || ''}</div>
    <h1 style="font-size:22px; font-weight:800; margin:8px 0 6px 0;">${esc(n.title) || ''}</h1>
    <div class="meta" style="margin-bottom:20px;">${n.publishedAt ? formatDate(n.publishedAt) : ''}</div>
    <p style="font-size:14px; color:var(--g700); line-height:1.7;">${esc(n.body) || ''}</p>
  </div>
`;};

views.amenities = () => {
  const ab = L.amenityBooking;
  const arrow = '<div class="svc-arrow"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l7 6-7 6"/></svg></div>';
  return `
  <div class="section" style="padding-top:24px; border-bottom:none;">
    <a href="#" class="back-link" data-go="home">← ${L.nav.home}</a>
    <div class="section-head"><h2 style="font-size:22px;">${L.home.amenities}</h2></div>
    <button class="btn btn-secondary my-bookings-link" data-go="myBookings">${L.myBookings.link}</button>
    <div class="svc-list">
      ${(state.amenities || []).map(a => {
        const icon = `<div class="svc-ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${amenityIcons[a.key] || amenityIcons.lounge}</svg></div>`;
        const hours = esc(amenityHoursText(a));
        // A zone that needs no reservation is just information: it shows its hours and is not clickable.
        return a.bookable
          ? `<button class="svc-row" data-go="amenityBooking" data-amenity="${a.id}">${icon}
              <div class="svc-info"><div class="svc-name">${esc(a.name)}</div><div class="svc-desc">${hours}${a.quantity > 1 ? ` · ${a.quantity} ${ab.units}` : ''}</div></div>${arrow}</button>`
          : `<div class="svc-row svc-static">${icon}
              <div class="svc-info"><div class="svc-name">${esc(a.name)}</div><div class="svc-desc">${hours}</div></div>
              <span class="amen-note">${ab.noBooking}</span></div>`;
      }).join('')}
    </div>
  </div>
`;};

views.notifications = () => {
  const nt = L.notif;
  const list = state.notifications || [];
  return `
  <div class="section" style="padding-top:24px; border-bottom:none;">
    <a href="#" class="back-link" data-go="home">← ${L.nav.home}</a>
    <div class="section-head" style="display:flex; justify-content:space-between; align-items:center;">
      <h2 style="font-size:22px;">${nt.title}</h2>
      ${state.unreadCount ? `<button class="btn btn-secondary mb-cancel" data-action="read-all-notifications">${nt.readAll}</button>` : ''}
    </div>
    ${list.map(n => `
      <button class="notif-row ${n.read ? '' : 'unread'}" data-action="open-notification" data-id="${n.id}">
        <span class="notif-dot"></span>
        <span class="notif-body"><span class="notif-text">${esc(notifText(n))}</span><span class="notif-time">${esc(notifAgo(n.createdAt))}</span></span>
      </button>`).join('') || `<div class="empty-note">${nt.empty}</div>`}
  </div>
`;};

views.myBookings = () => {
  const mb = L.myBookings;
  const list = state.myBookings || [];
  const upcoming = list.filter(b => b.canCancel).reverse();
  const past = list.filter(b => !b.canCancel);
  const row = (b) => `
    <div class="mb-row">
      <div class="mb-info">
        <div class="svc-name">${esc(b.amenityName)}</div>
        <div class="svc-desc">${esc(bookingDateText(b.date))} · ${esc(bookingRangeText(b))}</div>
      </div>
      ${b.canCancel
        ? `<button class="btn btn-secondary mb-cancel" data-action="cancel-my-booking" data-booking="${b.id}">${mb.cancel}</button>`
        : `<span class="amen-note">${mb.past}</span>`}
    </div>`;
  return `
  <div class="section" style="padding-top:24px; border-bottom:none;">
    <a href="#" class="back-link" data-go="amenities">${L.amenityBooking.back}</a>
    <div class="section-head"><h2 style="font-size:22px;">${mb.title}</h2></div>
    ${state.myBookingsError ? `<div style="color:#8a1f1f; font-size:12.5px; font-weight:600; margin-bottom:14px;">${esc(state.myBookingsError)}</div>` : ''}
    ${upcoming.map(row).join('') || `<div class="empty-note">${mb.empty}</div>`}
    ${past.length ? `<h3 class="mb-sub">${mb.pastTitle}</h3>${past.map(row).join('')}` : ''}
  </div>
`;};

views.amenityBooking = () => {
  const a = (state.amenities || []).find(x => x.id === state.activeAmenityId) || {};
  const ab = L.amenityBooking;
  const av = state.amenAvail;
  const slots = (av && av.slots) || [];
  const sel = slots.find(s => s.time === state.amenStart);
  const maxHours = sel ? sel.maxHours : 0;
  const anyFree = slots.some(s => s.maxHours > 0);
  return `
  <div class="form-shell">
    <a href="#" class="back-link" data-go="amenities">${ab.back}</a>
    <div class="form-card">
      <h1>${esc(a.name) || ''}</h1>
      <p class="lead">${ab.lead} <span style="color:var(--g600);">${esc(amenityHoursText(a))}${a.quantity > 1 ? ` · ${a.quantity} ${ab.units}` : ''}</span></p>
      <div class="field"><label>${ab.dateLabel}</label><input id="amenDate" type="date" min="${localDateStr(0)}" max="${localDateStr(60)}" value="${state.amenDate || localDateStr(0)}"></div>
      <div class="field"><label>${ab.slotLabel}</label>
        ${!av ? `<p class="lead" style="margin:0;">${ab.loading}</p>`
          : !anyFree ? `<p class="lead" style="margin:0;">${ab.noSlots}</p>`
          : `<div class="pill-row">${slots.map(s => `<button type="button" class="pill ${s.time === state.amenStart ? 'active' : ''} ${s.maxHours ? '' : 'disabled'}" ${s.maxHours ? `data-amen-start="${s.time}"` : 'disabled'} title="${s.maxHours ? '' : ab.full}">${fmtClock(s.time)}</button>`).join('')}</div>`}
      </div>
      <div class="field" style="margin-bottom:24px;"><label>${ab.durationLabel}</label>
        <div class="pill-row">${[1, 2, 3].map(h => `<button type="button" class="pill ${h === state.amenHours ? 'active' : ''} ${h <= maxHours ? '' : 'disabled'}" ${h <= maxHours ? `data-amen-hours="${h}"` : 'disabled'}>${ab.hours[h]}</button>`).join('')}</div>
      </div>
      ${state.amenBookingError ? `<div style="color:#8a1f1f; font-size:12.5px; font-weight:600; margin-bottom:14px;">${state.amenBookingError}</div>` : ''}
      <button class="btn btn-primary" data-action="submit-amenity-booking" ${state.busy || !sel || !state.amenHours ? 'disabled' : ''}>${state.busy ? '…' : ab.confirmBtn}</button>
    </div>
  </div>
`;};

views.documents = () => `
  <div class="section" style="padding-top:24px; border-bottom:none;">
    <a href="#" class="back-link" data-go="home">← ${L.nav.home}</a>
    <div class="section-head" style="display:flex; justify-content:space-between; align-items:flex-end;">
      <h2 style="font-size:22px;">${L.home.documents}</h2>
      ${(state.documents || []).length > 1 ? `<button class="btn btn-secondary" style="width:auto; padding:8px 14px; font-size:12px;" data-action="download-all-documents">${L.documents.downloadAll}</button>` : ''}
    </div>
    <div class="svc-list">
      ${(state.documents || []).map(d => `
        <button data-action="view-document" data-doc="${d.id}" data-name="${esc(d.originalName)}" class="svc-row" style="width:100%; text-align:left; background:none; border:none;">
          <div class="svc-ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l4 4v14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"/><path d="M14 3v4h4"/><path d="M9 13h6M9 17h6"/></svg></div>
          <div class="svc-info"><div class="svc-name">${esc(d.originalName)}</div><div class="svc-desc">${L.documents.types[d.docType] || d.docType} · ${formatDate(d.uploadedAt)}</div></div>
        </button>
      `).join('') || `<div class="empty-note">${L.requests.empty}</div>`}
    </div>
  </div>
`;

views.payments = () => `
  <div class="section" style="padding-top:24px; border-bottom:none;">
    <a href="#" class="back-link" data-go="home">← ${L.nav.home}</a>
    <div class="section-head"><h2 style="font-size:22px;">${L.payments.title}</h2></div>
    <div class="empty" style="padding:36px 20px;">
      <div class="ring"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/></svg></div>
      <h3>${L.payments.pausedTitle}</h3>
      <p>${L.payments.pausedBody}</p>
    </div>
  </div>
`;

views.guestParking = () => {
  const gp = L.guestParking;
  return `
  <div class="form-shell">
    <a href="#" class="back-link" data-go="home">← ${L.nav.home}</a>
    <div class="form-card">
      <h1>${gp.title}</h1>
      <p class="lead">${gp.note}</p>
      <div class="field"><label>${gp.fromLabel}</label><input id="gpFrom" value="${gp.fromValue}"></div>
      <div class="field"><label>${gp.toLabel}</label><input id="gpTo" value="${gp.toValue}"></div>
      <div class="field"><label>${gp.guestNameLabel}</label><input id="gpGuestName" placeholder="${gp.guestNamePh}"></div>
      <div class="field" style="margin-bottom:24px;"><label>${gp.plateLabel}</label><input id="gpPlate" placeholder="${gp.platePh}"></div>
      ${state.gpError ? `<div style="color:#8a1f1f; font-size:12.5px; font-weight:600; margin-bottom:14px;">${state.gpError}</div>` : ''}
      <button class="btn btn-primary" data-action="submit-guest-parking" ${state.busy ? 'disabled' : ''}>${state.busy ? '…' : gp.confirmBtn}</button>
    </div>
  </div>
`;};

views.management = () => `
  <div class="detail-shell">
    <a href="#" class="back-link" data-go="home">← ${L.nav.home}</a>
    <h1 style="font-size:20px; font-weight:800; margin:0 0 4px 0;">${L.management.name}</h1>
    <div class="meta" style="margin-bottom:24px;">${L.management.hours}</div>
    <div class="svc-list">
      ${state.managementPhone ? `
      <a class="svc-row" href="tel:${state.managementPhone.replace(/\s+/g, '')}">
        <div class="svc-ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h3l1.5 4.5-2 1.5a12 12 0 0 0 6 6l1.5-2 4.5 1.5v3a2 2 0 0 1-2.2 2A17 17 0 0 1 4 6.2 2 2 0 0 1 6 3Z"/></svg></div>
        <div class="svc-info"><div class="svc-name">${L.management.callBtn}</div><div class="svc-desc">${state.managementPhone}</div></div>
      </a>

const icT = () => IC_TEXT[state.lang] || IC_TEXT.en;

const IC_DOOR_SECONDS = 6;
let icTimers = { door: null, miss: null, tick: null };

function icState() {
  if (!state.ic) {
    const now = Date.now(), min = 60000;
    state.ic = {
      entrance: 'main', door: 'locked', call: null, callEntrance: 'main', callKind: 'visitor', callStart: 0, mute: false, speaker: true, dnd: false, ringHere: true, hours: 4, copied: null,

        { id: 3, kind: 'unknown', entrance: 'garage', state: 'declined', at: now - 26 * 60 * min },
        { id: 4, kind: 'visitor', entrance: 'main', state: 'answered', at: now - 30 * 60 * min },

}

const icClock = (ms) => { const d = new Date(ms); return d.toLocaleTimeString(state.lang, { hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }); };
const icDay = (ms) => { const T = icT(), a = new Date(ms), b = new Date(); return a.toDateString() === b.toDateString() ? T.today : (b - a < 2 * 86400000 && a.getDate() !== b.getDate() ? T.yesterday : a.toLocaleDateString(state.lang, { day: 'numeric', month: 'short' })); };

const IC_ICON = {

};

    <circle class="ic-led" cx="60" cy="132" r="3.2"/>

}

function icVisitor() {
  return `<svg class="ic-person" viewBox="0 0 200 160" aria-hidden="true"><circle cx="100" cy="62" r="26"/><path d="M42 160c4-40 28-58 58-58s54 18 58 58Z"/></svg>`;
}

views.intercom = () => {
  const T = icT(), ic = icState();
  const unlocked = ic.door === 'open';
  const last = (e) => e;
  const groups = {};
  ic.history.slice().sort((a, b) => b.at - a.at).forEach(h => { (groups[icDay(h.at)] = groups[icDay(h.at)] || []).push(h); });
  const active = ic.passes.filter(p => p.until > Date.now());
  return `
  <div class="ic-wrap">
    <a href="#" class="back-link" data-go="home">← ${T.back}</a>
    <div class="section-head"><h2 style="font-size:22px;">${T.title}</h2></div>

    <div class="ic-door ${unlocked ? 'is-open' : ''}">
      <div class="ic-door-panel">${icPanel(unlocked)}</div>
      <div class="ic-door-main">

    <div class="ic-card">

      <p class="ic-lead">${T.guestLead}</p>

    </div>
  </div>
  ${icCallOverlay()}`;
};

function icCallOverlay() {
  const T = icT(), ic = icState();

    ${ringing ? `
      <div class="ic-call-actions two">
        <button class="ic-round decline" data-ic="decline" aria-label="${T.decline}">${icSvg('phone', 26)}<span>${T.decline}</span></button>

      <div class="ic-call-actions">
        <button class="ic-round small ${ic.mute ? 'off' : ''}" data-ic="mute" aria-pressed="${ic.mute}">${icSvg('mic', 22)}<span>${T.mute}</span></button>
        <button class="ic-round small ${ic.speaker ? '' : 'off'}" data-ic="speaker" aria-pressed="${ic.speaker}">${icSvg('spk', 22)}<span>${T.speaker}</span></button>
        <button class="ic-round small door ${ic.door === 'open' ? 'done' : ''}" data-ic="open" ${ic.door === 'open' ? 'disabled' : ''}>${icSvg(ic.door === 'open' ? 'unlock' : 'lock', 22)}<span>${ic.door === 'open' ? T.opening : T.open}</span></button>
        <button class="ic-round small decline" data-ic="hangup">${icSvg('phone', 22)}<span>${T.hangup}</span></button>
      </div>`}
  </div>`;
}

// Redraw without the entrance animations and without jumping to the top of the page.
function icRefresh() {
  if (state.view !== 'intercom') return;
  document.body.dataset.enter = '0';
  const y = window.scrollY;
  document.getElementById('viewRoot').innerHTML = views.intercom();
  window.scrollTo(0, y);
}
function icPush(kind, st) { const ic = icState(); ic.history.push({ id: Date.now(), kind, entrance: ic.callEntrance, state: st, at: Date.now() }); }
function icStopTimers() { Object.values(icTimers).forEach(t => t && (clearTimeout(t), clearInterval(t))); icTimers = { door: null, miss: null, tick: null }; }
function icFmtTimer(ms) { const s = Math.max(0, Math.floor(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }

function icOpenDoor() {
  const ic = icState();
  if (ic.door === 'open') return;
  ic.door = 'open';
  if (ic.call === 'active') icPush(ic.callKind, 'opened');
  else ic.history.push({ id: Date.now(), kind: 'visitor', entrance: ic.entrance, state: 'opened', at: Date.now() });
  icRefresh();
  clearTimeout(icTimers.door);
  icTimers.door = setTimeout(() => { ic.door = 'locked'; icRefresh(); }, IC_DOOR_SECONDS * 1000);
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-ic]');
  if (!t || state.view !== 'intercom') return;
  e.preventDefault();
  const ic = icState(), v = t.dataset.v, a = t.dataset.ic;
  if (a === 'entrance') { ic.entrance = v; icRefresh(); }
  else if (a === 'open') icOpenDoor();
  else if (a === 'hours') { ic.hours = Number(v); icRefresh(); }
  else if (a === 'pass') {
    const code = String(Math.floor(100000 + Math.random() * 900000));
    ic.passes.unshift({ id: Date.now(), code, until: Date.now() + ic.hours * 3600000 }); icRefresh();
  }
  else if (a === 'revoke') { ic.passes = ic.passes.filter(p => String(p.id) !== v); icRefresh(); }
  else if (a === 'copy') {
    const p = ic.passes.find(x => String(x.id) === v);
    try { navigator.clipboard && navigator.clipboard.writeText(p.code).catch(() => {}); } catch (_) {}
    ic.copied = p.id; icRefresh(); setTimeout(() => { ic.copied = null; icRefresh(); }, 1600);
  }
  else if (a === 'dnd') { ic.dnd = !ic.dnd; icRefresh(); }
  else if (a === 'ringhere') { ic.ringHere = !ic.ringHere; icRefresh(); }
  else if (a === 'sim') {
    ic.call = 'ringing'; ic.callEntrance = ic.entrance; ic.callKind = ['visitor', 'courier', 'unknown'][Math.floor(Math.random() * 3)]; icRefresh();
    clearTimeout(icTimers.miss);
    icTimers.miss = setTimeout(() => { if (ic.call === 'ringing') { ic.call = null; icPush(ic.callKind, 'missed'); icRefresh(); } }, 25000);
  }
  else if (a === 'decline') { clearTimeout(icTimers.miss); ic.call = null; icPush(ic.callKind, 'declined'); icRefresh(); }
  else if (a === 'answer') {
    clearTimeout(icTimers.miss); ic.call = 'active'; ic.callStart = Date.now(); ic.mute = false; ic.speaker = true; icRefresh();
    clearInterval(icTimers.tick);
    icTimers.tick = setInterval(() => { const el = document.querySelector('.ic-timer'); if (el) el.textContent = icFmtTimer(Date.now() - ic.callStart); else clearInterval(icTimers.tick); }, 500);
  }
  else if (a === 'mute') { ic.mute = !ic.mute; icRefresh(); }
  else if (a === 'speaker') { ic.speaker = !ic.speaker; icRefresh(); }
  else if (a === 'hangup') {
    clearInterval(icTimers.tick); ic.call = null;
    if (!ic.history.some(h => h.at > Date.now() - 1500 && h.state === 'opened')) icPush(ic.callKind, 'answered');
    icRefresh();
  }
});

<script>
// render(), initial data loading and navigation helpers
// Part of the resident app: plain <script> files share one global scope; load order is set in index.html.
function render() {
  L = I18N[state.lang];

  const isLogin = state.view === 'login' || state.view === 'firstTime' || state.view === 'createPassword';
  document.body.classList.toggle('login-mode', isLogin);
  document.querySelector('header.site').style.display = isLogin ? 'none' : '';
  document.getElementById('tabBar').style.display = isLogin ? 'none' : '';
  document.querySelector('footer.site').style.display = isLogin ? 'none' : '';

  if (!isLogin && state.resident) {
    document.getElementById('aptChip').textContent = `${L.aptPrefix} ${state.resident.apartmentNumber}`;
    document.getElementById('parkingChip').textContent = `${L.parkingPrefix} ${state.resident.parkingSpot || '—'}`;
  }
  const badge = document.getElementById('bellBadge');
  if (badge) { badge.hidden = !state.unreadCount; badge.textContent = state.unreadCount > 9 ? '9+' : state.unreadCount; }
  document.getElementById('bell').style.display = isLogin ? 'none' : '';
  if ((state.unreadCount || 0) > (state.bellPrev || 0) && !isLogin) {
    const bl = document.getElementById('bell');
    bl.classList.remove('ring'); badge && badge.classList.remove('pop'); void bl.offsetWidth;
    bl.classList.add('ring'); badge && badge.classList.add('pop');
  }
  state.bellPrev = isLogin ? 0 : (state.unreadCount || 0);
  document.getElementById('footerRights').textContent = L.footer.rights;
  document.getElementById('footerLinks').innerHTML = `<a href="#">${L.footer.privacy}</a><a href="#">${L.footer.terms}</a><a href="#">${L.footer.contact}</a>`;

  document.getElementById('mainNav').innerHTML = ['home', 'services', 'requests', 'profile'].map(k =>
    `<a href="#" data-go="${k}" class="${state.view === k ? 'active' : ''}">${L.nav[k]}</a>`
  ).join('');

  document.getElementById('tabBar').innerHTML = ['home', 'services', 'requests', 'profile'].map(k =>
    `<button class="tab-item ${state.view === k ? 'active' : ''}" data-go="${k}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${tabIcons[k]}</svg>
      ${L.nav[k]}
    </button>`
  ).join('');

  // Entrance motion plays only when the screen actually changes (not on every busy/error redraw).
  const TABS = ['home', 'services', 'requests', 'profile'];
  const entering = state.view !== state._shown;
  const dir = !entering ? '' : (TABS.includes(state.view) ? (TABS.includes(state._shown) ? 'fade' : 'back') : 'forward');
  document.body.dataset.enter = entering ? '1' : '0';
  const root = document.getElementById('viewRoot');
  root.dataset.dir = dir;
  state._shown = state.view;
  root.innerHTML = (views[state.view] ? views[state.view]() : views.login());
  if (entering) revealOnScroll(root);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function loadInitialData() {
  const [resident, requests, settings] = await Promise.all([api.getMe(), api.getRequests(), api.getSettings().catch(() => null)]);
  state.resident = resident;
  state.requests = requests;
  refreshNotifications(true);
  if (settings) { state.services = settings.services || null; state.managementPhone = settings.managementPhone || null; state.managementEmail = settings.managementEmail || null; }
}

// Services management currently offers, in display order. Before the
// settings have loaded (or if that call failed) everything is shown, so a
// hiccup never hides the whole services screen.
function enabledServices() {
  if (!state.services) return serviceOrder;
  return serviceOrder.filter(k => !state.services[k] || state.services[k].enabled);
}

function servicePrice(key) {
  const sv = state.services && state.services[key];
  return sv && sv.price !== null && sv.price !== undefined ? sv.price : null;
}

function fmtPrice(n) {
  const localeMap = { fr:'fr-CA', en:'en-CA', uk:'uk-UA', es:'es-MX' };
  return new Intl.NumberFormat(localeMap[state.lang] || 'fr-CA', { style: 'currency', currency: 'CAD', minimumFractionDigits: Number.isInteger(n) ? 0 : 2 }).format(n);
}

async function goHome() {
  state.view = 'home';
  render();
}

async function showView(key) {
  state.view = key;
  state.loginError = null;
  state.formError = null;
  state.saveMessage = null;
  state.firstTimeError = null;
  state.createPasswordError = null;
  state.pwdError = null;
  state.pwdSaved = false;
  state.firstTimeSent = false;
  render();
}

// Rows below the fold wait and rise into place as they scroll into view (only on a screen change).
let revealObserver = null;
function revealOnScroll(root) {
  if (revealObserver) { revealObserver.disconnect(); revealObserver = null; }
  if (!('IntersectionObserver' in window) || (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) return;
  const items = root.querySelectorAll('.req-row, .svc-row, .notif-row, .section, .building-item');
  const fold = window.innerHeight;
  const late = [...items].filter(el => el.getBoundingClientRect().top > fold + 20);
  if (!late.length) return;
  revealObserver = new IntersectionObserver((entries) => {
    entries.forEach(en => { if (en.isIntersecting) { en.target.classList.add('in'); revealObserver.unobserve(en.target); } });
  }, { rootMargin: '0px 0px -8% 0px' });
  late.forEach(el => { el.classList.add('rv'); revealObserver.observe(el); });
}

<script>
// Actions: sign in, passwords, requests, bookings, guest parking, messages, documents, profile, sign out
// Part of the resident app: plain <script> files share one global scope; load order is set in index.html.
async function handleLoginSubmit(email, password) {
  state.busy = true; state.loginError = null; render();
  try {
    const { token } = await api.login(email, password);
    api.setToken(token);
    await loadInitialData();
    state.busy = false;
    await goHome();
  } catch (err) {
    state.busy = false;
    state.loginError = err.message;
    render();
  }
}

async function handleForgotPassword(email) {
  state.busy = true; state.forgotPasswordError = null; render();
  try {
    await api.forgotPassword(email);
    state.busy = false;
    state.forgotPasswordSent = true;
    render();
  } catch (err) {
    state.busy = false;
    state.forgotPasswordError = err.message;
    render();
  }
}

async function handleCheckEmail(email) {
  state.busy = true; state.firstTimeError = null; render();
  try {
    await api.checkEmail(email);
    state.busy = false;
    state.firstTimeSent = true;
    render();
  } catch (err) {
    state.busy = false;
    state.firstTimeError = err.message;
    render();
  }
}

async function handleCreatePassword(password, confirmPassword) {
  if (password.length < 8) {
    state.createPasswordError = L.createPassword.tooShort;
    render();
    return;
  }
  if (password !== confirmPassword) {
    state.createPasswordError = L.createPassword.mismatch;
    render();
    return;
  }
  state.busy = true; state.createPasswordError = null; render();
  try {
    const { token } = await api.setPassword(state.pendingActivationEmail, state.pendingActivationToken, password);
    api.setToken(token);
    await loadInitialData();
    state.busy = false;
    state.pendingActivationEmail = undefined;
    state.pendingActivationToken = undefined;
    await goHome();
  } catch (err) {
    state.busy = false;
    state.createPasswordError = err.message;
    render();
  }
}

async function handleSubmitRequest() {
  const textarea = document.getElementById('reqDescription');
  const description = textarea ? textarea.value.trim() : '';
  if (!description) {
    state.formError = L.form.descLabel + ' — ' + (state.lang === 'fr' ? 'requis' : 'required');
    render();
    return;
  }
  const preferredDate = L.form.dateOptions[state.selectedDateIdx ?? 1];
  const preferredTime = L.form.timeOptions[state.selectedTimeIdx ?? 1];
  state.busy = true; state.formError = null; render();
  try {
    const created = await api.createRequest({ category: state.activeService, description, preferredDate, preferredTime });
    state.lastCreatedId = created.id;

    // Upload any selected photo/video now that the request exists.
    if (state.reqPhotoFile) await api.uploadAttachment(created.id, state.reqPhotoFile);
    if (state.reqVideoFile) await api.uploadAttachment(created.id, state.reqVideoFile);

    state.requests = await api.getRequests();
    state.selectedDateIdx = undefined;
    state.selectedTimeIdx = undefined;
    state.reqPhotoFile = undefined; state.reqPhotoName = undefined;
    state.reqVideoFile = undefined; state.reqVideoName = undefined;
    state.busy = false;
    state.confirmKind = undefined;
    showView('confirm');
  } catch (err) {
    state.busy = false;
    state.formError = err.message;
    render();
  }
}

async function openRequestDetail(id) {
  try {
    state.requestDetail = await api.getRequest(id);
    showView('detail');
  } catch (err) {
    if (err.status === 401) { showView('login'); }
  }
}

async function openBuildingNews() {
  try { state.news = await api.getNews(); showView('buildingNews'); }
  catch (err) { if (err.status === 401) showView('login'); }
}

async function openAmenities() {
  try { state.amenities = await api.getAmenities(); showView('amenities'); }
  catch (err) { if (err.status === 401) showView('login'); }
}

// ---- Notifications ----
async function refreshNotifications(silent) {
  try {
    const data = await api.getNotifications();
    const changed = data.unread !== state.unreadCount;
    state.notifications = data.items; state.unreadCount = data.unread;
    if (silent) { if (changed) render(); }
  } catch (err) { /* offline or signed out: leave as is */ }
}

async function openNotifications() {
  await refreshNotifications(false);
  showView('notifications');
}

async function handleOpenNotification(id) {
  const n = (state.notifications || []).find(x => String(x.id) === String(id));
  if (!n) return;
  if (!n.read) { try { await api.readNotification(n.id); } catch (e) {} n.read = true; state.unreadCount = Math.max(0, (state.unreadCount || 0) - 1); }
  if (n.kind === 'request_status') return openRequestDetail(n.params.requestId);
  if (n.kind === 'booking_cancelled') return openMyBookings();
  if (n.kind === 'news') return openBuildingNews();
  if (n.kind === 'document') return openDocuments();
  if (n.kind === 'message') return openMessages();
  render();
}

async function handleReadAllNotifications() {
  try { await api.readAllNotifications(); } catch (e) {}
  (state.notifications || []).forEach(n => { n.read = true; });
  state.unreadCount = 0;
  render();
}

// Quiet check for new notifications once a minute while the page is open.
setInterval(() => { if (api.getToken() && state.resident) refreshNotifications(true); }, 60000);

async function openMyBookings() {
  try { state.myBookings = await api.getMyBookings(); state.myBookingsError = null; showView('myBookings'); }
  catch (err) { if (err.status === 401) showView('login'); }
}

async function handleCancelMyBooking(id) {
  if (!confirm(L.myBookings.cancelConfirm)) return;
  try {
    await api.cancelBooking(id);
    state.myBookings = await api.getMyBookings(); state.myBookingsError = null;
  } catch (err) {
    state.myBookingsError = err.message;
    try { state.myBookings = await api.getMyBookings(); } catch (e) {}
  }
  render();
}

async function openDocuments() {
  try { state.documents = await api.getDocuments(); showView('documents'); }
  catch (err) { if (err.status === 401) showView('login'); }
}

async function openMessages() {
  try { state.messages = await api.getMessages(); showView('messages'); }
  catch (err) { if (err.status === 401) showView('login'); }
}

async function openManagement() {
  try { const s = await api.getSettings(); state.managementPhone = s.managementPhone; state.managementEmail = s.managementEmail || null; showView('management'); }
  catch (err) { if (err.status === 401) showView('login'); else showView('management'); }
}

// Loads which start times are free on the chosen date, then redraws.
async function loadAmenityAvailability() {
  state.amenAvail = null; render();
  try {
    state.amenAvail = await api.getAmenityAvailability(state.activeAmenityId, state.amenDate);
    const sel = state.amenAvail.slots.find(s => s.time === state.amenStart);
    if (!sel || !sel.maxHours) { state.amenStart = null; state.amenHours = null; }
    else if (!state.amenHours || state.amenHours > sel.maxHours) state.amenHours = 1;
  } catch (err) {
    state.amenAvail = { slots: [] };
    state.amenBookingError = err.message;
  }
  render();
}

async function handleSubmitAmenityBooking() {
  if (!state.amenStart || !state.amenHours) return;
  state.busy = true; state.amenBookingError = null; render();
  try {
    await api.bookAmenity(state.activeAmenityId, { date: state.amenDate, start: state.amenStart, hours: state.amenHours });
    state.busy = false;
    state.confirmKind = 'booking';
    showView('confirm');
  } catch (err) {
    state.busy = false;
    state.amenBookingError = err.status === 409 ? L.amenityBooking.slotTaken : err.message;
    if (err.status === 409) { state.amenStart = null; state.amenHours = null; await loadAmenityAvailability(); return; }
    render();
  }
}

async function handleSubmitGuestParking() {
  const startDate = document.getElementById('gpFrom').value.trim();
  const endDate = document.getElementById('gpTo').value.trim();
  const guestName = document.getElementById('gpGuestName').value.trim();
  const licensePlate = document.getElementById('gpPlate').value.trim();

  state.busy = true; state.gpError = null; render();

    state.confirmKind = 'booking';
    showView('confirm');

    state.busy = false;

    render();

async function handleSendMessage() {
  const input = document.getElementById('messageInput');
  const body = input ? input.value.trim() : '';
  if (!body) return;
  state.busy = true; render();
  try {
    await api.sendMessage(body);
    state.messages = await api.getMessages();
    state.busy = false;
    render();
  } catch (err) {
    state.busy = false;

}

// Documents (like attachments) are behind auth, so fetch with the token
// and open the result as a blob URL rather than using a plain <a href>.
async function viewDocument(docId, filename) {
  try {
    const token = api.getToken();
    const res = await fetch(`/api/documents/${docId}`, {
      headers: token ? { Authorization: `Bearer ${token}` } : {},
    });
    if (!res.ok) throw new Error('Could not load the document.');
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename || 'document';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  } catch (err) {
    alert(err.message);
  }
}

async function downloadAllDocuments() {
  try {
    const token = api.getToken();
    const res = await fetch('/api/documents/download-all', {
      headers: token ? { Authorization: `Bearer ${token}` } : {},
    });
    if (!res.ok) throw new Error(L.documents.downloadAllError);
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `documents-${(window.COMPANY_NAME || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'all'}.zip`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  } catch (err) {
    alert(err.message);
  }
}

async function handleSaveContact() {
  const email = document.getElementById('piEmail').value.trim();
  const phone = document.getElementById('piPhone').value.trim();
  state.busy = true; state.saveMessage = null; render();
  try {
    await api.updateMe({ email, phone });
    state.resident.email = email;
    state.resident.phone = phone;
    state.busy = false;
    state.saveMessage = state.lang === 'fr' ? 'Enregistré.' : 'Saved.';
    render();
  } catch (err) {
    state.busy = false;
    state.saveMessage = err.message;
    render();
  }
}

async function handleSavePassword() {
  const pi = L.personalInfo;
  const currentPassword = document.getElementById('piPwdCurrent').value;
  const newPassword = document.getElementById('piPwdNew').value;
  const confirmPassword = document.getElementById('piPwdConfirm').value;

  if (!currentPassword || !newPassword || !confirmPassword) {
    state.pwdError = pi.pwdAllRequired; state.pwdSaved = false; render(); return;
  }
  if (newPassword.length < 8) {
    state.pwdError = pi.pwdTooShort; state.pwdSaved = false; render(); return;
  }
  if (newPassword !== confirmPassword) {
    state.pwdError = pi.pwdMismatch; state.pwdSaved = false; render(); return;
  }

  state.busy = true; state.pwdError = null; state.pwdSaved = false; render();
  try {
    const { token } = await api.changePassword(currentPassword, newPassword);
    // Changing the password revokes every token issued before this
    // moment — including the one this very request just used — so the
    // fresh one from the response has to replace it, or the next action
    // would otherwise fail as if logged out.
    if (token) api.setToken(token);
    state.busy = false;
    state.pwdSaved = true;
    render();
  } catch (err) {
    state.busy = false;
    state.pwdError = err.message;
    render();
  }
}

function handleLogout() {
  api.clearToken();
  state.resident = null;
  state.requests = [];
  showView('login');
}

async function handleLogoutEverywhere() {
  if (!confirm(L.personalInfo.logoutEverywhereConfirm)) return;
  state.busy = true; render();
  try {
    await api.logoutEverywhere();
  } catch (err) {
    // Even a network hiccup here doesn't change what happens next: the
    // call either revoked every token or it didn't, but either way this
    // device's own copy is about to be discarded regardless, so the
    // person still ends up signed out, which is what they asked for.
  }
  state.busy = false;
  handleLogout();
}

// Attachment downloads require the Bearer token, so a plain <a href> won't
// work (the browser sends no custom headers on navigation). Fetch it with
// the token instead, then open the result as a blob URL.
async function viewAttachment(requestId, attachmentId) {
  try {
    const token = api.getToken();
    const res = await fetch(`/api/requests/${requestId}/attachments/${attachmentId}`, {
      headers: token ? { Authorization: `Bearer ${token}` } : {},
    });
    if (!res.ok) throw new Error('Could not load the file.');
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    window.open(url, '_blank');
  } catch (err) {
    alert(err.message);
  }
}

<script>
// Global event listeners (submit, change, keydown, click)
// Part of the resident app: plain <script> files share one global scope; load order is set in index.html.
document.addEventListener('submit', (e) => {
  if (e.target && e.target.id === 'loginForm') {
    e.preventDefault();
    const email = document.getElementById('loginEmail').value.trim();

  if (e.target && e.target.id === 'firstTimeForm') {
    e.preventDefault();
    const email = document.getElementById('firstTimeEmail').value.trim();
    handleCheckEmail(email);
  }
  if (e.target && e.target.id === 'createPasswordForm') {
    e.preventDefault();
    const password = document.getElementById('newPassword').value;
    const confirm = document.getElementById('confirmPassword').value;
    handleCreatePassword(password, confirm);
  }
});

document.addEventListener('change', (e) => {
  if (e.target && e.target.id === 'reqPhotoInput') {
    const file = e.target.files[0];
    if (file) { state.reqPhotoFile = file; state.reqPhotoName = file.name; render(); }
  }
  if (e.target && e.target.id === 'reqVideoInput') {
    const file = e.target.files[0];
    if (file) { state.reqVideoFile = file; state.reqVideoName = file.name; render(); }
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && state.langMenuOpen) { state.langMenuOpen = false; render(); }
});

document.addEventListener('click', (e) => {
  const langMenuBtn = e.target.closest('[data-action="toggle-lang-menu"]');
  if (langMenuBtn) { state.langMenuOpen = !state.langMenuOpen; render(); return; }
  const langBtn = e.target.closest('[data-setlang]');
  if (langBtn) { state.lang = langBtn.dataset.setlang; state.langMenuOpen = false; render(); return; }
  // A click anywhere else closes an open language menu (and carries on as normal).
  if (state.langMenuOpen && !e.target.closest('.lang-menu-wrap')) { state.langMenuOpen = false; render(); }

  const filterBtn = e.target.closest('[data-filter]');
  if (filterBtn) { state.filter = filterBtn.dataset.filter; render(); return; }

  const slotEl = e.target.closest('[data-amen-start]');
  if (slotEl) {
    state.amenStart = slotEl.dataset.amenStart;
    const sel = state.amenAvail.slots.find(x => x.time === state.amenStart);
    if (!state.amenHours || state.amenHours > sel.maxHours) state.amenHours = 1;
    state.amenBookingError = null; render(); return;
  }
  const hoursEl = e.target.closest('[data-amen-hours]');
  if (hoursEl) { state.amenHours = parseInt(hoursEl.dataset.amenHours, 10); render(); return; }

  const pillEl = e.target.closest('.pill-row .pill');
  if (pillEl) {
    const group = pillEl.closest('[data-pillgroup]').dataset.pillgroup;
    const idx = parseInt(pillEl.dataset.pill, 10);
    if (group === 'date') state.selectedDateIdx = idx;
    if (group === 'time') state.selectedTimeIdx = idx;
    if (group === 'amenSlot') state.amenSlotIdx = idx;
    if (group === 'amenDuration') state.amenDurationIdx = idx;
    render();
    return;
  }

  const actionBtn = e.target.closest('[data-action]');
  if (actionBtn) {
    e.preventDefault();
    const action = actionBtn.dataset.action;
    if (action === 'submit-request') handleSubmitRequest();
    if (action === 'save-contact') handleSaveContact();
    if (action === 'save-password') handleSavePassword();
    if (action === 'logout-everywhere') handleLogoutEverywhere();
    if (action === 'logout') handleLogout();
    if (action === 'view-attachment') viewAttachment(actionBtn.dataset.req, actionBtn.dataset.att);
    if (action === 'submit-amenity-booking') handleSubmitAmenityBooking();
    if (action === 'open-notification') handleOpenNotification(actionBtn.dataset.id);
    if (action === 'read-all-notifications') handleReadAllNotifications();
    if (action === 'cancel-my-booking') handleCancelMyBooking(actionBtn.dataset.booking);
    if (action === 'submit-guest-parking') handleSubmitGuestParking();
    if (action === 'send-message') handleSendMessage();
    if (action === 'view-document') viewDocument(actionBtn.dataset.doc, actionBtn.dataset.name);
    if (action === 'download-all-documents') downloadAllDocuments();
    return;
  }

  const goEl = e.target.closest('[data-go]');
  if (goEl) {
    e.preventDefault();
    const key = goEl.dataset.go;
    if (key === 'requestForm') { state.activeService = goEl.dataset.svc || 'plumbing'; showView('requestForm'); return; }
    if (key === 'newsDetail') { state.activeNews = parseInt(goEl.dataset.news, 10); showView('newsDetail'); return; }
    if (key === 'amenityBooking') { state.activeAmenityId = parseInt(goEl.dataset.amenity, 10); state.amenDate = localDateStr(0); state.amenStart = null; state.amenHours = null; state.amenAvail = null; state.amenBookingError = null; showView('amenityBooking'); loadAmenityAvailability(); return; }
    if (key === 'detail') { openRequestDetail(goEl.dataset.req); return; }
    if (key === 'buildingNews') { openBuildingNews(); return; }
    if (key === 'amenities') { openAmenities(); return; }
    if (key === 'myBookings') { openMyBookings(); return; }
    if (key === 'notifications') { openNotifications(); return; }
    if (key === 'documents') { openDocuments(); return; }
    if (key === 'messages') { openMessages(); return; }
    if (key === 'management') { openManagement(); return; }
    showView(key);
  }
});

// Amenity booking: a new date means new availability.
document.addEventListener('change', (e) => {
  if (e.target.id !== 'amenDate') return;
  state.amenDate = e.target.value || localDateStr(0);
  state.amenBookingError = null;
  loadAmenityAvailability();
});

</script>
<script>
// init() – start of the app
// Part of the resident app: plain <script> files share one global scope; load order is set in index.html.
(async function init() {
  L = I18N[state.lang];

  // A resident arriving via their activation email link — ?activate=TOKEN&email=...
  // Takes priority over an existing session: if someone is testing a
  // second account on the same browser, the link should still work.
  const params = new URLSearchParams(window.location.search);
  const activateToken = params.get('activate');
  const activateEmail = params.get('email');
  if (activateToken && activateEmail) {
    state.pendingActivationToken = activateToken;
    state.pendingActivationEmail = activateEmail;
    state.view = 'createPassword';
    window.history.replaceState({}, '', window.location.pathname);
    render();
    return;
  }

  if (api.getToken()) {
    try {
      await loadInitialData();
      state.view = 'home';
    } catch (err) {
      api.clearToken();
      state.view = 'login';
    }
  }
  render();
})();

</script>
<script>
// Demo-only overrides: file previews/downloads need a real server, so say so politely.
(function () {
  const TEXT = {
    en: 'Demo mode — file previews aren’t included.',
    fr: 'Mode démo — l’aperçu des fichiers n’est pas inclus.',
    uk: 'Демо-режим — перегляд файлів недоступний.',
    es: 'Modo demo — la vista previa de archivos no está incluida.',
  };
  function toast() {
    const old = document.getElementById('demoToast'); if (old) old.remove();
    const t = document.createElement('div');
    t.id = 'demoToast'; t.className = 'demo-toast'; t.textContent = TEXT[state.lang] || TEXT.en;
    document.body.appendChild(t);
    setTimeout(() => t.classList.add('show'), 10);
    setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 2600);
  }
  window.viewDocument = async function () { toast(); };
  window.downloadAllDocuments = async function () { toast(); };
  window.viewAttachment = async function () { toast(); };
})();

</script>
